<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Addition & Subtraction</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 520px;
        }

        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            max-width: 240px;
            height: auto;
        }

        .screen {
            display: none;
            padding: 24px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        .hud-box {
            background: #e8f0ff;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mute-btn {
            background: #e8f0ff;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .mute-btn:hover {
            background: #d0e0ff;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        .feedback-box {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            color: #1d4ed8;
        }

        .feedback-box.explanation {
            background-color: #f8fafc;
            border-left: 5px solid #64748b;
            color: var(--text-main);
        }

        .next {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-self: flex-end;
            transition: background 0.2s;
        }

        .next:hover {
            background: var(--primary-hover);
        }

        .result-card {
            text-align: center;
            padding: 40px 10px;
            align-items: center;
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-muted);
        }

        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="fx-canvas"></canvas>

        <div id="splash">
            <img src="assets/logo.png" onerror="this.style.display='none'" alt="Logo">
        </div>

        <div id="game" class="screen active">
            <div class="top-bar">
                <div class="hud-box">Q: <span id="qno">1</span>/10</div>
                <div class="hud-box">Score: <span id="score">0</span></div>
                <button class="mute-btn" id="btn-mute" onclick="toggleMute()">🔊 Sound</button>
            </div>
            
            <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
                <div class="hud-box" style="width: auto; padding: 6px 16px; background: #fef3c7; color: #b45309;">
                    ⏱️ <span id="time">60</span>s
                </div>
            </div>

            <div class="question" id="question"></div>
            <div class="options-grid" id="options"></div>
            <div id="feedback" class="feedback-box"></div>
            <button class="next" onclick="nextQ()" id="nextBtn">Continue</button>
        </div>

        <div id="result" class="screen result-card">
            <h2>Chapter Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="final-msg">Good effort!</div>
            <button class="next" style="display:block; margin:auto;" onclick="window.location.reload()">Restart Quiz</button>
        </div>
    </div>

    <audio id="sfx-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="sfx-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        const questionsDatabase = [
            {
                q: "Rahul added 357 and 285 and got 542. Identify where Rahul went wrong.",
                a: ["No error", "Carrying error in tens/hundreds place", "Ones place calculation error", "He subtracted instead of added"],
                correctText: "Carrying error in tens/hundreds place",
                hint: "Add 357 and 285 step-by-step: 7+5 = 12 (carry 1). What happens when you add 1 + 5 + 8?",
                explanation: "357 + 285: Ones = 7+5 = 12 (write 2, carry 1). Tens = 1+5+8 = 14 (write 4, carry 1). Hundreds = 1+3+2 = 6. Correct sum is 642. Rahul forgot to carry the 1 to the hundreds place."
            },
            {
                q: "When subtracting 349 from 854, why do we need to regroup/borrow in the ones place?",
                a: ["Because 4 in ones place is smaller than 9", "Because 8 is larger than 3", "Because 5 tens is equal to 4 tens", "No regrouping is needed"],
                correctText: "Because 4 in ones place is smaller than 9",
                hint: "Look at the ones digits of 854 and 349. Can you take away 9 ones from 4 ones directly?",
                explanation: "In 854 - 349, the ones digit of the top number (4) is smaller than the ones digit of the bottom number (9), so we must borrow 1 ten from 5 tens."
            },
            {
                q: "Simran buys a bag for ₹560 and a book for ₹345. A discount of ₹150 is given if the total bill exceeds ₹600. How much does she pay?",
                a: ["₹755", "₹905", "₹450", "₹555"],
                correctText: "₹755",
                hint: "First find total price: ₹560 + ₹345. Since it is over ₹600, subtract ₹150 discount.",
                explanation: "Total price = ₹560 + ₹345 = ₹905. Since ₹905 > ₹600, she gets ₹150 off. Final payment = ₹905 - ₹150 = ₹755."
            },
            {
                q: "Aman has ₹900 and spends ₹563. Does he have enough remaining money to buy a ₹350 notebook?",
                a: ["Yes, he has exactly ₹350", "Yes, he has ₹337 left", "No, he is short by ₹13", "No, he is short by ₹100"],
                correctText: "No, he is short by ₹13",
                hint: "Calculate remaining money: ₹900 - ₹563. Then compare that result with ₹350.",
                explanation: "Remaining money = ₹900 - ₹563 = ₹337. Since ₹337 is less than ₹350, he does NOT have enough. Short by ₹350 - ₹337 = ₹13."
            },
            {
                q: "A store had 568 apples and received a new shipment of 402 apples. Which operation frames the total number of apples?",
                a: ["568 - 402", "568 + 402", "402 - 568", "568 × 402"],
                correctText: "568 + 402",
                hint: "When you combine existing stock with a new shipment, do you add or subtract?",
                explanation: "Finding the total combined quantity of existing stock and incoming shipment requires addition: 568 + 402."
            },
            {
                q: "Which expression using numbers from {450, 180, 100, 350, 900, 700, 620} equals 800?",
                a: ["900 - 100 only", "450 + 350 only", "Both (900 - 100) and (450 + 350)", "None of these"],
                correctText: "Both (900 - 100) and (450 + 350)",
                hint: "Calculate 900 - 100 and 450 + 350 separately.",
                explanation: "900 - 100 = 800, and 450 + 350 = 800. Therefore, both expressions equal 800."
            },
            {
                q: "Anaya has 245 stickers and receives 132 more. Her goal is to collect 350 stickers. Does she reach her goal?",
                a: ["Yes, she has 377 stickers", "Yes, she has 350 stickers", "No, she has 337 stickers", "No, she is short by 50"],
                correctText: "Yes, she has 377 stickers",
                hint: "Add 245 + 132 to find her total stickers, then compare with 350.",
                explanation: "Total stickers = 245 + 132 = 377. Since 377 is greater than 350, she reaches her goal with 27 extra stickers."
            },
            {
                q: "A bakery makes 500 chocolates and sells 278. They need at least 230 chocolates left for an event. Do they have enough left?",
                a: ["Yes, they have 230 left", "Yes, they have 250 left", "No, they have 222 left", "No, they have 200 left"],
                correctText: "No, they have 222 left",
                hint: "Subtract 278 from 500 to find remaining chocolates.",
                explanation: "Chocolates remaining = 500 - 278 = 222. Since 222 is less than 230, they do not have enough left (short by 8)."
            },
            {
                q: "Library A has 320 storybooks and gets 150 more. Library B has 460 storybooks. Which library has more books?",
                a: ["Library A has more (470 > 460)", "Library B has more (460 > 470)", "Both libraries have equal books", "Library A has 450 books"],
                correctText: "Library A has more (470 > 460)",
                hint: "Calculate total books in Library A (320 + 150) and compare with Library B (460).",
                explanation: "Library A total = 320 + 150 = 470 books. Library B = 460 books. Since 470 > 460, Library A has more."
            },
            {
                q: "Assertion: 500 - 200 = 300. Reason: Subtraction reduces a quantity by taking away. Which is correct?",
                a: ["Both Assertion and Reason are correct, and Reason explains Assertion", "Both are correct, but Reason does not explain Assertion", "Assertion is correct, Reason is false", "Both are false"],
                correctText: "Both Assertion and Reason are correct, and Reason explains Assertion",
                hint: "Is 500 - 200 = 300 true? Does taking away 200 reduce 500 to 300?",
                explanation: "500 - 200 = 300 is mathematically true, and subtraction fundamentally represents taking away a quantity to reduce it."
            }
        ];

        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let questions = [];
        let i = 0, score = 0, time = 60, attempt = 0, lock = false, timer;
        let isMuted = false;

        function startTimer() {
            clearInterval(timer);
            document.getElementById("time").innerText = time;
            timer = setInterval(() => {
                if (time > 0) {
                    time--;
                    document.getElementById("time").innerText = time;
                } else {
                    clearInterval(timer);
                    reveal(false);
                }
            }, 1000);
        }

        function load() {
            if (i >= questions.length) { 
                document.getElementById("game").className = "screen"; 
                document.getElementById("result").className = "screen result-card"; 
                
                const percentage = Math.round((score / questions.length) * 100);
                document.getElementById("final-score").innerText = percentage + "%";
                
                let msg = "Keep practicing! You will get better!";
                if (percentage >= 80) msg = "Outstanding! You are an Addition & Subtraction Master!";
                else if (percentage >= 60) msg = "Great effort! You understand the concepts well.";
                
                document.getElementById("final-msg").innerText = msg;
                return; 
            }

            let qData = questions[i];
            document.getElementById("qno").innerText = i + 1;
            document.getElementById("score").innerText = score;
            document.getElementById("question").innerText = qData.q;
            
            const feedback = document.getElementById("feedback");
            feedback.style.display = "none";
            feedback.className = "feedback-box";
            document.getElementById("nextBtn").style.display = "none";

            const shuffledOptions = shuffleArray(qData.a);
            const optionsBox = document.getElementById("options");
            optionsBox.innerHTML = "";

            shuffledOptions.forEach((optionText) => {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = optionText;
                btn.onclick = () => check(btn, optionText);
                optionsBox.appendChild(btn);
            });

            attempt = 0; 
            lock = false; 
            time = 60; 
            startTimer();
        }

        function check(btn, selectedText) {
            if (lock) return;
            const qData = questions[i];
            attempt++;

            if (selectedText === qData.correctText) {
                clearInterval(timer);
                btn.classList.add("correct");
                playSound("correct");
                triggerWinEffects();
                
                score++;
                document.getElementById("score").innerText = score;
                lock = true;
                
                reveal(true);
            } else {
                btn.classList.add("wrong");
                btn.disabled = true;
                playSound("wrong");

                if (attempt === 1) {
                    const feedback = document.getElementById("feedback");
                    feedback.innerText = "💡 Hint: " + qData.hint;
                    feedback.className = "feedback-box hint";
                    feedback.style.display = "block";
                } else {
                    clearInterval(timer);
                    reveal(false);
                }
            }
        }

        function reveal(isCorrect) {
            lock = true;
            clearInterval(timer);
            const qData = questions[i];

            const buttons = document.querySelectorAll("#options .btn");
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === qData.correctText) {
                    btn.classList.add("correct");
                }
            });

            const feedback = document.getElementById("feedback");
            feedback.innerText = (isCorrect ? "Correct! " : "Time's up or max attempts reached! ") + qData.explanation;
            feedback.className = "feedback-box explanation";
            feedback.style.display = "block";

            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQ() { 
            i++; 
            load(); 
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("btn-mute").innerText = isMuted ? "🔈 Mute" : "🔊 Sound";
        }

        function playSound(type) {
            if (isMuted) return;
            const audio = document.getElementById(type === "correct" ? "sfx-correct" : "sfx-wrong");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => playSynthFallback(type));
            } else {
                playSynthFallback(type);
            }
        }

        function playSynthFallback(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === "correct") {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(140, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function triggerWinEffects() {
            const canvas = document.getElementById("fx-canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            let particles = Array.from({ length: 35 }, () => ({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8 - 2,
                color: `hsl(${Math.random() * 360}, 80%, 60%)`,
                radius: Math.random() * 4 + 2,
                alpha: 1
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let ongoing = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.12;
                    p.alpha -= 0.025;
                    if (p.alpha > 0) {
                        ongoing = true;
                        ctx.globalAlpha = p.alpha;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    }
                });
                if (ongoing) requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animate();
        }

        window.onload = () => {
            questions = shuffleArray(questionsDatabase);
            setTimeout(() => {
                const splash = document.getElementById("splash");
                splash.classList.add("fade-out");
                setTimeout(() => splash.style.display = "none", 800);
            }, 1200);
            load();
        };
    </script>
</body>
</html>
