<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Addition & Subtraction</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }

        body { background: var(--background); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; position: relative; min-height: 480px; }

        #splash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 1; transition: opacity 1s ease-out; }
        #splash.fade-out { opacity: 0; pointer-events: none; }
        #splash img { max-width: 300px; }

        .screen { display: none; padding: 24px; }
        .screen.active { display: flex; flex-direction: column; }

        .top { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .box { background: #e8f0ff; padding: 10px; border-radius: 12px; }

        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }

        .btn { padding: 14px 16px; border-radius: 12px; border: 2px solid var(--primary); background: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 12px; width: 100%; text-align: left; transition: 0.2s; }
        .btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; }
        .btn.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #7f1d1d; }

        .next { margin-top: 20px; padding: 12px 24px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: none; align-self: flex-end; }
        
        .result-card { text-align: center; padding: 40px 0; }
        .score-display { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 20px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Path corrected to include 'assets/' folder -->
        <div id="splash">
            <img src="assets/logo.png" alt="Logo">
        </div>

        <div id="game" class="screen active">
            <div class="top">
                <div class="box">Q: <span id="qno">1</span>/10</div>
                <div class="box">Score: <span id="score">0</span></div>
                <div class="box">Time: <span id="time">60</span>s</div>
            </div>
            <div class="question" id="question"></div>
            <div id="options"></div>
            <button class="next" onclick="nextQ()" id="nextBtn">Continue</button>
        </div>

        <div id="result" class="screen result-card">
            <h2>Chapter Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <button class="next" style="display:block; margin:auto;" onclick="window.location.reload()">Restart</button>
        </div>
    </div>

    <!-- Audio paths updated to include 'assets/' folder -->
    <audio id="sfx-correct" src="assets/claps.mp3"></audio>
    <audio id="sfx-wrong" src="assets/wrong.mp3"></audio>

    <script>
        const questions = [
            { q: "Rahul added 357 and 285 and got 542. Identify where Rahul went wrong.", a: ["No error", "Carrying error", "Hundreds place error", "None"], c: 1 },
            { q: "When subtracting 349 from 854, why do we borrow?", a: ["4 < 9", "Tens digit larger", "Numbers equal", "No borrow"], c: 0 },
            { q: "Simran buys a bag for ₹560 and a book for ₹345. Discount is ₹150 for >₹600. Total payment?", a: ["755", "905", "450", "555"], c: 0 },
            { q: "Have ₹900, spend ₹563. Enough for a ₹350 notebook?", a: ["Yes", "Yes, has 337", "No, short by 13", "Unknown"], c: 2 },
            { q: "Frame problem for 568 and 402.", a: ["568-402", "568+402", "402-568", "568*402"], c: 1 },
            { q: "Which numbers from {450, 180, 100, 350, 900, 700, 620} give 800?", a: ["900-100", "450+350", "Both", "None"], c: 2 },
            { q: "Anaya has 245, gets 132. Goal 350. Does she reach it?", a: ["Yes", "Yes, has 377", "No", "Unknown"], c: 1 },
            { q: "500 chocolates, sell 278. Need 230 left. Have enough?", a: ["Yes", "More than enough", "No", "Unknown"], c: 2 },
            { q: "Lib A: 320+150. Lib B: 460. Compare?", a: ["A has more", "B has more", "Equal", "Unknown"], c: 0 },
            { q: "Assertion: 500-200=300. Reason: Subtraction reduces value.", a: ["Both correct, logic matches", "Both correct, no match", "Assertion correct", "Both wrong"], c: 0 }
        ];

        let i = 0, score = 0, time = 60, attempt = 0, lock = false, timer;

        function startTimer() {
            timer = setInterval(() => {
                if (time > 0) time--, document.getElementById("time").innerText = time;
                else clearInterval(timer), reveal();
            }, 1000);
        }

        function load() {
            if (i >= questions.length) { 
                document.getElementById("game").className = "screen"; 
                document.getElementById("result").className = "screen active"; 
                document.getElementById("final-score").innerText = (score/10)*100 + "%";
                return; 
            }
            let q = questions[i];
            document.getElementById("qno").innerText = i + 1;
            document.getElementById("question").innerText = q.q;
            document.getElementById("options").innerHTML = q.a.map((o, idx) => `<button class="btn" onclick="check(this, ${idx})">${o}</button>`).join("");
            document.getElementById("nextBtn").style.display = "none";
            attempt = 0; lock = false; time = 60; startTimer();
        }

        function check(btn, idx) {
            if (lock) return;
            if (idx === questions[i].c) {
                clearInterval(timer); btn.classList.add("correct"); document.getElementById("sfx-correct").play();
                score++; lock = true; document.getElementById("nextBtn").style.display = "block";
            } else {
                attempt++; btn.classList.add("wrong"); btn.disabled = true; document.getElementById("sfx-wrong").play();
                if (attempt >= 2) reveal();
            }
        }

        function reveal() {
            lock = true; clearInterval(timer);
            document.querySelectorAll(".btn")[questions[i].c].classList.add("correct");
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQ() { i++; load(); }

        setTimeout(() => document.getElementById("splash").classList.add("fade-out"), 3000);
        load();
    </script>
</body>
</html>
