<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition Up To 20</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.game-container{
  width:100%;
  max-width:1200px;
  min-height:90vh;
  background:#ffffff;
  border-radius:24px;
  text-align:center;
  padding:24px;
  border-bottom:8px solid #55d6c2;
}

.logo{
  width:150px;
  max-width:45%;
  margin-bottom:12px;
}

h1{
  font-size:44px;
  color:#222;
  margin-bottom:10px;
}

.status-bar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.status-box{
  background:#eaf4ff;
  color:#0077e6;
  font-size:22px;
  font-weight:700;
  padding:10px 18px;
  border-radius:14px;
}

.timer-box{
  background:#fff0f0;
  color:#d62828;
}

.attempt-box{
  background:#f2ecff;
  color:#6c35d4;
}

.question{
  font-size:28px;
  font-weight:700;
  color:#222;
  margin:20px auto 28px;
  line-height:1.4;
  max-width:1000px;
}

.question-image{
  width:100%;
  max-width:430px;
  margin:10px auto 18px;
  display:none;
  border-radius:16px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:20px;
}

.option-btn{
  border:none;
  background:#dfe8ed;
  border-radius:20px;
  padding:24px 18px;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
}

.option-btn:hover:not(:disabled){
  transform:scale(1.02);
  background:#cfe1ea;
}

.option-btn:disabled{
  cursor:not-allowed;
}

.correct{
  background:#25b978 !important;
  color:white !important;
}

.wrong{
  background:#e63946 !important;
  color:white !important;
}

.feedback{
  min-height:34px;
  margin-top:20px;
  font-size:24px;
  font-weight:700;
}

.explanation{
  display:none;
  background:#f3f6f8;
  border-radius:18px;
  padding:18px;
  margin-top:18px;
  font-size:20px;
  line-height:1.5;
}

.score-screen{
  display:none;
}

.score{
  font-size:34px;
  color:#25b978;
  margin:25px 0;
  font-weight:800;
}

.restart-btn{
  border:none;
  background:#0077e6;
  color:white;
  padding:16px 32px;
  font-size:22px;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:700px){
  h1{
    font-size:30px;
  }

  .status-box{
    font-size:16px;
    padding:8px 10px;
  }

  .question{
    font-size:21px;
  }

  .options{
    grid-template-columns:1fr;
  }

  .option-btn{
    font-size:19px;
    padding:18px;
  }

  .explanation{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="game-container">

  <div id="quiz-screen">
    <img src="assets/logo.png" class="logo" alt="Logo">

    <h1>Addition Up To 20</h1>

    <div class="status-bar">
      <div class="status-box" id="progress">Question 1 of 12</div>
      <div class="status-box timer-box" id="timer">Time: 60s</div>
      <div class="status-box attempt-box" id="attempts">Attempts Left: 2</div>
    </div>

    <img id="question-image" class="question-image" alt="Question Image">

    <div class="question" id="question"></div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="explanation" id="explanation"></div>
  </div>

  <div class="score-screen" id="score-screen">
    <img src="assets/logo.png" class="logo" alt="Logo">
    <h1>Great Job!</h1>
    <div class="score" id="final-score"></div>
    <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
  </div>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const questions = [
  {
    question:"Rohan has 8 pencils. His teacher gives him 1 more pencil. Rohan says he now has 10 pencils. Is he correct?",
    options:["No, he has 9 pencils.","No, he has 12 pencils","No, he has 13 pencils","Yes, he has 10 pencils"],
    answer:0,
    explanation:"Rohan had 8 pencils and got 1 more pencil. 8 + 1 = 9."
  },
  {
    question:"A teacher has 10 sticks in one box and 8 sticks in another box. There are 18 students. Does she have enough sticks?",
    options:["Yes, she has enough","No, she has 1 stick less","No, she has 2 sticks less","Yes, she has more than needed"],
    answer:0,
    explanation:"10 + 8 = 18 sticks, so she has enough sticks."
  },
  {
    question:"Juhi uses 5 white shells and the same number of yellow shells to make a necklace. How many shells did she use?",
    image:"assets/shells.png",
    options:["7","8","9","10"],
    answer:3,
    explanation:"Juhi used 5 white shells and 5 yellow shells. 5 + 5 = 10."
  },
  {
    question:"A frog is on number 7 on a number line. How many jumps forward are needed to land on 10?",
    image:"assets/frog.png",
    options:["3","4","1","2"],
    answer:0,
    explanation:"7 → 8 → 9 → 10. The frog makes 3 jumps."
  },
  {
    question:"There is a 1-digit number more than 4 but less than 6. Sonam says the number is 6. Is she correct?",
    options:["Yes, 6 fits the rule","No, the number is 5","No, the number is 4","Yes, the number can be 6 or 5"],
    answer:1,
    explanation:"Only 5 is between 4 and 6."
  },
  {
    question:"Maya adds 12 + 3 and writes the answer as 14. What mistake did she make?",
    options:["She added 3 tens instead of 3 ones","She counted one less in the ones place","She subtracted instead of adding","The answer is correct"],
    answer:1,
    explanation:"12 + 3 = 15. Maya counted one less."
  },
  {
    question:"Who brought the same number of pebbles?",
    image:"assets/pebbles.png",
    options:["Noor and Vinu","Vinu and Sid","Sid and Romi","Romi and Noor"],
    answer:1,
    explanation:"Sid has 15 pebbles and Vinu also has 15 pebbles."
  },
  {
    question:"Team A scored 5 + 5 points. Team B scored 4 + 6 points. Which statement is true?",
    options:["Team A scored more","Team B scored more","Both teams scored equal points","Team A scored 1 more point"],
    answer:2,
    explanation:"5 + 5 = 10 and 4 + 6 = 10. Both teams scored equal points."
  },
  {
    question:"Which sum does NOT equal 15?",
    options:["10 + 5","12 + 3","14 + 1","10 + 2"],
    answer:3,
    explanation:"10 + 2 = 12, not 15."
  },
  {
    question:"12 children are already on the bus. 7 more children get in. The bus can carry 20 children. Is the driver correct that everyone gets a seat?",
    options:["Yes, because 12 + 7 = 19","Yes, because the bus can carry 12 children","No, because 7 children are too many","No, because 12 + 7 = 21"],
    answer:0,
    explanation:"12 + 7 = 19. Since the bus can carry 20 children, everyone gets a seat."
  },
  {
    question:"Ali has 11 balloons. His sister gives him 5 more and he finds 3 more. Does he have enough balloons to make 20?",
    options:["Yes, exactly 20","No, he has 19 balloons","No, he has 16 balloons","Yes, he has more than 20"],
    answer:1,
    explanation:"11 + 5 + 3 = 19. He needs 20, so he has 1 balloon less."
  },
  {
    question:"Ronak and Risha are putting laddoos in baskets to make groups of 10. Which group is the odd one out?",
    options:["7 laddoos + 3 laddoos","6 laddoos + 4 laddoos","8 laddoos + 2 laddoos","5 laddoos + 3 laddoos"],
    answer:3,
    explanation:"7 + 3, 6 + 4, and 8 + 2 make 10. But 5 + 3 = 8."
  }
];

let shuffledQuestions = [];
let currentQuestion = 0;
let score = 0;
let attemptsLeft = 2;
let timeLeft = 60;
let timerInterval = null;
let questionLocked = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const explanationEl = document.getElementById("explanation");
const progressEl = document.getElementById("progress");
const questionImage = document.getElementById("question-image");
const timerEl = document.getElementById("timer");
const attemptsEl = document.getElementById("attempts");
const feedbackEl = document.getElementById("feedback");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function shuffleArray(array){
  return array
    .map(item => ({ item, sort: Math.random() }))
    .sort((a,b) => a.sort - b.sort)
    .map(({ item }) => item);
}

function startQuiz(){
  shuffledQuestions = shuffleArray(questions);
  currentQuestion = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion(){
  clearInterval(timerInterval);

  attemptsLeft = 2;
  timeLeft = 60;
  questionLocked = false;

  const q = shuffledQuestions[currentQuestion];

  progressEl.textContent = `Question ${currentQuestion + 1} of ${shuffledQuestions.length}`;
  timerEl.textContent = `Time: ${timeLeft}s`;
  attemptsEl.textContent = `Attempts Left: ${attemptsLeft}`;
  questionEl.textContent = q.question;
  feedbackEl.textContent = "";
  feedbackEl.style.color = "#222";
  explanationEl.style.display = "none";
  explanationEl.innerHTML = "";

  if(q.image){
    questionImage.src = q.image;
    questionImage.style.display = "block";
  }else{
    questionImage.style.display = "none";
  }

  optionsEl.innerHTML = "";

  q.options.forEach((option,index)=>{
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = option;
    btn.onclick = function(){
      checkAnswer(index, btn);
    };
    optionsEl.appendChild(btn);
  });

  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);

  timerInterval = setInterval(()=>{
    timeLeft--;
    timerEl.textContent = `Time: ${timeLeft}s`;

    if(timeLeft <= 0){
      clearInterval(timerInterval);
      revealCorrectAnswer("Time is up!");
    }
  },1000);
}

function playSound(sound){
  sound.currentTime = 0;
  sound.play().catch(()=>{});
}

function checkAnswer(selectedIndex, selectedButton){
  if(questionLocked) return;

  const q = shuffledQuestions[currentQuestion];
  const buttons = document.querySelectorAll(".option-btn");

  if(selectedIndex === q.answer){
    questionLocked = true;
    clearInterval(timerInterval);

    selectedButton.classList.add("correct");
    buttons.forEach(btn => btn.disabled = true);

    score++;
    feedbackEl.style.color = "#25b978";
    feedbackEl.textContent = "Good Job!";
    playSound(correctSound);
    confettiEffect();
    showExplanationAndMove();
  }else{
    attemptsLeft--;
    attemptsEl.textContent = `Attempts Left: ${attemptsLeft}`;
    selectedButton.classList.add("wrong");
    selectedButton.disabled = true;
    playSound(wrongSound);

    if(attemptsLeft === 1){
      feedbackEl.style.color = "#d62828";
      feedbackEl.textContent = "Try Again! One attempt left.";
    }else{
      revealCorrectAnswer("Two attempts are over!");
    }
  }
}

function revealCorrectAnswer(message){
  if(questionLocked) return;

  questionLocked = true;
  clearInterval(timerInterval);

  const q = shuffledQuestions[currentQuestion];
  const buttons = document.querySelectorAll(".option-btn");

  buttons.forEach(btn => btn.disabled = true);
  buttons[q.answer].classList.add("correct");

  feedbackEl.style.color = "#d62828";
  feedbackEl.textContent = `${message} Correct answer is shown.`;

  showExplanationAndMove();
}

function showExplanationAndMove(){
  const q = shuffledQuestions[currentQuestion];

  explanationEl.innerHTML = "<b>Explanation:</b> " + q.explanation;
  explanationEl.style.display = "block";

  setTimeout(()=>{
    currentQuestion++;

    if(currentQuestion < shuffledQuestions.length){
      loadQuestion();
    }else{
      showScore();
    }
  },3500);
}

function showScore(){
  clearInterval(timerInterval);
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("score-screen").style.display = "block";
  document.getElementById("final-score").textContent = `You scored ${score} / ${shuffledQuestions.length}`;
}

function restartQuiz(){
  document.getElementById("score-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  startQuiz();
}

function confettiEffect(){
  for(let i=0;i<70;i++){
    let confetti = document.createElement("div");
    confetti.style.position = "fixed";
    confetti.style.width = "10px";
    confetti.style.height = "10px";
    confetti.style.background = `hsl(${Math.random()*360},100%,50%)`;
    confetti.style.left = Math.random()*window.innerWidth + "px";
    confetti.style.top = "-15px";
    confetti.style.borderRadius = "50%";
    confetti.style.zIndex = "9999";
    document.body.appendChild(confetti);

    confetti.animate([
      {transform:"translateY(0px) rotate(0deg)"},
      {transform:`translateY(${window.innerHeight + 80}px) rotate(360deg)`}
    ],{
      duration:2500 + Math.random()*1500,
      iterations:1
    });

    setTimeout(()=>{
      confetti.remove();
    },4200);
  }
}

startQuiz();
</script>

</body>
</html>
