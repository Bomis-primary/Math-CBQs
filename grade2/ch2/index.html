<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 2: Addition Challenge</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #475569;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
            min-height: 480px;
        }

        /* 5-second Splash Screen */
        #intro-view {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #intro-view.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        .view {
            display: none;
            padding: 24px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        #instruction-view {
            text-align: center;
            align-items: center;
        }

        .instruction-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            width: 100%;
        }

        .instruction-box p {
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .instruction-box ul {
            margin-left: 20px;
            color: var(--text-muted);
        }

        .instruction-box li {
            margin-bottom: 8px;
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: var(--primary-hover);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            margin-bottom: 20px;
            gap: 10px;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-item {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .timer-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 4px 12px;
            border-radius: 20px;
            min-width: 55px;
            text-align: center;
        }

        .mute-btn {
            background: #f1f5f9;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        
        .mute-btn:hover {
            background: #e2e8f0;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .question-image-frame {
            width: 100%;
            height: 180px;
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .question-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        .feedback-box {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-box.hint {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            color: #1d4ed8;
        }

        .feedback-box.explanation {
            background-color: #f8fafc;
            border-left: 5px solid #64748b;
            color: var(--text-main);
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        .results-card {
            text-align: center;
            padding: 20px 0;
            align-items: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="fx-canvas"></canvas>

        <div id="intro-view">
            <div class="logo-container">
                <img src="assets/logo.png" onerror="this.style.display='none'" alt="Innovine Logo">
            </div>
        </div>

        <div id="instruction-view" class="view">
            <h2 style="color: var(--primary);">Addition Challenge</h2>
            <div class="instruction-box">
                <p><strong>Rules:</strong></p>
                <ul>
                    <li>You have <strong>60 seconds</strong> to solve each puzzle.</li>
                    <li>If you make a mistake, you'll get a <strong>hint</strong>!</li>
                    <li>You get <strong>2 attempts</strong> before the correct explanation is shown.</li>
                </ul>
            </div>
            <button class="start-btn" onclick="gameEngine.startQuiz()">Start Playing</button>
        </div>

        <div id="game-view" class="view">
            <div class="game-header">
                <div class="hud-item" id="q-counter">Question: 1/20</div>
                <div class="hud-group">
                    <div class="hud-item timer-badge" id="timer-display">60s</div>
                    <button class="mute-btn" id="btn-mute" onclick="gameEngine.toggleMute()">🔊 Mute</button>
                </div>
                <div class="hud-item" id="score-counter">Score: 0</div>
            </div>

            <div class="question-image-frame" id="img-frame">
                <img id="q-img" class="question-image" src="" alt="Context Card">
            </div>
            
            <div class="question-text" id="q-txt">Question Text Placeholder</div>

            <div class="options-grid" id="options-box"></div>

            <div id="feedback-display" class="feedback-box"></div>

            <div class="action-container">
                <button id="btn-next" class="next-btn" onclick="gameEngine.nextQuestion()">Continue</button>
            </div>
        </div>

        <div id="result-view" class="view results-card">
            <h2>Challenge Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="final-msg">Performance Review</div>
            <button class="start-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="snd-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        const questionsDatabase = [
            {
                text: "Look at the flying kites containing math expressions side by side. Which kite yields the largest total sum?",
                image: "assets/kites.png",
                options: ["Kite A", "Kite B", "Kite C", "Kite D"],
                answer: 3,
                hint: "Calculate each sum: A is 110+115=225, B is 205+145=350, C is 120+260=380, D is 210+215=425.",
                explanation: "210 + 215 = 425. Kite D yields the largest total sum."
            },
            {
                text: "A student adds 215 and 240. Is the final sum greater than 450?",
                options: ["Yes, because it equals 455", "No, because it equals 445", "It matches 450", "Less than 400"],
                answer: 0,
                hint: "Break it down: 200 + 200 = 400. Now add the tens together (15 + 40).",
                explanation: "215 + 240 = 455. Since 455 is larger than 450, the correct evaluation is Yes."
            },
            {
                text: "Karan has a tray with 160 green buttons. Meera places an identical tray with 110 purple buttons next to him. They want to find out how many buttons they have in all. What mathematical process should they use?",
                options: ["Combine both groups using addition", "Find the difference using subtraction", "Separate them equally using division", "Multiply the green buttons only"],
                answer: 0,
                hint: "Think about what happens when you combine two distinct collections into one layout group.",
                explanation: "To find out the total quantity when groups are put together, you must always add them. 160 + 110 = 270 buttons."
            },
            {
                text: "Aayan solved an expression: 216 + 252 = 468. Which statement is correct about his work?",
                options: ["Ones place is wrong", "Tens place is wrong", "Hundreds place is wrong", "No mistake, it is correct"],
                answer: 3,
                hint: "Check column by column: Ones (6+2), Tens (1+5), and Hundreds (2+2).",
                explanation: "6+2=8, 1+5=6, and 2+2=4. All positional columns are perfectly calculated."
            },
            {
                text: "A storage facility houses 240 crates and receives 210 more crates. The facility must hold at least 450 crates to meet its goal. Did it reach the goal?",
                options: ["Yes, they have 450 crates", "No, they need 10 more", "Yes, they have 460 crates", "No, they only have 400"],
                answer: 0,
                hint: "Add 240 and 210 first to find out the current storage count.",
                explanation: "240 + 210 = 450 crates. This hits the targeted benchmark."
            },
            {
                text: "Three tracking teams measure their collection targets. Team Alpha has 210 + 80 items, Team Beta has 300 + 110 items, and Team Gamma has 250 + 20 items. Which team reached the highest total?",
                options: ["Team Alpha", "Team Beta", "Team Gamma", "Team Alpha and Team Beta tied"],
                answer: 1,
                hint: "Find the sums: Alpha = 290, Beta = 410, Gamma = 270.",
                explanation: "Team Beta reached 300 + 110 = 410 items, which is higher than the other tracking teams."
            },
            {
                text: "Examine Zayan's puzzle card. Box X has 180 cars and Box Y has 140 cars. He states that the collective total is 40 cars. What went wrong?",
                image: "assets/jars.png",
                options: ["He subtracted instead of adding the groups together", "He divided the items by accident", "He only counted the cars in Box Y", "His logic is correct"],
                answer: 0,
                hint: "When finding a combined total of multiple sets, should you use subtraction or addition?",
                explanation: "Zayan subtracted (180 − 140 = 40) instead of adding the groups together to get the full amount of 320."
            },
            {
                text: "Look at the visual unit block sets layout below. Which statement correctly identifies the total number of blocks?",
                image: "assets/blocks-320.png",
                options: ["Total is 320", "Total is less than 300", "Total is more than 350", "Total is 300"],
                answer: 0,
                hint: "Count upwards by groupings: on the left are 2 large flats (200), on the right are one flat (100) and two rods (20).",
                explanation: "Combining 200 units (left) and 120 units (right) gives a total calculation of 320 blocks."
            },
            {
                text: "Examine the counting abacuses. What is the total sum when the values displayed on both abacuses are joined?",
                image: "assets/abacus.png",
                options: ["It is 176", "It is 300", "It is 476", "It is 496"],
                answer: 2,
                hint: "Identify both baseline numbers first: Abacus A shows 176 and Abacus B shows 300. Then combine them together.",
                explanation: "The first abacus shows 176 and the second shows 300. Joining them results in 176 + 300 = 476."
            },
            {
                text: "Tickets sold over two days: Day 1 – 140 tickets, Day 2 – 150 tickets. Which statement is completely true?",
                options: ["The total is 290", "The total is less than 280", "The total is more than 300", "The total is 200"],
                answer: 0,
                hint: "Add the baseline values directly: 140 + 150.",
                explanation: "Adding 140 and 150 gives an exact calculation outcome of 290 tickets."
            },
            {
                text: "A fruit shop owner has 230 red apples and buys 120 green apples. What is the total number of apples available at the shop?",
                options: ["350 apples", "320 apples", "250 apples", "400 apples"],
                answer: 0,
                hint: "Add the hundreds together (200 + 100), then add the tens together (30 + 20).",
                explanation: "230 + 120 = 350. The shop has a combined sum of 350 apples."
            },
            {
                text: "A delivery rider has 170 parcels and receives 200 more. Is the total count above 400?",
                options: ["No, it is 370", "Yes, it is above 410", "It maps to 400", "Less than 300"],
                answer: 0,
                hint: "Combine the values: 170 + 200. Does it cross 400?",
                explanation: "170 + 200 = 370. Since 370 is less than 400, the true statement evaluation answer is No."
            },
            {
                text: "Which of the following addition layouts requires regrouping (carrying)?",
                options: ["134 + 212", "258 + 124", "303 + 172", "210 + 230"],
                answer: 1,
                hint: "Look at the digits in the ones place. If they equal 10 or more when combined, you must carry over.",
                explanation: "In 258 + 124, adding the ones digits (8 + 4) gives 12, which requires carrying over 1 ten to the tens place. The total is 382."
            },
            {
                text: "Which of the following expressions does NOT fit because it does not represent an addition setup?",
                options: ["100 + 300", "400 + 20", "400 − 100", "250 + 150"],
                answer: 2,
                hint: "Look closely at the mathematical sign in the center of each operation block.",
                explanation: "400 − 100 uses a minus sign, meaning it performs subtraction, unlike the additive alternatives."
            },
            {
                text: "Look at the unit block sets layout side by side. Which statement correctly describes the total number of blocks?",
                image: "assets/blocks-300.png",
                options: ["Total is 300", "Total is less than 300", "Total is more than 300", "Total is 200"],
                answer: 0,
                hint: "Count upwards by groupings of hundreds for the three blocks: 100, 200, 300.",
                explanation: "Three separate unit blocks of 100 group together side by side to form a total value of 300."
            },
            {
                text: "A student calculates 150 + 150 and then incorporates 60 more units. What is the final value?",
                options: ["Total is 360", "Total is less than 350", "Total is more than 370", "Total is 300"],
                answer: 0,
                hint: "Add 150 and 150 together to reach a flat hundred milestone (300), then add 60.",
                explanation: "150 + 150 = 300. Adding 60 more gives 360."
            },
            {
                text: "A community drive gathered 200 non-perishable cans and later added 140 more. Is the total higher than 300?",
                options: ["Yes, because it is 340", "No, because it is 290", "It matches 300", "Less than 250"],
                answer: 0,
                hint: "Add 200 and 140 together (340) to compare the combined number against the 300 baseline.",
                explanation: "200 + 140 = 340. Since 340 is greater than 300, the correct answer is Yes."
            },
            {
                text: "A given number baseline is 150. Another 250 is added directly to it. Is the result higher than 400?",
                options: ["No, it is 400", "Yes, it is 410", "It maps to 350", "Less than 300"],
                answer: 0,
                hint: "Add the numbers together: 150 + 250. Does it cross 400 or hit it?",
                explanation: "150 + 250 = 400. Since 400 is equal to 400 (not higher), the true evaluation answer is No."
            },
            {
                text: "A chef matches 200 + 120 + 80 ingredient units during meal prep. What is the total sum?",
                options: ["Total is 400", "Total is less than 400", "Total is more than 400", "Total is 320"],
                answer: 0,
                hint: "Group the smaller values first: 120 + 80 makes 200. Now add that to 200.",
                explanation: "120 + 80 = 200. Then 200 + 200 gives a total of 400."
            },
            {
                text: "Which of the following numbers, when added to 200, does not require carrying?",
                options: ["100", "150", "199", "250"],
                answer: 2,
                hint: "Look at the ones and tens places. 200 has 0s there, so you only have to check if the incoming ones/tens are 9 or less.",
                explanation: "200 has zeros in both tens and ones. In 199, ones (0+9=9) and tens (0+9=9) do not cross 10. The layout does not require carrying over."
            }
        ];

        class GameEngine {
            constructor(questions) {
                this.rawDB = questions;
                this.gameDB = [];
                this.currentIdx = 0;
                this.score = 0;
                this.attemptsLeft = 2;
                this.timer = null;
                this.timeLeft = 60;
                this.isMuted = false;
                
                this.canvas = document.getElementById('fx-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
            }

            shuffle(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                setTimeout(() => {
                    const splash = document.getElementById('intro-view');
                    splash.classList.add('fade-out');
                    document.getElementById('instruction-view').classList.add('active');
                }, 5000);

                this.animateParticles();
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.parentElement.offsetWidth;
                this.canvas.height = this.canvas.parentElement.offsetHeight;
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                document.getElementById('btn-mute').innerText = this.isMuted ? "❌ Muted" : "🔊 Mute";
            }

            startQuiz() {
                this.gameDB = this.shuffle(this.rawDB);
                this.currentIdx = 0;
                this.score = 0;
                
                document.getElementById('instruction-view').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                this.loadQuestion();
            }

            loadQuestion() {
                if (this.currentIdx >= this.gameDB.length) {
                    this.showResults();
                    return;
                }

                clearInterval(this.timer);
                this.attemptsLeft = 2;
                
                const q = this.gameDB[this.currentIdx];
                
                document.getElementById('q-counter').innerText = `Question: ${this.currentIdx + 1}/${this.gameDB.length}`;
                document.getElementById('score-counter').innerText = `Score: ${this.score}`;
                
                document.getElementById('q-txt').innerText = q.text;

                const imgFrame = document.getElementById('img-frame');
                const imgElem = document.getElementById('q-img');
                if (q.image) {
                    imgElem.src = q.image;
                    imgFrame.style.display = 'flex';
                } else {
                    imgFrame.style.display = 'none';
                    imgElem.src = ''; 
                }

                const optBox = document.getElementById('options-box');
                optBox.innerHTML = '';
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.handleAnswer(idx, btn);
                    optBox.appendChild(btn);
                });

                document.getElementById('feedback-display').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
                
                this.timeLeft = 60;
                this.startTimer();
            }

            startTimer() {
                const display = document.getElementById('timer-display');
                display.innerText = `${this.timeLeft}s`;
                
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    display.innerText = `${this.timeLeft}s`;
                    
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.lockOptionsDueTimeout();
                    }
                }, 1000);
            }

            handleAnswer(selectedIdx, clickedBtn) {
                const q = this.gameDB[this.currentIdx];
                const feedback = document.getElementById('feedback-display');

                if (selectedIdx === q.answer) {
                    clearInterval(this.timer);
                    clickedBtn.classList.add('correct');
                    this.playSound('snd-correct');
                    this.triggerConfetti();
                    
                    this.score += (this.attemptsLeft === 2) ? 10 : 5;
                    document.getElementById('score-counter').innerText = `Score: ${this.score}`;
                    
                    this.disableAllOptions();
                    document.getElementById('btn-next').style.display = 'block';
                } else {
                    this.attemptsLeft--;
                    clickedBtn.classList.add('wrong');
                    clickedBtn.disabled = true;
                    this.playSound('snd-wrong');

                    if (this.attemptsLeft > 0) {
                        feedback.className = "feedback-box hint";
                        feedback.innerText = `Hint: ${q.hint}`;
                        feedback.style.display = 'block';
                    } else {
                        clearInterval(this.timer);
                        feedback.className = "feedback-box explanation";
                        feedback.innerText = `Incorrect. ${q.explanation}`;
                        feedback.style.display = 'block';
                        
                        this.highlightCorrectAnswer(q.answer);
                        this.disableAllOptions();
                        document.getElementById('btn-next').style.display = 'block';
                    }
                }
            }

            lockOptionsDueTimeout() {
                const q = this.gameDB[this.currentIdx];
                const feedback = document.getElementById('feedback-display');
                feedback.className = "feedback-box explanation";
                feedback.innerText = `Time's up! ${q.explanation}`;
                feedback.style.display = 'block';
                
                this.highlightCorrectAnswer(q.answer);
                this.disableAllOptions();
                document.getElementById('btn-next').style.display = 'block';
            }

            highlightCorrectAnswer(targetIdx) {
                const buttons = document.querySelectorAll('.option-btn');
                if (buttons[targetIdx]) {
                    buttons[targetIdx].classList.add('correct');
                }
            }

            disableAllOptions() {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            }

            nextQuestion() {
                this.currentIdx++;
                this.loadQuestion();
            }

            playSound(id) {
                if (this.isMuted) return;
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            }

            triggerConfetti() {
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 3,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.7) * 10,
                        color: `hsla(${Math.random() * 360}, 100%, 50%, 1)`,
                        size: Math.random() * 5 + 3,
                        alpha: 1
                    });
                }
            }

            animateParticles() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= 0.015;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1.0;
                requestAnimationFrame(() => this.animateParticles());
            }

            showResults() {
                document.getElementById('game-view').classList.remove('active');
                document.getElementById('result-view').classList.add('active');
                
                const maxPossibleScore = this.gameDB.length * 10;
                const percentage = Math.round((this.score / maxPossibleScore) * 100);
                document.getElementById('final-score').innerText = `${percentage}%`;
                
                const msgElem = document.getElementById('final-msg');
                if (percentage >= 75) {
                    msgElem.innerText = "Good job!";
                    msgElem.style.color = "var(--success)";
                } else if (percentage >= 40) {
                    msgElem.innerText = "Review this chapter and try again";
                    msgElem.style.color = "#d97706";
                } else {
                    msgElem.innerText = "Let’s practise more";
                    msgElem.style.color = "var(--error)";
                }
            }
        }

        const gameEngine = new GameEngine(questionsDatabase);
        window.onload = () => gameEngine.init();
    </script>
</body>
</html>
