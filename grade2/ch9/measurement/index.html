<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Measurements Challenge</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 480px;
        }

        /* 5-second Splash Overlay Frame (Logo only) */
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            max-width: 240px;
            height: auto;
            object-fit: contain;
        }

        /* View Layout System */
        .screen {
            display: none;
            padding: 24px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Panel */
        .top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .box {
            background: #e8f0ff;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        /* Question View Element */
        .question {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Options Interactive Interface (Single Column Optimization) */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            background: var(--card-bg);
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
            min-height: 56px;
        }

        .btn:hover:not(:disabled) {
            background: #eef5ff;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .btn.correct {
            background: #c8f7d5 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .btn.wrong {
            background: #ffd6d6 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        /* Control Button Container */
        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .next {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next:hover {
            background: var(--primary-hover);
        }

        /* Summary Panel Formatting */
        .result-card {
            text-align: center;
            padding: 40px 0;
            align-items: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            white-space: pre-line;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 5-Second Splash Screen with logo only -->
        <div id="splash">
            <img src="assets/logo.png" alt="Logo" onerror="this.onerror=null; this.src='assets/innovine-logo.png';">
        </div>

        <div id="game" class="screen active">
            <div class="top">
                <div class="box">Q: <span id="qno">1</span>/<span id="qtotal">10</span></div>
                <div class="box">Score: <span id="score">0</span></div>
                <div class="box">Time: <span id="time">60</span>s</div>
            </div>

            <div class="question" id="question"></div>
            <div class="options" id="options"></div>

            <div class="action-container">
                <button class="next" onclick="nextQ()" id="nextBtn">Next</button>
            </div>
        </div>

        <div id="result" class="screen result-card">
            <h2>Chapter Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="resultText">Performance Review</div>
            <button class="restart-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // HIGH-QUALITY COMPETENCY-BASED QUESTIONS (CBQs) ON MEASUREMENTS
        const questionsDatabase = [
            { 
                q: "Ria wants to measure the length of her classroom whiteboard. Which standard tool should she choose for the most accurate result?", 
                a: ["A short 15 cm plastic scale", "A long measuring tape", "A standard hand span", "A wooden pencil"], 
                c: 1 
            },
            { 
                q: "A tailor needs to measure around a customer's chest to stitch a shirt. Which instrument is ideal for this?", 
                a: ["A flexible cloth measuring tape", "A heavy iron weighing scale", "A rigid metre rod", "A 30 cm desk ruler"], 
                c: 0 
            },
            { 
                q: "Amit buys a watermelon from the market. Which unit is best suited to express the weight of the watermelon?", 
                a: ["Grams (g)", "Kilograms (kg)", "Millilitres (ml)", "Centimetres (cm)"], 
                c: 1 
            },
            { 
                q: "A recipe for making fruit punch requires 2 litres of orange juice and 1 litre of apple juice. What is the total volume of juice in the punch?", 
                a: ["1 litre", "2 litres", "3 litres", "4 litres"], 
                c: 2 
            },
            { 
                q: "Look at the given objects: A feather, a textbook, a paperclip, and an eraser. Which among these is expected to have the maximum weight?", 
                a: ["A feather", "A textbook", "A paperclip", "An eraser"], 
                c: 1 
            },
            { 
                q: "Sanya has a piece of ribbon that is 45 cm long. She cuts off 15 cm to pack a gift. What length of ribbon is left with her?", 
                a: ["20 cm", "30 cm", "60 cm", "45 cm"], 
                c: 1 
            },
            { 
                q: "Which of the following containers typically holds the largest amount of liquid?", 
                a: ["A medicine teaspoon", "A drinking glass", "A water bucket", "An ink dropper"], 
                c: 2 
            },
            { 
                q: "Deepak weighs two school bags. Bag X weighs 4 kg and Bag Y weighs 7 kg. What is the difference in weight between the two bags?", 
                a: ["2 kg", "3 kg", "11 kg", "4 kg"], 
                c: 1 
            },
            { 
                q: "Assertion (A): Capacity refers to the amount of liquid a container can hold. Reason (R): Liquids are generally measured in units like litres and millilitres. Which option is correct?", 
                a: ["Both A and R are correct and R explains A", "Both A and R are correct but R does not explain A", "A is correct, R is incorrect", "Both A and R are incorrect"], 
                c: 0 
            },
            { 
                q: "A jug holds 10 cups of water. If Kabir pours out 4 cups of water to fill glasses, how many cups of water are left in the jug?", 
                a: ["4 cups", "6 cups", "10 cups", "14 cups"], 
                c: 1 
            }
        ];

        let runtimeQuestions = [];
        let i = 0, score = 0, time = 60, attempt = 0, lock = false, currentCorrectIndex = null, timerInterval = null;

        // FISHER-YATES UNBIASED ARRAY SHUFFLE UTILITY
        function shuffleArray(array) {
            for (let idx = array.length - 1; idx > 0; idx--) {
                const j = Math.floor(Math.random() * (idx + 1));
                [array[idx], array[j]] = [array[j], array[idx]];
            }
            return array;
        }

        // DEEP COPY AND BOOTSTRAP AUTOMATION
        function bootstrapQuizData() {
            runtimeQuestions = questionsDatabase.map(item => {
                const originalAnswers = [...item.a];
                const trueAnswerValue = originalAnswers[item.c];
                
                const shuffledAnswers = shuffleArray(originalAnswers);
                const dynamicCorrectIdx = shuffledAnswers.indexOf(trueAnswerValue);
                
                return {
                    q: item.q,
                    a: shuffledAnswers,
                    c: dynamicCorrectIdx
                };
            });

            shuffleArray(runtimeQuestions);
            document.getElementById("qtotal").innerText = runtimeQuestions.length;
        }

        const appEngine = {
            init() {
                setTimeout(() => {
                    const splash = document.getElementById("splash");
                    splash.classList.add("fade-out");
                    
                    splash.addEventListener('transitionend', () => {
                        splash.style.display = "none";
                    });
                }, 5000);
                
                bootstrapQuizData();
                load();
            }
        };

        function load() {
            if (i >= runtimeQuestions.length) {
                showResult();
                return;
            }

            let q = runtimeQuestions[i];
            currentCorrectIndex = q.c;

            document.getElementById("qno").innerText = i + 1;
            document.getElementById("question").innerText = q.q;

            let html = "";
            q.a.forEach((o, idx) => {
                html += `<button class="btn" onclick="check(this,${idx})">${o}</button>`;
            });

            document.getElementById("options").innerHTML = html;
            document.getElementById("nextBtn").style.display = "none";

            attempt = 0;
            lock = false;
            
            time = 60;
            document.getElementById("time").innerText = time;
            startCountdown();
        }

        function startCountdown() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (time > 0) {
                    time--;
                    document.getElementById("time").innerText = time;
                } else {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }, 1000);
        }

        function check(btn, ans) {
            if (lock) return;

            if (ans == currentCorrectIndex) {
                clearInterval(timerInterval);
                btn.classList.add("correct");
                safePlayAudio("correct");
                score++;
                document.getElementById("score").innerText = score;
                lock = true;
                document.getElementById("nextBtn").style.display = "inline-block";
            } else {
                attempt++;
                btn.classList.add("wrong");
                btn.disabled = true;
                safePlayAudio("wrong");

                if (attempt >= 2) {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }
        }

        function autoRevealCorrect() {
            lock = true;
            const buttons = document.querySelectorAll(".options .btn");
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx == currentCorrectIndex) {
                    btn.classList.add("correct");
                }
            });
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQ() {
            i++;
            load();
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById("game").style.display = "none";
            document.getElementById("result").style.display = "flex";

            let percent = Math.round((score / runtimeQuestions.length) * 100);
            document.getElementById("final-score").innerText = `${percent}%`;

            let msg = "";
            if (percent >= 75) msg = "Good job 🎉";
            else if (percent >= 40) msg = "Review this chapter 🙂";
            else msg = "Let’s practise more 📘";

            document.getElementById("resultText").innerText = `${msg}\nScore: ${score}/${runtimeQuestions.length}`;
        }

        function safePlayAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        window.onload = () => appEngine.init();
    </script>
</body>
</html>
