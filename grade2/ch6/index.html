<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Multiplication Challenge</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #475569;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 480px;
        }

        /* 5-second Splash Overlay Frame */
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            max-width: 240px;
            height: auto;
        }

        /* View Layout System */
        .screen {
            display: none;
            padding: 24px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Panel */
        .top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .box {
            background: #e8f0ff;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        /* Question View Element */
        .question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Options Interactive Interface */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            background: var(--card-bg);
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
            min-height: 56px;
        }

        .btn:hover:not(:disabled) {
            background: #eef5ff;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .btn.correct {
            background: #c8f7d5 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .btn.wrong {
            background: #ffd6d6 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        /* Control Button Container */
        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .next {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next:hover {
            background: var(--primary-hover);
        }

        /* Summary Panel Formatting */
        .result-card {
            text-align: center;
            padding: 40px 0;
            align-items: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            white-space: pre-line;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="splash">
            <img src="assets/innovine-logo.png" onerror="this.style.display='none'">
        </div>

        <div id="game" class="screen active">
            <div class="top">
                <div class="box">Q: <span id="qno">1</span>/18</div>
                <div class="box">Score: <span id="score">0</span></div>
                <div class="box">Time: <span id="time">60</span>s</div>
            </div>

            <div class="question" id="question"></div>
            <div class="options" id="options"></div>

            <div class="action-container">
                <button class="next" onclick="nextQ()" id="nextBtn">Next</button>
            </div>
        </div>

        <div id="result" class="screen result-card">
            <h2>Chapter Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="resultText">Performance Review</div>
            <button class="restart-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // ORIGINAL STATIC REFERENCE DATASET
        const questionsDatabase = [
            { q: "4 rows with 5 chairs each. Do they have enough chairs for 18 students?", a: ["Yes, more than needed", "Yes, exactly 18", "No, less than needed", "Exactly 20"], c: 0 },
            { q: "Which shows 3 x 6?", a: ["6+6+6", "3+3+3+3+3+3", "6+3", "6+6"], c: 0 },
            { q: "4 x 5 = 25. What is mistake?", a: ["Used addition", "Fact incorrect", "Extra group", "No mistake"], c: 1 },
            { q: "7 baskets × 3 apples. Enough for 20 apples?", a: ["Yes, more", "Yes, exactly", "No, less", "Exactly 21"], c: 0 },
            { q: "Which shows equal groups?", a: ["2+3+4", "5+5+5", "6+7", "3+4+5"], c: 1 },
            { q: "8 pencils in 3 boxes = ?", a: ["24", "23", "25", "20"], c: 0 },
            { q: "3 groups of 4 means?", a: ["3+4", "4+4+4", "3×4", "Both b and c"], c: 3 },
            { q: "5+5+5 = ?", a: ["15", "10", "20", "25"], c: 0 },
            { q: "3×5 or 5×3 correct?", a: ["3×5", "5×3", "Both", "None"], c: 2 },
            { q: "6 plates × 4 biscuits. More than 20?", a: ["Yes", "No", "Exactly 20", "Exactly 24"], c: 0 },
            { q: "Which does NOT equal 12?", a: ["3×4", "4+4+4", "2×6", "5+5+5"], c: 3 },
            { q: "3 rows of 4 stars = ?", a: ["3×4", "4×3", "Both", "3+4"], c: 2 },
            { q: "5 baskets × 2 oranges = ?", a: ["10", "12", "8", "15"], c: 0 },
            { q: "4 packets × 5 pencils + 4 pencils = ?", a: ["24", "20", "25", "30"], c: 0 },
            { q: "4 rows × 6 plants. More than 20?", a: ["Yes", "No", "Exactly 20", "24 but not more"], c: 0 },
            { q: "At least 25 plants, 24 available?", a: ["Yes", "No", "Enough", "Exactly"], c: 1 },
            { q: "5 rows × 7 chairs − 5 chairs = ?", a: ["30", "35", "40", "25"], c: 0 },
            { q: "3×8 + 2×5 = ?", a: ["34", "30", "32", "36"], c: 0 }
        ];

        // Active operational session array placeholder
        let runtimeQuestions = [];
        let i = 0, score = 0, time = 60, attempt = 0, lock = false, currentCorrectIndex = null, timerInterval = null;

        // SEED UTILITY FOR FISHER-YATES UNBIASED RANDOMIZATION
        function shuffleArray(array) {
            for (let idx = array.length - 1; idx > 0; idx--) {
                const j = Math.floor(Math.random() * (idx + 1));
                [array[idx], array[j]] = [array[j], array[idx]];
            }
            return array;
        }

        // PREPARE INDEPENDENT RUNTIME DATA LAYERS
        function bootstrapQuizData() {
            // Shallow/Deep mapping hybrid to protect global objects
            runtimeQuestions = questionsDatabase.map(item => {
                const originalAnswers = [...item.a];
                const trueAnswerValue = originalAnswers[item.c];
                
                // Shuffle current question choice collection
                const shuffledAnswers = shuffleArray(originalAnswers);
                const dynamicCorrectIdx = shuffledAnswers.indexOf(trueAnswerValue);
                
                return {
                    q: item.q,
                    a: shuffledAnswers,
                    c: dynamicCorrectIdx
                };
            });

            // Randomize the sequence ordering of the items themselves
            shuffleArray(runtimeQuestions);
        }

        // APPLICATION ENGINE CORE
        const appEngine = {
            init() {
                setTimeout(() => {
                    const splash = document.getElementById("splash");
                    splash.classList.add("fade-out");
                    
                    splash.addEventListener('transitionend', () => {
                        splash.style.display = "none";
                    });
                }, 5000);
                
                bootstrapQuizData();
                load();
            }
        };

        function load() {
            if (i >= runtimeQuestions.length) {
                showResult();
                return;
            }

            let q = runtimeQuestions[i];
            currentCorrectIndex = q.c; // Link index context cleanly

            document.getElementById("qno").innerText = i + 1;
            document.getElementById("question").innerText = q.q;

            let html = "";
            q.a.forEach((o, idx) => {
                html += `<button class="btn" onclick="check(this,${idx})">${o}</button>`;
            });

            document.getElementById("options").innerHTML = html;
            document.getElementById("nextBtn").style.display = "none";

            attempt = 0;
            lock = false;
            
            time = 60;
            document.getElementById("time").innerText = time;
            startCountdown();
        }

        function startCountdown() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (time > 0) {
                    time--;
                    document.getElementById("time").innerText = time;
                } else {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }, 1000);
        }

        function check(btn, ans) {
            if (lock) return;

            if (ans == currentCorrectIndex) {
                clearInterval(timerInterval);
                btn.classList.add("correct");
                safePlayAudio("correct");
                score++;
                document.getElementById("score").innerText = score;
                lock = true;
                document.getElementById("nextBtn").style.display = "inline-block";
            } else {
                attempt++;
                btn.classList.add("wrong");
                btn.disabled = true;
                safePlayAudio("wrong");

                if (attempt >= 2) {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }
        }

        function autoRevealCorrect() {
            lock = true;
            const buttons = document.querySelectorAll(".options .btn");
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx == currentCorrectIndex) {
                    btn.classList.add("correct");
                }
            });
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQ() {
            i++;
            load();
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById("game").style.display = "none";
            document.getElementById("result").style.display = "flex";

            let percent = Math.round((score / runtimeQuestions.length) * 100);
            document.getElementById("final-score").innerText = `${percent}%`;

            let msg = "";
            if (percent >= 75) msg = "Good job 🎉";
            else if (percent >= 40) msg = "Review this chapter 🙂";
            else msg = "Let’s practise more 📘";

            document.getElementById("resultText").innerText = `${msg}\nScore: ${score}/${runtimeQuestions.length}`;
        }

        function safePlayAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        window.onload = () => appEngine.init();
    </script>
</body>
</html>
