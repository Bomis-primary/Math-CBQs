<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 Multiplication Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-indigo-50 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-xl rounded-2xl p-8 max-w-lg w-full m-4 border border-indigo-100">
        
        <!-- ================= 1. BRANDING SCREEN (Logo only for 5s) ================= -->
        <div id="screen-logo" class="text-center py-12">
            <img src="assets/logo.png" alt="Innovine Logo" class="w-32 h-32 object-contain mx-auto" onerror="this.src='https://via.placeholder.com/128?text=Innovine'">
        </div>

        <!-- ================= 2. INSTRUCTIONS SCREEN ================= -->
        <div id="screen-instructions" class="hidden text-center py-4">
            <h1 class="text-2xl font-bold text-indigo-900 mb-3">Multiplication Quest!</h1>
            <p class="text-gray-600 mb-6 text-sm">Welcome to Grade 2 Multiplication! Read each question carefully, look at the groups or numbers, and pick the best option. Earn points and have fun!</p>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md">
                Start Game 🚀
            </button>
        </div>

        <!-- ================= 3. QUIZ GAMEPLAY SCREEN ================= -->
        <div id="screen-quiz" class="hidden">
            <!-- Header / Progress -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                <h1 class="text-lg font-bold text-indigo-900">Multiplication Quest!</h1>
                <span id="progress-badge" class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-3 py-1 rounded-full">Question 1 of 10</span>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container">
                <h2 id="question-text" class="text-lg font-medium text-gray-800 mb-4"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <!-- Feedback & Next Button -->
            <div id="feedback-section" class="mt-6 hidden">
                <p id="feedback-text" class="font-semibold text-center mb-4"></p>
                <button id="next-btn" onclick="nextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-md">
                    Next Question
                </button>
            </div>
        </div>

        <!-- ================= 4. COMPLETION SCREEN ================= -->
        <div id="screen-complete" class="hidden text-center py-6">
            <h2 class="text-2xl font-bold text-indigo-900 mb-2">Quiz Completed! 🌟</h2>
            <p id="final-score-text" class="text-gray-600 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition">Play Again</button>
        </div>

    </div>

    <!-- Audio Elements -->
    <audio id="claps-audio" src="assets/claps.mp3"></audio>
    <audio id="wrong-audio" src="assets/wrong.mp3"></audio>

    <script>
        const quizData = [
            {
                question: "Rhea plants flowers in 4 rows, with 5 flowers in each row. Which number sentence shows the total?",
                options: ["4 + 5 = 9", "4 × 5 = 20", "5 + 5 + 5 = 15", "4 + 4 + 4 + 4 = 16"],
                correct: 1
            },
            {
                question: "What is 3 groups of 2 apples written as a multiplication sentence?",
                options: ["3 + 2 = 5", "3 × 2 = 6", "2 × 2 × 2 = 8", "3 × 3 = 9"],
                correct: 1
            },
            {
                question: "Teacher Anu asked her class to solve 7 × 0. What is the correct answer?",
                options: ["7", "1", "0", "14"],
                correct: 2
            },
            {
                question: "What is the product of any number and 1? (Example: 9 × 1)",
                options: ["0", "1", "The number itself (9)", "10"],
                correct: 2
            },
            {
                question: "If 3 × 5 = 15, what is the value of 5 × 3 according to the order property?",
                options: ["8", "12", "15", "18"],
                correct: 2
            },
            {
                question: "What is the product of 2 × 6?",
                options: ["10", "12", "14", "16"],
                correct: 1
            },
            {
                question: "Liam has 4 packs of crayons with 5 crayons in each pack. How many crayons does he have?",
                options: ["9", "15", "20", "25"],
                correct: 2
            },
            {
                question: "Count by 10s: What is 3 × 10?",
                options: ["13", "30", "33", "100"],
                correct: 1
            },
            {
                question: "Which picture represents 5 × 2?",
                options: ["5 groups of 2 objects", "2 groups of 5 objects", "Both A and B", "5 objects added to 2 objects"],
                correct: 2
            },
            {
                question: "A box has 4 rows of eggs with 2 eggs in each row. How many eggs are there in total?",
                options: ["6", "8", "10", "12"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const screenLogo = document.getElementById("screen-logo");
        const screenInstructions = document.getElementById("screen-instructions");
        const screenQuiz = document.getElementById("screen-quiz");
        const screenComplete = document.getElementById("screen-complete");

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const feedbackSection = document.getElementById("feedback-section");
        const feedbackText = document.getElementById("feedback-text");
        const progressBadge = document.getElementById("progress-badge");
        const clapsAudio = document.getElementById("claps-audio");
        const wrongAudio = document.getElementById("wrong-audio");

        // 1. Logo Sequence timer (5 seconds)
        window.onload = () => {
            setTimeout(() => {
                screenLogo.classList.add("hidden");
                screenInstructions.classList.remove("hidden");
            }, 5000);
        };

        function startQuiz() {
            screenInstructions.classList.add("hidden");
            screenQuiz.classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedbackSection.classList.add("hidden");
            const q = quizData[currentQuestion];
            questionText.textContent = q.question;
            progressBadge.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            
            optionsContainer.innerHTML = "";
            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 text-gray-700 font-medium transition duration-150 cursor-pointer";
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const buttons = optionsContainer.getElementsByTagName("button");

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add("bg-green-100", "border-green-500", "text-green-800");
                feedbackText.textContent = "🎉 Correct! Great job!";
                feedbackText.className = "text-green-600 font-bold text-center mb-4 text-lg";
                score++;
                clapsAudio.play().catch(() => {});
            } else {
                selectedBtn.classList.add("bg-red-100", "border-red-500", "text-red-800");
                buttons[q.correct].classList.add("bg-green-100", "border-green-500", "text-green-800");
                feedbackText.textContent = "❌ Oops! Not quite right.";
                feedbackText.className = "text-red-600 font-bold text-center mb-4 text-lg";
                wrongAudio.play().catch(() => {});
            }

            feedbackSection.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                screenQuiz.classList.add("hidden");
                screenComplete.classList.remove("hidden");
                document.getElementById("final-score-text").textContent = `You scored ${score} out of ${quizData.length}!`;
                if(score >= 7) clapsAudio.play().catch(() => {});
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            screenComplete.classList.add("hidden");
            screenQuiz.classList.remove("hidden");
            loadQuestion();
        }
    </script>
</body>
</html>
