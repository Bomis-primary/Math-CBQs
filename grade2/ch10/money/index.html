<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ - Money</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

body{
  background:#f4f7ff;
  color:#1f2937;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

#splash img{
  width:300px;
}

/* SCREEN */
.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:block;
}

.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* TOP */
.top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:15px;
  text-align:center;
  font-weight:bold;
}

.box{
  background:#e8f0ff;
  padding:10px;
  border-radius:12px;
}

/* QUESTION */
.question{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  padding:14px;
  border-radius:12px;
  border:2px solid #1f4e79;
  background:#fff;
  font-size:16px;
  cursor:pointer;
  min-height:60px;
}

.btn:hover{background:#eef5ff}

.correct{background:#c8f7d5 !important}
.wrong{background:#ffd6d6 !important}

/* NEXT */
.next{
  margin-top:15px;
  padding:12px 20px;
  background:#1f4e79;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* RESULT */
.result{
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game" class="screen active">
  <div class="card">

    <div class="top">
      <div class="box">Q: <span id="qno">1</span>/18</div>
      <div class="box">Score: <span id="score">0</span></div>
      <div class="box">Time: <span id="time">60</span></div>
    </div>

    <div class="question" id="question"></div>
    <div class="options" id="options"></div>

    <button class="next" onclick="nextQ()" id="nextBtn">Next</button>

  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="card result" id="resultText"></div>
</div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>

/* SPLASH */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},5000);

/* QUESTIONS */
const questions=[
{
q:"Who has more money: ₹20 or ₹15?",
a:["₹20","₹15","Equal","None"],
c:0
},
{
q:"What is money used for?",
a:["Buy things","Measure length","Weigh objects","Draw"],
c:0
},
{
q:"₹10 > ₹20?",
a:["Wrong","Correct","Equal","Unknown"],
c:0
},
{
q:"Can ₹30 buy ₹25 toy?",
a:["Yes","No","Exact","Cannot"],
c:0
},
{
q:"Which is greater?",
a:["₹10","₹50","₹5","₹2"],
c:1
},
{
q:"Which costs more?",
a:["Book ₹20","Pencil ₹5","Equal","Both cheap"],
c:0
},
{
q:"Money measures length?",
a:["Wrong","Correct","Both","Sometimes"],
c:0
},
{
q:"Which is cheaper?",
a:["Pen ₹10","Eraser ₹5","Equal","Both"],
c:1
},
{
q:"₹10 - ₹5 = ?",
a:["₹5","₹10","₹15","₹2"],
c:0
},
{
q:"₹40 - ₹35 = ?",
a:["₹5","₹10","₹15","₹0"],
c:0
},
{
q:"NOT money?",
a:["Ruler","₹10","₹20","₹50"],
c:0
},
{
q:"Highest coin?",
a:["₹1","₹2","₹5","All equal"],
c:2
},
{
q:"₹10+₹10 vs ₹5+₹5+₹5",
a:["Equal","A more","B more","None"],
c:1
},
{
q:"₹50 - ₹20 - ₹10 = ?",
a:["₹20","₹10","₹30","₹40"],
c:0
},
{
q:"₹30 - ₹20 = ?",
a:["₹10","₹5","₹20","₹15"],
c:0
},
{
q:"₹100 - ₹40 - ₹30 = ?",
a:["₹30","₹20","₹10","₹40"],
c:0
},
{
q:"₹25 toy + ₹25 toy = ?",
a:["₹50","₹40","₹30","₹60"],
c:0
},
{
q:"₹20 + ₹15 vs ₹50",
a:["Less","More","Equal","Cannot"],
c:0
}
];

let i=0,score=0,time=60,attempt=0,lock=false;

function load(){
  let q=questions[i];
  document.getElementById("qno").innerText=i+1;
  document.getElementById("question").innerText=q.q;

  let html="";
  q.a.forEach((o,idx)=>{
    html+=`<button class="btn" onclick="check(this,${idx})">${o}</button>`;
  });

  document.getElementById("options").innerHTML=html;
  document.getElementById("nextBtn").style.display="none";

  attempt=0;
  lock=false;
}

function check(btn,ans){
  if(lock) return;

  if(ans==questions[i].c){
    btn.classList.add("correct");
    document.getElementById("correct").play();
    score++;
    document.getElementById("score").innerText=score;
    lock=true;
    document.getElementById("nextBtn").style.display="inline-block";
  } else {
    attempt++;
    btn.classList.add("wrong");
    document.getElementById("wrong").play();

    if(attempt>=2){
      lock=true;
      document.getElementById("nextBtn").style.display="inline-block";
    }
  }
}

function nextQ(){
  i++;
  if(i<questions.length){
    load();
  } else {
    show();
  }
}

function show(){
  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";

  let percent=(score/questions.length)*100;

  let msg="";
  if(percent>=75) msg="Good job 🎉";
  else if(percent>=40) msg="Review this chapter 🙂";
  else msg="Let’s practise more 📘";

  document.getElementById("resultText").innerText =
    `${msg}\nScore: ${score}/${questions.length}`;
}

setInterval(()=>{
  if(time>0){
    time--;
    document.getElementById("time").innerText=time;
  } else {
    show();
  }
},1000);

load();

</script>

</body>
</html>
