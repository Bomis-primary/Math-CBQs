<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 - Chapter 10: Money Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }
        /* Splash Screen Styling */
        #splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            min-height: 300px;
        }
        #splash-screen img {
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 25px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        #splash-screen h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        #splash-screen p {
            color: #64748b;
            font-size: 16px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-height: 55px;
            object-fit: contain;
        }
        .timer-bar {
            height: 6px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            transition: width 1s linear;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background: #e0e7ff;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--accent-green) !important;
            color: #166534;
        }
        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--accent-red) !important;
            color: #991b1b;
        }
        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.hint {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        .feedback.explanation {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
            margin-top: 20px;
            display: none;
        }
        .next-btn:hover {
            background: var(--primary-hover);
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .score-card p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Audio elements for correct/wrong sounds from assets folder -->
<audio id="claps-sound" src="assets/claps.mp3" preload="auto"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3" preload="auto"></audio>

<div class="container">
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Learning Logo" onerror="this.onerror=null; this.src='logo.png';">
        <h1>Innovine Learning</h1>
        <p>Grade 2 Math - Chapter 10: Money Quiz</p>
        <p style="font-size: 13px; margin-top: 15px; color: #94a3b8;">Loading in <span id="splash-countdown">5</span>s...</p>
    </div>

    <!-- Quiz View (Hidden initially) -->
    <div id="quiz-view" style="display: none;">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Innovine Learning Logo" onerror="this.onerror=null; this.src='logo.png';">
        </div>
        <div class="timer-bar">
            <div class="timer-fill" id="timer-fill"></div>
        </div>
        <div class="question-header">
            <span id="question-counter">Question 1 of 12</span>
            <span id="timer-text">Time left: 60s</span>
        </div>
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-list" id="options-list"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="score-card" id="score-card">
        <h2>Quiz Completed! 🎉</h2>
        <p id="final-score">You scored X out of 12</p>
        <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Ranu wants to buy a notebook that costs ₹ 40. Which combination of notes and coins should she pick to pay the exact amount without needing any change?",
            options: [
                "One ₹ 20 note and two ₹ 10 notes",
                "One ₹ 50 note and one ₹ 10 note",
                "Four ₹ 5 notes",
                "Two ₹ 20 notes and two ₹ 5 notes"
            ],
            answer: 0,
            hint: "Count the total value: ₹ 20 + ₹ 10 + ₹ 10 = ₹ 40.",
            explanation: "One ₹ 20 note and two ₹ 10 notes add up precisely to ₹ 40 (20 + 10 + 10 = 40)."
        },
        {
            q: "Look at the amount written in figures: ₹ 252. How is this amount correctly written in words?",
            options: [
                "Two hundred twenty-five rupees",
                "Two hundred fifty-two rupees",
                "Five hundred twenty-two rupees",
                "Two hundred fifty rupees"
            ],
            answer: 1,
            hint: "Look closely at the tens and ones digits (5 tens and 2 ones).",
            explanation: "The number ₹ 252 is read and written in words as 'Two hundred fifty-two rupees'."
        },
        {
            q: "Amit wants to exchange one ₹ 500 note into smaller notes of ₹ 100. How many ₹ 100 notes will he get?",
            options: [
                "2 notes",
                "4 notes",
                "5 notes",
                "10 notes"
            ],
            answer: 2,
            hint: "Think about how many hundreds make five hundred (100 × 5 = 500).",
            explanation: "Five ₹ 100 notes equal one ₹ 500 note (100 + 100 + 100 + 100 + 100 = 500)."
        },
        {
            q: "Renuka buys a mango for ₹ 45 and a papaya for ₹ 32. How much money does Renuka spend in all?",
            options: [
                "₹ 67",
                "₹ 77",
                "₹ 87",
                "₹ 75"
            ],
            answer: 1,
            hint: "Add the ones column first (5 + 2), then the tens column (4 + 3).",
            explanation: "Adding ₹ 45 and ₹ 32 gives ₹ 77 in total (45 + 32 = 77)."
        },
        {
            q: "Shridhar had a ₹ 100 note. He purchased stationery items worth ₹ 77. How much money does the shopkeeper need to return?",
            options: [
                "₹ 23",
                "₹ 33",
                "₹ 25",
                "₹ 13"
            ],
            answer: 0,
            hint: "Subtract ₹ 77 from ₹ 100 by borrowing across columns (100 - 77).",
            explanation: "The remaining balance is found by subtracting the spent amount from the given amount: 100 - 77 = 23."
        },
        {
            q: "Using item values: Doll = ₹ 70, Toy car = ₹ 30, Toy plane = ₹ 25, Candy = ₹ 6. Which item from the list is the most expensive?",
            options: [
                "Toy car",
                "Toy plane",
                "Doll",
                "Candy"
            ],
            answer: 2,
            hint: "Compare the numbers 70, 30, 25, and 6. The largest number represents the highest cost.",
            explanation: "The Doll costs ₹ 70, which is the highest value among the choices."
        },
        {
            q: "Rahul solved an addition problem: ₹ 48 + ₹ 41 = ₹ 89. Amit solved: ₹ 30 + ₹ 19 = ₹ 49. Which of the following statements is true regarding their solutions?",
            options: [
                "Both Rahul's and Amit's solutions are correct",
                "Only Rahul's solution is correct",
                "Only Amit's solution is correct",
                "Both solutions are wrong"
            ],
            answer: 0,
            hint: "Check 48 + 41 (8+1=9, 4+4=8) and 30 + 19 (0+9=9, 3+1=4).",
            explanation: "Both addition sums have been correctly calculated (48 + 41 = 89 and 30 + 19 = 49)."
        },
        {
            q: "Assertion: Exchanging a ₹ 50-rupee note for five 10-rupee notes gives the exact same value. Reason: Five tens make fifty (10 × 5 = 50).",
            options: [
                "Both are correct and reason explains assertion",
                "Both are correct but reason does not explain",
                "Assertion is correct, reason is wrong",
                "Both are wrong"
            ],
            answer: 0,
            hint: "Check if 10 + 10 + 10 + 10 + 10 equals 50.",
            explanation: "Exchanging larger notes for smaller ones requires equivalent value, which is verified by multiplication/addition (10 × 5 = 50)."
        },
        {
            q: "Swati bought sweets worth ₹ 42 and savouries worth ₹ 29. How much did she spend in total?",
            options: [
                "₹ 61",
                "₹ 71",
                "₹ 81",
                "₹ 70"
            ],
            answer: 1,
            hint: "Add the cost of sweets and savouries together (42 + 29).",
            explanation: "42 + 29 = 71 rupees spent in all."
        },
        {
            q: "The cost of a book in shop X is ₹ 40 and in shop Y is ₹ 45. What is the difference between the cost of the book in the two shops?",
            options: [
                "₹ 3",
                "₹ 5",
                "₹ 10",
                "₹ 85"
            ],
            answer: 1,
            hint: "Find the difference by subtracting the smaller price from the larger price (45 - 40).",
            explanation: "The difference in price is 45 - 40 = 5 rupees."
        },
        {
            q: "Shaurya has ₹ 50 with him. He wants to buy a toy worth ₹ 89. How much more money does he need to buy the toy?",
            options: [
                "₹ 29",
                "₹ 39",
                "₹ 49",
                "₹ 139"
            ],
            answer: 1,
            hint: "Subtract the money he has from the cost of the toy (89 - 50).",
            explanation: "89 - 50 = 39 rupees more are needed to complete the purchase."
        },
    ];

    let currentQuestion = 0;
    let score = 0;
    let attempts = 0;
    let timer;
    let timeLeft = 60;

    // Splash Screen Timer Logic (5 seconds)
    let splashTimeLeft = 5;
    const splashCountdown = document.getElementById('splash-countdown');
    
    const splashTimer = setInterval(() => {
        splashTimeLeft--;
        if (splashCountdown) {
            splashCountdown.innerText = splashTimeLeft;
        }
        if (splashTimeLeft <= 0) {
            clearInterval(splashTimer);
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            loadQuestion();
        }
    }, 1000);

    function playSound(type) {
        try {
            const audio = document.getElementById(type === 'correct' ? 'claps-sound' : 'wrong-sound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play prevented:", e));
            }
        } catch(err) {
            console.log("Audio error:", err);
        }
    }

    function startTimer() {
        timeLeft = 60;
        document.getElementById('timer-text').innerText = `Time left: ${timeLeft}s`;
        document.getElementById('timer-fill').style.width = '100%';
        
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = `Time left: ${timeLeft}s`;
            document.getElementById('timer-fill').style.width = `${(timeLeft / 60) * 100}%`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        attempts = 0;
        const q = questions[currentQuestion];
        document.getElementById('question-counter').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsList.appendChild(btn);
        });

        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback';
        feedback.innerText = '';
        document.getElementById('next-btn').style.display = 'none';

        startTimer();
    }

    function selectOption(index) {
        clearInterval(timer);
        const q = questions[currentQuestion];
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');

        buttons.forEach(b => b.disabled = true);

        if (index === q.answer) {
            buttons[index].classList.add('correct');
            playSound('correct');
            feedback.className = 'feedback show explanation';
            feedback.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            if (attempts === 0) score++;
            document.getElementById('next-btn').style.display = 'block';
        } else {
            buttons[index].classList.add('wrong');
            playSound('wrong');
            attempts++;
            if (attempts === 1) {
                feedback.className = 'feedback show hint';
                feedback.innerHTML = `<strong>Hint:</strong> ${q.hint} <br><em>You have 1 retry left. Try again!</em>`;
                buttons.forEach((b, i) => {
                    if (i !== index) b.disabled = false;
                });
                startTimer();
            } else {
                buttons[q.answer].classList.add('correct');
                feedback.className = 'feedback show explanation';
                feedback.innerHTML = `<strong>Incorrect.</strong> The correct answer is: ${q.options[q.answer]}.<br>${q.explanation}`;
                document.getElementById('next-btn').style.display = 'block';
            }
        }
    }

    function handleTimeout() {
        const q = questions[currentQuestion];
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');

        buttons.forEach(b => b.disabled = true);
        buttons[q.answer].classList.add('correct');
        playSound('wrong');
        feedback.className = 'feedback show explanation';
        feedback.innerHTML = `<strong>Time's up!</strong> The correct answer is: ${q.options[q.answer]}.<br>${q.explanation}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showScoreCard();
        }
    }

    function showScoreCard() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('score-card').style.display = 'block';
        document.getElementById('final-score').innerText = `You scored ${score} out of ${questions.length}`;
        playSound('correct');
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        document.getElementById('score-card').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        loadQuestion();
    }
</script>

</body>
</html>
