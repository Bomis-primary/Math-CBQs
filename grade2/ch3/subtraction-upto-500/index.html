<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ - Addition Part 2</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

body{
  background:#f4f7ff;
  color:#1f2937;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

#splash img{
  width:300px;
}

/* SCREEN */
.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:block;
}

.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* TOP BAR */
.top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:15px;
  text-align:center;
  font-weight:bold;
}

.box{
  background:#e8f0ff;
  padding:10px;
  border-radius:12px;
}

/* QUESTION */
.question{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  padding:14px;
  border-radius:12px;
  border:2px solid #1f4e79;
  background:#fff;
  font-size:16px;
  cursor:pointer;
  min-height:60px;
}

.btn:hover{background:#eef5ff}

.correct{background:#c8f7d5 !important}
.wrong{background:#ffd6d6 !important}

/* BUTTON */
.next{
  margin-top:15px;
  padding:12px 20px;
  background:#1f4e79;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* RESULT */
.result{
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game" class="screen active">
  <div class="card">

    <div class="top">
      <div class="box">Q: <span id="qno">1</span>/18</div>
      <div class="box">Score: <span id="score">0</span></div>
      <div class="box">Time: <span id="time">60</span></div>
    </div>

    <div class="question" id="question"></div>
    <div class="options" id="options"></div>

    <button class="next" onclick="nextQ()" id="nextBtn">Next</button>

  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="card result" id="resultText"></div>
</div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>

/* SPLASH */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},5000);

/* QUESTIONS */
const questions = [
{
q:"A child adds 245 and 130. Is the sum more than 350?",
a:["Yes","No","Exactly 350","Less than 300"],
c:0
},
{
q:"Which shows addition correctly?",
a:["Joining two groups","Taking away objects","Breaking into parts","Sharing equally"],
c:0
},
{
q:"Kabir: 234 + 125 = 349. What is mistake?",
a:["Ones place","Tens place","Hundreds place","No mistake"],
c:3
},
{
q:"320 + 150. Does shop have 450 pencils?",
a:["Yes","No","Exactly 450","Less than 400"],
c:0
},
{
q:"Which needs carrying?",
a:["245 + 132","230 + 120","410 + 120","300 + 200"],
c:0
},
{
q:"Which sum is greater?",
a:["250+100","200+200","Both equal","300+60"],
c:1
},
{
q:"What is wrong: “Addition means subtracting”",
a:["Addition means joining","Subtraction is correct","Both same","No mistake"],
c:0
},
{
q:"120 + 130 = ?",
a:["250","240","260","230"],
c:0
},
{
q:"180 + 100 > 300?",
a:["Yes","No","Exactly 300","Less than 200"],
c:0
},
{
q:"Which is NOT addition?",
a:["200+100","300+50","400-100","250+150"],
c:2
},
{
q:"200 + 150 blocks = ?",
a:["350","300","400","250"],
c:0
},
{
q:"100 + 100 + 100 = ?",
a:["300","200","400","150"],
c:0
},
{
q:"150 + 150 + 50 = ?",
a:["350","300","400","250"],
c:0
},
{
q:"200 + 180 = ? Is it > 350?",
a:["Yes","No","Exactly 350","Less"],
c:0
},
{
q:"Is 380 correct for 200+180?",
a:["Yes","No","More","Less"],
c:1
},
{
q:"275 + 125 > 400?",
a:["Yes","No","375","300"],
c:0
},
{
q:"300 + 150 + 50 = ?",
a:["500","450","550","400"],
c:0
}
];

let i=0,score=0,time=60,attempt=0,lock=false;

/* LOAD */
function load(){
  let q=questions[i];
  document.getElementById("qno").innerText=i+1;
  document.getElementById("question").innerText=q.q;

  let html="";
  q.a.forEach((o,idx)=>{
    html+=`<button class="btn" onclick="check(this,${idx})">${o}</button>`;
  });

  document.getElementById("options").innerHTML=html;
  document.getElementById("nextBtn").style.display="none";

  attempt=0;
  lock=false;
}

/* CHECK */
function check(btn,ans){
  if(lock) return;

  if(ans==questions[i].c){
    btn.classList.add("correct");
    document.getElementById("correct").play();
    score++;
    document.getElementById("score").innerText=score;
    lock=true;
    document.getElementById("nextBtn").style.display="inline-block";
  } else {
    attempt++;
    btn.classList.add("wrong");
    document.getElementById("wrong").play();

    if(attempt>=2){
      lock=true;
      document.getElementById("nextBtn").style.display="inline-block";
    }
  }
}

/* NEXT */
function nextQ(){
  i++;
  if(i<questions.length){
    load();
  } else {
    show();
  }
}

/* RESULT */
function show(){
  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";

  let percent = (score/questions.length)*100;

  let msg="";
  if(percent>=75) msg="Good job 🎉";
  else if(percent>=40) msg="Review this chapter and try again 🙂";
  else msg="Let’s practise more 📘";

  document.getElementById("resultText").innerText =
    `${msg}\nScore: ${score}/${questions.length}`;
}

/* TIMER */
setInterval(()=>{
  if(time>0){
    time--;
    document.getElementById("time").innerText=time;
  } else {
    show();
  }
},1000);

load();

</script>

</body>
</html>
