<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 2: Subtraction Challenge</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #475569;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
            min-height: 480px;
        }

        /* 5-second Splash Screen */
        #intro-view {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #intro-view.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        .view {
            display: none;
            padding: 24px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        #instruction-view {
            text-align: center;
            align-items: center;
        }

        .instruction-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            width: 100%;
        }

        .instruction-box p {
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .instruction-box ul {
            margin-left: 20px;
            color: var(--text-muted);
        }

        .instruction-box li {
            margin-bottom: 8px;
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: var(--primary-hover);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            margin-bottom: 20px;
            gap: 10px;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-item {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .timer-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 4px 12px;
            border-radius: 20px;
            min-width: 55px;
            text-align: center;
        }

        .mute-btn {
            background: #f1f5f9;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        
        .mute-btn:hover {
            background: #e2e8f0;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .question-image-frame {
            width: 100%;
            height: 180px;
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .question-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        .background-box, .feedback-box {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-box.hint {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            color: #1d4ed8;
        }

        .feedback-box.explanation {
            background-color: #f8fafc;
            border-left: 5px solid #64748b;
            color: var(--text-main);
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        .results-card {
            text-align: center;
            padding: 20px 0;
            align-items: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="fx-canvas"></canvas>

        <div id="intro-view">
            <div class="logo-container">
                <img src="assets/logo.png" onerror="this.style.display='none'" alt="Innovine Logo">
            </div>
        </div>

        <div id="instruction-view" class="view">
            <h2 style="color: var(--primary);">Subtraction Challenge</h2>
            <div class="instruction-box">
                <p><strong>Rules:</strong></p>
                <ul>
                    <li>You have <strong>60 seconds</strong> to solve each puzzle.</li>
                    <li>If you make a mistake, you'll get a <strong>hint</strong>!</li>
                    <li>You get <strong>2 attempts</strong> before the correct explanation is shown.</li>
                </ul>
            </div>
            <button class="start-btn" onclick="gameEngine.startQuiz()">Start Playing</button>
        </div>

        <div id="game-view" class="view">
            <div class="game-header">
                <div class="hud-item" id="q-counter">Question: 1/12</div>
                <div class="hud-group">
                    <div class="hud-item timer-badge" id="timer-display">60s</div>
                    <button class="mute-btn" id="btn-mute" onclick="gameEngine.toggleMute()">🔊 Mute</button>
                </div>
                <div class="hud-item" id="score-counter">Score: 0</div>
            </div>

            <div class="question-image-frame" id="img-frame">
                <img id="q-img" class="question-image" src="" alt="Context Card">
            </div>
            
            <div class="question-text" id="q-txt">Question Text Placeholder</div>

            <div class="options-grid" id="options-box"></div>

            <div id="feedback-display" class="feedback-box"></div>

            <div class="action-container">
                <button id="btn-next" class="next-btn" onclick="gameEngine.nextQuestion()">Continue</button>
            </div>
        </div>

        <div id="result-view" class="view results-card">
            <h2>Challenge Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="final-msg">Performance Review</div>
            <button class="start-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="snd-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // DATABASE CONTAINING EXCLUSIVELY SUBTRACTION QUESTIONS
        const questionsDatabase = [
            {
                text: "Four shops are counting their leftover toys. Which shop has the fewest toys left?",
                options: ["Shop A: 450 - 150", "Shop B: 500 - 200", "Shop C: 300 - 50", "Shop D: 400 - 150"],
                answer: 2,
                hint: "Work out each subtraction box: Shop A = 300, Shop B = 300, Shop C = 250, Shop D = 250. Check which value is the absolute smallest.",
                explanation: "Shop C has 300 - 50 = 250 toys left, which matches the smallest leftover item count."
            },
            {
                text: "Look at the flying kites containing math expressions. Which kite gives the smallest answer after subtracting?",
                image: "assets/kites.png",
                options: ["Kite A", "Kite B", "Kite C", "Kite D"],
                answer: 0,
                hint: "Let's change these to subtraction checks! If Kite A was 250 - 110, it equals 140. Check which one drops the lowest.",
                explanation: "Kite A results in the lowest leftover value after evaluating our subtraction step."
            },
            {
                text: "A student subtracts: 450 - 215. Is the final answer less than 250?",
                options: ["Yes, because it equals 235", "No, because it equals 235", "No, it equals 245", "It equals 300"],
                answer: 0,
                hint: "Take away 200 from 450 first to get 250, then take away 15 more.",
                explanation: "450 - 215 = 235. Since 235 is smaller than 250, the answer is Yes."
            },
            {
                text: "Aayan solved this problem: 468 - 252 = 216. Which statement is true about his work?",
                options: ["Ones place is wrong", "Tens place is wrong", "Hundreds place is wrong", "No mistake, it is correct"],
                answer: 3,
                hint: "Check column by column: Ones (8 - 2), Tens (6 - 5), and Hundreds (4 - 2).",
                explanation: "8-2=6, 6-5=1, and 4-2=2. All rows are completely correct."
            },
            {
                text: "A storage room has 450 crates. A worker takes away 210 crates. How many crates are left in the room?",
                options: ["240 crates", "200 crates", "250 crates", "140 crates"],
                answer: 0,
                hint: "Subtract the hundreds first (400 - 200 = 200), then subtract the tens (50 - 10).",
                explanation: "450 - 210 = 240 crates left in the room."
            },
            {
                text: "Examine Zayan's puzzle card. Jar X has 190 marbles. He gives 140 marbles away to Jar Y. He says he has 50 marbles left. Is his answer correct?",
                image: "assets/jars.png",
                options: ["Yes, because 190 - 140 = 50", "No, because he should add", "No, it should be 40", "Yes, because 190 - 140 = 100"],
                answer: 0,
                hint: "Count backward from 190 by 140, or think: 19 tens minus 14 tens.",
                explanation: "Zayan subtracted correctly. 190 - 140 leaves exactly 50 marbles left."
            },
            {
                text: "Look at the visual unit blocks layout below. If we take away 120 blocks from 320 blocks, how many blocks are left?",
                image: "assets/blocks-320.png",
                options: ["200 blocks", "100 blocks", "300 blocks", "220 blocks"],
                answer: 0,
                hint: "Start with 320 blocks. Take away the 20 blocks, then take away 100 blocks.",
                explanation: "320 minus 120 leaves exactly 200 unit blocks behind."
            },
            {
                text: "Examine the counting abacuses. If we start with the value on Abacus B (300) and subtract 100, what is the new number?",
                image: "assets/abacus.png",
                options: ["200", "100", "400", "250"],
                answer: 0,
                hint: "Think about taking 1 hundred away from 3 hundreds.",
                explanation: "300 minus 100 leaves us with exactly 200."
            },
            {
                text: "A fruit shop has 350 apples. The owner sells 120 apples. How many apples are left at the shop?",
                options: ["230 apples", "200 apples", "150 apples", "330 apples"],
                answer: 0,
                hint: "Subtract the hundreds (300 - 100), then subtract the tens (50 - 20).",
                explanation: "350 - 120 = 230 apples left at the shop."
            },
            {
                text: "A delivery rider has 370 parcels. He delivers 200 of them. Is his leftover parcel count below 200?",
                options: ["No, it is 170", "Yes, it is 170", "No, it is 270", "Yes, it is 100"],
                answer: 1,
                hint: "Find 370 minus 200 first. Then check if that answer is smaller than 200.",
                explanation: "370 - 200 = 170. Since 170 is less than 200, the correct statement is Yes."
            },
            {
                text: "Which of the following math cards shows a true subtraction problem?",
                options: ["400 - 100 = 300", "400 + 100 = 300", "400 - 100 = 200", "400 + 20 = 420"],
                answer: 0,
                hint: "Look for the minus sign (-) and make sure the calculation matches up correctly.",
                explanation: "400 - 100 = 300 uses a subtraction format and gives the correct answer."
            },
            {
                text: "A school drive had 340 cans. The volunteers handed out 140 cans to families. How many cans do they have left?",
                options: ["200 cans", "240 cans", "300 cans", "100 cans"],
                answer: 0,
                hint: "Subtract 140 from 340. The tens place columns will clear out to zero.",
                explanation: "340 - 140 leaves exactly 200 cans with the school group."
            }
        ];

        class GameEngine {
            constructor(questions) {
                this.rawDB = questions;
                this.gameDB = [];
                this.currentIdx = 0;
                this.score = 0;
                this.attemptsLeft = 2;
                this.timer = null;
                this.timeLeft = 60;
                this.isMuted = false;
                
                this.currentRuntimeOptions = [];
                this.correctRuntimeIndex = -1;

                this.canvas = document.getElementById('fx-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
            }

            shuffle(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                setTimeout(() => {
                    const splash = document.getElementById('intro-view');
                    splash.classList.add('fade-out');
                    document.getElementById('instruction-view').classList.add('active');
                }, 5000);

                this.animateParticles();
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.parentElement.offsetWidth;
                this.canvas.height = this.canvas.parentElement.offsetHeight;
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                document.getElementById('btn-mute').innerText = this.isMuted ? "❌ Muted" : "🔊 Mute";
            }

            startQuiz() {
                this.gameDB = this.shuffle(this.rawDB);
                this.currentIdx = 0;
                this.score = 0;
                
                document.getElementById('instruction-view').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                this.loadQuestion();
            }

            loadQuestion() {
                if (this.currentIdx >= this.gameDB.length) {
                    this.showResults();
                    return;
                }

                clearInterval(this.timer);
                this.attemptsLeft = 2;
                
                const q = this.gameDB[this.currentIdx];
                
                document.getElementById('q-counter').innerText = `Question: ${this.currentIdx + 1}/${this.gameDB.length}`;
                document.getElementById('score-counter').innerText = `Score: ${this.score}`;
                
                document.getElementById('q-txt').innerText = q.text;

                const imgFrame = document.getElementById('img-frame');
                const imgElem = document.getElementById('q-img');
                if (q.image) {
                    imgElem.src = q.image;
                    imgFrame.style.display = 'flex';
                } else {
                    imgFrame.style.display = 'none';
                    imgElem.src = ''; 
                }

                const correctOptionText = q.options[q.answer]; 
                this.currentRuntimeOptions = this.shuffle(q.options);
                this.correctRuntimeIndex = this.currentRuntimeOptions.indexOf(correctOptionText);

                const optBox = document.getElementById('options-box');
                optBox.innerHTML = '';
                
                this.currentRuntimeOptions.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.handleAnswer(idx, btn);
                    optBox.appendChild(btn);
                });

                document.getElementById('feedback-display').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
                
                this.timeLeft = 60;
                this.startTimer();
            }

            startTimer() {
                const display = document.getElementById('timer-display');
                display.innerText = `${this.timeLeft}s`;
                
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    display.innerText = `${this.timeLeft}s`;
                    
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.lockOptionsDueTimeout();
                    }
                }, 1000);
            }

            handleAnswer(selectedIdx, clickedBtn) {
                const q = this.gameDB[this.currentIdx];
                const feedback = document.getElementById('feedback-display');

                if (selectedIdx === this.correctRuntimeIndex) {
                    clearInterval(this.timer);
                    clickedBtn.classList.add('correct');
                    this.playSound('snd-correct');
                    this.triggerConfetti();
                    
                    this.score += (this.attemptsLeft === 2) ? 10 : 5;
                    document.getElementById('score-counter').innerText = `Score: ${this.score}`;
                    
                    this.disableAllOptions();
                    document.getElementById('btn-next').style.display = 'block';
                } else {
                    this.attemptsLeft--;
                    clickedBtn.classList.add('wrong');
                    clickedBtn.disabled = true;
                    this.playSound('snd-wrong');

                    if (this.attemptsLeft > 0) {
                        feedback.className = "feedback-box hint";
                        feedback.innerText = `Hint: ${q.hint}`;
                        feedback.style.display = 'block';
                    } else {
                        clearInterval(this.timer);
                        feedback.className = "feedback-box explanation";
                        feedback.innerText = `Incorrect. ${q.explanation}`;
                        feedback.style.display = 'block';
                        
                        this.highlightCorrectAnswer(this.correctRuntimeIndex);
                        this.disableAllOptions();
                        document.getElementById('btn-next').style.display = 'block';
                    }
                }
            }

            lockOptionsDueTimeout() {
                const q = this.gameDB[this.currentIdx];
                const feedback = document.getElementById('feedback-display');
                feedback.className = "feedback-box explanation";
                feedback.innerText = `Time's up! ${q.explanation}`;
                feedback.style.display = 'block';
                
                this.highlightCorrectAnswer(this.correctRuntimeIndex);
                this.disableAllOptions();
                document.getElementById('btn-next').style.display = 'block';
            }

            highlightCorrectAnswer(targetIdx) {
                const buttons = document.querySelectorAll('.option-btn');
                if (buttons[targetIdx]) {
                    buttons[targetIdx].classList.add('correct');
                }
            }

            disableAllOptions() {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            }

            nextQuestion() {
                this.currentIdx++;
                this.loadQuestion();
            }

            playSound(id) {
                if (this.isMuted) return;
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            }

            triggerConfetti() {
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 3,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.7) * 10,
                        color: `hsla(${Math.random() * 360}, 100%, 50%, 1)`,
                        size: Math.random() * 5 + 3,
                        alpha: 1
                    });
                }
            }

            animateParticles() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= 0.015;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1.0;
                requestAnimationFrame(() => this.animateParticles());
            }

            showResults() {
                document.getElementById('game-view').classList.remove('active');
                document.getElementById('result-view').classList.add('active');
                
                const maxPossibleScore = this.gameDB.length * 10;
                const percentage = Math.round((this.score / maxPossibleScore) * 100);
                document.getElementById('final-score').innerText = `${percentage}%`;
                
                const msgElem = document.getElementById('final-msg');
                if (percentage >= 75) {
                    msgElem.innerText = "Good job!";
                    msgElem.style.color = "var(--success)";
                } else if (percentage >= 40) {
                    msgElem.innerText = "Review this chapter and try again";
                    msgElem.style.color = "#d97706";
                } else {
                    msgElem.innerText = "Let’s practise more";
                    msgElem.style.color = "var(--error)";
                }
            }
        }

        const gameEngine = new GameEngine(questionsDatabase);
        window.onload = () => gameEngine.init();
    </script>
</body>
</html>
