<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Shapes and Patterns Challenge</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        /* 5-second Splash / Logo Screen */
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            max-width: 240px;
            height: auto;
        }

        /* Title Screen View (Appears after 5 seconds) */
        #title-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 90;
        }

        #title-screen.active {
            display: flex;
        }

        #title-screen h1 {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 30px;
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: var(--primary-hover);
        }

        /* View Layout System */
        .screen {
            display: none;
            padding: 24px;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
        }

        .screen.active {
            display: flex;
        }

        /* Top HUD Panel */
        .top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .box {
            background: #e8f0ff;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--primary);
        }

        /* Question View Element */
        .question {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Options Vertical Grid Stack Layout */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            background: var(--card-bg);
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
            min-height: 50px;
        }

        .btn:hover:not(:disabled) {
            background: #eef5ff;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn.correct {
            background: #c8f7d5 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .btn.wrong {
            background: #ffd6d6 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        /* Feedback Cards (Hint & Explanation) */
        .feedback-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #fefce8;
            border-left: 4px solid #eab308;
            color: #854d0e;
        }

        .feedback-box.explanation {
            background-color: #f8fafc;
            border-left: 4px solid #64748b;
            color: #1e293b;
        }

        /* Control Button Container */
        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
        }

        .next {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next:hover {
            background: var(--primary-hover);
        }

        /* Summary Panel Formatting */
        .result-card {
            text-align: center;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 30px;
            white-space: pre-line;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pure 5-second logo screen -->
        <div id="splash">
            <img src="assets/logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='assets/innovine-logo.png';">
        </div>

        <!-- Title screen appearing after 5 seconds -->
        <div id="title-screen">
            <h1>Shapes and Patterns Challenge</h1>
            <button class="start-btn" onclick="startGame()">Start Quiz</button>
        </div>

        <!-- Quiz Gameplay Screen -->
        <div id="game" class="screen">
            <div>
                <div class="top">
                    <div class="box">Q: <span id="qno">1</span>/<span id="qtotal">18</span></div>
                    <div class="box">Score: <span id="score">0</span></div>
                    <div class="box">Time: <span id="time">60</span>s</div>
                </div>

                <div class="question" id="question"></div>
                <div class="options" id="options"></div>

                <!-- Feedback Container for Hints and Explanations -->
                <div id="feedbackBox" class="feedback-box"></div>
            </div>

            <div class="action-container">
                <button class="next" onclick="nextQ()" id="nextBtn">Continue ➔</button>
            </div>
        </div>

        <!-- Completion Screen -->
        <div id="result" class="screen result-card">
            <h2>Chapter Complete! 🎉</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="resultText">Performance Review</div>
            <button class="restart-btn" onclick="window.location.reload()">Play Again 🔄</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // MASTER COMPREHENSIVE DATASET WITH HINTS AND EXPLANATIONS
        const questionsDatabase = [
            { 
                q: "Fatima holds her ruler straight up. What kind of line does she make?", 
                a: ["Standing line", "Sleeping line", "Slanting line", "Curved line"], 
                c: 0,
                hint: "Think about how a person stands upright from top to bottom.",
                explanation: "A vertical line pointing directly up and down is called a standing (vertical) line."
            },
            { 
                q: "Jasbir holds a stick at a tilt. What kind of line does it show?", 
                a: ["Slanting line", "Standing line", "Sleeping line", "Curved line"], 
                c: 0,
                hint: "The line is leaning to one side rather than standing or lying flat.",
                explanation: "Lines that lean at an angle are called slanting (diagonal) lines."
            },
            { 
                q: "Raima places her pencil flat on the floor. What type of line is this?", 
                a: ["Sleeping line", "Standing line", "Slanting line", "Curved line"], 
                c: 0,
                hint: "Think about how your body lies down flat when you go to sleep.",
                explanation: "A flat line that goes sideways parallel to the ground is called a sleeping (horizontal) line."
            },
            { 
                q: "What kind of line does the edge of a straight desk represent?", 
                a: ["Straight line", "Curved line", "Zigzag line", "Wavy line"], 
                c: 0,
                hint: "The edge goes directly from one corner to another without bending.",
                explanation: "Desk edges follow a direct path without any bends, forming a straight line."
            },
            { 
                q: "Ekta draws lines that are not straight. What are they called?", 
                a: ["Curved lines", "Standing lines", "Sleeping lines", "Slanting lines"], 
                c: 0,
                hint: "These lines bend smoothly like the edge of a circle or a wave.",
                explanation: "Lines that bend continuously without sharp corners are called curved lines."
            },
            { 
                q: "Can you make the number '3' using only straight matchsticks?", 
                a: ["No, it needs curved lines", "Yes, easily", "Only with standing lines", "Only with slanting lines"], 
                c: 0,
                hint: "Matchsticks are completely rigid and straight. Think about the rounded loops in '3'.",
                explanation: "The standard written number '3' consists of smooth curved arcs, which cannot be formed by unbent straight matchsticks."
            },
            { 
                q: "Which of these letters can be drawn using ONLY straight lines?", 
                a: ["A", "O", "S", "C"], 
                c: 0,
                hint: "Check which letter is made of three straight sticks joined together.",
                explanation: "The letter 'A' is made of two slanting lines and one sleeping line. 'O', 'S', and 'C' require curved lines."
            },
            { 
                q: "Which of these numbers is made entirely of straight lines in a digital clock?", 
                a: ["7", "0", "8", "9"], 
                c: 0,
                hint: "Digital displays use straight glowing segments to form characters.",
                explanation: "In a standard digital display, '7' uses a top sleeping line and a standing/slanting line."
            },
            { 
                q: "What type of line is formed by tracing around a round coin?", 
                a: ["Curved line", "Standing line", "Sleeping line", "Curved line"], 
                c: 0,
                hint: "A coin is round, so its border bends all the way around.",
                explanation: "Tracing the perimeter of a circular coin forms a smooth curved line."
            },
            { 
                q: "A traffic policeman waves his arm in a circular loop. What line is that?", 
                a: ["Curved line", "Standing line", "Sleeping line", "Slanting line"], 
                c: 0,
                hint: "Moving in a loop means changing direction continuously in a arc.",
                explanation: "Any circular or looping motion follows a curved path."
            },
            { 
                q: "Which letter has BOTH straight lines and curved lines?", 
                a: ["B", "X", "O", "L"], 
                c: 0,
                hint: "Look for a letter with one straight vertical spine and rounded loops on the side.",
                explanation: "The letter 'B' has one standing straight line on the left and two curved loops on the right."
            },
            { 
                q: "If you fold a piece of paper flat and unfold it, what does the crease make?", 
                a: ["A straight line", "A curved line", "A circle", "No line"], 
                c: 0,
                hint: "A flat paper fold travels directly across from edge to edge.",
                explanation: "Folding a flat piece of paper creates a sharp, direct crease that forms a straight line."
            },
            { 
                q: "What kind of lines are used to draw a complete triangle?", 
                a: ["Straight lines", "Curved lines", "Only sleeping lines", "Only standing lines"], 
                c: 0,
                hint: "A triangle has 3 sharp corners and 3 straight sides.",
                explanation: "A triangle is a closed 2D shape bounded by 3 straight line segments."
            },
            { 
                q: "The letter 'E' consists of which types of straight lines?", 
                a: ["Standing and Sleeping", "Standing and Slanting", "Sleeping and Slanting", "Only Slanting"], 
                c: 0,
                hint: "Look at the vertical spine and the 3 horizontal arms of 'E'.",
                explanation: "The letter 'E' uses 1 vertical (standing) line and 3 horizontal (sleeping) lines."
            },
            { 
                q: "What line is parallel to the ground surface?", 
                a: ["Sleeping line", "Standing line", "Slanting line", "Curved line"], 
                c: 0,
                hint: "Think about the horizon line where the sky meets the earth.",
                explanation: "Lines that run level with the ground surface are horizontal, or sleeping lines."
            },
            { 
                q: "The hands of a clock at 12:00 show what kind of line layout?", 
                a: ["Standing line", "Sleeping line", "Slanting line", "Curved line"], 
                c: 0,
                hint: "Both hands point directly straight up towards the top of the clock.",
                explanation: "At 12:00, both hands point straight up, aligning along a standing (vertical) line."
            },
            { 
                q: "Which shape can be drawn using only curved lines?", 
                a: ["Circle", "Square", "Rectangle", "Triangle"], 
                c: 0,
                hint: "This shape has no corners or straight edges.",
                explanation: "A circle is formed by a single continuous curved line that stays equal distance from the center."
            },
            { 
                q: "A lightning bolt pattern is an example of what type of lines?", 
                a: ["Slanting and Zigzag", "Perfect Curved", "Only Sleeping", "Only Standing"], 
                c: 0,
                hint: "Lightning turns sharply at angles from side to side.",
                explanation: "Lightning tracks in sharp, angled turns consisting of slanting segments, forming a zigzag pattern."
            }
        ];

        let runtimeQuestions = [];
        let i = 0, score = 0, time = 60, attempt = 0, lock = false, currentCorrectIndex = null, timerInterval = null;

        // FISHER-YATES RE-ALIGNMENT ENGINE
        function shuffleArray(array) {
            const arr = [...array];
            for (let idx = arr.length - 1; idx > 0; idx--) {
                const j = Math.floor(Math.random() * (idx + 1));
                [arr[idx], arr[j]] = [arr[j], arr[idx]];
            }
            return arr;
        }

        function bootstrapQuizData() {
            runtimeQuestions = questionsDatabase.map(item => {
                const originalAnswers = [...item.a];
                const trueAnswerValue = originalAnswers[item.c];
                
                const shuffledAnswers = shuffleArray(originalAnswers);
                const dynamicCorrectIdx = shuffledAnswers.indexOf(trueAnswerValue);
                
                return {
                    q: item.q,
                    a: shuffledAnswers,
                    c: dynamicCorrectIdx,
                    hint: item.hint,
                    explanation: item.explanation
                };
            });

            runtimeQuestions = shuffleArray(runtimeQuestions);
            document.getElementById("qtotal").innerText = runtimeQuestions.length;
        }

        const appEngine = {
            init() {
                // Wait for exactly 5 seconds, then fade out logo and show title screen
                setTimeout(() => {
                    const splash = document.getElementById("splash");
                    splash.classList.add("fade-out");
                    
                    splash.addEventListener('transitionend', () => {
                        splash.style.display = "none";
                        document.getElementById("title-screen").classList.add("active");
                    });
                }, 5000);
                
                bootstrapQuizData();
            }
        };

        function startGame() {
            document.getElementById("title-screen").classList.remove("active");
            document.getElementById("game").classList.add("active");
            load();
        }

        function load() {
            if (i >= runtimeQuestions.length) {
                showResult();
                return;
            }

            let q = runtimeQuestions[i];
            currentCorrectIndex = q.c;

            document.getElementById("qno").innerText = i + 1;
            document.getElementById("question").innerText = q.q;

            // Reset feedback container
            const feedbackBox = document.getElementById("feedbackBox");
            feedbackBox.style.display = "none";
            feedbackBox.className = "feedback-box";
            feedbackBox.innerHTML = "";

            let html = "";
            q.a.forEach((o, idx) => {
                html += `<button class="btn" onclick="check(this,${idx})">${o}</button>`;
            });

            document.getElementById("options").innerHTML = html;
            document.getElementById("nextBtn").style.display = "none";

            attempt = 0;
            lock = false;
            
            time = 60;
            document.getElementById("time").innerText = time;
            startCountdown();
        }

        function startCountdown() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (time > 0) {
                    time--;
                    document.getElementById("time").innerText = time;
                } else {
                    clearInterval(timerInterval);
                    autoRevealCorrect("Time's up! ");
                }
            }, 1000);
        }

        function check(btn, ans) {
            if (lock) return;

            const q = runtimeQuestions[i];
            const feedbackBox = document.getElementById("feedbackBox");

            if (ans == currentCorrectIndex) {
                clearInterval(timerInterval);
                btn.classList.add("correct");
                safePlayAudio("correct");
                
                score++;
                document.getElementById("score").innerText = score;
                lock = true;

                // Display explanation on correct response
                feedbackBox.innerHTML = `<strong>🎉 Correct!</strong> ${q.explanation}`;
                feedbackBox.className = "feedback-box explanation";
                feedbackBox.style.display = "block";

                document.getElementById("nextBtn").style.display = "inline-block";
            } else {
                attempt++;
                btn.classList.add("wrong");
                btn.disabled = true;
                safePlayAudio("wrong");

                if (attempt === 1) {
                    // Display hint on first incorrect attempt
                    feedbackBox.innerHTML = `💡 <strong>Hint:</strong> ${q.hint}`;
                    feedbackBox.className = "feedback-box hint";
                    feedbackBox.style.display = "block";
                } else if (attempt >= 2) {
                    clearInterval(timerInterval);
                    autoRevealCorrect("Out of attempts! ");
                }
            }
        }

        function autoRevealCorrect(prefix = "") {
            lock = true;
            const q = runtimeQuestions[i];
            const buttons = document.querySelectorAll(".options .btn");
            const feedbackBox = document.getElementById("feedbackBox");
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx == currentCorrectIndex) {
                    btn.classList.add("correct");
                }
            });

            feedbackBox.innerHTML = `<strong>${prefix}</strong>${q.explanation}`;
            feedbackBox.className = "feedback-box explanation";
            feedbackBox.style.display = "block";
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQ() {
            i++;
            load();
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById("game").style.display = "none";
            document.getElementById("result").style.display = "flex";

            let percent = Math.round((score / runtimeQuestions.length) * 100);
            document.getElementById("final-score").innerText = `${percent}%`;

            let msg = "";
            if (percent >= 75) msg = "Great job! 🎉";
            else if (percent >= 40) msg = "Review this chapter 🙂";
            else msg = "Let’s practise more 📘";

            document.getElementById("resultText").innerText = `${msg}\nScore: ${score}/${runtimeQuestions.length}`;
        }

        function safePlayAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => playSynthFallback(id));
            } else {
                playSynthFallback(id);
            }
        }

        // Web Audio API Synthetic Fallback for guaranteed sound feedback
        function playSynthFallback(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === "correct") {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(140, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        window.onload = () => appEngine.init();
    </script>
</body>
</html>
