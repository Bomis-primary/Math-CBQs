<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBQ - Shapes and Patterns Challenge</title>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-hover: #153a5c;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f4f7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 480px;
        }

        /* 5-second Splash / Logo Screen */
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            max-width: 240px;
            height: auto;
        }

        /* Title Screen View (Appears after 5 seconds) */
        #title-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 90;
        }

        #title-screen.active {
            display: flex;
        }

        #title-screen h1 {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 30px;
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: var(--primary-hover);
        }

        /* View Layout System */
        .screen {
            display: none;
            padding: 24px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Panel */
        .top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .box {
            background: #e8f0ff;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        /* Question View Element */
        .question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Options Vertical Grid Stack Layout */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            background: var(--card-bg);
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            width: 100%;
            min-height: 56px;
        }

        .btn:hover:not(:disabled) {
            background: #eef5ff;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .btn.correct {
            background: #c8f7d5 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 700;
        }

        .btn.wrong {
            background: #ffd6d6 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        /* Control Button Container */
        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .next {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next:hover {
            background: var(--primary-hover);
        }

        /* Summary Panel Formatting */
        .result-card {
            text-align: center;
            padding: 40px 0;
            align-items: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .result-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            white-space: pre-line;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pure 5-second logo screen -->
        <div id="splash">
            <img src="assets/logo.png" onerror="this.style.display='none'">
        </div>

        <!-- Title screen appearing after 5 seconds -->
        <div id="title-screen">
            <h1>Shapes and Patterns Challenge</h1>
            <button class="start-btn" onclick="startGame()">Start Quiz</button>
        </div>

        <div id="game" class="screen">
            <div class="top">
                <div class="box">Q: <span id="qno">1</span>/<span id="qtotal">18</span></div>
                <div class="box">Score: <span id="score">0</span></div>
                <div class="box">Time: <span id="time">60</span>s</div>
            </div>

            <div class="question" id="question"></div>
            <div class="options" id="options"></div>

            <div class="action-container">
                <button class="next" onclick="nextQ()" id="nextBtn">Next</button>
            </div>
        </div>

        <div id="result" class="screen result-card">
            <h2>Chapter Complete!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div class="result-msg" id="resultText">Performance Review</div>
            <button class="restart-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // MASTER COMPREHENSIVE DATASET
        const questionsDatabase = [
            { q: "Fatima holds her ruler straight up. What kind of line does she make?", a: ["Standing line", "Sleeping line", "Slanting line", "Curved line"], c: 0 },
            { q: "Jasbir holds a stick at a tilt. What kind of line does it show?", a: ["Slanting line", "Standing line", "Sleeping line", "Curved line"], c: 0 },
            { q: "Raima places her pencil flat on the floor. What type of line is this?", a: ["Sleeping line", "Standing line", "Slanting line", "Curved line"], c: 0 },
            { q: "What kind of line does the edge of a straight desk represent?", a: ["Straight line", "Curved line", "Zigzag line", "Wavy line"], c: 0 },
            { q: "Ekta draws lines that are not straight. What are they called?", a: ["Curved lines", "Standing lines", "Sleeping lines", "Slanting lines"], c: 0 },
            { q: "Can you make the number '3' using only straight matchsticks?", a: ["No, it needs curved lines", "Yes, easily", "Only with standing lines", "Only with slanting lines"], c: 0 },
            { q: "Which of these letters can be drawn using ONLY straight lines?", a: ["A", "O", "S", "C"], c: 0 },
            { q: "Which of these numbers is made entirely of straight lines in a digital clock?", a: ["7", "0", "8", "9"], c: 0 },
            { q: "What type of line is formed by tracing around a round coin?", a: ["Curved line", "Standing line", "Sleeping line", "Slanting line"], c: 0 },
            { q: "A traffic policeman waves his arm in a circular loop. What line is that?", a: ["Curved line", "Standing line", "Sleeping line", "Slanting line"], c: 0 },
            { q: "Which letter has BOTH straight lines and curved lines?", a: ["B", "X", "O", "L"], c: 0 },
            { q: "If you fold a piece of paper flat and unfold it, what does the crease make?", a: ["A straight line", "A curved line", "A circle", "No line"], c: 0 },
            { q: "What kind of lines are used to draw a complete triangle?", a: ["Straight lines", "Curved lines", "Only sleeping lines", "Only standing lines"], c: 0 },
            { q: "The letter 'E' consists of which types of straight lines?", a: ["Standing and Sleeping", "Standing and Slanting", "Sleeping and Slanting", "Only Slanting"], c: 0 },
            { q: "What line is parallel to the ground surface?", a: ["Sleeping line", "Standing line", "Slanting line", "Curved line"], c: 0 },
            { q: "The hands of a clock at 12:00 show what kind of line layout?", a: ["Standing line", "Sleeping line", "Slanting line", "Curved line"], c: 0 },
            { q: "Which shape can be drawn using only curved lines?", a: ["Circle", "Square", "Rectangle", "Triangle"], c: 0 },
            { q: "A lightning bolt pattern is an example of what type of lines?", a: ["Slanting and Zigzag", "Perfect Curved", "Only Sleeping", "Only Standing"], c: 0 }
        ];

        let runtimeQuestions = [];
        let i = 0, score = 0, time = 60, attempt = 0, lock = false, currentCorrectIndex = null, timerInterval = null;

        // FISHER-YATES RE-ALIGNMENT ENGINE
        function shuffleArray(array) {
            for (let idx = array.length - 1; idx > 0; idx--) {
                const j = Math.floor(Math.random() * (idx + 1));
                [array[idx], array[j]] = [array[j], array[idx]];
            }
            return array;
        }

        function bootstrapQuizData() {
            runtimeQuestions = questionsDatabase.map(item => {
                const originalAnswers = [...item.a];
                const trueAnswerValue = originalAnswers[item.c];
                
                const shuffledAnswers = shuffleArray(originalAnswers);
                const dynamicCorrectIdx = shuffledAnswers.indexOf(trueAnswerValue);
                
                return {
                    q: item.q,
                    a: shuffledAnswers,
                    c: dynamicCorrectIdx
                };
            });

            shuffleArray(runtimeQuestions);
            document.getElementById("qtotal").innerText = runtimeQuestions.length;
        }

        const appEngine = {
            init() {
                // Wait for exactly 5 seconds, then fade out logo and show title screen
                setTimeout(() => {
                    const splash = document.getElementById("splash");
                    splash.classList.add("fade-out");
                    
                    splash.addEventListener('transitionend', () => {
                        splash.style.display = "none";
                        document.getElementById("title-screen").classList.add("active");
                    });
                }, 5000);
                
                bootstrapQuizData();
            }
        };

        function startGame() {
            document.getElementById("title-screen").classList.remove("active");
            document.getElementById("game").classList.add("active");
            load();
        }

        function load() {
            if (i >= runtimeQuestions.length) {
                showResult();
                return;
            }

            let q = runtimeQuestions[i];
            currentCorrectIndex = q.c;

            document.getElementById("qno").innerText = i + 1;
            document.getElementById("question").innerText = q.q;

            let html = "";
            q.a.forEach((o, idx) => {
                html += `<button class="btn" onclick="check(this,${idx})">${o}</button>`;
            });

            document.getElementById("options").innerHTML = html;
            document.getElementById("nextBtn").style.display = "none";

            attempt = 0;
            lock = false;
            
            time = 60;
            document.getElementById("time").innerText = time;
            startCountdown();
        }

        function startCountdown() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (time > 0) {
                    time--;
                    document.getElementById("time").innerText = time;
                } else {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }, 1000);
        }

        function check(btn, ans) {
            if (lock) return;

            if (ans == currentCorrectIndex) {
                clearInterval(timerInterval);
                btn.classList.add("correct");
                safePlayAudio("correct");
                score++;
                document.getElementById("score").innerText = score;
                lock = true;
                document.getElementById("nextBtn").style.display = "inline-block";
            } else {
                attempt++;
                btn.classList.add("wrong");
                btn.disabled = true;
                safePlayAudio("wrong");

                if (attempt >= 2) {
                    clearInterval(timerInterval);
                    autoRevealCorrect();
                }
            }
        }

        function autoRevealCorrect() {
            lock = true;
            const buttons = document.querySelectorAll(".options .btn");
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx == currentCorrectIndex) {
                    btn.classList.add("correct");
                }
            });
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQ() {
            i++;
            load();
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById("game").style.display = "none";
            document.getElementById("result").style.display = "flex";

            let percent = Math.round((score / runtimeQuestions.length) * 100);
            document.getElementById("final-score").innerText = `${percent}%`;

            let msg = "";
            if (percent >= 75) msg = "Good job 🎉";
            else if (percent >= 40) msg = "Review this chapter 🙂";
            else msg = "Let’s practise more 📘";

            document.getElementById("resultText").innerText = `${msg}\nScore: ${score}/${runtimeQuestions.length}`;
        }

        function safePlayAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        window.onload = () => appEngine.init();
    </script>
</body>
</html>
