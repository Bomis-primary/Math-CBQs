<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 2 Maths: Data Handling Adventure</title>
    <style>
        :root {
            --primary: #0284c7;
            --secondary: #bae6fd;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ea580c;
            --background: #f0f9ff;
            --surface: #ffffff;
            --text: #0c4a6e;
        }

        * {
            box-shadow: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', "Chalkboard SE", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.1);
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--secondary);
            min-height: 480px;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .logo-placeholder {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Display Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        p.description {
            text-align: center;
            color: #4b5563;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 1.1rem;
        }

        /* Game HUD Layout */
        .hud {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: #e0f2fe;
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
            border: 2px dashed var(--primary);
        }

        .timer-box {
            color: var(--danger);
        }

        /* Question Area */
        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-line;
            background: #f0f9ff;
            padding: 14px;
            border-radius: 12px;
            border-left: 6px solid var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-btn {
            background: var(--surface);
            border: 3px solid #e5e7eb;
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            width: 100%;
            color: #374151;
            min-height: 54px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d !important;
        }

        /* Context Drawers */
        .feedback-box {
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
            font-weight: bold;
            display: none;
            line-height: 1.4;
            font-size: 1rem;
        }

        .feedback-box.hint {
            background-color: #fff7ed;
            border: 2px solid var(--warning);
            color: #7c2d12;
        }

        .feedback-box.explanation {
            background-color: #f0fdf4;
            border: 2px solid var(--success);
            color: #166534;
        }

        /* Control Button */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }

        .action-btn:hover {
            background: #0369a1;
        }

        .score-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 16px auto;
            color: var(--primary);
            border: 4px solid var(--primary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 14px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
            .hud { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="particle-canvas"></canvas>

        <div id="splash-screen">
            <img src="assets/logo.png" alt="Innovine Logo" class="logo-placeholder" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
            <h2 id="logo-text" style="display:none; color: var(--primary);">Innovine</h2>
        </div>

        <div id="welcome-screen" class="screen active">
            <h1>Data Handling Quest</h1>
            <p class="description">Become a Data Detective! Learn how to collect answers from surveys, count interesting objects, and read fun picture graphs to unlock secrets!</p>
            <button class="action-btn" onclick="startInteractive()">Start Adventure</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Quest: 1/18</div>
                <div id="score-text">Score: 0 ⭐</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading data layout...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Challenge ➔</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Quest Complete! 🎉</h2>
            <div class="score-circle" id="final-score-value">0/18</div>
            <p class="description" id="final-status-msg">Gathering your shiny stars...</p>
            <button class="action-btn" onclick="resetInteractive()">Play Again! 🔄</button>
        </div>
    </div>

    <audio id="audio-correct" src="grade-2/maths/chapter-12/assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="grade-2/maths/chapter-12/assets/wrong.mp3" preload="auto"></audio>

    <script>
        // PROTECTED SYSTEM DATABASE
        const questionBankDatabase = [
            {
                type: "Understanding Data",
                question: "What do we call a collection of information, numbers, or facts that we gather together by looking around or asking questions?",
                options: ["Data", "A secret riddle", "A guess", "A baseline"],
                answer: 0,
                hint: "It starts with the letter 'D' and helps us build mathematical charts.",
                explanation: "Data is a collection of facts, counts, or measurements gathered together to learn or show information."
            },
            {
                type: "Data Gathering Activity",
                question: "Riya wants to find out which outdoor game her friends like playing the most. What is the best way for her to gather this data?",
                options: ["Ask each friend directly by doing a simple survey.", "Close her eyes and make a guess.", "Look at a book about old sports stories.", "Count how many toys she has in her room."],
                answer: 0,
                hint: "To find out what people like, you need to talk to them and record their real choices.",
                explanation: "Conducting a simple survey by asking people directly is a perfect way to gather fresh, accurate data."
            },
            {
                type: "Reading Pictographs",
                question: "Look at this chart showing favorite lunch treats:\n🍦 Ice Cream: 🍦 🍦 🍦 🍦\n🍩 Donut: 🍩 🍩\n\n(Note: 1 picture = 1 child)\nHow many children chose Ice Cream?",
                options: ["4 children", "2 children", "6 children", "1 child"],
                answer: 0,
                hint: "Count each ice cream cone picture one by one in that specific row.",
                explanation: "There are 4 ice cream pictures, which means 4 children voted for ice cream."
            },
            {
                type: "Comparing Quantities",
                question: "Look at the lunch chart again:\n🍦 Ice Cream: 🍦 🍦 🍦 🍦\n🍩 Donut: 🍩 🍩\n\nHow many MORE children preferred Ice Cream than Donuts?",
                options: ["2 more children", "4 more children", "6 more children", "3 more children"],
                answer: 0,
                hint: "Subtract the number of donuts (2) from the number of ice creams (4).",
                explanation: "To compare the quantities, we look at the difference: 4 - 2 = 2. So, 2 more children preferred ice cream."
            },
            {
                type: "Purpose of Pictographs",
                question: "Why do we draw data using pictures in a pictograph instead of just writing down a long messy list of random words?",
                options: ["To share information with others in an easy-to-understand and quick way.", "To hide our findings from other people.", "Because drawing pictures takes much longer.", "Because math rules say words are not allowed."],
                answer: 0,
                hint: "Think about what is faster to read: scanning 100 messy names, or looking at organized picture groups.",
                explanation: "Pictographs use clear symbols to display data cleanly, making it very easy for anyone to compare items at a single glance."
            },
            {
                type: "Gathering by Observation",
                question: "Dev stands near the classroom window and watches the sky to note down how many birds fly past in 10 minutes. What kind of data activity is Dev doing?",
                options: ["An observation activity", "An interview survey", "A guessing game", "A reading challenge"],
                answer: 0,
                hint: "He is watching and tracking events carefully with his eyes without asking anyone questions.",
                explanation: "Watching events happen naturally and recording them is called gathering data through observation."
            },
            {
                type: "Comparing Totals",
                question: "A picture chart displays weather patterns over two weeks:\n☀️ Sunny Days: ☀️ ☀️ ☀️ ☀️ ☀️\n🌧️ Rainy Days: 🌧️ 🌧️\n\nWhich type of weather happened the LEAST (smallest number of days)?",
                options: ["🌧️ Rainy Days", "☀️ Sunny Days", "Both happened the same amount", "Cloudy Days"],
                answer: 0,
                hint: "Look for the row that has the shortest line of symbols.",
                explanation: "Rainy Days only has 2 symbols, while Sunny Days has 5. 2 is smaller than 5, so Rainy Days happened the least."
            },
            {
                type: "Drawing Rules",
                question: "When you draw a pictograph to represent your collected data, what must you do to ensure your chart is accurate and fair?",
                options: ["Use the exact same size symbol for each count and align them cleanly.", "Draw symbols in different sizes so some look giant.", "Change the symbol meaning halfway through the row.", "Leave out categories that you don't like."],
                answer: 0,
                hint: "If one picture is drawn huge and another tiny, it will confuse people who look at your graph.",
                explanation: "To keep a pictograph accurate, every symbol must be drawn equal in size and placed in structured rows so counts can be compared fairly."
            },
            {
                type: "Data Sources",
                question: "Which of the following is NOT a real source where we can find or collect data for a school project?",
                options: ["Making up random numbers from an imaginary dream.", "Asking classmates what pets they have.", "Counting the color of cars parked outside.", "Looking at a school attendance log book."],
                answer: 0,
                hint: "Data must always come from real-world counts, logs, questions, or tracking, never from made-up stories.",
                explanation: "Inventing numbers from imagination does not produce real data. Real data must come from true measurements, surveys, or observations."
            },
            {
                type: "Assertion & Reason Logic",
                question: "Assertion: A pictograph showing 6 star symbols represents more items than a row with 3 star symbols (where 1 symbol = 1 item).\nReason: In a pictograph, the row with more identical symbols represents a greater quantity.",
                options: ["Both statements are true and the reason explains the assertion perfectly!", "The assertion is true, but the reason makes no sense.", "The assertion is false.", "Both statements are completely false."],
                answer: 0,
                hint: "Is 6 bigger than 3? Does drawing more icons mean you counted a larger group?",
                explanation: "Both statements are correct. Since each symbol equals 1 item, 6 symbols means 6 items and 3 symbols means 3 items. More symbols directly mean a larger amount."
            },
            {
                type: "Case Story Challenge (Part 1)",
                question: "Case Story Part 1: Kabir counts the pencils in his team's storage boxes:\n🔴 Red Boxes: ✏️ ✏️ ✏️\n🔵 Blue Boxes: ✏️ ✏️ ✏️ ✏️ ✏️\n\nHow many total pencils are in the Blue Boxes?",
                options: ["5 pencils", "3 pencils", "8 pencils", "2 pencils"],
                answer: 0,
                hint: "Count only the pencil symbols next to the Blue Boxes row.",
                explanation: "The row for Blue Boxes has 5 pencil drawings, meaning there are 5 pencils inside."
            },
            {
                type: "Case Story Challenge (Part 2)",
                question: "Case Story Part 2: Kabir needs to find the absolute sum of his entire chart from Part 1 (3 Red Box pencils, 5 Blue Box pencils). How many pencils did his team collect altogether?",
                options: ["8 pencils", "5 pencils", "3 pencils", "2 pencils"],
                answer: 0,
                hint: "Combine the values of both rows together by adding: 3 + 5.",
                explanation: "To find the complete total amount of data gathered, calculate the sum: 3 + 5 = 8 pencils in total."
            },
            {
                type: "Analyzing Lists",
                question: "A teacher writes down student favorite fruits on the board:\nApple, Banana, Apple, Mango, Apple, Banana.\nWhich fruit was written down the most times?",
                options: ["Apple", "Banana", "Mango", "All are equal"],
                answer: 0,
                hint: "Count how many times each word appears. Apple appears 3 times.",
                explanation: "Apple appears 3 times, Banana 2 times, and Mango 1 time. Apple appears the most."
            },
            {
                type: "Chart Keys",
                question: "If a chart states: '🔑 1 Star Sticker = 2 Points', how many points do you get if you collect 3 Star Stickers?",
                options: ["6 points", "3 points", "2 points", "5 points"],
                answer: 0,
                hint: "Each star is worth 2, so skip-count by twos three times: 2, 4, 6.",
                explanation: "Since 1 sticker equals 2 points, 3 stickers equal 3 x 2 = 6 points."
            },
            {
                type: "Data Grouping",
                question: "Anu counts blocks by grouping them into piles of 5. She has three full piles. How many blocks does she have in total?",
                options: ["15 blocks", "10 blocks", "5 blocks", "20 blocks"],
                answer: 0,
                hint: "Add 5 three times together, or calculate 3 x 5.",
                explanation: "Grouping makes counting faster. 3 groups of 5 equals 5 + 5 + 5 = 15 blocks."
            },
            {
                type: "Interpreting Tables",
                question: "Look at this table of rainy days:\nJuly: 12 days | August: 15 days | September: 8 days\nWhich month had the fewest rainy days?",
                options: ["September", "July", "August", "None"],
                answer: 0,
                hint: "Compare the numbers 12, 15, and 8. Find the smallest one.",
                explanation: "8 is the smallest number, so September had the fewest rainy days."
            },
            {
                type: "Tally Marks Concept",
                question: "When recording data, why do we draw a slanting diagonal line across four vertical lines for the fifth count?",
                options: ["To make groups of 5 that are very easy to see and count quickly.", "To show that we made a mistake.", "Because we ran out of space.", "To end the survey immediately."],
                answer: 0,
                hint: "Think about how grouping lines into bundles of 5 helps you avoid counting individual sticks.",
                explanation: "Bundling tally marks into groups of 5 allows us to skip-count by 5s later, making large data sets quick to read."
            },
            {
                type: "Incomplete Data",
                question: "If some pictures get erased from a pictograph row by accident, what happens to our data results?",
                options: ["The chart becomes inaccurate because information is missing.", "The chart stays exactly the same.", "The answer choices become automatically correct.", "The timer speeds up."],
                answer: 0,
                hint: "Missing symbols mean we lose parts of our real counts.",
                explanation: "A pictograph relies on exact visual tallies. If symbols are lost, the chart becomes incomplete and inaccurate."
            }
        ];

        let runtimeQuestionBank = [];
        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        // FISHER-YATES SHUFFLE CORE
        function shuffleArray(arr) {
            for (let idx = arr.length - 1; idx > 0; idx--) {
                const j = Math.floor(Math.random() * (idx + 1));
                [arr[idx], arr[j]] = [arr[j], arr[idx]];
            }
            return arr;
        }

        // INITIALIZE RUNTIME DATA CLONE
        function bootstrapDatabase() {
            runtimeQuestionBank = questionBankDatabase.map(item => {
                const choicesCopy = [...item.options];
                const trueValue = choicesCopy[item.answer];
                
                shuffleArray(choicesCopy);
                const dynamicCorrectIdx = choicesCopy.indexOf(trueValue);
                
                return {
                    type: item.type,
                    question: item.question,
                    options: choicesCopy,
                    answer: dynamicCorrectIdx,
                    hint: item.hint,
                    explanation: item.explanation
                };
            });
            shuffleArray(runtimeQuestionBank);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                splash.addEventListener('transitionend', () => splash.style.display = 'none');
            }, 5000);
            bootstrapDatabase();
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60; 
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = runtimeQuestionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Quest: ${currentIndex + 1}/${runtimeQuestionBank.length}`;
            document.getElementById('target-question').innerText = `[${qData.type}]\n${qData.question}`;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            disableAllOptions();
            let qData = runtimeQuestionBank[currentIndex];
            
            const optionsList = document.getElementById('target-options').children;
            optionsList[qData.answer].classList.add('correct');

            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up! ⏱️</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = runtimeQuestionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore} ⭐`;
                }
                
                triggerSparkles();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Super! Correct! 🎉</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';
            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Clue: 💡</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    document.getElementById('hint-feedback').style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Let's check! 🌟</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => {});
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < runtimeQuestionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score-value').innerText = `${runningScore}/${runtimeQuestionBank.length}`;
            
            let finalPercentage = (runningScore / runtimeQuestionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Incredible! You are a master Data Detective! 🕵️‍♂️⭐";
            } else if (finalPercentage >= 40) {
                statusText = "Good effort! Practice reading the graphs and try again! 📊🌱";
            } else {
                statusText = "Let's review the picture charts together and play again! 🤗🎒";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0 ⭐`;
            document.getElementById('result-screen').classList.remove('active');
            bootstrapDatabase();
            document.getElementById('welcome-screen').classList.add('active');
        }

        // PARTICLE EFFECTS ENGINE
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            resizeCanvas();
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    radius: Math.random() * 5 + 3,
                    color: `hsl(${Math.random() * 40 + 190}, 95%, 60%)`, 
                    speedX: (Math.random() - 0.5) * 7,
                    speedY: (Math.random() - 0.5) * 7,
                    alpha: 1
                });
            }
            renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, idx) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.025;
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) {
                requestAnimationFrame(renderParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
