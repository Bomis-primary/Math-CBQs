<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eef2f5;
        }

        .question-count {
            font-weight: 600;
            color: #6c757d;
        }

        .timer {
            font-weight: 600;
            color: #e63946;
            background-color: #ffe6e6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1d3557;
            line-height: 1.4;
        }

        .question-type-notice {
            font-size: 0.85rem;
            color: #457b9d;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2b2d42;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e8f4f8;
            border-color: #a8dadc;
        }

        .option-btn.selected {
            background-color: #e1f5fe;
            border-color: #0288d1;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-primary {
            background-color: #457b9d;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d3557;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #495057;
        }

        .btn-submit {
            background-color: #2a9d8f;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #218377;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .hint-container {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #856404;
            display: none;
        }

        .score-container {
            text-align: center;
            padding: 20px 0;
        }

        .score-title {
            font-size: 1.8rem;
            color: #1d3557;
            margin-bottom: 10px;
        }

        .score-val {
            font-size: 3rem;
            font-weight: 700;
            color: #2a9d8f;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="quiz-header">
            <span class="question-count" id="question-count">Question 1 of 10</span>
            <span class="timer" id="timer">Time: 30s</span>
        </div>

        <div class="question-text" id="question-text">Loading question...</div>
        <div class="question-type-notice hidden" id="type-notice">Select all that apply</div>

        <div class="options-container" id="options-container">
            <!-- Dynamic Options -->
        </div>

        <button class="btn btn-submit hidden" id="submit-multi-btn" onclick="submitMultiAnswer()">Submit Selection</button>

        <div class="hint-container" id="hint-container">
            <strong>Hint:</strong> <span id="hint-text"></span>
        </div>

        <div class="controls" style="margin-top: 20px;">
            <button class="btn btn-secondary" id="hint-btn" onclick="toggleHint()">Show Hint</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
        </div>
    </div>

    <div id="score-screen" class="hidden">
        <div class="score-container">
            <h2 class="score-title">Quiz Completed!</h2>
            <p>Your Final Score:</p>
            <div class="score-val" id="final-score">0 / 10</div>
            <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>
</div>

<script>
    const originalQuestions = [
        {
            question: "What is 15 + 27?",
            options: ["32", "42", "43", "52"],
            correct: 1,
            hint: "Break it down: 15 + 20 = 35, then add 7."
        },
        {
            question: "Which of the following are prime numbers?",
            options: ["4", "7", "11", "15"],
            correct: [1, 2],
            hint: "A prime number has only two factors: 1 and itself."
        },
        {
            question: "Solve for x: 3x - 5 = 10",
            options: ["3", "4", "5", "6"],
            correct: 2,
            hint: "Add 5 to both sides, then divide by 3."
        },
        {
            question: "What is the area of a rectangle with length 8 cm and width 5 cm?",
            options: ["13 cm²", "26 cm²", "40 cm²", "45 cm²"],
            correct: 2,
            hint: "Area of a rectangle = length × width."
        },
        {
            question: "Which fraction is equivalent to 1/2?",
            options: ["2/3", "3/6", "4/10", "5/8"],
            correct: 1,
            hint: "Multiply numerator and denominator by the same number."
        },
        {
            question: "What is 20% of 150?",
            options: ["20", "25", "30", "35"],
            correct: 2,
            hint: "Find 10% first by moving the decimal point left once, then double it."
        },
        {
            question: "Which of these geometric shapes have 4 sides?",
            options: ["Square", "Triangle", "Rectangle", "Pentagon"],
            correct: [0, 2],
            hint: "Look for quadrilaterals."
        },
        {
            question: "What is the value of 2³?",
            options: ["6", "8", "9", "16"],
            correct: 1,
            hint: "2³ means 2 × 2 × 2."
        },
        {
            // FIXED: Corrected Rahul's classification statements and key mapping
            question: "Rahul made errors classifying numbers. Which of his statements are INCORRECT?",
            options: [
                "246 is odd",
                "431 is even",
                "183 is odd",
                "354 is even"
            ],
            correct: [0, 1],
            hint: "Check 246 (ends in 6 = even) and 431 (ends in 1 = odd)."
        },
        {
            question: "If a train travels at 60 km/h, how far will it go in 2.5 hours?",
            options: ["120 km", "140 km", "150 km", "180 km"],
            correct: 2,
            hint: "Distance = Speed × Time (60 × 2.5)."
        }
    ];

    let quizData = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let selectedMultiIndices = [];

    function shuffleArray(array) {
        return array.map(value => ({ value, sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(item => item.value);
    }

    function initQuizData() {
        quizData = originalQuestions.map(q => {
            let shuffledOptions = shuffleArray([...q.options]);

            if (Array.isArray(q.correct)) {
                let correctTexts = q.correct.map(idx => q.options[idx]);
                let newCorrectIndices = correctTexts.map(text => shuffledOptions.indexOf(text));
                return { ...q, options: shuffledOptions, correct: newCorrectIndices };
            } else {
                let correctText = q.options[q.correct];
                let newCorrectIndex = shuffledOptions.indexOf(correctText);
                return { ...q, options: shuffledOptions, correct: newCorrectIndex };
            }
        });
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        document.getElementById('timer').innerText = `Time: ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `Time: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        document.getElementById('hint-container').style.display = 'none';
        document.getElementById('hint-btn').innerText = 'Show Hint';
        document.getElementById('next-btn').disabled = true;

        const q = quizData[currentQuestionIndex];
        document.getElementById('question-count').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        document.getElementById('question-text').innerText = q.question;
        document.getElementById('hint-text').innerText = q.hint;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        selectedMultiIndices = [];

        const isMulti = Array.isArray(q.correct);
        const typeNotice = document.getElementById('type-notice');
        const submitBtn = document.getElementById('submit-multi-btn');

        if (isMulti) {
            typeNotice.classList.remove('hidden');
            submitBtn.classList.remove('hidden');
        } else {
            typeNotice.classList.add('hidden');
            submitBtn.classList.add('hidden');
        }

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => isMulti ? toggleMultiOption(index, btn) : handleSingleSelect(index);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function handleSingleSelect(selectedIndex) {
        clearInterval(timerInterval);
        const q = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (index === q.correct) {
                btn.classList.add('correct');
            } else if (index === selectedIndex) {
                btn.classList.add('incorrect');
            }
        });

        if (selectedIndex === q.correct) {
            score++;
        }

        document.getElementById('next-btn').disabled = false;
    }

    function toggleMultiOption(index, btn) {
        if (selectedMultiIndices.includes(index)) {
            selectedMultiIndices = selectedMultiIndices.filter(i => i !== index);
            btn.classList.remove('selected');
        } else {
            selectedMultiIndices.push(index);
            btn.classList.add('selected');
        }
    }

    function submitMultiAnswer() {
        clearInterval(timerInterval);
        const q = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        document.getElementById('submit-multi-btn').classList.add('hidden');

        let isCorrect = selectedMultiIndices.length === q.correct.length &&
            selectedMultiIndices.every(val => q.correct.includes(val));

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            btn.classList.remove('selected');
            if (q.correct.includes(index)) {
                btn.classList.add('correct');
            } else if (selectedMultiIndices.includes(index)) {
                btn.classList.add('incorrect');
            }
        });

        if (isCorrect) {
            score++;
        }

        document.getElementById('next-btn').disabled = false;
    }

    function handleTimeout() {
        const q = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        document.getElementById('submit-multi-btn').classList.add('hidden');

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (Array.isArray(q.correct)) {
                if (q.correct.includes(index)) btn.classList.add('correct');
            } else {
                if (index === q.correct) btn.classList.add('correct');
            }
        });

        document.getElementById('next-btn').disabled = false;
    }

    function toggleHint() {
        const hintEl = document.getElementById('hint-container');
        const btn = document.getElementById('hint-btn');
        if (hintEl.style.display === 'none' || hintEl.style.display === '') {
            hintEl.style.display = 'block';
            btn.innerText = 'Hide Hint';
        } else {
            hintEl.style.display = 'none';
            btn.innerText = 'Show Hint';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        initQuizData();
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    // Start application
    initQuizData();
    loadQuestion();
</script>
</body>
</html>
