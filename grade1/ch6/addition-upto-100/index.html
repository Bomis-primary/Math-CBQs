<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Number System (100 to 200)</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4dadf7;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fff9db;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 440px; border: 5px solid #ff922b; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; margin-bottom: 20px; }
        .loader-dots { font-size: 1.8rem; color: var(--secondary); animation: blink 1.4s infinite both; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #ffd8a8; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Simple Layout Typography */
        h2 { font-size: 1.7rem; text-align: center; margin-bottom: 15px; color: #e64980; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.8rem; text-align: center; margin: 10px 0; user-select: none; }
        .q-context { background: #f1f3f5; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.35rem; text-align: center; font-weight: bold; color: #102a43; line-height: 1.4; border: 2px dashed #cbd5e1; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 15px; text-align: center; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.15rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e3fafc; color: #0b7285; border: 2px solid #c5f6fa; }

        /* General UI Actions */
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #e03131; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #e03131; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
        <div class="loader-dots">🎈 Loading Game... 🎈</div>
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🔢 Let's Count!</h2>
        <div class="visual-emoji-display">🧱🚗🏠</div>
        <p style="margin-bottom: 25px; font-size: 1.35rem; color: #495057; font-weight: bold;">
            Numbers 100 to 200 Game ⭐
        </p>
        <button class="btn-action" onclick="startInteractive()">PLAY! 🚀</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🎉 Finished!</h2>
        <div class="visual-emoji-display">🏆👑✨</div>
        <p id="result-text" style="font-size: 1.35rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
    // 12 Chapter-aligned questions with child-friendly text adaptations and structural icons
    const dataset = [
        {
            emoji: "🦖",
            context: "What number comes next right after 159?",
            options: ["158 🦖", "160 🦖", "150 🦖", "170 🦖"],
            answer: 1,
            hint: "Add 1 more to 159! What comes after 59? 🔢",
            exp: "160 comes just after 159! 🎉"
        },
        {
            emoji: "🧱",
            context: "Look at number 174. What is the value of the middle 7?",
            options: ["7 ones 🟥", "70 tens 🟩", "700 hundreds 🟦", "1 one 🟨"],
            answer: 1,
            hint: "The 7 is standing in the middle tens place! 🚪",
            exp: "7 in the tens place means 70! 🎈"
        },
        {
            emoji: "✏️",
            context: "Which matches the expanded break-up form of 135?",
            options: ["100 + 3 + 5 ✏️", "1 + 3 + 5 ✏️", "100 + 30 + 5 ✏️", "10 + 30 + 5 ✏️"],
            answer: 2,
            hint: "Say it aloud: One-hundred, thirty, five! 🗣️",
            exp: "135 is 100 and 30 and 5! ⭐"
        },
        {
            emoji: "🚗",
            context: "Which friendly number sits between 188 and 190?",
            options: ["187 🚗", "191 🚗", "189 🚗", "199 🚗"],
            answer: 2,
            hint: "Count up: 188, then what number, then 190? 🔢",
            exp: "189 sits in the middle of 188 and 190! ✨"
        },
        {
            emoji: "💎",
            context: "What is the true face value of digit 1 in number 142?",
            options: ["100 💎", "10 💎", "1 💎", "142 💎"],
            answer: 2,
            hint: "Face value is what the number looks like on its own! 👀",
            exp: "The face name value of 1 is just 1! ✔️"
        },
        {
            emoji: "⚖️",
            context: "Which matching sign fits here? 165 ___ 156",
            options: ["< (Smaller)", "> (Bigger)", "= (Same)", "+ (Plus)"],
            answer: 1,
            hint: "Compare the tens! 6 tens is bigger than 5 tens. 🔼",
            exp: "165 is greater than 156! 🌸"
        },
        {
            emoji: "🚂",
            context: "Sort from smallest to biggest: 120, 110, 150.",
            options: ["150, 120, 110 🚂", "110, 150, 120 🚂", "110, 120, 150 🚂", "120, 110, 150 🚂"],
            answer: 2,
            hint: "Find the lowest starting counting number first! 🚂",
            exp: "Smallest to biggest is 110, 120, 150! 🌟"
        },
        {
            emoji: "🍎",
            context: "In the word 'APPLE', what position is the letter 'L'?",
            options: ["Second 🥈", "Sixth 🏅", "Fifth 🎖️", "Fourth 🥇"],
            answer: 3,
            hint: "Count the letters from start to finish: A, P, P, L... 🔢",
            exp: "'L' is the fourth letter in APPLE! 🏆"
        },
        {
            emoji: "🚌",
            context: "Line order: Candy, Danny, Freddy, Polly. Who is third?",
            options: ["Danny 🎒", "Freddy 🎒", "Polly 🎒", "Edward 🎒"],
            answer: 1,
            hint: "Count down the queue line positions from Candy! 🏃‍♂️",
            exp: Freddy sits in the third spot! 🎖️"
        },
        {
            emoji: "🎈",
            context: "Which number is exactly 1 less than 200?",
            options: ["100 🎈", "190 🎈", "199 🎈", "201 🎈"],
            answer: 2,
            hint: "What number comes right before you reach 200? 🛑",
            exp: "Take 1 away from 200 to get 199! 🎨"
        },
        {
            emoji: "🍭",
            context: "What is the short standard form of 100 + 0 + 7?",
            options: ["170 🍭", "107 🍭", "17 🍭", "1007 🍭"],
            answer: 1,
            hint: "Combine them safely: 1 hundred, 0 tens, and 7 ones. 🧩",
            exp: "It joins together to make 107! 🌸"
        },
        {
            emoji: "⭐️",
            context: "Which number has a 5 in the ones place?",
            options: ["152 ⭐", "501 ⭐", "125 ⭐", "160 ⭐"],
            answer: 2,
            hint: "Look at the very last digit on the right side! 📦",
            exp: "In 125, the last digit 5 is in the ones place! ✔️"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; // Grade 1 minimum runtime limit rule
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');

    // Strict 5-second asynchronous splash guard screen trigger
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});
        } else {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerText = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            triggerVisualSparklers();
            score++;
            document.getElementById('score-val').innerText = score;
            disableOptions();
            showFeedback('explanation', `🎉 Correct! ${qData.exp}`);
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { // 2 attempts feedback rules
                showFeedback('hint', `✨ Hint: ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Answer: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time's Up! ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerText = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You got ${score} / ${dataset.length} stars! ⭐`;
        
        if (finalPercent >= 75) {
            msg += "\nGood job! 🏆";
        } else if (finalPercent >= 40) {
            msg += "\nReview this chapter and try again 📚";
        } else {
            msg += "\nLet's practise more 💪";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    // Canvas particle sparklers framework
    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
