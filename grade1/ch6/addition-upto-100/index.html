<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Addition up to 100 (CBQ Challenge)</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #e67e22;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #ebf5fb;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 460px; border: 5px solid #5dade2; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #a9dfbf; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Simple Layout Typography */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #1f618d; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.5rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
        .q-context { background: #f4f6f6; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; font-weight: bold; color: #1f3a52; line-height: 1.4; border: 2px dashed #a9dfbf; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 14px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }

        /* General UI Actions */
        .btn-action { background: #1f618d; color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #154360; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #154360; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo">
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🧩 Thinking Math!</h2>
        <div class="visual-emoji-display">🧠🏫📦🌟</div>
        <p style="margin-bottom: 25px; font-size: 1.3rem; color: #495057; font-weight: bold;">
            Chapter 6: Addition up to 100 Competency Challenge 🚀
        </p>
        <button class="btn-action" onclick="startInteractive()">START CHALLENGE! 👉</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT QUESTION 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Evaluation Done!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆👑✨</div>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">TRY AGAIN 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        {
            emoji: "🪵",
            context: "Simi counted 1 bundle of 10 sticks and another bundle of 39 sticks. How many sticks are there in the 2 bundles?",
            options: ["29", "43", "49", "40"],
            answer: 2,
            hint: "Put the values together to find the total count: 10 + 39.",
            exp: "10 + 39 = 49 sticks in total!"
        },
        {
            emoji: "🧱",
            context: "To solve 45 + 23 correctly, which of the given options shows the correct place value breakdown?",
            options: ["40 + 50 + 2 + 3", "4 + 5 + 2 + 3", "40 + 20 + 50 + 30", "40 + 20 + 5 + 3"],
            answer: 3,
            hint: "Break each number into its tens group and ones group first.",
            exp: "We add tens (40 + 20) and ones (5 + 3) separately to get the correct structural answer!"
        },
        {
            emoji: "⚙️",
            context: "Identify the correct expanded layout method to add 27 and 5.",
            options: ["20 + 70 + 5", "20 + 50 + 7", "2 + 7 + 5", "20 + 7 + 5"],
            answer: 3,
            hint: "Decompose 27 into its tens and ones components first.",
            exp: "27 is made of 20 + 7. Adding 5 more gives us the correct expanded expression: 20 + 7 + 5."
        },
        {
            emoji: "🌹",
            context: "A florist has 44 red roses and 35 yellow roses. How many roses does she have in total?",
            options: ["70", "79", "89", "11"],
            answer: 1,
            hint: "Perform an explicit horizontal or column sum: 44 + 35.",
            exp: "44 + 35 = 79 total roses in her inventory!"
        },
        {
            emoji: "💯",
            context: "Which of the following addition combinations equals 100 perfectly?",
            options: ["50 + 40", "90 + 10", "80 + 10", "70 + 20"],
            answer: 1,
            hint: "Look for the bundle combination that completes exactly 10 full tens.",
            exp: "Adding 1 ten (10) to 9 tens (90) gives 10 tens, which is exactly 100!"
        },
        {
            emoji: "✨",
            context: "Reena has 18 stickers and her brother gives her 12 more. How many stickers does she have now?",
            options: ["20", "30", "28", "40"],
            answer: 1,
            hint: "Add 18 + 12. Keep an eye on what happens when the ones add up to 10.",
            exp: "18 + 12 = 30. The 8 + 2 makes a brand new ten, giving us exactly 3 tens!"
        },
        {
            emoji: "🧠",
            context: "In the sum 56 + 19, how many \"tens\" will there be in the final answer after carrying over?",
            options: ["6", "7", "5", "1"],
            answer: 1,
            hint: "6 + 9 makes 15 ones, which creates an extra ten to carry over to the tens column.",
            exp: "6 + 9 = 15 (carry 1 ten). Then 1 (carried) + 5 + 1 = 7 tens in total!"
        },
        {
            emoji: "🏏",
            context: "A cricket player scored 55 runs in the first match and 44 runs in the second match. What is his total score?",
            options: ["88", "99", "100", "95"],
            answer: 1,
            hint: "Add the digits in the ones columns together, then the digits in the tens columns.",
            exp: "55 + 44 = 99 total runs scored!"
        },
        {
            emoji: "🎨",
            context: "Which of the following expression pairs add up to exactly 65?",
            options: ["20 + 16", "25 + 30", "15 + 45", "30 + 35"],
            answer: 3,
            hint: "Test the values of the choices. Look for a sum that gives 5 ones and 6 tens.",
            exp: "30 + 35 equals exactly 65!"
        },
        {
            emoji: "📏",
            context: "What is the sum of the largest 1-digit number and the smallest 2-digit number?",
            options: ["10", "11", "19", "20"],
            answer: 2,
            hint: "The largest 1-digit number is 9, and the smallest 2-digit number is 10.",
            exp: "Largest 1-digit number is 9. Smallest 2-digit number is 10. 9 + 10 = 19!"
        },
        {
            emoji: "🏫",
            context: "There are 23 boys and 26 girls in a classroom. How many students are there altogether?",
            options: ["49", "50", "43", "59"],
            answer: 0,
            hint: "Combine the student groups together using addition: 23 + 26.",
            exp: "23 + 26 = 49 total classroom students!"
        },
        {
            emoji: "🎈",
            context: "If you add 0 to 88, the final sum is:",
            options: ["0", "80", "88", "89"],
            answer: 2,
            hint: "Think about what happens to a number's value when you add nothing to it.",
            exp: "Adding zero to any number does not change its value at all. It remains 88!"
        },
        {
            emoji: "🔍",
            context: "Which of these given addition sums requires a \"carry over\" (regrouping) step?",
            options: ["12 + 13", "45 + 22", "36 + 15", "50 + 40"],
            answer: 2,
            hint: "Check the ones place for each pair. Which one sums up to more than 9?",
            exp: "In 36 + 15, 6 + 5 = 11, which is more than 9, so it requires carrying over 1 ten to the tens place!"
        },
        {
            emoji: "🥭",
            context: "A farmer planted 62 mango trees and 28 apple trees. How many trees did he plant in all?",
            options: ["80", "90", "100", "82"],
            answer: 1,
            hint: "Set up 62 + 28. Don't forget to regroup the ones column if it reaches 10.",
            exp: "62 + 28 = 90. The 2 + 8 makes a ten, plus 6 + 2 tens gives 9 tens total!"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    // Explicit audio configurations mapping local project targets
    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000); // Strict 5-second display configuration layout rule
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});
        } else {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            // Score increment mechanic constrained strictly to a correct first attempt
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 Brilliant! First try star earned! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Good job correcting your track! ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                // First incorrect action pulls up a targeted contextual hint
                showFeedback('hint', `✨ Hint: ${qData.hint}`);
            } else {
                // Second incorrect action locks choices and renders the direct explanation
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Review Breakdown: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time ran out! Here is the conceptual calculation breakdown: ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerHTML = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You achieved ${score} / ${dataset.length} first-attempt stars! ⭐`;
        
        if (finalPercent >= 75) {
            document.getElementById('result-title').innerText = "🎉 Addition Mastery!";
            document.getElementById('result-emoji').innerText = "👑🏆🥇";
            msg += "\nSensational place value and arithmetic reasoning skills! You are an official Math Hero.";
        } else if (finalPercent >= 40) {
            document.getElementById('result-title').innerText = "📚 Keep Practicing!";
            document.getElementById('result-emoji').innerText = "✏️📖✨";
            msg += "\nA solid attempt! Let's review regrouping columns and tens bundles to score higher next time. 💪";
        } else {
            document.getElementById('result-title').innerText = "💪 Review & Retry!";
            document.getElementById('result-emoji').innerText = "🧱🧩🎈";
            msg += "\nGoing over base-10 block structures will make this easy. Try the challenge once more!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
