<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Addition up to 20</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #9b59b6;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #e8f8f5;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 460px; border: 5px solid #2cc7c9; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #a3e4d7; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Simple Layout Typography */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #117a65; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.5rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
        .q-context { background: #f4f6f6; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; font-weight: bold; color: #1f3a52; line-height: 1.4; border: 2px dashed #a3e4d7; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 14px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }

        /* General UI Actions */
        .btn-action { background: #117a65; color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #0e6251; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #0e6251; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/innovine_logo.png" alt="Innovine Logo">
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>➕ Adding Together!</h2>
        <div class="visual-emoji-display">🍦🎈🚀</div>
        <p style="margin-bottom: 25px; font-size: 1.3rem; color: #495057; font-weight: bold;">
            Addition up to 20 Interactive Challenge ⭐
        </p>
        <button class="btn-action" onclick="startInteractive()">START! 🚀</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Finished!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆⭐👑</div>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">RESTART 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        {
            emoji: "👥",
            context: "Priya and Kabir are adding 14 + 5. Priya says, 'The answer has 9 ones.' Kabir says, 'The answer has 1 ten.' Who is making the correct claim about the final total?",
            options: ["Only Priya is correct", "Only Kabir is correct", "Both Priya and Kabir are correct", "Neither is correct"],
            answer: 2,
            hint: "Find 14 + 5 first! Look at what sits in the tens and ones places of 19. 🔍",
            exp: "14 + 5 = 19. The number 19 has exactly 1 ten and 9 ones, so both are correct!"
        },
        {
            emoji: "Crayons 🖍️",
            context: "Miss Sonia needs exactly 12 colored chalk sticks for an art project. She finds three boxes:<br>• Box A: 5 chalk sticks<br>• Box B: 7 chalk sticks<br>• Box C: 6 chalk sticks<br>Which two boxes should she pick?",
            options: ["Box A and Box C", "Box B and Box C", "Box A and Box B", "She needs all three boxes"],
            answer: 2,
            hint: "Try adding pairs together to find which combination equals exactly 12! 💡",
            exp: "Box A (5) + Box B (7) makes exactly 12 chalk sticks!"
        },
        {
            emoji: "✏️",
            context: "Rohan has 8 pencils and his sister has 4 pencils. His teacher gives him 1 more pencil for good work. Rohan says he now has 10 pencils. Is he correct?",
            options: ["No, he has 9 pencils.", "No, he has 12 pencils.", "No, he has 13 pencils.", "Yes, he has 10 pencils."],
            answer: 2,
            hint: "Count all of Rohan's pencils together: 8 + 4 + 1! 🔢",
            exp: "Rohan has 8 + 4 + 1 = 13 pencils in total. So his claim was incorrect!"
        },
        {
            emoji: "🍦",
            context: "A teacher needs to give 1 ice-cream stick to each student. There are 18 students. She has 10 sticks in one box and 8 sticks in another box. Does she have enough?",
            options: ["Yes, she has enough", "No, she has 1 stick less", "No, she has 2 sticks less", "Yes, she has more than needed"],
            answer: 0,
            hint: "Add the sticks in both boxes together to check the total count! 📦",
            exp: "10 + 8 = 18 sticks. This matches the 18 students exactly!"
        },
        {
            emoji: "🐚",
            context: "Juhi collects 5 blue shells, 7 yellow shells, and 5 white shells. She uses all the white shells and an equal number of yellow shells to make a necklace. How many shells did she use?",
            options: ["7", "8", "9", "10"],
            answer: 3,
            hint: "She used 5 white shells and the same number (5) of yellow shells. Add them up! 📿",
            exp: "She used 5 white and 5 yellow shells. 5 + 5 = 10 shells altogether!"
        },
        {
            emoji: "🐸",
            context: "A frog is on number 7 on a number line. How many times should it jump forward to land on 10?",
            options: ["3 jumps", "4 jumps", "1 jump", "2 jumps"],
            answer: 0,
            hint: "Count on from 7 to 10: 8, 9, 10! 🔢",
            exp: "Starting at 7, moving 3 steps forward gets you straight to 10!"
        },
        {
            emoji: "🧩",
            context: "There is a hidden 1-digit number. It is more than 1 + 3 but less than 2 + 4. Sonam says the number is 6. Is she correct?",
            options: ["Yes, 6 fits the rule", "No, the number is 5", "No, the number is 4", "Yes, the number can be 6 or 5"],
            answer: 1,
            hint: "1 + 3 = 4 and 2 + 4 = 6. What number lives right between 4 and 6? 🔍",
            exp: "The mystery number must be strictly between 4 and 6, which means it is 5!"
        },
        {
            emoji: "🤔",
            context: "Maya adds 12 + 3 and writes the answer as 1 ten and 4 ones (14). What mistake did she make?",
            options: ["She added 3 tens instead of 3 ones.", "She added one less in the ones place.", "She added 5 more in the ones place.", "The answer is correct."],
            answer: 1,
            hint: "Count 3 steps forward from 12 carefully. What number do you reach? 🧱",
            exp: "12 + 3 is 15. Maya wrote 14, meaning she counted one less in the ones place!"
        },
        {
            emoji: "🎮",
            context: "In a match, Team A scored 5 points in Round 1 and 5 points in Round 2. Team B scored 4 points in Round 1 and 6 points in Round 2. Which statement is true?",
            options: ["Team A scored more points in total.", "Team B scored more points in total.", "Both teams scored equal points", "Team A scored 1 point more than Team B"],
            answer: 2,
            hint: "Find the total score for both teams by adding their rounds up. 📈",
            exp: "Both teams equal 10 points! Different pairs can add up to the same total."
        },
        {
            emoji: "📿",
            context: "Tina has 7 yellow beads, 8 red beads, and 1 white bead. She makes a necklace using all the red and white beads. How many beads does she use in all?",
            options: ["7", "2", "5", "9"],
            answer: 3,
            hint: "Be careful! Only count the red and white beads that went into the necklace. 🛑",
            exp: "8 red beads and 1 white bead make 8 + 1 = 9 beads used in total!"
        },
        {
            emoji: "🚌",
            context: "A bus can carry 20 children. 12 children are already on the bus. 7 children are waiting in line to get in. The driver says, 'There are seats for all 7 children.' Is he correct?",
            options: ["Yes, because 12 + 7 = 19", "Yes, because the bus can carry 12 children.", "No, because 7 children are too many.", "No, because 12 + 7 = 21."],
            answer: 0,
            hint: "Add the new 7 children to the 12 already inside. Is that total under 20? 🏫",
            exp: "12 + 7 = 19. Since 19 is less than the bus capacity of 20, everyone gets a seat!"
        },
        {
            emoji: "🧺",
            context: "Look at this shopping list:<br>• Mangoes: 8 🥭<br>• Bananas: 6 🍌<br>• Papaya: 1 🥑<br>How many fruits are there in total?",
            options: ["16", "10", "15", "18"],
            answer: 2,
            hint: "Add the three items step by step: 8 + 6 + 1! 🍉",
            exp: "8 + 6 + 1 equals 15 fruits in all!"
        },
        {
            emoji: "📏",
            context: "If you start at number 10 on a number line and take 0 jumps forward, where are you?",
            options: ["0", "10", "1", "9"],
            answer: 1,
            hint: "Adding zero means you aren't moving any spaces forward! 👣",
            exp: "0 added to 10 stays exactly 10! You haven't moved."
        },
        {
            emoji: "🎈",
            context: "Ali needs 20 balloons. He bought 11 balloons. His sister gave him 5 balloons, and he found 3 more in a box. Does he have sufficient balloons?",
            options: ["Yes, exactly 20", "No, he has 19 balloons", "No, he has 16 balloons", "Yes, he has more than 20"],
            answer: 1,
            hint: "Add up all the balloons Ali collected: 11 + 5 + 3! 🔍",
            exp: "The sum is 11 + 5 + 3 = 19. He is exactly 1 balloon short of 20!"
        },
        {
            emoji: "🌷",
            context: "Rahul and Adil count flowers. Rahul counts 19 and Adil counts 11. Adil says the total is '2 tens and 0 ones' (20). What is the correct answer description?",
            options: ["He counted 1 ones more", "He counted 1 tens less", "He added 1 tens and 5 ones", "He counted 1 tens more"],
            answer: 1,
            hint: "Calculate 19 + 11. How many tens are actually in 30 compared to Adil's 2 tens? 🌸",
            exp: "19 + 11 = 30. 30 is 3 tens, so Adil counted 1 ten less than the true answer!"
        },
        {
            emoji: "🛝",
            context: "In a park, 5 kids are on the slide, 6 are in the sand pit, and 1 is on the bench. The teacher wants to buy an ice cream for every child. How many does she need?",
            options: ["16", "13", "12", "19"],
            answer: 2,
            hint: "Find the total sum of children across all three park zones: 5 + 6 + 1! 🍦",
            exp: "5 + 6 + 1 makes 12 total children, so she needs 12 ice creams!"
        },
        {
            emoji: "📦",
            context: "Ronak and Risha are sorting laddoos into sweet boxes of 10. Which combination is the odd one out and does NOT make 10?",
            options: ["7 laddoos + 3 laddoos", "6 laddoos + 4 laddoos", "8 laddoos + 2 laddoos", "5 laddoos + 3 laddoos"],
            answer: 3,
            hint: "Add each pair together. One of these options only equals 8! 🍡",
            exp: "Options a, b, and c all sum up to 10. But 5 + 3 = 8, making it the odd group out!"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});
        } else {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            // Strict First Attempt Condition
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 Outstanding! First try star! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Good job getting it! Let's hit the next on try one. ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                // First attempt failure shows hints
                showFeedback('hint', `✨ Dynamic Hint: ${qData.hint}`);
            } else {
                // Second attempt failure locks and skips to explanation
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Notice: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time ran out! Here is the concept: ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerHTML = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You earned ${score} / ${dataset.length} first-attempt stars! ⭐`;
        
        if (finalPercent >= 75) {
            document.getElementById('result-title').innerText = "🎉 Superb Work!";
            document.getElementById('result-emoji').innerText = "👑🏆🥇";
            msg += "\nWonderful competency skills! You are an addition master.";
        } else if (finalPercent >= 40) {
            document.getElementById('result-title').innerText = "📚 Let's Revise!";
            document.getElementById('result-emoji').innerText = "✏️📖✨";
            msg += "\nAn average performance! Please revise the concept chapters carefully and try again. 💪";
        } else {
            document.getElementById('result-title').innerText = "💪 Practice Helps!";
            document.getElementById('result-emoji').innerText = "🧱🧩🎈";
            msg += "\nLet's go back through the items to strengthen your math logic foundational skills!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
