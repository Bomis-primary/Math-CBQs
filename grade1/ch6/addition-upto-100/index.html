<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Addition up to 100</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:white;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:880px;
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.15);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#ecfdf5;
  border:2px solid #6ee7b7;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:130px;
}

.visual{
  font-size:54px;
  margin-bottom:8px;
  line-height:1.2;
}

.visual-text{
  font-size:19px;
  font-weight:bold;
  color:#065f46;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.option{
  width:100%;
  min-height:72px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:white;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:23px;
  text-align:center;
  margin-bottom:20px;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:58px;font-size:18px;padding:12px}
  .visual{font-size:46px}
  .visual-text{font-size:17px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{
q:"Simi counted 1 bundle of 10 sticks and another bundle of 39 sticks. How many sticks are there in the 2 bundles?",
visual:"🪵 10 + 39",
visualText:"Add both bundles of sticks.",
options:["29","43","49","40"],
answer:2
},
{
q:"To solve 45 + 23 correctly, which option shows the correct expanded form?",
visual:"45 + 23",
visualText:"Break the numbers into tens and ones.",
options:["40 + 50 + 2 + 3","4 + 5 + 2 + 3","40 + 20 + 50 + 30","40 + 20 + 5 + 3"],
answer:3
},
{
q:"Solve: 52 + 16",
visual:"52 + 16",
visualText:"Add ones first, then tens.",
options:["68","58","78","66"],
answer:0
},
{
q:"Identify the correct method to add 27 and 5.",
visual:"27 + 5",
visualText:"Break 27 into 20 and 7.",
options:["20 + 70 + 5","20 + 50 + 7","2 + 7 + 5","20 + 7 + 5"],
answer:3
},
{
q:"What is the sum of 38 + 42?",
visual:"38 + 42",
visualText:"8 + 2 makes 10, so carry 1 ten.",
options:["70","80","710","82"],
answer:1
},
{
q:"A florist has 44 red roses and 35 yellow roses. How many roses does she have in total?",
visual:"🌹 44 + 🌼 35",
visualText:"Add red roses and yellow roses.",
options:["70","79","89","11"],
answer:1
},
{
q:"5 + 9 + 7 is equal to:",
visual:"5 + 9 + 7",
visualText:"Add all three numbers.",
options:["25","24","21","20"],
answer:2
},
{
q:"Solve: 60 + 30",
visual:"60 + 30",
visualText:"6 tens + 3 tens = 9 tens.",
options:["63","30","90","100"],
answer:2
},
{
q:"Which of the following equals 100?",
visual:"Make 100",
visualText:"Look for the pair that makes one hundred.",
options:["50 + 40","90 + 10","80 + 10","70 + 20"],
answer:1
},
{
q:"Reena has 18 stickers and her brother gives her 12 more. How many stickers does she have now?",
visual:"⭐ 18 + 12",
visualText:"Add the stickers together.",
options:["20","30","28","40"],
answer:1
},
{
q:"What is 72 + 27?",
visual:"72 + 27",
visualText:"Add ones and tens carefully.",
options:["90","99","100","89"],
answer:1
},
{
q:"In the sum 56 + 19, how many tens will there be in the final answer after carrying over?",
visual:"56 + 19",
visualText:"6 + 9 = 15, so carry 1 ten.",
options:["6","7","5","1"],
answer:1
}
];

let current=0,score=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  timeLeft=60;
  scoreBox.textContent=score;
  timerBox.textContent=timeLeft;
  loadQuestion();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  nextBtn.style.display="none";

  const item=questions[current];
  qNo.textContent=current+1;
  questionText.textContent=item.q;
  visualBox.innerHTML=`<div class="visual">${item.visual}</div><div class="visual-text">${item.visualText}</div>`;
  optionsBox.innerHTML="";

  item.options.forEach((option,index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=option;
    btn.onclick=()=>checkAnswer(btn,index);
    optionsBox.appendChild(btn);
  });
}

function checkAnswer(button,selected){
  if(answered)return;
  const correctIndex=questions[current].answer;

  if(selected===correctIndex){
    answered=true;
    score++;
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    playSound(correctSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Try again.";
      button.disabled=true;
    }else{
      answered=true;
      feedback.textContent="Incorrect. The correct answer is highlighted.";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  const correctIndex=questions[current].answer;
  document.querySelectorAll(".option")[correctIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(score/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again";
  }else{
    message="Let’s practise more";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").textContent="Your Score: "+score+" out of "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
