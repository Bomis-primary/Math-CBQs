<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Shapes and Patterns</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:#ffffff;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:900px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
}

.visual-img{
  width:105px;
  height:105px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.visual-img.big{
  width:150px;
  height:120px;
}

.visual-img.large-square {
  width: 140px;
  height: 140px;
}

.pattern-img{
  width:72px;
  height:72px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.pattern-number{
  width:72px;
  height:72px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  color:#1f4e79;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.qmark{
  width:72px;
  height:72px;
  border-radius:16px;
  background:#1f4e79;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:110px;
  padding:14px 16px;
  font-size:18px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:#ffffff;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option img{
  height:60px;
  width:60px;
  object-fit:contain;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:21px;
  text-align:center;
  margin-bottom:20px;
  line-height:1.5;
  color:#4b5563;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:95px;font-size:16px;padding:10px}
  .option img{height:45px;width:45px}
  .visual-img{width:86px;height:86px}
  .visual-img.big{width:120px;height:95px}
  .visual-img.large-square{width:110px;height:110px}
  .pattern-img,.pattern-number,.qmark{width:56px;height:56px}
  .pattern-number{font-size:28px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="qLabel">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

const correctSound=document.getElementById("correctSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");

function startQuiz(){
  current=0;
  score=0;
  firstAttemptCorrect=0;
  scoreBox.textContent=score;
  loadQuestion();
}

function startTimer(){
  timeLeft=60;

  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}
