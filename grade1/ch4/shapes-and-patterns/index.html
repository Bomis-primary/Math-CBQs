<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Shapes and Patterns</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:#ffffff;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:900px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.visual-img{
  width:105px;
  height:105px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.visual-img.big{
  width:150px;
  height:120px;
}

.pattern-img{
  width:72px;
  height:72px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.pattern-number{
  width:72px;
  height:72px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  color:#1f4e79;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.qmark{
  width:72px;
  height:72px;
  border-radius:16px;
  background:#1f4e79;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:76px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:#ffffff;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:21px;
  text-align:center;
  margin-bottom:20px;
  line-height:1.5;
  color:#4b5563;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:62px;font-size:17px;padding:12px}
  .visual-img{width:86px;height:86px}
  .visual-img.big{width:120px;height:95px}
  .pattern-img,.pattern-number,.qmark{width:56px;height:56px}
  .pattern-number{font-size:28px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="qLabel">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{
q:"Misha is looking at the main entrance door of her classroom. If she wants to paint a shape that looks exactly like the face of the door, which flat shape should she choose?",
visualType:"images",
images:["door.png","rectangle.png"],
options:["A perfectly even square","A tall, wide rectangle","A smooth round circle","A sharp triangle"],
answer:1,
hint:"Think about an object or door that has two long parallel sides and two shorter sides.",
explanation:"A standard classroom door is taller than it is wide, giving it a distinct rectangular face."
},
{
q:"Zayan is playing a game where he can only pick up toys that spin or roll smoothly across the carpet without hitting a flat edge. Which item can he pick up?",
visualType:"images",
images:["coin.png","circle.png"],
options:["A wooden building block","A shiny round coin","A flat plastic ruler","A square puzzle box"],
answer:1,
hint:"Look for the item that has zero corners and a single curved line wrapping all the way around.",
explanation:"A coin has a perfectly curved, round border with no corners to stop it from rolling smoothly."
},
{
q:"Avani cuts out two secret origami shapes. She tells her brother: 'Both of my flat paper pieces have exactly 4 straight sides and 4 sharp corners.' What did she cut out?",
visualType:"images",
images:["rectangle.png","square.png"],
options:["A rectangle and a square","A triangle and a rectangle","A square and a circle","A circle and a triangle"],
answer:0,
hint:"Triangles only have 3 corners, and circles have none. Focus on the four-sided shapes.",
explanation:"Both rectangles and squares are built using exactly four straight lines and four corners."
},
{
q:"Dev steps into a sports shop and kicks a soft soccer ball across the floor. What is the mathematical name for this round, solid 3D shape?",
visualType:"images",
images:["ball.png","sphere.png"],
options:["Cube","Sphere","Cylinder","Cone"],
answer:1,
hint:"It is a solid ball shape that is perfectly round from every single side, not a flat drawing.",
explanation:"A ball is a solid 3D round shape, which is geometrically called a sphere."
},
{
q:"Tara is dressing up as a magical wizard for a play. She puts on a tall, pointed party hat that stands on a flat round base. What 3D shape is her hat?",
visualType:"images",
images:["party-hat.png","cone.png"],
options:["A sharp pyramid","A flat square","A pointed cone","A rolling cylinder"],
answer:2,
hint:"This shape has a flat circle at the bottom that narrows all the way up into a single pointed tip.",
explanation:"An object with a flat circular bottom that tapers up to a sharp top point is a cone."
},
{
q:"Look at this tile pattern on the swimming pool floor: Circle, Square, Circle, Square. What tile comes next to keep the pattern going?",
visualType:"pattern",
items:["circle.png","square.png","circle.png","square.png","?"],
options:["A three-sided triangle","A long rectangle","A round circle","A five-pointed star"],
answer:2,
hint:"Watch the repeating sequence closely. Look at what always comes right after a square.",
explanation:"The pattern swaps back and forth cleanly. Every time a square ends, a circle returns next."
},
{
q:"Rohit looks out the car window and sees a bright red 'Yield' traffic sign. If he counts the sharp points where the straight lines meet, how many corners will he find?",
visualType:"images",
images:["triangle.png"],
options:["2 corners","3 corners","4 corners","0 corners"],
answer:1,
hint:"A Yield sign is a flat triangle shape. Count the points on a triangle.",
explanation:"A triangle shape is built from 3 straight edges, which always join together to create exactly 3 corners."
},
{
q:"Ananya wants to store her soup can in the pantry. She discovers it slides smoothly when stood upright, but rolls away when laid on its side! What 3D shape is the can?",
visualType:"images",
images:["cylinder.png"],
options:["A flat box","A round sphere","A tube cylinder","A pointed cone"],
answer:2,
hint:"Look for a tube-like shape that has a curved middle section but two flat circular faces at both ends.",
explanation:"A cylinder can slide when standing on its flat round face and roll easily when tipped onto its curved side."
},
{
q:"Imagine tracing the shapes of the written letters 'S' and 'L' with your finger. Which sentence describes the lines of these letters perfectly?",
visualType:"images",
images:["S.png","L.png"],
options:[
"S is made of a straight line, but L is made of a curved line.",
"Both letters are built out of completely straight lines.",
"S is made of a curved line, but L is made of straight lines.",
"Both letters are built out of completely curved lines."
],
answer:2,
hint:"One letter loops around smoothly without corners, while the other makes a single sharp corner turn.",
explanation:"The letter S bends smoothly without any corners (curved), while L is made of two straight lines joined at a corner."
},
{
q:"Siddharth looks down at his breakfast table and notices his round bicycle wheel sticker matches the outer rim of his cereal bowl. What shape do they share?",
visualType:"images",
images:["wheel.png","plate.png","circle.png"],
options:["Square","Triangle","Circle","Rectangle"],
answer:2,
hint:"Think of the flat, perfectly round shape that has no corners and no straight edges.",
explanation:"Bicycle wheels and dining bowls are completely round on the outside, matching the definition of a circle."
},
{
q:"Meera is rolling a standard game dice during a board game. Which of these facts is true about the surfaces of her dice?",
visualType:"images",
images:["dice.png","cube.png"],
options:[
"It is a flat 2D drawing with no depth.",
"It has only round, curved surfaces that roll everywhere.",
"It has flat square surfaces that let it slide to a stop.",
"It has absolutely no corners or edges."
],
answer:2,
hint:"Think about what a dice is made of—six flat square walls that help it stop spinning and land on a flat face.",
explanation:"A game dice is a solid cube with six flat faces, which allows it to slide cleanly across a surface and rest flat."
},
{
q:"You place a tiny plastic shirt button right next to a giant family frying pan. Both are perfectly round. Which statement describes them correctly?",
visualType:"images",
images:["button.png","plate.png"],
options:[
"They are different shapes because their sizes are not the same.",
"They are the exact same shape but have different sizes.",
"The pan is a square and the tiny button is a circle.",
"They are exactly the same size in your hand."
],
answer:1,
hint:"Does stretching an object or making it bigger change what shape it is?",
explanation:"Changing the size of an object does not change its basic shape. Both items are still perfect circles."
}
];

let current=0,score=0,firstAttemptCorrect=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;
let currentCorrectIndex = 0;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const qLabel=document.getElementById("qLabel");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  firstAttemptCorrect=0;
  scoreBox.textContent=score;
  loadQuestion();
}

function startTimer(){
  timeLeft=60;
  timerBox.textContent=timeLeft;
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  feedback.style.color="#1f2937";
  nextBtn.style.display="none";

  const item=questions[current];
  
  if (current >= questions.length - 2) {
    qLabel.innerHTML = `⚡ Challenge <span id="qNo">${current + 1}</span>/${questions.length}`;
    document.getElementById("quizScreen").querySelector('.card').style.borderColor = "#8b5cf6";
  } else {
    qLabel.innerHTML = `Question <span id="qNo">${current + 1}</span>/${questions.length}`;
    document.getElementById("quizScreen").querySelector('.card').style.borderColor = "";
  }
  
  questionText.textContent=item.q;
  optionsBox.innerHTML="";
  renderVisual(item);

  let shuffledOptions = item.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
  shuffledOptions.sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((option, index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=option.text;
    
    if(option.originalIndex === item.answer) {
      currentCorrectIndex = index;
    }

    btn.onclick=()=>checkAnswer(btn, index);
    optionsBox.appendChild(btn);
  });

  startTimer();
}

function renderVisual(item){
  if(item.visualType==="images"){
    let html='<div class="visual-row">';
    item.images.forEach(img=>{
      html+=`<img class="visual-img big" src="assets/${img}" alt="">`;
    });
    html+='</div>';
    visualBox.innerHTML=html;
  }

  if(item.visualType==="pattern"){
    let html='<div class="visual-row">';
    item.items.forEach(it=>{
      if(it==="?"){
        html+='<div class="qmark">?</div>';
      }else{
        html+=`<img class="pattern-img" src="assets/${it}" alt="">`;
      }
    });
    html+='</div>';
    visualBox.innerHTML=html;
  }
}

function checkAnswer(button,selected){
  if(answered)return;
  const currentQuestion=questions[current];

  if(selected===currentCorrectIndex){
    clearInterval(timerInterval);
    answered=true;
    score++;
    
    if(attempts===0){
      firstAttemptCorrect++;
    }
    
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    feedback.style.color="#047857";
    playSound(correctSound);
    playSound(clapSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Hint: " + currentQuestion.hint;
      feedback.style.color="#b45309";
      button.disabled=true;
    }else{
      clearInterval(timerInterval);
      answered=true;
      feedback.textContent="Incorrect. " + currentQuestion.explanation;
      feedback.style.color="#b91c1c";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  document.querySelectorAll(".option")[currentCorrectIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(firstAttemptCorrect/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again";
  }else{
    message="Let’s practise more";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").innerHTML="Total Solved: "+score+" / "+questions.length+"<br>First-Attempt Correct: "+firstAttemptCorrect+" / "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
