<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Shapes and Patterns</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:#ffffff;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:900px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
}

.visual-img{
  max-width:130px;
  max-height:130px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.visual-img.big{
  max-width:160px;
  max-height:140px;
}

.visual-img.large-square {
  max-width:140px;
  max-height:140px;
}

.pattern-img{
  width:72px;
  height:72px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}

.pattern-number{
  width:72px;
  height:72px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  color:#1f4e79;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.qmark{
  width:72px;
  height:72px;
  border-radius:16px;
  background:#1f4e79;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.word-display{
  font-size:42px;
  font-weight:bold;
  letter-spacing:6px;
  color:#1f4e79;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.45;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:90px;
  padding:14px 16px;
  font-size:18px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:#ffffff;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

/* Mixed content (Image + Text) Question Variant Styling */
.option.has-image {
  flex-direction: column;
  min-height: 120px;
  gap: 10px;
}

.option img{
  height:45px;
  width:45px;
  object-fit:contain;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:21px;
  text-align:center;
  margin-bottom:20px;
  line-height:1.5;
  color:#4b5563;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:75px;font-size:16px;padding:10px}
  .option.has-image{min-height:105px}
  .visual-img{max-width:90px;max-height:90px}
  .visual-img.big{max-width:110px;max-height:100px}
  .visual-img.large-square{max-width:100px;max-height:100px}
  .pattern-img,.pattern-number,.qmark{width:56px;height:56px}
  .pattern-number{font-size:28px}
  .word-display{font-size:32px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="qLabel">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{
q:"Misha is looking at the main entrance door of her classroom. If she wants to paint a shape that looks exactly like the face of the door, which flat shape should she choose?",
visualType:"images",
images:["door.png"],
options:[
  {text:"Square", img:"square.png"},
  {text:"Triangle", img:"triangle.png"},
  {text:"Rectangle", img:"rectangle.png"},
  {text:"Circle", img:"circle.png"}
],
answer:2,
hint:"A door has two long sides and two shorter sides.",
explanation:"A door is taller than it is wide, making it a rectangle!"
},
{
q:'Which of these items can <strong style="color: #b45309; background: #fef3c7; padding: 2px 6px; border-radius: 6px;">roll</strong> smoothly across the floor without stopping?',
visualType:"images",
images:["cube.png","eraser.png","rubics-cube.png","coin.png"],
options:[
  {text:"A toy block"},
  {text:"An eraser"},
  {text:"A Rubik's cube"},
  {text:"A round coin"}
],
answer:3,
hint:"Look for the shape with no corners and zero straight sides.",
explanation:"A coin is round and has no sharp corners, so it rolls perfectly!"
},
{
q:"Avani cuts out two secret origami shapes. She tells her brother: 'Both of my flat paper pieces have exactly 4 straight sides and 4 sharp corners.' What did she cut out?",
visualType:"images",
images:["rectangle.png","square.png"],
options:[
  {text:"A triangle and a rectangle"},
  {text:"A square and a circle"},
  {text:"A circle and a triangle"},
  {text:"A rectangle and a square"}
],
answer:3,
hint:"Triangles only have 3 corners, and circles have none.",
explanation:"Both squares and rectangles are made with exactly 4 sides and 4 corners!"
},
{
q:"What 3D mathematical name belongs to a round, solid soccer ball?",
visualType:"images",
images:["ball.png"],
options:[
  {text:"Cube"},
  {text:"Sphere"},
  {text:"Cylinder"},
  {text:"Cone"}
],
answer:1,
hint:"It is a perfectly round 3D ball, not a flat drawing.",
explanation:"A solid, round ball shape is called a sphere."
},
{
q:"What 3D shape looks exactly like a pointed party hat?",
visualType:"images",
images:["party-hat.png"],
options:[
  {text:"Pyramid"},
  {text:"Cube"},
  {text:"Cone"},
  {text:"Cylinder"}
],
answer:2,
hint:"This shape has a round flat bottom that goes up to a sharp tip.",
explanation:"A party hat has a circle on the bottom and a point at the top, which is a cone!"
},
{
q:"Look at this tile pattern on the swimming pool floor: Circle, Square, Circle, Square. What tile comes next to keep the pattern going?",
visualType:"pattern",
items:["circle.png","square.png","circle.png","square.png","?"],
options:[
  {text:"A round circle"},
  {text:"A three-sided triangle"},
  {text:"A five-pointed star"},
  {text:"A long rectangle"}
],
answer:0,
hint:"What always comes right after a square in this line?",
explanation:"The pattern changes back and forth. A circle always comes after a square!"
},
{
q:"Rohit looks out the car window and sees a bright red 'Yield' traffic sign. If he counts the sharp points where the straight lines meet, how many corners will he find?",
visualType:"images",
images:["image_65c945.jpg"],
options:[
  {text:"4 corners"},
  {text:"3 corners"},
  {text:"0 corners"},
  {text:"2 corners"}
],
answer:1,
hint:"Count the sharp points on the triangle sign.",
explanation:"A triangle shape always has exactly 3 corners!"
},
{
q:"This soup can slides when upright but rolls on its side. What 3D shape is it?",
visualType:"images",
images:["can.png"],
options:[
  {text:"Cube"},
  {text:"Cone"},
  {text:"Sphere"},
  {text:"Cylinder"}
],
answer:3,
hint:"Look for a tube shape with flat circles at both ends.",
explanation:"A tube-like shape with two flat circular ends is called a cylinder."
},
{
q:"Look carefully at the letters in the words below. Which four-letter word is made up entirely of completely straight lines with absolutely no curves?",
visualType:"word",
word:"KITE",
options:[
  {text:"ROSE"},
  {text:"KITE"},
  {text:"LAMP"},
  {text:"GATE"}
],
answer:1,
hint:"Look for the word where every single letter (K, I, T, E) is built using only straight sticks!",
explanation:"The letters K, I, T, and E use completely straight segments, whereas R, O, S, P, and G contain rounded lines."
},
{
q:"A bicycle wheel and a food bowl share which flat geometric shape?",
visualType:"images",
images:["wheel.png","plate.png","circle.png"],
options:[
  {text:"Square"},
  {text:"Triangle"},
  {text:"Circle"},
  {text:"Rectangle"}
],
answer:2,
hint:"Think of a shape that is perfectly round with no sides.",
explanation:"Wheels and bowls are round, meaning they are circles!"
},
{
q:"Meera is rolling a standard game dice during a board game. Which of these facts is true about the surfaces of her dice?",
visualType:"images",
images:["dice.png","cube.png"],
options:[
  {text:"It has absolutely no corners or edges."},
  {text:"It has flat square surfaces that let it slide to a stop."},
  {text:"It is a flat 2D drawing with no depth."},
  {text:"It has only round, curved surfaces that roll everywhere."}
],
answer:1,
hint:"Look closely at a dice—each of its six walls is a perfect flat shape.",
explanation:"A dice is a cube made out of six flat squares!"
},
{
q:"You place a tiny plastic shirt button right next to a giant family frying pan. Both are perfectly round. Which statement describes them correctly?",
visualType:"largeImages",
images:["button.png","plate.png"],
options:[
  {text:"They are different shapes because their sizes are not the same."},
  {text:"The pan is a square and the tiny button is a circle."},
  {text:"They are the exact same shape but have different sizes."},
  {text:"They are exactly the same size in your hand."}
],
answer:2,
hint:"Does making a round circle bigger turn it into a triangle or square?",
explanation:"Size doesn't change the shape. A tiny circle and a giant circle are still both circles!"
}
];

let current=0,score=0,firstAttemptCorrect=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;
let currentCorrectIndex = 0;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const qLabel=document.getElementById("qLabel");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  firstAttemptCorrect=0;
  scoreBox.textContent=score;
  loadQuestion();
}

function startTimer(){
  timeLeft=60;
  timerBox.textContent=timeLeft;
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  feedback.style.color="#1f2937";
  nextBtn.style.display="none";

  const item=questions[current];
  
  if (current >= questions.length - 2) {
    qLabel.innerHTML = `⚡ Challenge <span id="qNo">${current + 1}</span>/${questions.length}`;
    document.getElementById("quizScreen").querySelector('.card').style.borderColor = "#8b5cf6";
  } else {
    qLabel.innerHTML = `Question <span id="qNo">${current + 1}</span>/${questions.length}`;
    document.getElementById("quizScreen").querySelector('.card').style.borderColor = "";
  }
  
  questionText.innerHTML=item.q;
  optionsBox.innerHTML="";
  renderVisual(item);

  let shuffledOptions = item.options.map((opt, idx) => ({ text: opt.text, img: opt.img, originalIndex: idx }));
  shuffledOptions.sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((option, index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    
    if(option.img) {
      btn.classList.add("has-image");
      const imgEl = document.createElement("img");
      imgEl.src = `assets/${option.img}`;
      imgEl.alt = option.text;
      btn.appendChild(imgEl);
    }
    
    const textSpan = document.createElement("span");
    textSpan.textContent = option.text;
    btn.appendChild(textSpan);
    
    if(option.originalIndex === item.answer) {
      currentCorrectIndex = index;
    }

    btn.onclick=()=>checkAnswer(btn, index);
    optionsBox.appendChild(btn);
  });

  startTimer();
}

function renderVisual(item){
  if(item.visualType==="images" || item.visualType==="largeImages"){
    let html='<div class="visual-row">';
    const sizeClass = item.visualType === "largeImages" ? "large-square" : "big";
    item.images.forEach(img=>{
      const srcPath = img.startsWith("image_") ? img : `assets/${img}`;
      html+=`<img class="visual-img ${sizeClass}" src="${srcPath}" alt="">`;
    });
    html+='</div>';
    visualBox.innerHTML=html;
  }

  if(item.visualType==="pattern"){
    let html='<div class="visual-row">';
    item.items.forEach(it=>{
      if(it==="?"){
        html+='<div class="qmark">?</div>';
      }else{
        html+=`<img class="pattern-img" src="assets/${it}" alt="">`;
      }
    });
    html+='</div>';
    visualBox.innerHTML=html;
  }

  if(item.visualType==="word"){
    visualBox.innerHTML=`<div class="word-display">${item.word}</div>`;
  }
}

function checkAnswer(button,selected){
  if(answered)return;
  const currentQuestion=questions[current];

  if(selected===currentCorrectIndex){
    clearInterval(timerInterval);
    answered=true;
    score++;
    
    if(attempts===0){
      firstAttemptCorrect++;
    }
    
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    feedback.style.color="#047857";
    playSound(correctSound);
    playSound(clapSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Hint: " + currentQuestion.hint;
      feedback.style.color="#b45309";
      button.disabled=true;
    }else{
      clearInterval(timerInterval);
      answered=true;
      feedback.textContent="Not quite. " + currentQuestion.explanation;
      feedback.style.color="#b91c1c";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  document.querySelectorAll(".option")[currentCorrectIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(firstAttemptCorrect/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job!";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again!";
  }else{
    message="Let’s practice some more!";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").innerHTML="Total Solved: "+score+" / "+questions.length+"<br>First-Attempt Correct: "+firstAttemptCorrect+" / "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
