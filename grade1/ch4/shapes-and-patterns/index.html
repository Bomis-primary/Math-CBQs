<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Shapes and Patterns</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:#ffffff;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:900px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:170px;
}

.visual-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.visual-img{
  width:105px;
  height:105px;
  object-fit:contain;
  background:white;
  border-radius:18px;
  padding:8px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.visual-img.big{
  width:150px;
  height:120px;
}

.pattern-img{
  width:72px;
  height:72px;
  object-fit:contain;
  background:white;
  border-radius:16px;
  padding:8px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.pattern-number{
  width:72px;
  height:72px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  color:#1f4e79;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.qmark{
  width:72px;
  height:72px;
  border-radius:16px;
  background:#1f4e79;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.visual-text{
  font-size:19px;
  font-weight:bold;
  color:#7c2d12;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:76px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:#ffffff;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:21px;
  text-align:center;
  margin-bottom:20px;
  line-height:1.5;
  color:#4b5563;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:62px;font-size:17px;padding:12px}
  .visual-img{width:86px;height:86px}
  .visual-img.big{width:120px;height:95px}
  .pattern-img,.pattern-number,.qmark{width:56px;height:56px}
  .pattern-number{font-size:28px}
  .visual-text{font-size:17px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="qLabel">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{
q:"Look at the main entrance door of your classroom. Which flat shape does its face resemble most?",
visualType:"images",
images:["door.png","rectangle.png"],
text:"A door looks like a rectangle.",
options:["Square","Triangle","Rectangle","Circle"],
answer:2,
hint:"Think about an object that has two long parallel sides and two shorter sides.",
explanation:"A standard room door is taller than it is wide, giving it a distinct rectangular face."
},
{
q:"Kabir is searching for objects in his room. Which of these items has only curved lines and zero straight edges?",
visualType:"images",
images:["coin.png","circle.png"],
text:"A coin has a round curved edge.",
options:["A wooden ruler","A play dice","A round coin","A story textbook"],
answer:2,
hint:"Look for the item that can roll smoothly across a table without hitting flat edges.",
explanation:"Rulers and books have straight sides, but a coin is perfectly round all the way around."
},
{
q:"Reema is sorting cutout blocks. She finds two pieces that both have exactly 4 straight sides and 4 corners. What are they?",
visualType:"images",
images:["rectangle.png","square.png"],
text:"Both shapes have 4 sides and 4 corners.",
options:["Triangle and Rectangle","Rectangle and Square","Square and Circle","Circle and Triangle"],
answer:1,
hint:"Triangles only have 3 corners, and circles have none. Eliminate those choices.",
explanation:"Both rectangles and squares are built using exactly four straight lines and four corners."
},
{
q:"Sanya throws a toy across the grass. Which solid shape is shaped like a tennis ball and can roll easily in any direction?",
visualType:"images",
images:["ball.png","sphere.png"],
text:"A ball is shaped like a sphere.",
options:["Cube","Sphere","Cylinder","Cone"],
answer:1,
hint:"This shape has no flat edges or sharp corners at all.",
explanation:"A ball is a perfect solid round shape, which in mathematics is called a sphere."
},
{
q:"A colorful birthday party hat is an example of which solid 3D shape?",
visualType:"images",
images:["party-hat.png","cone.png"],
text:"A party hat has a pointed top like a cone.",
options:["Cube","Sphere","Cone","Cylinder"],
answer:2,
hint:"It has a circular flat bottom that goes up to a sharp pointed tip.",
explanation:"A shape that stands on a circular base and tapers to a fine point is a cone."
},
{
q:"Identify the next missing shape in this wallpaper pattern: Circle, Square, Circle, Square, ____",
visualType:"pattern",
items:["circle.png","square.png","circle.png","square.png","?"],
text:"The pattern repeats circle and square.",
options:["Triangle","Rectangle","Circle","Star"],
answer:2,
hint:"Look at what shape always shows up right after a square finishes.",
explanation:"The sequence swaps back and forth: Circle, then Square. Following the square, a circle returns."
},
{
q:"Rohan points to a triangular highway warning sign. How many sharp corners can he count on it?",
visualType:"images",
images:["triangle.png"],
text:"Count the corners of the sign.",
options:["2","3","4","0"],
answer:1,
hint:"Count the sharp points where the straight side lines meet.",
explanation:"A triangle is constructed of 3 straight edges, creating exactly 3 corners."
},
{
q:"Which solid object in a kitchen can both roll on its side and slide when placed on its flat ends?",
visualType:"images",
images:["cylinder.png"],
text:"A cylinder rolls on its curved side and slides on its flat ends.",
options:["A block box","A play marble","A soup cylinder can","A pointed pyramid tile"],
answer:2,
hint:"Look for a shape like a soda can that has both a round side and flat circular ends.",
explanation:"A cylinder slides when placed on its flat top/bottom, and rolls when laid on its side."
},
{
q:"Look at the written letter S and the letter L. Which sentence describes their lines correctly?",
visualType:"images",
images:["S.png","L.png"],
text:"S is curved. L is made of straight lines.",
options:[
"S is a straight line, L is a curved line.",
"Both are made of straight lines.",
"S is a curved line, L is made of straight lines.",
"Both are made of curved lines."
],
answer:2,
hint:"Trace the shapes with your finger. One winds around smoothly, while the other makes a sharp corner turn.",
explanation:"The letter S has smooth bends (curved line), while L is formed by two flat straight paths joining."
},
{
q:"Look at a bicycle wheel and a circular dinner plate. What geometric shape do they both share?",
visualType:"images",
images:["wheel.png","plate.png","circle.png"],
text:"Both are round like a circle.",
options:["Square","Triangle","Circle","Rectangle"],
answer:2,
hint:"Both items have zero straight borders and can spin or turn smoothly.",
explanation:"Wheels and dining plates are completely round, matching a circle."
},
{
q:"Aarav is holding a standard game dice. Which statement is true about its surfaces?",
visualType:"images",
images:["dice.png","cube.png"],
text:"A cube has flat surfaces.",
options:[
"It has no corners or edges.",
"It has only curved round surfaces.",
"It has flat surfaces and can slide.",
"It is a completely flat 2D drawing."
],
answer:2,
hint:"Think about sliding a dice across a smooth game board tile.",
explanation:"A cube is built out of six flat square faces, allowing it to slide smoothly across surfaces."
},
{
q:"You compare two round items: a tiny clothing shirt button and a large kitchen pan. Which statement is correct?",
visualType:"images",
images:["button.png","plate.png"],
text:"They are the same shape but different sizes.",
options:[
"They are different shapes because their sizes are different.",
"They are the same shape but different sizes.",
"The pan is a square and the button is a circle.",
"They are exactly the same size."
],
answer:1,
hint:"Do they both keep the exact same round profile despite one being bigger?",
explanation:"Size does not change the core geometric properties. Both remain circles."
}
];

let current=0,score=0,firstAttemptCorrect=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;
let currentCorrectIndex = 0;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const qLabel=document.getElementById("qLabel");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  firstAttemptCorrect=0;
  scoreBox.textContent=score;
  loadQuestion();
}

function startTimer(){
  timeLeft=60;
  timerBox.textContent=timeLeft;
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  feedback.style.color="#1f2937";
  nextBtn.style.display="none";

  const item=questions[current];
  
  // Enforce Linear Structure with Final Challenge Indicator for last 2 questions 
  if (current >= questions.length - 2) {
    qLabel.innerHTML = `⚡ Challenge <span id="qNo">${current + 1}</span>/${questions.length}`;
    document.getElementById("quizScreen").querySelector('.card').style.borderColor = "#8b5cf6";
  } else {
    qLabel.innerHTML = `Question <span id="qNo">${current + 1}</span>/${questions.length}`;
  }
  
  questionText.textContent=item.q;
  optionsBox.innerHTML="";
  renderVisual(item);

  // Dynamic choice scrambling routine to avoid pattern recognition [cite: 71]
  let shuffledOptions = item.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
  shuffledOptions.sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((option, index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=option.text;
    
    if(option.originalIndex === item.answer) {
      currentCorrectIndex = index;
    }

    btn.onclick=()=>checkAnswer(btn, index);
    optionsBox.appendChild(btn);
  });

  startTimer();
}

function renderVisual(item){
  if(item.visualType==="images"){
    let html='<div class="visual-row">';
    item.images.forEach(img=>{
      html+=`<img class="visual-img big" src="assets/${img}" alt="">`;
    });
    html+='</div>';
    html+=`<div class="visual-text">${item.text}</div>`;
    visualBox.innerHTML=html;
  }

  if(item.visualType==="pattern"){
    let html='<div class="visual-row">';
    item.items.forEach(it=>{
      if(it==="?"){
        html+='<div class="qmark">?</div>';
      }else{
        html+=`<img class="pattern-img" src="assets/${it}" alt="">`;
      }
    });
    html+='</div>';
    html+=`<div class="visual-text">${item.text}</div>`;
    visualBox.innerHTML=html;
  }
}

function checkAnswer(button,selected){
  if(answered)return;
  const currentQuestion=questions[current];

  if(selected===currentCorrectIndex){
    clearInterval(timerInterval);
    answered=true;
    score++;
    
    if(attempts===0){
      firstAttemptCorrect++;
    }
    
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    feedback.style.color="#047857";
    // Double audio indicator overlay execution [cite: 93]
    playSound(correctSound);
    playSound(clapSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      // Instantly show targeted scaffolding tip on first error [cite: 88]
      feedback.textContent="Hint: " + currentQuestion.hint;
      feedback.style.color="#b45309";
      button.disabled=true;
    }else{
      clearInterval(timerInterval);
      answered=true;
      // Show explanation details after second failed attempt [cite: 89]
      feedback.textContent="Incorrect. " + currentQuestion.explanation;
      feedback.style.color="#b91c1c";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  document.querySelectorAll(".option")[currentCorrectIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  // Score metrics evaluated strictly against first-attempt milestones [cite: 123, 124, 125]
  const percentage=(firstAttemptCorrect/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again";
  }else{
    message="Let’s practise more";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").innerHTML="Total Solved: "+score+" / "+questions.length+"<br>First-Attempt Correct: "+firstAttemptCorrect+" / "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
