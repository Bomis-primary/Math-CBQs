<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: 100 to 200</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4dadf7;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fff9db;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 500px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 420px; border: 5px solid #ff922b; }
        
        /* Full Page Splash Screen */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 180px; height: auto; margin-bottom: 20px; }
        .loader-dots { font-size: 2rem; color: var(--secondary); animation: blink 1.4s infinite both; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .hidden { display: none !important; }
        
        /* Header Stats */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #ffd8a8; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Box Text Formats */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #e64980; }
        .q-context { background: #f1f3f5; padding: 12px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; border: 2px dashed #ced4da; }
        h3 { font-size: 1.3rem; text-align: center; margin-bottom: 15px; color: #102a43; }
        
        /* Grid Buttons */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24; box-shadow: 0 4px #f5c6cb; }
        
        /* Visual Dialogs */
        .feedback-box { padding: 12px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e3fafc; color: #0b7285; border: 2px solid #c5f6fa; }

        /* Action Keys */
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px; font-size: 1.2rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #e03131; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #e03131; }
        .audio-ctrl { background: none; border: none; font-size: 1.8rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
        <div class="loader-dots">🎈 Loading Game... 🎈</div>
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🔢 Fun Math Game!</h2>
        <p style="margin-bottom: 25px; font-size: 1.2rem; color: #495057; line-height: 1.4; font-weight: bold;">
            Let's count from 100 to 200 with pictures and blocks! ⭐
        </p>
        <button class="btn-action" onclick="startInteractive()">Let's Play! 🚀</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ Score: <span id="score-val">0</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-text" class="q-context"></div>
            <h3 id="q-body"></h3>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">Next Card 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🎉 Game Over!</h2>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50;"></p>
        <button class="btn-action" onclick="restartInteractive()">Play Again 🔄</button>
    </div>
</div>

<script>
    // Ultra-short texts with high-density visual cue symbols for 1st graders
    const dataset = [
        {
            context: "Anu has 10 crayon packs. 🖍️ Each pack has 10 crayons.",
            question: "How many crayons does Anu have in total?",
            options: ["10 crayons 🖍️", "100 crayons 🖍️", "20 crayons 🖍️", "50 crayons 🖍️"],
            answer: 1,
            hint: "Skip-count by 10s: 10, 20, 30... up to 10 packs!",
            exp: "10 packs of 10 makes exactly 100 crayons! 🌟"
        },
        {
            context: "Leo counts blocks. 🧱 He just counted block 149.",
            question: "What number block comes next?",
            options: ["148 🧱", "160 🧱", "150 🧱", "200 🧱"],
            answer: 2,
            hint: "What comes right after 49 when counting? 🔢",
            exp: "150 comes right after 149! 🎉"
        },
        {
            context: "Look at the toy cars: 115 🚗 ,  ___ 🚗 , 117 🚗.",
            question: "What car number is missing in the middle?",
            options: ["114 🚗", "116 🚗", "118 🚗", "120 🚗"],
            answer: 1,
            hint: "Count up: 115, then what, then 117? 🔢",
            exp: "116 is in between 115 and 117! ✨"
        },
        {
            context: "Look at the big house number: 184 🏠.",
            question: "What is the value of the middle number 8?",
            options: ["8 ones 🟥", "80 tens 🟩", "800 hundreds 🟦", "8 ones 🟦"],
            answer: 1,
            hint: "The 8 is in the tens room! 🚪",
            exp: "The 8 means 8 tens, which is 80! 🎈"
        },
        {
            context: "Sita wants to make the number 135 🧩.",
            question: "Which collection card shows 135?",
            options: ["10 + 30 + 5 🧩", "100 + 3 + 5 🧩", "100 + 30 + 5 🧩", "1 + 3 + 5 🧩"],
            answer: 2,
            hint: "Say it out loud: One-hundred, thirty, five! 🗣️",
            exp: "100 and 30 and 5 makes 135! ⭐"
        },
        {
            context: "The card reads: 100 + 90 + 2 📇.",
            question: "What number does this make together?",
            options: ["192 📇", "129 📇", "102 📇", "190 📇"],
            answer: 0,
            hint: "Put the hundreds, tens, and ones together! 🧩",
            exp: "100 + 90 + 2 joins to make 192! 🎨"
        },
        {
            context: "Book A has 167 stickers 🦋. Book B has 176 stickers 🦋.",
            question: "Which statement is true?",
            options: ["167 is bigger 🔼", "167 is equal 🟡", "167 is smaller 🔽", "176 is smaller 🔽"],
            answer: 2,
            hint: "Look at the tens! 6 tens is less than 7 tens. 🔢",
            exp: "167 is smaller than 176! 🌸"
        },
        {
            context: "Sort these number trains: 112 🚂, 189 🚂, 145 🚂, 123 🚂.",
            question: "Which row goes from smallest to biggest?",
            options: ["189, 145, 123, 112 🚂", "112, 123, 145, 189 🚂", "112, 145, 123, 189 🚂", "123, 112, 145, 189 🚂"],
            answer: 1,
            hint: "Find the lowest number first! 🚂",
            exp: "From smallest to biggest: 112, 123, 145, 189! 🌟"
        },
        {
            context: "Rohan says: 'In 143 💎, the face value of 4 is forty.'",
            question: "Is Rohan correct?",
            options: ["Yes, it is in the tens room 👍", "No, the face value is just 4 🛑", "No, it is 400 🛑", "Yes, numbers never change 👍"],
            answer: 1,
            hint: "Face value means what the number looks like on its own! 👀",
            exp: "The place value is 40, but the face name value is just 4! ✔️"
        },
        {
            context: "Look at the children in line: 🏃‍♂️🏃‍♀️🏃‍♂️...",
            question: "What are the position names for line numbers 12 and 20?",
            options: ["Twelve, Twenty 🔢", "Twelfth, Twentieth 🥇", "Second, Tenth 🥇", "Light, Last 🔢"],
            answer: 1,
            hint: "Use position words like first, second, third! 🏆",
            exp: "Line position 12 is Twelfth and 20 is Twentieth! 🎖️"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; // Grade 1: 60 seconds
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');

    // Strict 5 seconds splash screen layout trigger
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});
        } else {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-text').innerText = qData.context;
        document.getElementById('q-body').innerText = qData.question;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            triggerVisualSparklers();
            score++;
            document.getElementById('score-val').innerText = score;
            disableOptions();
            showFeedback('explanation', `🎉 ${qData.exp}`);
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) {
                showFeedback('hint', `✨ ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Let's see: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time's up! ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerText = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You earned ${score} out of ${dataset.length} stars! ⭐`;
        
        if (finalPercent >= 75) {
            msg += "\nSuper Job! 🏆🏆";
        } else if (finalPercent >= 40) {
            msg += "\nGood try! Let's practice again! 📚";
        } else {
            msg += "\nLet's try one more time! 💪";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    // High performance localized visual confetti particle burst effect
    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
