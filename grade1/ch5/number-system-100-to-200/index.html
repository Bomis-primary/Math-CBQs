<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Number System (13 CBQ Master Suite)</title>
    <style>
        :root {
            --primary: #d35400;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fdf2e9;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 480px; border: 5px solid #f5b041; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #f5b041; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Layout Typography */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #ba4a00; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.5rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
        .q-context { background: #f4f6f6; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; font-weight: bold; color: #7e5109; line-height: 1.4; border: 2px dashed #f5b041; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 14px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }

        /* General UI Actions */
        .btn-action { background: #e67e22; color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #a04000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #a04000; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo">
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🧩 13 Master CBQ Challenge</h2>
        <div class="visual-emoji-display">🎯📦🚌🏫</div>
        <p style="margin-bottom: 25px; font-size: 1.3rem; color: #495057; font-weight: bold;">
            Numbers 100 to 200 Competency Check 🚀
        </p>
        <button class="btn-action" onclick="startInteractive()">START SUITE 👉</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span> / <span id="q-total">13</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT QUESTION 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Analytics Complete!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆👏✨</div>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">RESTART CHALLENGE 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        {
            emoji: "📦",
            context: "How many ‘tens’ do you need to group together to make 100?",
            options: ["1", "5", "10", "100"],
            answer: 2,
            hint: "Try skip counting by 10 until you reach 100. How many counts?",
            exp: "10 groups of ten (10 × 10) bundle together perfectly to make 100!"
        },
        {
            emoji: "🚌",
            context: "Candy, Danny, Freddy, Polly, Edward, and Suzi are standing in a line for the bus, starting with Candy at the front. Who is third in the line?",
            options: ["Danny", "Freddy", "Polly", "Edward"],
            answer: 1,
            hint: "Candy is 1st, Danny is 2nd. Who is next?",
            exp: "Counting directly from Candy at the front, Freddy holds the third position."
        },
        {
            emoji: "🏫",
            context: "In a school assembly row, Deepa is 5th in line and she is the last student. How many students are standing in that row?",
            options: ["7", "5", "3", "1"],
            answer: 1,
            hint: "If she is number 5 and there is no one behind her, that defines the total count.",
            exp: "Since she is 5th and last, there are exactly 5 students total in that row."
        },
        {
            emoji: "🚶‍♀️",
            context: "A girl is standing in a queue. There are 10 people in front of her. What is her ordinal position in the queue?",
            options: ["10th", "9th", "11th", "12th"],
            answer: 2,
            hint: "If 10 spots are already taken up ahead of her, what turn is she?",
            exp: "With 10 people in front of her, she occupies the next spot, which is the 11th position."
        },
        {
            emoji: "🍎",
            context: "In the word \"APPLE\", what is the position of 'L'?",
            options: ["second", "sixth", "fifth", "fourth"],
            answer: 3,
            hint: "Count each letter sequentially from left to right.",
            exp: "'L' is the fourth letter when counting out the word structure."
        },
        {
            emoji: "🎟️",
            context: "What is the standard form of 100 + 0 + 7?",
            options: ["170", "107", "17", "1007"],
            answer: 1,
            hint: "Combine 1 hundred, 0 tens, and 7 ones directly into their places.",
            exp: "Putting together 1 hundred, 0 tens, and 7 ones constructs the number 107."
        },
        {
            emoji: "💎",
            context: "What is the face value of the digit 1 in the number 142?",
            options: ["100", "10", "1", "142"],
            answer: 2,
            hint: "Face value is what a digit looks like on its own, ignoring its column place.",
            exp: "The face value of any digit is always just the digit itself, so it is 1!"
        },
        {
            emoji: "💯",
            context: "How many hundreds are there in the number 200?",
            options: ["1", "2", "0", "20"],
            answer: 1,
            hint: "How many chunks of 100 combine to make up 200?",
            exp: "The number 200 consists of exactly 2 completed bundles of hundreds."
        },
        {
            emoji: "📝",
            context: "In the number 106, which digit is in the tens place?",
            options: ["1", "6", "0", "10"],
            answer: 2,
            hint: "Look at the middle placeholder digit that sits between hundreds and ones.",
            exp: "106 is written as 1 Hundred, 0 Tens, and 6 Ones. The middle tracking digit is 0."
        },
        {
            emoji: "⚖️",
            context: "Which number is greater than 179 but less than 181?",
            options: ["178", "180", "182", "170"],
            answer: 1,
            hint: "What number sits right between 179 and 181 on the number line?",
            exp: "180 is the exact consecutive number situated between 179 and 181."
        },
        {
            emoji: "📊",
            context: "Which statement is correct?",
            options: ["165 > 156", "165 < 156", "165 = 156", "156 > 165"],
            answer: 0,
            hint: "Compare the tens place: 6 tens is larger than 5 tens.",
            exp: "165 is greater than 156 because 6 tens (60) is greater than 5 tens (50)."
        },
        {
            emoji: "📉",
            context: "Arrange these numbers in descending order: 144, 188, 166.",
            options: ["188, 166, 144", "144, 166, 188", "166, 188, 144", "188, 144, 166"],
            answer: 0,
            hint: "Descending order means organizing from the largest value down to the smallest.",
            exp: "Sorting from greatest to least gives us 188, then 166, and finally 144."
        },
        {
            emoji: "🪵",
            context: "If you have 1 bundle of 100 sticks, 3 bundles of 10 sticks, and 5 loose sticks, what number do you have?",
            options: ["135", "153", "531", "130"],
            answer: 0,
            hint: "Group them by place: 1 hundred + 3 tens + 5 ones.",
            exp: "Combining 1 hundred, 3 tens, and 5 ones models the number 135 perfectly."
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');
    const audioClaps = new Audio('assets/freesound_community-claps-44774.mp3');

    window.addEventListener('load', () => {
        document.getElementById('q-total').innerText = dataset.length;
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') { audioCorrect.currentTime = 0; audioCorrect.play().catch(() => {}); }
        else if (type === 'wrong') { audioWrong.currentTime = 0; audioWrong.play().catch(() => {}); }
        else if (type === 'claps') { audioClaps.currentTime = 0; audioClaps.play().catch(() => {}); }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 First-Attempt Star! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Correct! ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                showFeedback('hint', `💡 Hint: ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Review Rule: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time's up! Here is the core structure: ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerHTML = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        playSound('claps');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You earned ${score} / ${dataset.length} flawless first-attempt stars! ⭐`;
        
        if (finalPercent >= 80) {
            document.getElementById('result-title').innerText = "👑 Math Structural Master!";
            document.getElementById('result-emoji').innerText = "🏆🏅✨";
            msg += "\nIncredible spatial and placeholder logic! You completely master sequence dynamics, ordinal limits, and base-10 systems.";
        } else if (finalPercent >= 50) {
            document.getElementById('result-title').innerText = "🚀 Terrific Work!";
            document.getElementById('result-emoji').innerText = "✏️📈💡";
            msg += "\nGreat job! Visualizing empty placeholders and positional lines carefully will help you reach a flawless score.";
        } else {
            document.getElementById('result-title').innerText = "🧱 Keep Building!";
            document.getElementById('result-emoji').innerText = "🎒📖🔄";
            msg += "\nUsing models and blocks makes these clear. Give it another try to secure your master stars!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
