<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number System 100 to 200 - Master Suite</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:#ffffff;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:900px;
  background:#ffffff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

/* Title Screen Styling */
.title-content {
  text-align: center;
  padding: 60px 20px;
}

.title-header {
  font-size: 42px;
  font-weight: bold;
  color: #1f4e79;
  margin-bottom: 32px;
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:250px; /* Increased to accommodate the larger graphic comfortably */
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual-emoji-display {
  font-size: 5rem;
  user-select: none;
}

.visual-image-display {
  max-height: 220px; /* Made bigger for clear character visibility */
  width: auto;
  max-width: 100%;
  object-fit: contain;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.45;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:90px;
  padding:14px 16px;
  font-size:18px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:#ffffff;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.primary.large {
  padding: 16px 42px;
  font-size: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 12px rgba(31, 78, 121, 0.3);
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:21px;
  text-align:center;
  margin-bottom:20px;
  line-height:1.5;
  color:#4b5563;
  white-space: pre-line;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .title-header{font-size: 30px; margin-bottom: 24px;}
  .topbar{grid-template-columns:1fr 1fr}
  .visual-box{min-height: 180px;}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:75px;font-size:16px;padding:10px}
  .visual-emoji-display{font-size:3.5rem}
  .visual-image-display{max-height:160px} /* Increased scaling for crisp layout readability on mobile devices */
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Logo" class="logo" />
</div>

<div id="titleScreen" class="screen">
  <div class="card title-content">
    <div class="title-header">Number System 100 to 200</div>
    <button class="primary large" onclick="handleStartClick()">Start Game</button>
  </div>
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="qLabel">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔈 Sound Off</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/claps.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const questionPool=[
  {
    emoji: "📦",
    q: "How many ‘tens’ do you need to group together to make 100?",
    options: ["1", "5", "10", "100"],
    answer: 2,
    hint: "Try skip counting by 10 until you reach 100. How many counts?",
    explanation: "10 groups of ten (10 × 10) bundle together perfectly to make 100!"
  },
  {
    image: "assets/line.png", 
    q: "Candy, Danny, Freddy, Polly, Edward, and Suzi are standing in a line for the bus, starting with Candy at the front. Who is third in the line?",
    options: ["Danny", "Freddy", "Polly", "Edward"],
    answer: 1,
    hint: "Candy is 1st, Danny is 2nd. Who is next?",
    explanation: "Counting directly from Candy at the front, Freddy holds the third position."
  },
  {
    emoji: "🏫",
    q: "In a school assembly row, Deepa is 5th in line and she is the last student. How many students are standing in that row?",
    options: ["7", "5", "3", "1"],
    answer: 1,
    hint: "If she is number 5 and there is no one behind her, that defines the total count.",
    explanation: "Since she is 5th and last, there are exactly 5 students total in that row."
  },
  {
    emoji: "🚶‍♀️",
    q: "A girl is standing in a queue. There are 10 people in front of her. What is her ordinal position in the queue?",
    options: ["10th", "9th", "11th", "12th"],
    answer: 2,
    hint: "If 10 spots are already taken up ahead of her, what turn is she?",
    explanation: "With 10 people in front of her, she occupies the next spot, which is the 11th position."
  },
  {
    emoji: "🍎",
    q: "In the word \"APPLE\", what is the position of 'L'?",
    options: ["second", "sixth", "fifth", "fourth"],
    answer: 3,
    hint: "Count each letter sequentially from left to right.",
    explanation: "'L' is the fourth letter when counting out the word structure."
  },
  {
    emoji: "🎟️",
    q: "What is the standard form of 100 + 0 + 7?",
    options: ["170", "107", "17", "1007"],
    answer: 1,
    hint: "Combine 1 hundred, 0 tens, and 7 ones directly into their places.",
    explanation: "Putting together 1 hundred, 0 tens, and 7 ones constructs the number 107."
  },
  {
    emoji: "💎",
    q: "What is the face value of the digit 1 in the number 142?",
    options: ["100", "10", "1", "142"],
    answer: 2,
    hint: "Face value is what a digit looks like on its own, ignoring its column place.",
    explanation: "The face value of any digit is always just the digit itself, so it is 1!"
  },
  {
    emoji: "💯",
    q: "How many hundreds are there in the number 200?",
    options: ["1", "2", "0", "20"],
    answer: 1,
    hint: "How many chunks of 100 combine to make up 200?",
    explanation: "The number 200 consists of exactly 2 completed bundles of hundreds."
  },
  {
    emoji: "📝",
    q: "In the number 106, which digit is in the tens place?",
    options: ["1", "6", "0", "10"],
    answer: 2,
    hint: "Look at the middle placeholder digit that sits between hundreds and ones.",
    explanation: "106 is written as 1 Hundred, 0 Tens, and 6 Ones. The middle tracking digit is 0."
  },
  {
    emoji: "⚖️",
    q: "Which number is greater than 179 but less than 181?",
    options: ["178", "180", "182", "170"],
    answer: 1,
    hint: "What number sits right between 179 and 181 on the number line?",
    explanation: "180 is the exact consecutive number situated between 179 and 181."
  },
  {
    emoji: "📊",
    q: "Which statement is correct?",
    options: ["165 > 156", "165 < 156", "165 = 156", "156 > 165"],
    answer: 0,
    hint: "Compare the tens place: 6 tens is larger than 5 tens.",
    explanation: "165 is greater than 156 because 6 tens (60) is greater than 5 tens (50)."
  },
  {
    emoji: "📉",
    q: "Arrange these numbers in descending order: 144, 188, 166.",
    options: ["188, 166, 144", "144, 166, 188", "166, 188, 144", "188, 144, 166"],
    answer: 0,
    hint: "Descending order means organizing from the largest value down to the smallest.",
    explanation: "Sorting from greatest to least gives us 188, then 166, and finally 144."
  },
  {
    emoji: "🪵",
    q: "If you have 1 bundle of 100 sticks, 3 bundles of 10 sticks, and 5 loose sticks, what number do you have?",
    options: ["135", "153", "531", "130"],
    answer: 0,
    hint: "Group them by place: 1 hundred + 3 tens + 5 ones.",
    explanation: "Combining 1 hundred, 3 tens, and 5 ones models the number 135 perfectly."
  }
];

let questions=[];
let current=0,score=0,firstAttemptCorrect=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=true;
let currentCorrectIndex = 0;

let logoScreen, titleScreen, quizScreen, resultScreen, qNo, qLabel, scoreBox, timerBox, visualBox, questionText, optionsBox, feedback, nextBtn, correctSound, wrongSound;

document.addEventListener("DOMContentLoaded", () => {
  logoScreen=document.getElementById("logoScreen");
  titleScreen=document.getElementById("titleScreen");
  quizScreen=document.getElementById("quizScreen");
  resultScreen=document.getElementById("resultScreen");
  qNo=document.getElementById("qNo");
  qLabel=document.getElementById("qLabel");
  scoreBox=document.getElementById("score");
  timerBox=document.getElementById("timer");
  visualBox=document.getElementById("visualBox");
  questionText=document.getElementById("questionText");
  optionsBox=document.getElementById("optionsBox");
  feedback=document.getElementById("feedback");
  nextBtn=document.getElementById("nextBtn");
  correctSound=document.getElementById("correctSound");
  wrongSound=document.getElementById("wrongSound");

  setTimeout(()=>{
    logoScreen.classList.remove("active");
    titleScreen.classList.add("active");
  },5000);
});

function handleStartClick() {
  titleScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function startQuiz(){
  let shuffledPool = [...questionPool].sort(() => Math.random() - 0.5);
  questions = shuffledPool.slice(0, 12);
  
  current=0;
  score=0;
  firstAttemptCorrect=0;
  scoreBox.textContent=score;
  loadQuestion();
}

function startTimer(){
  timeLeft=60;
  timerBox.textContent=timeLeft;
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      answered=true;
      feedback.textContent="Time's up! " + questions[current].explanation;
      feedback.style.color="#b91c1c";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  feedback.style.color="#1f2937";
  nextBtn.style.display="none";

  const item=questions[current];
  
  qLabel.innerHTML = `Question <span id="qNo">${current + 1}</span>/12`;
  
  questionText.innerHTML=item.q;
  optionsBox.innerHTML="";
  
  if (item.image) {
    visualBox.innerHTML = `<img src="${item.image}" alt="Question Graphic" class="visual-image-display" />`;
  } else {
    visualBox.innerHTML = `<div class="visual-emoji-display">${item.emoji}</div>`;
  }

  let shuffledOptions = item.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
  shuffledOptions.sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((option, index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    
    const textSpan = document.createElement("span");
    textSpan.textContent = option.text;
    btn.appendChild(textSpan);
    
    if(option.originalIndex === item.answer) {
      currentCorrectIndex = index;
    }

    btn.onclick=()=>checkAnswer(btn, index);
    optionsBox.appendChild(btn);
  });

  startTimer();
}

function checkAnswer(button,selected){
  if(answered)return;
  const currentQuestion=questions[current];

  if(selected===currentCorrectIndex){
    clearInterval(timerInterval);
    answered=true;
    score++;
    
    if(attempts===0){
      firstAttemptCorrect++;
    }
    
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent=attempts === 0 ? `🎉 First-Attempt Star! ${currentQuestion.explanation}` : `👍 Correct! ${currentQuestion.explanation}`;
    feedback.style.color="#047857";
    playSound(correctSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Hint: " + currentQuestion.hint;
      feedback.style.color="#b45309";
      button.disabled=true;
    }else{
      clearInterval(timerInterval);
      answered=true;
      feedback.textContent="Review Rule: " + currentQuestion.explanation;
      feedback.style.color="#b91c1c";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  document.querySelectorAll(".option")[currentCorrectIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(firstAttemptCorrect/questions.length)*100;
  let title="";
  let msg=`You earned ${firstAttemptCorrect} / ${questions.length} flawless first-attempt stars! ⭐\n\n`;

  if(percentage >= 80){
    title="👑 Math Structural Master!";
    msg += "Incredible spatial and placeholder logic! You completely master sequence dynamics, ordinal limits, and base-10 systems.";
    launchConfetti();
    playSound(correctSound);
  }else if(percentage >= 50){
    title="🚀 Terrific Work!";
    msg += "Great job! Visualizing empty placeholders and positional lines carefully will help you reach a flawless score.";
    playSound(correctSound);
  }else{
    title="🧱 Keep Building!";
    msg += "Using models and blocks makes these clear. Give it another try to secure your master stars!";
  }

  document.getElementById("resultMessage").textContent=title;
  document.getElementById("finalScore").innerText=msg;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  titleScreen.classList.add("active");
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
