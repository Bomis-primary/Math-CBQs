<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition Upto 20</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f8ff;color:#1f2937;min-height:100vh}

.screen {
  display: none; 
  width: 100%;
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
}

.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#logoScreen {
  background: #ffffff;
}

.logo {
  max-width: 420px;
  width: 80%;
  height: auto;
  display: block;
}

.card {
  width: 100%;
  max-width: 880px;
  background: #ffffff;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15);
}

.topbar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
  width: 100%;
}

.badge {
  background: #e0f2fe;
  color: #0f3f5f;
  padding: 10px;
  border-radius: 14px;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
}

.visual-box {
  background: #fff7ed;
  border: 2px solid #fdba74;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
  min-height: 130px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.visual {
  font-size: 54px;
  line-height: 1.2;
}

/* FIXED IMAGE SIZING CONSTRAINTS */
.visual-box img {
  max-width: 100%; 
  max-height: 220px; 
  object-fit: contain; 
  border-radius: 12px;
  display: block;
  margin: 0 auto;
}

.question {
  font-size: 24px;
  font-weight: bold;
  line-height: 1.35;
  margin: 16px 0;
  text-align: left;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(220px, 1fr));
  gap: 14px;
  width: 100%;
}

.option {
  width: 100%;
  min-height: 72px;
  padding: 14px 16px;
  font-size: 19px;
  font-weight: bold;
  border: 2px solid #1f4e79;
  background: #ffffff;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.option.correct { background: #d1fae5; border-color: #047857; color: #047857; }
.option.wrong { background: #fee2e2; border-color: #b91c1c; color: #b91c1c; }
.option:disabled { cursor: not-allowed; opacity: 0.7; }

.feedback {
  min-height: 48px;
  margin-top: 14px;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  width: 100%;
}

.primary {
  background: #1f4e79;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 14px 28px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

#nextBtn { display: none; }

@media(max-width:700px){
  .options { grid-template-columns: 1fr; }
  .topbar { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<audio id="audioCorrect" src="assets/claps.mp3" preload="auto"></audio>
<audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" class="logo" alt="Logo">
</div>

<div id="introScreen" class="screen">
  <div class="card" style="text-align:center">
    <h2>Addition Upto 20</h2>
    <p>Test your understanding through real-life scenarios, challenges, and puzzles!</p>
    <button class="primary" onclick="startQuiz()">Start Challenge</button>
  </div>
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge"><span id="qTypeBadge">Flow</span>: <span id="qNo">1</span>/12</div>
      <div class="badge">Score <span id="score">0</span></div>
      <div class="badge">Time <span id="timer">60</span>s</div>
      <div class="badge">Add up to 20</div>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div style="text-align:center; margin-top: 15px;">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card" style="text-align:center">
    <h1 id="resultMessage"></h1>
    <p id="finalScore"></p>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

/* ---------------- ACTIVE GAME QUESTIONS ARRAY ---------------- */
let questions = [];

let current = 0;
let score = 0;
let timer = 60;
let interval;
let attemptsLeft = 2;

function changeScreen(fromId, toId) {
  const fromScreen = document.getElementById(fromId);
  const toScreen = document.getElementById(toId);
  if (fromScreen) fromScreen.classList.remove("active");
  if (toScreen) toScreen.classList.add("active");
}

function init() {
  setTimeout(() => {
    changeScreen("logoScreen", "introScreen");
  }, 5000);
}

function startQuiz() {
  // RANDOMIZE AND CHOOSE EXACTLY 12 QUESTIONS EVERY TIME GAME STARTS
  let shuffled = [...questionPool].sort(() => Math.random() - 0.5);
  questions = shuffled.slice(0, 12);
  
  current = 0;
  score = 0;
  changeScreen("introScreen", "quizScreen");
  loadQuestion();
}

function startTimer() {
  clearInterval(interval);
  timer = 60;
  document.getElementById("timer").innerText = timer;

  interval = setInterval(() => {
    timer--;
    document.getElementById("timer").innerText = timer;

    if (timer <= 0) {
      clearInterval(interval);
      playAudio(false);
      disableOptions();
      document.getElementById("feedback").innerText = "Time's up! " + questions[current].explain;
      document.getElementById("feedback").style.color = "#b91c1c";
      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }, 1000);
}

function playAudio(isCorrect) {
  const correctSound = document.getElementById("audioCorrect");
  const wrongSound = document.getElementById("audioWrong");
  if(isCorrect && correctSound) {
    correctSound.currentTime = 0;
    correctSound.play().catch(e => console.log("Audio blocked"));
  } else if(!isCorrect && wrongSound) {
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log("Audio blocked"));
  }
}

function loadQuestion() {
  startTimer();
  attemptsLeft = 2;
  
  let q = questions[current];

  document.getElementById("qNo").innerText = current + 1;
  document.getElementById("qTypeBadge").innerText = q.type;
  document.getElementById("score").innerText = score;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("questionText").innerText = q.q;

  if (q.visual.includes("assets/")) {
    document.getElementById("visualBox").innerHTML = `<img src="${q.visual}" alt="Question Image">`;
  } else {
    document.getElementById("visualBox").innerHTML = `<div class="visual">${q.visual}</div>`;
  }

  let box = document.getElementById("optionsBox");
  box.innerHTML = "";

  q.options.forEach(opt => {
    let btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(btn, opt, q);
    box.appendChild(btn);
  });
}

function checkAnswer(selectedBtn, selectedValue, qObj) {
  if (selectedValue === qObj.answer) {
    clearInterval(interval);
    selectedBtn.classList.add("correct");
    playAudio(true);
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("feedback").innerText = "🎉 Correct! " + qObj.explain;
    document.getElementById("feedback").style.color = "#047857";
    disableOptions();
    document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    attemptsLeft--;
    selectedBtn.classList.add("wrong");
    selectedBtn.disabled = true;
    playAudio(false);

    if (attemptsLeft > 0) {
      document.getElementById("feedback").innerText = "💡 Hint: " + qObj.hint;
      document.getElementById("feedback").style.color = "#1f4e79";
    } else {
      clearInterval(interval);
      disableOptions();
      document.getElementById("feedback").innerText = "Unsuccessful. Correct answer: " + qObj.answer + ". " + qObj.explain;
      document.getElementById("feedback").style.color = "#b91c1c";
      
      const buttons = document.querySelectorAll(".option");
      buttons.forEach(b => {
        if(b.innerText === qObj.answer) b.classList.add("correct");
      });
      
      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }
}

function disableOptions() {
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    clearInterval(interval);
    showResults();
  } else {
    loadQuestion();
  }
}

function showResults() {
  changeScreen("quizScreen", "resultScreen");

  let percentage = (score / questions.length) * 100;
  let msg = "";

  if (percentage >= 75) {
    msg = "Good job";
  } else if (percentage >= 40) {
    msg = "Review this chapter and try again";
  } else {
    msg = "Let’s practise more";
  }

  document.getElementById("resultMessage").innerText = msg;
  document.getElementById("finalScore").innerText = `Final Score: ${score} / ${questions.length} (${percentage}%)`;
}

function restartQuiz() {
  changeScreen("resultScreen", "introScreen");
}

init();
</script>

</body>
</html>
