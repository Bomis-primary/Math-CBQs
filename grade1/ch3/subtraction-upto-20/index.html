<script>

let questions = [
{
q:"A baker had 19 cupcakes. He gave away 4. How many are left?",
visual:"🧁 19 − 4",
options:["15","14","16","13"],
answer:0,
hint:"Take away 4 from 19 step by step.",
explanation:"19 − 4 = 15"
},
{
q:"Riya is at 15 on a number line. She moves 3 steps back. Where does she land?",
visual:"assets/number-line.png",
options:["12","13","11","14"],
answer:0,
hint:"Start at 15 and move backward.",
explanation:"15 − 3 = 12"
},
{
q:"A bus had 18 children. 6 got down. How many remain?",
visual:"🚌 18 − 6",
options:["12","11","13","10"],
answer:0,
hint:"Remove 6 from 18.",
explanation:"18 − 6 = 12"
},
{
q:"Arya had 7 pencils. She gave all away. How many are left?",
visual:"✏️ 7 − 7",
options:["0","1","7","2"],
answer:0,
hint:"When you take all away, nothing remains.",
explanation:"7 − 7 = 0"
},
{
q:"A shop has 16 apples. 5 are sold. How many remain?",
visual:"🍎 16 − 5",
options:["11","10","12","9"],
answer:0,
hint:"Start from 16 and take away 5.",
explanation:"16 − 5 = 11"
},
{
q:"There were 14 birds on a tree. 3 flew away. How many remain?",
visual:"🐦 14 − 3",
options:["11","10","12","9"],
answer:0,
hint:"Subtract 3 from 14.",
explanation:"14 − 3 = 11"
},
{
q:"Rohan had 20 balloons. 8 burst. How many remain?",
visual:"🎈 20 − 8",
options:["12","11","13","10"],
answer:0,
hint:"Take away 8 from 20.",
explanation:"20 − 8 = 12"
},
{
q:"A basket had 12 oranges. 2 were eaten. How many left?",
visual:"🍊 12 − 2",
options:["10","9","11","8"],
answer:0,
hint:"Subtract 2 from 12.",
explanation:"12 − 2 = 10"
},
{
q:"Meera had 17 stickers. She gave 5 away. How many remain?",
visual:"⭐ 17 − 5",
options:["12","11","13","10"],
answer:0,
hint:"Take away 5 from 17.",
explanation:"17 − 5 = 12"
},
{
q:"A bag had 13 chocolates. 4 were eaten. How many left?",
visual:"🍫 13 − 4",
options:["9","8","10","7"],
answer:0,
hint:"Subtract 4 from 13.",
explanation:"13 − 4 = 9"
},
{
q:"A shopkeeper had 15 pens. He sold 3. How many remain?",
visual:"🖊️ 15 − 3",
options:["12","11","13","10"],
answer:0,
hint:"Take away 3 from 15.",
explanation:"15 − 3 = 12"
},
{
q:"There were 11 ducks in a pond. 2 left. How many remain?",
visual:"🦆 11 − 2",
options:["9","8","10","7"],
answer:0,
hint:"Subtract 2 from 11.",
explanation:"11 − 2 = 9"
}
];

// ---------------- SAFE RANDOMIZATION ----------------
let order=[];
let i=0, score=0, answered=false;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function start(){
order = shuffle([...questions]); // shuffle questions safely
i=0;
score=0;
load();
}

function load(){

answered=false;
document.getElementById("nextBtn").style.display="none";

let q = order[i];

// visual handling (image or emoji)
if(q.visual.includes("assets/")){
document.getElementById("visualBox").innerHTML =
`<img src="${q.visual}" style="max-width:100%;border-radius:10px">`;
}else{
document.getElementById("visualBox").innerText = q.visual;
}

document.getElementById("questionText").innerText = q.q;

// shuffle options safely
let opt = q.options.map(v=>v);
opt = shuffle(opt);

let correctValue = q.options[q.answer];

document.getElementById("qNo").innerText=i+1;
document.getElementById("score").innerText=score;

document.getElementById("feedback").innerText="";

let box=document.getElementById("optionsBox");
box.innerHTML="";

opt.forEach(v=>{
let b=document.createElement("button");
b.className="option";
b.innerText=v;

b.onclick=()=>{
if(answered)return;

if(v===correctValue){
b.classList.add("correct");
score++;
answered=true;
document.getElementById("feedback").innerText="Correct ✔";
document.getElementById("nextBtn").style.display="inline-block";
}else{
b.classList.add("wrong");
document.getElementById("feedback").innerText="Hint: "+q.hint;
}
};

box.appendChild(b);
});
}

function nextQuestion(){
i++;
if(i>=order.length){
document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultScreen").classList.add("active");
document.getElementById("resultMessage").innerText="Good Job!";
document.getElementById("finalScore").innerText="Score: "+score+"/"+order.length;
}else{
load();
}
}

function restartQuiz(){
location.reload();
}

</script>
