<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CBQ Master Engine v2 - Subtraction</title>

<style>
body{margin:0;font-family:Arial;background:#f3f8ff}
.screen{display:none;min-height:100vh;align-items:center;justify-content:center}
.screen.active{display:flex}
#logoScreen{background:#fff}
.logo{width:70%;max-width:420px}

.card{background:#fff;padding:20px;border-radius:18px;max-width:900px;width:95%;box-shadow:0 8px 20px rgba(0,0,0,0.15)}

.topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.badge{background:#e0f2fe;padding:10px;border-radius:12px;font-weight:bold;text-align:center}

.question{font-size:22px;font-weight:bold;margin:15px 0}
.visual{text-align:center}
.visual img{max-width:100%;border-radius:12px;margin-bottom:10px}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{padding:14px;border-radius:14px;border:2px solid #1f4e79;background:#fff;font-size:18px;font-weight:bold;cursor:pointer}

.option.correct{background:#d1fae5}
.option.wrong{background:#fee2e2}

.feedback{min-height:40px;margin-top:10px;font-weight:bold;text-align:center}

.btn{margin-top:12px;padding:12px 20px;background:#1f4e79;color:#fff;border:none;border-radius:12px;font-size:18px}

#nextBtn{display:none}

.result{text-align:center}

@media(max-width:700px){
.options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" class="logo"/>
</div>

<!-- GAME -->
<div id="game" class="screen">
<div class="card">

<div class="topbar">
<div class="badge">Q <span id="qno"></span></div>
<div class="badge">Score <span id="score"></span></div>
<div class="badge">Time <span id="time"></span>s</div>
<div class="badge">CBQ v2</div>
</div>

<div class="visual">
  <img id="visualImg" src="" />
</div>

<div id="question" class="question"></div>

<div id="options" class="options"></div>

<div id="feedback" class="feedback"></div>

<button id="nextBtn" class="btn" onclick="nextQ()">Next</button>

</div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
<div class="card result">
<h1 id="msg"></h1>
<p id="final"></p>
<button class="btn" onclick="restart()">Play Again</button>
</div>
</div>

<script>

setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("game").classList.add("active");
start();
},5000);

// 🔥 CBQ QUESTION BANK (FULL APPLICATION BASED)

let bank = [
{
type:"numberline",
q:"Riya stands at 15 on a number line. She takes 3 equal backward jumps. Where does she land?",
img:"assets/number-line.png",
answer:12,
options:[14,13,12,11]
},
{
type:"case",
q:"A shopkeeper had 19 stickers. 4 were damaged and removed. How many usable stickers remain?",
img:"",
answer:15,
options:[14,15,16,13]
},
{
type:"reason",
q:"Why does subtracting zero not change a number?",
img:"",
answer:1,
options:[
"It becomes zero",
"It keeps value same",
"It increases value",
"It doubles"
]
},
{
type:"error",
q:"A student says 17 − 9 = 7. What is correct?",
img:"",
answer:1,
options:[7,8,9,6]
},
{
type:"data",
q:"Books read: A=5, B=8, C=6. Which student read most?",
img:"",
answer:1,
options:["A","B","C","A & C"]
},
{
type:"case",
q:"A bus had 18 children. 6 got down. How many are left inside?",
img:"",
answer:12,
options:[11,12,13,14]
},
{
type:"reason",
q:"What is the predecessor of a number?",
img:"",
answer:0,
options:[
"The number before it",
"The number after it",
"Double of it",
"Zero"
]
},
{
type:"odd",
q:"Which number does NOT belong?",
img:"",
answer:3,
options:[14,16,18,19]
},
{
type:"case",
q:"Ravi had 20 chocolates. He gave 7 to his friend. How many remain?",
img:"",
answer:13,
options:[11,12,13,14]
},
{
type:"data",
q:"Which day had least sales? Mon=12, Tue=15, Wed=9",
img:"",
answer:2,
options:["Mon","Tue","Wed","All same"]
}
];

let order=[],i=0,score=0,answered=false;

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function start(){
order = shuffle([...bank]); // 🔥 RANDOM QUESTIONS EVERY START
i=0;score=0;
load();
}

function load(){

answered=false;
document.getElementById("nextBtn").style.display="none";

let q = order[i];

// visual
document.getElementById("visualImg").src = q.img || "";
document.getElementById("question").innerText = q.q;

// shuffle options
let opt = q.options.map(v=>v);
opt = shuffle(opt);

let correctValue = q.options[q.answer];

document.getElementById("qno").innerText=i+1;
document.getElementById("score").innerText=score;
document.getElementById("time").innerText=60;

let box=document.getElementById("options");
box.innerHTML="";

opt.forEach((v)=>{
let b=document.createElement("button");
b.className="option";
b.innerText=v;

b.onclick=()=>{
if(answered)return;

if(v===correctValue){
b.classList.add("correct");
score++;
answered=true;
document.getElementById("feedback").innerText="Correct ✔";
document.getElementById("nextBtn").style.display="block";
}else{
b.classList.add("wrong");
document.getElementById("feedback").innerText="Try again";
}
};

box.appendChild(b);
});
}

function nextQ(){
i++;
if(i>=order.length){
document.getElementById("game").classList.remove("active");
document.getElementById("result").classList.add("active");
document.getElementById("msg").innerText="Great Work!";
document.getElementById("final").innerText="Score: "+score+"/"+order.length;
}else{
load();
}
}

function restart(){
location.reload();
}

</script>

</body>
</html>
