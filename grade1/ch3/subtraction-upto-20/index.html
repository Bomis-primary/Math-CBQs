<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ Interactive - Subtraction up to 20</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f8ff;color:#1f2937}
.screen{display:none;min-height:100vh;padding:16px}
.screen.active{display:flex;align-items:center;justify-content:center}
#logoScreen{background:#fff}
.logo{max-width:420px;width:80%}

.card{
  width:100%;
  max-width:880px;
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:130px;
}

.visual{font-size:54px;margin-bottom:8px;line-height:1.2}
.visual img{max-width:100%;border-radius:12px}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:72px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  border:2px solid #1f4e79;
  background:#fff;
  border-radius:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.option.correct{background:#d1fae5;border-color:#047857}
.option.wrong{background:#fee2e2;border-color:#b91c1c}

.feedback{
  min-height:48px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{display:none}

@media(max-width:700px){
  .options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGO SCREEN -->
<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" class="logo">
</div>

<!-- GAME SCREEN -->
<div id="quizScreen" class="screen">
  <div class="card">

    <div class="topbar">
      <div class="badge">Q <span id="qNo">1</span></div>
      <div class="badge">Score <span id="score">0</span></div>
      <div class="badge">Time <span id="timer">60</span>s</div>
      <div class="badge">Subtraction up to 20</div>
    </div>

    <div class="visual-box" id="visualBox"></div>

    <div class="question" id="questionText"></div>

    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedback"></div>

    <div style="text-align:center">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

  </div>
</div>

<!-- RESULT -->
<div id="resultScreen" class="screen">
  <div class="card" style="text-align:center">
    <h1 id="resultMessage"></h1>
    <p id="finalScore"></p>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<script>

/* ---------------- QUESTIONS ---------------- */

const questions = [
{
q:"A baker baked 19 cupcakes. He has 4 left. How many did he sell?",
visual:"🧁 19 − 4",
options:["15","14","16","13"],
answer:"15",
hint:"Think 19 take away 4",
},
{
q:"Riya starts at 15 on a number line and moves back 3 steps. Where does she land?",
visual:"assets/number-line.png",
options:["12","13","14","11"],
answer:"12",
hint:"Move backward step by step",
},
{
q:"Arya had 7 pencils. She gave all away. How many left?",
visual:"✏️ 7 − 7",
options:["0","1","7","2"],
answer:"0",
hint:"All gone means zero",
},
{
q:"A bus has 18 children. 6 get down. How many remain?",
visual:"🚌 18 − 6",
options:["12","11","13","10"],
answer:"12",
hint:"Subtract carefully",
},
{
q:"A shopkeeper has 19 kites. He sells 15. How many remain?",
visual:"🪁 19 − 15",
options:["4","5","6","3"],
answer:"4",
hint:"Take away 15 from 19",
},
{
q:"A student says 17 − 9 = 7. What should be the correct answer?",
visual:"17 − 9",
options:["6","7","8","9"],
answer:"8",
hint:"Use number line",
},
];

/* ---------------- ENGINE ---------------- */

let current=0;
let score=0;
let timer=60;
let interval;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function start(){
shuffle(questions);
loadQuestion();
}

function startTimer(){
clearInterval(interval);
timer=60;
document.getElementById("timer").innerText=timer;

interval=setInterval(()=>{
timer--;
document.getElementById("timer").innerText=timer;

if(timer<=0){
clearInterval(interval);
nextQuestion();
}
},1000);
}

function loadQuestion(){

startTimer();

let q=questions[current];

document.getElementById("qNo").innerText=current+1;
document.getElementById("score").innerText=score;

document.getElementById("feedback").innerText="";
document.getElementById("nextBtn").style.display="none";

document.getElementById("questionText").innerText=q.q;

if(q.visual.includes("assets/")){
document.getElementById("visualBox").innerHTML =
`<img src="${q.visual}">`;
}else{
document.getElementById("visualBox").innerHTML =
`<div class="visual">${q.visual}</div>`;
}

let options = shuffle([...q.options]);

let box=document.getElementById("optionsBox");
box.innerHTML="";

options.forEach(opt=>{
let btn=document.createElement("button");
btn.className="option";
btn.innerText=opt;

btn.onclick=()=>{

if(opt===q.answer){
btn.classList.add("correct");
score++;
document.getElementById("feedback").innerText="Correct!";
document.getElementById("nextBtn").style.display="inline-block";
clearInterval(interval);
}else{
btn.classList.add("wrong");
document.getElementById("feedback").innerText=q.hint;
}
};

box.appendChild(btn);
});
}

function nextQuestion(){
current++;

if(current>=questions.length){
document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultScreen").classList.add("active");

document.getElementById("resultMessage").innerText="Good Job!";
document.getElementById("finalScore").innerText="Score: "+score+"/"+questions.length;
}else{
loadQuestion();
}
}

function restartQuiz(){
location.reload();
}

setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");
start();
},5000);

</script>

</body>
</html>
