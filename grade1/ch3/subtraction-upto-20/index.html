<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ Interactive - Subtraction up to 20</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f8ff;color:#1f2937}
.screen{display:none;min-height:100vh;padding:16px}
.screen.active{display:flex;align-items:center;justify-content:center}
#logoScreen{background:#fff}
.logo{max-width:420px;width:80%}

.card{
  width:100%;
  max-width:880px;
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:130px;
}

.visual{font-size:54px;margin-bottom:8px;line-height:1.2}
.visual img{max-width:200px; max-height:120px; object-fit:contain; border-radius:12px}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(220px,1fr));
  gap:14px;
}

.option{
  width:100%;
  min-height:72px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  border:2px solid #1f4e79;
  background:#fff;
  border-radius:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.option.correct{background:#d1fae5;border-color:#047857;color:#047857}
.option.wrong{background:#fee2e2;border-color:#b91c1c;color:#b91c1c}
.option:disabled{cursor:not-allowed;opacity:0.7}

.feedback{
  min-height:48px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{display:none}

@media(max-width:700px){
  .options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<audio id="audioCorrect" src="grade1/ch3/subtraction-upto-20/assets/claps.mp3" preload="auto"></audio>
<audio id="audioWrong" src="grade1/ch3/subtraction-upto-20/assets/wrong.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen active">
  <img src="grade1/ch3/subtraction-upto-20/assets/logo.png" class="logo">
</div>

<div id="introScreen" class="screen">
  <div class="card" style="text-align:center">
    <h2>Subtraction up to 20</h2>
    <p>Test your understanding through real-life scenarios, challenges, and puzzles!</p>
    <button class="primary" onclick="startQuiz()">Start Challenge</button>
  </div>
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge"><span id="qTypeBadge">Flow</span>: <span id="qNo">1</span>/10</div>
      <div class="badge">Score <span id="score">0</span></div>
      <div class="badge">Time <span id="timer">60</span>s</div>
      <div class="badge">Sub up to 20</div>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div style="text-align:center; margin-top: 15px;">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card" style="text-align:center">
    <h1 id="resultMessage"></h1>
    <p id="finalScore"></p>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<script>
/* ---------------- COMPLIANT QUESTIONS COLLECTION ---------------- */
// 10 questions structured as: Intro/Flow (1-7) & Final Challenge (8-10)
const questions = [
  {
    type: "Flow", // Scenario-Based MCQ [cite: 54]
    q: "A baker baked 19 cupcakes. He has 4 left. How many did he sell?",
    visual: "🧁 19 − 4",
    options: ["15", "14", "16", "13"],
    answer: "15",
    hint: "Count backward 4 steps from 19.",
    explain: "19 minus 4 leaves 15 cupcakes sold."
  },
  {
    type: "Flow", // Picture-Based/Number-Line MCQ [cite: 56]
    q: "Riya starts at 15 on a number line and moves back 3 steps. Where does she land?",
    visual: "grade1/ch3/subtraction-upto-20/assets/number-line.png",
    options: ["12", "13", "14", "11"],
    answer: "12",
    hint: "Move back 3 single steps from 15.",
    explain: "Moving backward 3 steps: 14, 13, then 12."
  },
  {
    type: "Flow", // Problem Solving [cite: 25]
    q: "Arya had 7 pencils. She gave all of them away to her friends. How many are left with her?",
    visual: "✏️ 7 − 7",
    options: ["0", "1", "7", "2"],
    answer: "0",
    hint: "If you give away everything you have, nothing remains.",
    explain: "Subtracting a number from itself always results in 0."
  },
  {
    type: "Flow", // Scenario-Based MCQ [cite: 54]
    q: "A school bus has 18 children inside. 6 children get down at the first stop. How many remain?",
    visual: "🚌 18 − 6",
    options: ["12", "11", "13", "10"],
    answer: "12",
    hint: "Subtract 6 from the 8 ones in 18.",
    explain: "18 − 6 = 12 children remain."
  },
  {
    type: "Flow", // Data-Based MCQ [cite: 58]
    q: "A shopkeeper has 19 kites. He sells 15 of them. How many kites are left in his shop?",
    visual: "🪁 19 − 15",
    options: ["4", "5", "6", "3"],
    answer: "4",
    hint: "Take away 15 from 19.",
    explain: "19 minus 15 leaves exactly 4 kites."
  },
  {
    type: "Flow", // Error Detection MCQ [cite: 61]
    q: "A student writes: 17 − 9 = 7. What is the correct answer to this problem?",
    visual: "❌ 17 − 9 = ?",
    options: ["8", "6", "7", "9"],
    answer: "8",
    hint: "Think: 9 + what number makes 17?",
    explain: "The correct calculation is 17 − 9 = 8."
  },
  {
    type: "Flow", // Odd One Out MCQ [cite: 62]
    q: "Which of the following subtraction pairs does NOT match the value of 5?",
    visual: "🔍 Find the odd pair",
    options: ["12 − 6", "10 − 5", "15 − 10", "9 − 4"],
    answer: "12 − 6",
    hint: "Calculate each option. Three of them equal 5.",
    explain: "12 − 6 equals 6, while all other options equal 5."
  },
  {
    type: "Challenge", // Final Challenge 1: Assertion-Reason Simplified [cite: 51, 60]
    q: "Assertion: 14 − 0 = 14. Reason: Subtracting zero means we take away nothing.",
    visual: "🧠 Reasoning",
    options: [
      "Both statement and reason are true and clear", 
      "The statement is true but reason is completely false", 
      "The statement is false but reason is true", 
      "Both statement and reason are false"
    ],
    answer: "Both statement and reason are true and clear",
    hint: "Think about what happens when you take away nothing from a group.",
    explain: "Subtracting 0 keeps the identity unchanged because nothing was removed."
  },
  {
    type: "Challenge", // Final Challenge 2: Two-Step Case Problem [cite: 51, 59]
    q: "Kabir had 20 marbles. He lost 5 in the morning and gave 3 to his sister in the afternoon. How many does he have now?",
    visual: "🔮 20 − 5 − 3",
    options: ["12", "15", "17", "8"],
    answer: "12",
    hint: "First do 20 − 5. Then subtract 3 from that answer.",
    explain: "20 − 5 = 15, and 15 − 3 = 12."
  },
  {
    type: "Challenge", // Final Challenge 3: Advanced Scenario Application [cite: 51]
    q: "A team needs 18 points to win a game. They currently have 9 points. How many more points do they need?",
    visual: "🏆 9 + ? = 18",
    options: ["9", "8", "10", "11"],
    answer: "9",
    hint: "Find the difference between the target points and current points.",
    explain: "18 minus 9 means they need 9 more points to win."
  }
];

/* ---------------- CONTROLLER ENGINE ---------------- */

let current = 0;
let score = 0;
let timer = 60;
let interval;
let attemptsLeft = 2; // Track strict 1-retry system [cite: 87]

function init() {
  // Brand Logo display requirement: Exactly 5 seconds [cite: 164]
  setTimeout(() => {
    document.getElementById("logoScreen").classList.remove("active");
    document.getElementById("introScreen").classList.add("active");
  }, 5000);
}

function startQuiz() {
  document.getElementById("introScreen").classList.remove("active");
  document.getElementById("quizScreen").classList.add("active");
  loadQuestion();
}

function startTimer() {
  clearInterval(interval);
  timer = 60; // Grades 1–3 require 60 seconds minimum [cite: 84]
  document.getElementById("timer").innerText = timer;

  interval = setInterval(() => {
    timer--;
    document.getElementById("timer").innerText = timer;

    if (timer <= 0) {
      clearInterval(interval);
      playAudio(false);
      disableOptions();
      document.getElementById("feedback").innerText = "Time's up! " + questions[current].explain;
      document.getElementById("feedback").style.color = "#b91c1c";
      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }, 1000);
}

function playAudio(isCorrect) {
  const correctSound = document.getElementById("audioCorrect");
  const wrongSound = document.getElementById("audioWrong");
  if(isCorrect) {
    correctSound.currentTime = 0;
    correctSound.play().catch(e => console.log("Audio play blocked"));
  } else {
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log("Audio play blocked"));
  }
}

function loadQuestion() {
  startTimer();
  attemptsLeft = 2; // Reset total attempts for this question [cite: 87]
  
  let q = questions[current];

  document.getElementById("qNo").innerText = current + 1;
  document.getElementById("qTypeBadge").innerText = q.type;
  document.getElementById("score").innerText = score;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("questionText").innerText = q.q;

  // Render contextual assets securely
  if (q.visual.includes("assets/")) {
    document.getElementById("visualBox").innerHTML = `<img src="${q.visual}" alt="Question Visual">`;
  } else {
    document.getElementById("visualBox").innerHTML = `<div class="visual">${q.visual}</div>`;
  }

  // Generate options safely
  let box = document.getElementById("optionsBox");
  box.innerHTML = "";

  q.options.forEach(opt => {
    let btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(btn, opt, q);
    box.appendChild(btn);
  });
}

function checkAnswer(selectedBtn, selectedValue, qObj) {
  if (selectedValue === qObj.answer) {
    // CORRECT ANSWER
    clearInterval(interval);
    selectedBtn.classList.add("correct");
    playAudio(true);
    score++;
    document.getElementById("score").innerText = score;
    document.getElementById("feedback").innerText = "🎉 Correct! " + qObj.explain;
    document.getElementById("feedback").style.color = "#047857";
    disableOptions();
    document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    // WRONG ANSWER
    attemptsLeft--;
    selectedBtn.classList.add("wrong");
    selectedBtn.disabled = true; // Block clicking this choice again
    playAudio(false);

    if (attemptsLeft > 0) {
      // First wrong attempt: Show hint [cite: 88]
      document.getElementById("feedback").innerText = "💡 Hint: " + qObj.hint;
      document.getElementById("feedback").style.color = "#1f4e79";
    } else {
      // Second wrong attempt: End round, show explanation [cite: 89]
      clearInterval(interval);
      disableOptions();
      document.getElementById("feedback").innerText = "Unsuccessful. Correct answer: " + qObj.answer + ". " + qObj.explain;
      document.getElementById("feedback").style.color = "#b91c1c";
      
      // Visually reveal the correct key
      const buttons = document.querySelectorAll(".option");
      buttons.forEach(b => {
        if(b.innerText === qObj.answer) b.classList.add("correct");
      });
      
      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }
}

function disableOptions() {
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    clearInterval(interval);
    showResults();
  } else {
    loadQuestion();
  }
}

function showResults() {
  document.getElementById("quizScreen").classList.remove("active");
  document.getElementById("resultScreen").classList.add("active");

  let percentage = (score / questions.length) * 100;
  let msg = "";

  // Strict score tier conditional assignment [cite: 122]
  if (percentage >= 75) {
    msg = "Good job"; [cite: 123]
  } else if (percentage >= 40) {
    msg = "Review this chapter and try again"; [cite: 124]
  } else {
    msg = "Let’s practise more"; [cite: 125]
  }

  document.getElementById("resultMessage").innerText = msg;
  document.getElementById("finalScore").innerText = `Final Score: ${score} / ${questions.length} (${percentage}%)`;
}

function restartQuiz() {
  current = 0;
  score = 0;
  document.getElementById("resultScreen").classList.remove("active");
  document.getElementById("introScreen").classList.add("active");
}

window.onload = init;
</script>

</body>
</html>
