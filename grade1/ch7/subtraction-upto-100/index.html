<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Subtraction up to 100</title>
    <style>
        :root {
            --primary: #f76707;
            --secondary: #4dadf7;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fff4e6;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 440px; border: 5px solid #ffa94d; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #ffe8cc; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Simple Layout Typography */
        h2 { font-size: 1.7rem; text-align: center; margin-bottom: 15px; color: #d9480f; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.8rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .q-context { background: #f1f3f5; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.35rem; text-align: center; font-weight: bold; color: #102a43; line-height: 1.4; border: 2px dashed #ffd8a8; }
        
        /* Diagram Container for Bundles */
        .diagram-container { display: flex; justify-content: center; gap: 20px; margin: 15px 0; padding: 5px; }
        .bundle-item { display: flex; flex-direction: column; align-items: center; font-weight: bold; }
        .bundle-art { font-size: 3rem; line-height: 1; margin-bottom: 2px; }
        .bundle-label { font-size: 1.2rem; color: #d9480f; background: #fff4e6; padding: 2px 8px; border-radius: 8px; border: 1px solid #ffd8a8; }

        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 15px; text-align: center; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.15rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e3fafc; color: #0b7285; border: 2px solid #c5f6fa; }

        /* General UI Actions */
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #c85907; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #c85907; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo">
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>➖ Taking Away!</h2>
        <div class="visual-emoji-display">🍬🎈🧸</div>
        <p style="margin-bottom: 25px; font-size: 1.35rem; color: #495057; font-weight: bold;">
            Subtraction up to 100 Interactive Activity ⭐
        </p>
        <button class="btn-action" onclick="startInteractive()">START! 🚀</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Finished!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆⭐👑</div>
        <p id="result-text" style="font-size: 1.35rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">RESTART 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        {
            emoji: "🍬",
            context: "Diya has 50 candies. She gives 20 to her friend. How many candies are left?",
            options: ["20 candies 🍬", "30 candies 🍬", "40 candies 🍬", "50 candies 🍬"],
            answer: 1,
            hint: "Count backward by tens from 50 two times! 🔢",
            exp: "50 − 20 = 30 candies left! 🎉"
        },
        {
            emoji: "🎈",
            context: "A shop has 80 balloons. 30 balloons are sold. How many remain?",
            options: ["40 balloons 🎈", "50 balloons 🎈", "60 balloons 🎈", "70 balloons 🎈"],
            answer: 1,
            hint: "Take 3 tens away from 8 tens! 🔢",
            exp: "80 − 30 = 50 balloons left! ✨"
        },
        {
            emoji: "🔮",
            context: "Which number should be subtracted from 60 to get 40?",
            options: ["10 🔮", "20 🔮", "30 🔮", "40 🔮"],
            answer: 1,
            hint: "6 tens minus how many tens leaves 4 tens? 🧱",
            exp: "60 − 20 = 40! ⭐"
        },
        {
            emoji: "🟢",
            context: "Sam has 45 marbles. He loses 15 marbles. How many are left?",
            options: ["25 marbles 🟢", "30 marbles 🟢", "35 marbles 🟢", "40 marbles 🟢"],
            answer: 1,
            hint: "Subtract the ones place first: 5 − 5 = 0. Then do the tens! 🔢",
            exp: "45 − 15 leaves exactly 30 marbles! 🌸"
        },
        {
            emoji: "📝",
            context: "Meera solved: 34 − 12 = 22. Is she correct?",
            options: ["Yes ✅", "No ❌", "Maybe 🤷", "Cannot say ❓"],
            answer: 0,
            hint: "Check the math: 4 − 2 in the ones place and 3 − 1 in the tens place!",
            exp: "34 − 12 = 22 is correct!"
        },
        {
            emoji: "🪵",
            isDiagram: true,
            context: "Kabir has a box with 4 bundles of sticks. Each bundle has exactly 10 sticks (40 sticks in total). He unties one bundle and gives 5 single sticks to his sister. How many sticks does Kabir have left now?",
            options: ["30 sticks 🪵", "35 sticks 🪵", "25 sticks 🪵", "45 sticks 🪵"],
            answer: 1,
            hint: "If he starts with 40 sticks and gives away 5, count backward by ones from 40! 🔢",
            exp: "40 minus 5 leaves 3 tens and 5 ones, which equals 35 sticks."
        },
        {
            emoji: "🗣️",
            context: "Rohit and Sana are looking at the problem 85 − 30. Rohit says, 'The answer will have 5 in the ones place.' Sana says, 'The answer will have 5 in the tens place.' Who is making the correct claim?",
            options: ["Only Rohit is correct 🛑", "Only Sana is correct 🛑", "Both Rohit and Sana are correct", "Neither is correct ❌"],
            answer: 2,
            hint: "Subtract 0 ones from 5 ones (5 − 0), then subtract 3 tens from 8 tens (8 − 3). 👀",
            exp: "85 − 30 = 55. The answer has a 5 in both the tens place and the ones place, meaning both statements are correct!"
        },
        {
            emoji: "🌸",
            context: "A flower garland has 75 beads in total. Some beads break and fall off. Now, there are only 50 beads left on the garland. How many beads broke off?",
            options: ["20 beads 🌸", "25 beads 🌸", "30 beads 🌸", "35 beads 🌸"],
            answer: 1,
            hint: "Find the difference between the starting number of beads (75) and the leftover beads (50). 🔍",
            exp: "Subtracting 50 from 75 (75 − 50) tells us that exactly 25 beads broke off."
        },
        {
            emoji: "🔍",
            context: "Which subtraction statement is incorrect?",
            options: ["52 − 20 = 32", "45 − 15 = 30", "63 − 21 = 42", "72 − 22 = 40"],
            answer: 3,
            hint: "Work out each answer. One equation does not match up correctly!",
            exp: "72 − 22 = 40 is incorrect! The correct answer is 50, not 40."
        },
        {
            emoji: "✏️",
            context: "A boy has 72 pencils. He gives away 30 pencils. How many are left?",
            options: ["32 pencils ✏️", "42 pencils ✏️", "52 pencils ✏️", "62 pencils ✏️"],
            answer: 1,
            hint: "Subtract 0 from 2 ones, and 3 tens from 7 tens! 🎒",
            exp: "72 − 30 = 42 pencils! 🎈"
        },
        {
            emoji: "🍎",
            context: "Which subtraction sum needs borrowing from the tens place?",
            options: ["54 − 12 🍎", "63 − 21 🍎", "72 − 35 🍎", "80 − 20 🍎"],
            answer: 2,
            hint: "Look for a sum where the top ones digit is smaller than the bottom ones digit! 👀",
            exp: "72 − 35 needs borrowing because 2 is smaller than 5! 🌟"
        },
        {
            emoji: "🍏",
            context: "A basket has 90 apples. 45 are taken away. How many remain?",
            options: ["35 apples 🍏", "45 apples 🍏", "55 apples 🍏", "65 apples 🍏"],
            answer: 1,
            hint: "Borrow 1 ten to make the ones place 10 − 5! 🔢",
            exp: "90 − 45 leaves exactly 45 apples! 🏆"
        },
        {
            emoji: "⚖️",
            context: "Which is smaller:<br>(65 − 20) or (70 − 25)?",
            options: ["65 − 20 is smaller ⚖️", "70 − 25 is smaller ⚖️", "Both are equal ⚖️", "Cannot say ⚖️"],
            answer: 2,
            hint: "Solve both sums! They both give the same number answer. 🧩",
            exp: "Both equal 45, so they are perfectly equal! 🎨"
        },
        {
            emoji: "🍫",
            context: "A child has 60 chocolates. He eats 25. How many are left?",
            options: ["35 chocolates 🍫", "30 chocolates 🍫", "40 chocolates 🍫", "45 chocolates 🍫"],
            answer: 0,
            hint: "Borrow 1 ten from 6 to change 0 into 10! 🔢",
            exp: "60 − 25 = 35 chocolates left! 🍩"
        },
        {
            emoji: "🧸",
            context: "A shop had 100 toys. 30 were sold. How many are left?",
            options: ["60 toys 🧸", "70 toys 🧸", "80 toys 🧸", "90 toys 🧸"],
            answer: 1,
            hint: "Count backward by tens from 100 three times! 🔢",
            exp: "100 − 30 leaves 70 toys! ✔️"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});
        } else {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        const emojiContainer = document.getElementById('q-emoji');
        
        if (qData.isDiagram) {
            emojiContainer.innerHTML = `
                <div class="diagram-container">
                    <div class="bundle-item"><span class="bundle-art">🪵</span><span class="bundle-label">10</span></div>
                    <div class="bundle-item"><span class="bundle-art">🪵</span><span class="bundle-label">10</span></div>
                    <div class="bundle-item"><span class="bundle-art">🪵</span><span class="bundle-label">10</span></div>
                    <div class="bundle-item"><span class="bundle-art">🪵</span><span class="bundle-label">10</span></div>
                </div>`;
        } else {
            emojiContainer.innerText = qData.emoji;
        }
        
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            // Only award a star if answered correctly on the FIRST attempt
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 Perfect! You earned a star! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Got it! Let's try the next one on the first go. ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                showFeedback('hint', `✨ Hint: ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Answer: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time's Up! ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerText = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You got ${score} / ${dataset.length} stars! ⭐`;
        
        if (finalPercent >= 75) {
            document.getElementById('result-title').innerText = "🎉 Excellent Work!";
            document.getElementById('result-emoji').innerText = "👑🏆🥇";
            msg += "\nOutstanding! You are a subtraction champion!";
        } else if (finalPercent >= 40) {
            document.getElementById('result-title').innerText = "📚 Keep Practising!";
            document.getElementById('result-emoji').innerText = "✏️📖✨";
            msg += "\nAn average performance! Please revise this chapter carefully and try again. 💪";
        } else {
            document.getElementById('result-title').innerText = "💪 Let's Try Again!";
            document.getElementById('result-emoji').innerText = "🧱🧩🎈";
            msg += "\nLet's practise more together to build up your math skills!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
