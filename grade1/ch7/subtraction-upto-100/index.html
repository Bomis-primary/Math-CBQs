<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBQ Interactive</title>

<style>
/* ===== BASE CHATGPT-STYLE UI ===== */

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

body{
  margin:0;
  background:#f7f7f8;
  color:#111827;
}

/* CENTER CONTAINER */
.wrapper{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:10px;
  flex-wrap:wrap;
}

.badge{
  background:#ffffff;
  border:1px solid #e5e7eb;
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
  color:#374151;
}

/* QUESTION CARD */
.card{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:22px;
}

/* QUESTION */
.question{
  font-size:20px;
  line-height:1.5;
  margin-bottom:16px;
  color:#111827;
}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:10px;
}

.option{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  transition:0.15s;
}

.option:hover{
  border-color:#9ca3af;
  background:#f3f4f6;
}

.option.correct{
  background:#ecfdf5;
  border-color:#10b981;
}

.option.wrong{
  background:#fef2f2;
  border-color:#ef4444;
}

/* FEEDBACK */
.feedback{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  color:#374151;
  min-height:20px;
}

/* NEXT BUTTON */
.next{
  margin-top:16px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
  cursor:pointer;
  display:none;
}

/* SPLASH */
.splash{
  position:fixed;
  inset:0;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:#6b7280;
}

/* RESPONSIVE */
@media(max-width:700px){
  .options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="splash" id="splash">Loading...</div>

<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <div class="badge">Question: <span id="qNo">1</span></div>
    <div class="badge">Score: <span id="score">0</span></div>
    <div class="badge">Time: <span id="timer">60</span>s</div>
  </div>

  <!-- QUESTION CARD -->
  <div class="card">

    <div class="question" id="questionText"></div>

    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedback"></div>

    <button class="next" id="nextBtn" onclick="nextQuestion()">Next</button>

  </div>

</div>

<script>

/* ================= QUESTIONS (UNCHANGED) ================= */

const questionPool = [
  {
    q:"Diya has 50 candies. She gives 20 to her friend. How many candies are left?",
    options:["20 candies","30 candies","40 candies","50 candies"],
    answer:1
  },
  {
    q:"A shop has 80 balloons. 30 balloons are sold. How many remain?",
    options:["40 balloons","50 balloons","60 balloons","70 balloons"],
    answer:1
  },
  {
    q:"Which number should be subtracted from 60 to get 40?",
    options:["10","20","30","40"],
    answer:1
  },
  {
    q:"Sam has 45 marbles. He loses 15 marbles. How many are left?",
    options:["25","30","35","40"],
    answer:1
  }
];

/* ================= ENGINE (UNCHANGED LOGIC) ================= */

let questions=[];
let current=0;
let score=0;
let answered=false;
let attempts=0;
let timer;
let timeLeft=60;

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function start(){
  questions = shuffle([...questionPool]);
  load();
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  timeLeft=60;

  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById("timer").innerText=timeLeft;

    if(timeLeft<=0){
      nextQuestion();
    }
  },1000);
}

function load(){

answered=false;
attempts=0;

let q=questions[current];

document.getElementById("qNo").innerText=current+1;
document.getElementById("score").innerText=score;
document.getElementById("feedback").innerText="";

document.getElementById("questionText").innerText=q.q;

let box=document.getElementById("optionsBox");
box.innerHTML="";

let shuffled=[...q.options].sort(()=>Math.random()-0.5);

shuffled.forEach(opt=>{

let btn=document.createElement("button");
btn.className="option";
btn.innerText=opt;

btn.onclick=()=>{

if(answered) return;

if(opt===q.options[q.answer]){
btn.classList.add("correct");
score++;
answered=true;
document.getElementById("feedback").innerText="Correct ✔";
document.getElementById("nextBtn").style.display="block";
clearInterval(timer);
}else{
btn.classList.add("wrong");
attempts++;
document.getElementById("feedback").innerText="Try again";

if(attempts>=2){
answered=true;
document.getElementById("nextBtn").style.display="block";
}
}
};

box.appendChild(btn);
});
}

function nextQuestion(){
current++;

if(current>=questions.length){
alert("Game Over! Score: "+score);
location.reload();
}else{
load();
startTimer();
}
}

/* START */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
start();
},1500);

</script>

</body>
</html>
