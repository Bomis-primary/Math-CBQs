<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Subtraction up to 100</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f8ff;
  color:#1f2937;
}

.screen{
  display:none;
  min-height:100vh;
  padding:16px;
}

.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen{
  background:white;
}

.logo{
  max-width:420px;
  width:80%;
}

.card{
  width:100%;
  max-width:880px;
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.15);
}

.topbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.badge,.sound-btn{
  background:#e0f2fe;
  color:#0f3f5f;
  padding:10px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
}

.sound-btn{
  border:none;
  cursor:pointer;
}

.visual-box{
  background:#fff7ed;
  border:2px solid #fdba74;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  text-align:center;
  min-height:130px;
}

.visual{
  font-size:54px;
  margin-bottom:8px;
  line-height:1.2;
}

.visual-text{
  font-size:19px;
  font-weight:bold;
  color:#7c2d12;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.35;
  margin:16px 0;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.option{
  width:100%;
  min-height:72px;
  padding:14px 16px;
  font-size:19px;
  font-weight:bold;
  line-height:1.3;
  border:2px solid #1f4e79;
  background:white;
  color:#111827;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:normal;
}

.option:hover{
  background:#eef6ff;
}

.option.correct{
  background:#d1fae5;
  border-color:#047857;
}

.option.wrong{
  background:#fee2e2;
  border-color:#b91c1c;
}

.feedback{
  min-height:34px;
  margin-top:14px;
  font-size:19px;
  font-weight:bold;
  text-align:center;
}

.controls{
  margin-top:14px;
  text-align:center;
}

.primary{
  background:#1f4e79;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px 28px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#nextBtn{
  display:none;
}

.result-title{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin-bottom:14px;
}

.result-score{
  font-size:23px;
  text-align:center;
  margin-bottom:20px;
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall 1.2s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:700px){
  .card{padding:15px}
  .topbar{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:58px;font-size:18px;padding:12px}
  .visual{font-size:46px}
  .visual-text{font-size:17px}
  .primary{width:100%}
  .badge,.sound-btn{font-size:14px}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{
q:"Diya has 50 candies. She gives 20 to her friend. How many candies are left?",
visual:"🍬 50 − 20",
visualText:"Take away 20 candies from 50 candies.",
options:["20","30","40","50"],
answer:1
},
{
q:"A shop has 80 balloons. 30 balloons are sold. How many remain?",
visual:"🎈 80 − 30",
visualText:"Subtract the sold balloons.",
options:["40","50","60","70"],
answer:1
},
{
q:"Which number should be subtracted from 60 to get 40?",
visual:"60 − ? = 40",
visualText:"Find the missing number.",
options:["10","20","30","40"],
answer:1
},
{
q:"Sam has 45 marbles. He loses 15 marbles. How many are left?",
visual:"🔵 45 − 15",
visualText:"Take away the marbles Sam lost.",
options:["25","30","35","40"],
answer:1
},
{
q:"Meera solved: 34 − 12 = 22. Is she correct?",
visual:"34 − 12 = 22",
visualText:"Check the subtraction statement.",
options:["Yes","No","Maybe","Cannot say"],
answer:0
},
{
q:"Subtract: 56 − 23",
visual:"56 − 23",
visualText:"Subtract ones, then tens.",
options:["33","34","35","36"],
answer:0
},
{
q:"A boy has 72 pencils. He gives away 30 pencils. How many are left?",
visual:"✏️ 72 − 30",
visualText:"Take away 30 pencils.",
options:["32","42","52","62"],
answer:1
},
{
q:"Subtract: 65 − 28",
visual:"65 − 28",
visualText:"This subtraction needs borrowing.",
options:["37","38","39","36"],
answer:0
},
{
q:"Which subtraction needs borrowing?",
visual:"Borrowing means the ones digit on top is smaller.",
visualText:"Look carefully at the ones place.",
options:["54 − 12","63 − 21","72 − 35","80 − 20"],
answer:2
},
{
q:"A basket has 90 apples. 45 are taken away. How many apples remain?",
visual:"🍎 90 − 45",
visualText:"Subtract the apples taken away.",
options:["35","45","55","65"],
answer:1
},
{
q:"Which is smaller?",
visual:"65 − 20  and  70 − 25",
visualText:"Solve both and compare.",
options:["65 − 20","70 − 25","Both equal","Cannot say"],
answer:2
},
{
q:"A child has 60 chocolates. He eats 25. How many are left?",
visual:"🍫 60 − 25",
visualText:"Subtract the chocolates eaten.",
options:["35","30","40","45"],
answer:0
}
];

let current=0,score=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  timeLeft=60;
  scoreBox.textContent=score;
  timerBox.textContent=timeLeft;
  loadQuestion();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  nextBtn.style.display="none";

  const item=questions[current];
  qNo.textContent=current+1;
  questionText.textContent=item.q;
  visualBox.innerHTML=`<div class="visual">${item.visual}</div><div class="visual-text">${item.visualText}</div>`;
  optionsBox.innerHTML="";

  item.options.forEach((option,index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=option;
    btn.onclick=()=>checkAnswer(btn,index);
    optionsBox.appendChild(btn);
  });
}

function checkAnswer(button,selected){
  if(answered)return;

  const correctIndex=questions[current].answer;

  if(selected===correctIndex){
    answered=true;
    score++;
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    playSound(correctSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Try again.";
      button.disabled=true;
    }else{
      answered=true;
      feedback.textContent="Incorrect. The correct answer is highlighted.";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  const correctIndex=questions[current].answer;
  document.querySelectorAll(".option")[correctIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(score/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again";
  }else{
    message="Let’s practise more";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").textContent="Your Score: "+score+" out of "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*0.8+0.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
