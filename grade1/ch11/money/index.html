<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Time</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef6ff;color:#1f2937}
.screen{display:none;min-height:100vh;padding:16px}
.screen.active{display:flex;align-items:center;justify-content:center}
#logoScreen{background:white}
.logo{max-width:420px;width:80%}
.card{width:100%;max-width:820px;background:white;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.topbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge,.sound-btn{background:#e0f2fe;color:#0f3f5f;padding:9px 12px;border-radius:12px;font-weight:bold;font-size:16px}
.sound-btn{border:none;cursor:pointer}
.visual-box{background:#fefce8;border:2px solid #facc15;border-radius:18px;padding:16px;margin-bottom:14px;text-align:center;min-height:150px}
.visual{font-size:68px;margin-bottom:8px}
.clock-face{width:135px;height:135px;border:8px solid #1f4e79;border-radius:50%;margin:0 auto 8px;position:relative;background:white}
.clock-face::before{content:"12";position:absolute;top:5px;left:50%;transform:translateX(-50%);font-weight:bold}
.clock-face::after{content:"6";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-weight:bold}
.num3{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:bold}
.num9{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-weight:bold}
.hand-hour{position:absolute;width:6px;height:38px;background:#111827;left:50%;top:50%;transform-origin:bottom center;border-radius:5px}
.hand-minute{position:absolute;width:4px;height:50px;background:#dc2626;left:50%;top:50%;transform-origin:bottom center;border-radius:5px}
.center-dot{position:absolute;width:12px;height:12px;background:#111827;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.question{font-size:23px;font-weight:bold;line-height:1.35;margin:14px 0}
.options{display:grid;gap:12px}
.option{font-size:19px;padding:15px;border:2px solid #1f4e79;background:white;color:#111827;border-radius:14px;cursor:pointer;text-align:left;min-height:56px}
.option.correct{background:#d1fae5;border-color:#047857}
.option.wrong{background:#fee2e2;border-color:#b91c1c}
.feedback{min-height:32px;margin-top:12px;font-size:18px;font-weight:bold}
.controls{margin-top:14px}
.primary{background:#1f4e79;color:white;border:none;border-radius:14px;padding:13px 22px;font-size:18px;font-weight:bold;cursor:pointer}
#nextBtn{display:none}
.result-title{font-size:32px;font-weight:bold;text-align:center;margin-bottom:14px}
.result-score{font-size:22px;text-align:center;margin-bottom:18px}
.confetti{position:fixed;width:10px;height:10px;top:-10px;animation:fall 1.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
@media(max-width:600px){
.card{padding:14px}
.question{font-size:20px}
.option{font-size:17px;padding:13px}
.visual{font-size:54px}
.clock-face{width:115px;height:115px}
.badge,.sound-btn{font-size:14px}
.primary{width:100%}
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Solutions Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions=[
{q:"Which of these activities usually takes the most time?",visual:"🍱",visualText:"Think about how long daily activities take.",options:["Blinking your eyes","Eating your lunch","Sneezing","Writing your name"],answer:1},
{q:"On an analog clock, the short hand points to the:",visual:"clock",visualText:"Short hand = hour hand",hourDeg:90,minuteDeg:0,options:["Minutes","Seconds","Hours","Days"],answer:2},
{q:"If the hour hand is on 3 and the minute hand is on 12, what time is it?",visual:"clock",visualText:"Look at the clock carefully.",hourDeg:90,minuteDeg:0,options:["12:03","3:00","3:12","6:00"],answer:1},
{q:"Which of these shows a digital clock time?",visual:"digital",visualText:"10:30",options:["A circle with numbers 1 to 12","A long hand and a short hand","10:30","A sun dial"],answer:2},
{q:"If today is Tuesday, what day was yesterday?",visual:"days",visualText:"Monday → Tuesday → Wednesday",options:["Wednesday","Monday","Sunday","Thursday"],answer:1},
{q:"If today is Friday, what day will it be tomorrow?",visual:"days",visualText:"Thursday → Friday → Saturday",options:["Saturday","Thursday","Sunday","Monday"],answer:0},
{q:"How many days are there in a full week?",visual:"calendar",visualText:"A week has seven days.",options:["5","6","7","12"],answer:2},
{q:"Which month comes immediately after June?",visual:"months",visualText:"May → June → July → August",options:["May","August","July","January"],answer:2},
{q:"Which activity do we usually do in the morning?",visual:"🌅",visualText:"Morning routine",options:["Going to sleep for the night","Seeing the stars","Brushing our teeth after waking up","Having dinner"],answer:2},
{q:"How many months are there in one year?",visual:"months",visualText:"January to December",options:["7","10","12","30"],answer:2},
{q:"Which day comes between Wednesday and Friday?",visual:"days",visualText:"Wednesday → ? → Friday",options:["Tuesday","Thursday","Saturday","Monday"],answer:1},
{q:"When both the long hand and the short hand are pointing at 12, the time is:",visual:"clock",visualText:"Both hands are on 12.",hourDeg:0,minuteDeg:0,options:["6:00","12:00","12:12","1:12"],answer:1}
];

let current=0,score=0,attempts=0,answered=false,timeLeft=60,timerInterval,muted=false;

const logoScreen=document.getElementById("logoScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");
const qNo=document.getElementById("qNo");
const scoreBox=document.getElementById("score");
const timerBox=document.getElementById("timer");
const visualBox=document.getElementById("visualBox");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
  logoScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
},5000);

function startQuiz(){
  current=0;
  score=0;
  timeLeft=60;
  scoreBox.textContent=score;
  timerBox.textContent=timeLeft;
  loadQuestion();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    timerBox.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  attempts=0;
  answered=false;
  feedback.textContent="";
  nextBtn.style.display="none";

  const item=questions[current];
  qNo.textContent=current+1;
  questionText.textContent=item.q;
  optionsBox.innerHTML="";
  renderVisual(item);

  item.options.forEach((option,index)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=option;
    btn.onclick=()=>checkAnswer(btn,index);
    optionsBox.appendChild(btn);
  });
}

function renderVisual(item){
  if(item.visual==="clock"){
    visualBox.innerHTML=`
      <div class="clock-face">
        <div class="num3">3</div>
        <div class="num9">9</div>
        <div class="hand-hour" style="transform:translate(-50%,-100%) rotate(${item.hourDeg}deg);"></div>
        <div class="hand-minute" style="transform:translate(-50%,-100%) rotate(${item.minuteDeg}deg);"></div>
        <div class="center-dot"></div>
      </div>
      <strong>${item.visualText}</strong>`;
  }else if(item.visual==="digital"){
    visualBox.innerHTML=`
      <div style="font-size:54px;font-weight:bold;background:#111827;color:white;display:inline-block;padding:14px 24px;border-radius:12px;">
        ${item.visualText}
      </div>
      <div style="margin-top:10px;"><strong>Digital clock time</strong></div>`;
  }else if(item.visual==="days"){
    visualBox.innerHTML=`<div class="visual">📅</div><strong>${item.visualText}</strong>`;
  }else if(item.visual==="calendar"){
    visualBox.innerHTML=`<div class="visual">🗓️</div><strong>${item.visualText}</strong>`;
  }else if(item.visual==="months"){
    visualBox.innerHTML=`<div class="visual">🌦️</div><strong>${item.visualText}</strong>`;
  }else{
    visualBox.innerHTML=`<div class="visual">${item.visual}</div><strong>${item.visualText}</strong>`;
  }
}

function checkAnswer(button,selected){
  if(answered)return;
  const correctIndex=questions[current].answer;

  if(selected===correctIndex){
    answered=true;
    score++;
    scoreBox.textContent=score;
    button.classList.add("correct");
    feedback.textContent="Correct!";
    playSound(correctSound);
    launchConfetti();
    disableOptions();
    nextBtn.style.display="inline-block";
  }else{
    attempts++;
    button.classList.add("wrong");
    playSound(wrongSound);

    if(attempts===1){
      feedback.textContent="Try again.";
      button.disabled=true;
    }else{
      answered=true;
      feedback.textContent="Incorrect. The correct answer is highlighted.";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display="inline-block";
    }
  }
}

function showCorrectAnswer(){
  const correctIndex=questions[current].answer;
  const allOptions=document.querySelectorAll(".option");
  allOptions[correctIndex].classList.add("correct");
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  clearInterval(timerInterval);
  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage=(score/questions.length)*100;
  let message="";

  if(percentage>=75){
    message="Good job";
    launchConfetti();
    playSound(clapSound);
  }else if(percentage>=40){
    message="Review this chapter and try again";
  }else{
    message="Let’s practise more";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("finalScore").textContent="Your Score: "+score+" out of "+questions.length;
}

function restartQuiz(){
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute(){
  muted=!muted;
  document.getElementById("muteBtn").textContent=muted?"🔇 Sound Off":"🔊 Sound On";
}

function playSound(sound){
  if(muted)return;
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function launchConfetti(){
  const colors=["#f59e0b","#10b981","#3b82f6","#ef4444","#8b5cf6"];
  for(let i=0;i<30;i++){
    const piece=document.createElement("div");
    piece.className="confetti";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration=(Math.random()*.8+.8)+"s";
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),1500);
  }
}
</script>

</body>
</html>
