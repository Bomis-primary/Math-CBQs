<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBQ Interactive - Grade 1 Money</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  color: #1f2937;
}

.screen {
  display: none;
  min-height: 100vh;
  padding: 16px;
}

.screen.active {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#logoScreen {
  background: white;
}

.logo {
  max-width: 260px;
  width: 70%;
  height: auto;
}

.card {
  width: 100%;
  max-width: 820px;
  background: #ffffff;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.badge, .sound-btn {
  background: #e0f2fe;
  color: #0f3f5f;
  padding: 9px 12px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
}

.sound-btn {
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}

.sound-btn:hover {
  background: #bae6fd;
}

.visual-box {
  background: #fefce8;
  border: 2px solid #facc15;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.visual {
  font-size: 68px;
  margin-bottom: 8px;
}

/* Clock Styles */
.clock-face {
  width: 135px;
  height: 135px;
  border: 8px solid #1f4e79;
  border-radius: 50%;
  margin: 0 auto 8px;
  position: relative;
  background: #fff;
}

.clock-face::before {
  content: "12";
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: bold;
}

.clock-face::after {
  content: "6";
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: bold;
}

.num3 {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: bold;
}

.num9 {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: bold;
}

.hand-hour {
  position: absolute;
  width: 6px;
  height: 38px;
  background: #111827;
  left: 50%;
  top: 50%;
  transform-origin: bottom center;
  border-radius: 5px;
}

.hand-minute {
  position: absolute;
  width: 4px;
  height: 50px;
  background: #dc2626;
  left: 50%;
  top: 50%;
  transform-origin: bottom center;
  border-radius: 5px;
}

.center-dot {
  position: absolute;
  width: 12px;
  height: 12px;
  background: #111827;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* Money Component Styles */
.money-container {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.note {
  background: #86efac;
  border: 2px solid #16a34a;
  color: #14532d;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 20px;
  box-shadow: 2px 3px 0px #15803d;
  display: inline-block;
}

.note-10 { background: #fde047; border-color: #ca8a04; color: #713f12; box-shadow: 2px 3px 0px #a16207; }
.note-20 { background: #f9a8d4; border-color: #db2777; color: #831843; box-shadow: 2px 3px 0px #be185d; }
.note-50 { background: #93c5fd; border-color: #2563eb; color: #1e3a8a; box-shadow: 2px 3px 0px #1d4ed8; }
.note-100 { background: #c084fc; border-color: #9333ea; color: #581c87; box-shadow: 2px 3px 0px #7e22ce; }

.coin {
  background: #e2e8f0;
  border: 3px solid #64748b;
  color: #334155;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  box-shadow: inset -2px -2px 0px #94a3b8;
}

.coin-gold { background: #fef08a; border-color: #ca8a04; color: #854d0e; }

.item-tag {
  background: white;
  border: 2px solid #cbd5e1;
  padding: 8px 14px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: bold;
  margin: 4px;
}

.question {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.35;
  margin: 0 0 20px 0;
  text-align: center;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.option {
  font-size: 18px;
  padding: 18px 24px;
  border: 2px solid #1f4e79;
  background: #ffffff;
  color: #111827;
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 72px;
  font-weight: 500;
  line-height: 1.3;
  white-space: normal;
  word-wrap: break-word;
  transition: all 0.2s ease;
}

.option:hover:not(:disabled) {
  background: #f0f7ff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(31, 78, 121, 0.1);
}

.option.correct {
  background: #d1fae5 !important;
  border-color: #047857 !important;
  color: #065f46 !important;
  font-weight: bold;
}

.option.wrong {
  background: #fee2e2 !important;
  border-color: #b91c1c !important;
  color: #991b1b !important;
}

.feedback {
  min-height: 32px;
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.4;
  text-align: center;
}

.controls {
  margin-top: 20px;
  text-align: center;
}

.primary {
  background: #1f4e79;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 14px 32px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.primary:hover {
  background: #153553;
}

#nextBtn {
  display: none;
}

.result-title {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 14px;
}

.result-score {
  font-size: 22px;
  text-align: center;
  margin-bottom: 18px;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: fall 1.2s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

@media (max-width: 640px) {
  .options {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .card {
    padding: 16px;
  }

  .question {
    font-size: 20px;
  }

  .option {
    font-size: 17px;
    padding: 14px 20px;
    min-height: 60px;
  }

  .visual {
    font-size: 54px;
  }

  .clock-face {
    width: 115px;
    height: 115px;
  }

  .badge, .sound-btn {
    font-size: 14px;
  }

  .primary {
    width: 100%;
  }
}
</style>
</head>

<body>

<div id="logoScreen" class="screen active">
  <img src="assets/logo.png" alt="Innovine Logo" class="logo" />
</div>

<div id="quizScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge">Question <span id="qNo">1</span>/12</div>
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Time: <span id="timer">60</span>s</div>
      <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 Sound On</button>
    </div>

    <div class="visual-box" id="visualBox"></div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="screen">
  <div class="card">
    <div class="result-title" id="resultMessage"></div>
    <div class="result-score" id="finalScore"></div>
    <button class="primary" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<script>
const originalQuestions = [
  {
    q: "If you have ₹70, can you buy a book that costs ₹75?",
    visual: "evaluate_book",
    visualText: "Book: ₹75 | You have: ₹70",
    options: ["Yes, and you will have ₹5 left.", "No, you need ₹5 more.", "Yes, exactly.", "No, you need ₹10 more."],
    answerText: "No, you need ₹5 more."
  },
  {
    q: "Rohan has one ₹10 note, one ₹5 coin, and one ₹2 coin. How much total money does Rohan have?",
    visual: "money_sum1",
    visualText: "₹10 + ₹5 + ₹2",
    options: ["₹15", "₹16", "₹17", "₹20"],
    answerText: "₹17"
  },
  {
    q: "Complete the relation: How many paise equal 1 Rupee (₹1)?",
    visual: "rupee_paise",
    visualText: "₹1 = _____ paise",
    options: ["10 paise", "50 paise", "100 paise", "500 paise"],
    answerText: "100 paise"
  },
  {
    q: "Which denomination is available in BOTH a note and a coin in India?",
    visual: "coin_note",
    visualText: "Note or Coin?",
    options: ["₹10", "₹50", "₹100", "₹200"],
    answerText: "₹10"
  },
  {
    q: "Ria buys an eraser for ₹5 and a pencil for ₹4. What is the total cost of both items?",
    visual: "items_sum",
    items: [{name:"Eraser", price:"₹5", icon:"✏️"}, {name:"Pencil", price:"₹4", icon:"✏️"}],
    visualText: "Total cost = ?",
    options: ["₹8", "₹9", "₹10", "₹12"],
    answerText: "₹9"
  },
  {
    q: "A toy cap costs ₹55, a stacking tower costs ₹48, and an eraser box costs ₹70. Which item costs the LEAST?",
    visual: "compare_items",
    items: [{name:"Cap", price:"₹55", icon:"🧢"}, {name:"Tower", price:"₹48", icon:"🗼"}, {name:"Box", price:"₹70", icon:"📦"}],
    visualText: "Compare prices: ₹55, ₹48, ₹70",
    options: ["Toy Cap (₹55)", "Stacking Tower (₹48)", "Eraser Box (₹70)", "All cost the same"],
    answerText: "Stacking Tower (₹48)"
  },
  {
    q: "A burger costs ₹60 and a cookie costs ₹45. Which statement is correct?",
    visual: "compare_food",
    items: [{name:"Burger", price:"₹60", icon:"🍔"}, {name:"Cookie", price:"₹45", icon:"🍪"}],
    visualText: "Burger ₹60 vs Cookie ₹45",
    options: ["The cookie costs more than the burger", "The burger costs more than the cookie", "Both cost the exact same amount", "The cookie costs ₹60"],
    answerText: "The burger costs more than the cookie"
  },
  {
    q: "Mala has ₹20 in her piggy bank. Her father gives her ₹15 more. How much money does Mala have now?",
    visual: "add_story",
    visualText: "₹20 + ₹15",
    options: ["₹25", "₹30", "₹35", "₹40"],
    answerText: "₹35"
  },
  {
    q: "Grace has ₹90. She gives ₹32 to her classmate to buy a notebook. How much money does Grace have left?",
    visual: "sub_story",
    visualText: "₹90 - ₹32",
    options: ["₹58", "₹62", "₹52", "₹48"],
    answerText: "₹58"
  },
  {
    q: "Stella buys a paper clip for ₹20. She pays the cashier with a ₹50 note. How much change will she get back?",
    visual: "change_story",
    visualText: "Paid: ₹50 - Item: ₹20",
    options: ["₹20", "₹30", "₹40", "₹10"],
    answerText: "₹30"
  },
  {
    q: "How many ₹10 notes are needed to make a total value of ₹20?",
    visual: "make_20",
    visualText: "_____ x ₹10 notes = ₹20",
    options: ["1 note", "2 notes", "3 notes", "5 notes"],
    answerText: "2 notes"
  },
  {
    q: "To pay an exact amount of ₹17, which combination of notes and coins is correct?",
    visual: "comb_17",
    visualText: "Combination for ₹17",
    options: ["One ₹10 note + One ₹5 coin + One ₹2 coin", "Two ₹10 notes", "Three ₹5 coins", "One ₹10 note + Two ₹5 coins"],
    answerText: "One ₹10 note + One ₹5 coin + One ₹2 coin"
  }
];

let questions = [];
let current = 0;
let score = 0;
let attempts = 0;
let answered = false;
let timeLeft = 60;
let timerInterval;
let muted = false;
let audioContext;

const logoScreen = document.getElementById("logoScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");
const qNo = document.getElementById("qNo");
const scoreBox = document.getElementById("score");
const timerBox = document.getElementById("timer");
const visualBox = document.getElementById("visualBox");
const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    logoScreen.classList.remove("active");
    quizScreen.classList.add("active");
    startQuiz();
  }, 5000);
});

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function startQuiz() {
  current = 0;
  score = 0;
  scoreBox.textContent = score;

  questions = shuffle(JSON.parse(JSON.stringify(originalQuestions)));
  questions.forEach(q => shuffle(q.options));

  loadQuestion();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 60;
  timerBox.textContent = timeLeft;

  timerInterval = setInterval(() => {
    timeLeft--;
    timerBox.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      answered = true;
      feedback.style.color = "#dc2626";
      feedback.textContent = "Time's up!";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display = "inline-block";
    }
  }, 1000);
}

function loadQuestion() {
  attempts = 0;
  answered = false;
  feedback.textContent = "";
  nextBtn.style.display = "none";

  const item = questions[current];
  qNo.textContent = current + 1;
  questionText.textContent = item.q;
  optionsBox.innerHTML = "";
  renderVisual(item);

  item.options.forEach((optionText) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = optionText;
    btn.onclick = () => checkAnswer(btn, optionText);
    optionsBox.appendChild(btn);
  });

  startTimer();
}

function renderVisual(item) {
  if (item.visual === "clock") {
    visualBox.innerHTML = `
      <div class="clock-face">
        <div class="num3">3</div>
        <div class="num9">9</div>
        <div class="hand-hour" style="transform: translate(-50%, -100%) rotate(${item.hourDeg}deg); -webkit-transform: translate(-50%, -100%) rotate(${item.hourDeg}deg);"></div>
        <div class="hand-minute" style="transform: translate(-50%, -100%) rotate(${item.minuteDeg}deg); -webkit-transform: translate(-50%, -100%) rotate(${item.minuteDeg}deg);"></div>
        <div class="center-dot"></div>
      </div>
      <strong>${item.visualText}</strong>
    `;
  } else if (item.visual === "digital") {
    visualBox.innerHTML = `
      <div style="font-size:54px; font-weight:bold; background:#111827; color:white; display:inline-block; padding:14px 24px; border-radius:12px; font-family: monospace;">
        ${item.visualText}
      </div>
      <div style="margin-top:10px;"><strong>Digital clock time</strong></div>
    `;
  } else if (item.visual === "money_sum1" || item.visual === "comb_17") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-10">₹10</span> + 
        <span class="coin coin-gold">₹5</span> + 
        <span class="coin">₹2</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "evaluate_book") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="item-tag">📖 Book: ₹75</span>
        <span class="note note-50">₹50</span> + <span class="note note-20">₹20</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "rupee_paise") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="coin coin-gold" style="width:60px;height:60px;font-size:22px;">₹1</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "coin_note") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-10">₹10</span>
        <span class="coin coin-gold">₹10</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "items_sum" || item.visual === "compare_items" || item.visual === "compare_food") {
    let itemsHTML = item.items.map(i => `<div class="item-tag">${i.icon} ${i.name}: <span style="color:#0284c7;">${i.price}</span></div>`).join('');
    visualBox.innerHTML = `
      <div class="money-container">${itemsHTML}</div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "add_story") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-20">₹20</span> + <span class="note">₹15</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "sub_story") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-50">₹50</span> <span class="note note-20">₹20</span> <span class="note note-20">₹20</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "change_story") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-50">Paid: ₹50</span> - <span class="item-tag">📎 Clip: ₹20</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else if (item.visual === "make_20") {
    visualBox.innerHTML = `
      <div class="money-container">
        <span class="note note-20">Total = ₹20</span>
      </div>
      <strong>${item.visualText}</strong>`;
  } else {
    visualBox.innerHTML = `<div class="visual">🛒</div><strong>${item.visualText}</strong>`;
  }
}

function checkAnswer(button, selectedText) {
  initAudio();
  if (answered) return;

  const currentQuestion = questions[current];

  if (selectedText === currentQuestion.answerText) {
    clearInterval(timerInterval);
    answered = true;
    score++;
    scoreBox.textContent = score;
    button.classList.add("correct");
    feedback.style.color = "#047857";
    feedback.textContent = "Correct!";
    playBeep(600, 0.15);
    launchConfetti();
    disableOptions();
    nextBtn.style.display = "inline-block";
  } else {
    attempts++;
    button.classList.add("wrong");
    playBeep(220, 0.2);

    if (attempts === 1) {
      feedback.style.color = "#ea580c";
      feedback.textContent = "Try again.";
      button.disabled = true;
    } else {
      clearInterval(timerInterval);
      answered = true;
      feedback.style.color = "#b91c1c";
      feedback.textContent = "Incorrect. The correct answer is highlighted.";
      showCorrectAnswer();
      disableOptions();
      nextBtn.style.display = "inline-block";
    }
  }
}

function showCorrectAnswer() {
  const currentQuestion = questions[current];
  const allOptions = document.querySelectorAll(".option");
  allOptions.forEach(btn => {
    if (btn.textContent === currentQuestion.answerText) {
      btn.classList.add("correct");
    }
  });
}

function disableOptions() {
  const allOptions = document.querySelectorAll(".option");
  allOptions.forEach(btn => btn.disabled = true);
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  clearInterval(timerInterval);

  quizScreen.classList.remove("active");
  resultScreen.classList.add("active");

  const percentage = (score / questions.length) * 100;
  let message = "";

  if (percentage >= 75) {
    message = "Good job";
    launchConfetti();
    playBeep(800, 0.4);
  } else if (percentage >= 40) {
    message = "Review this chapter and try again";
  } else {
    message = "Let’s practise more";
  }

  document.getElementById("resultMessage").textContent = message;
  document.getElementById("finalScore").textContent =
    "Your Score: " + score + " out of " + questions.length;
}

function restartQuiz() {
  resultScreen.classList.remove("active");
  quizScreen.classList.add("active");
  startQuiz();
}

function toggleMute() {
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "0x1F507 Sound Off" : "🔊 Sound On";
}

function playBeep(freq, duration) {
  if (muted || !audioContext) return;
  try {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + duration);
  } catch (e) {}
}

function launchConfetti() {
  const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ef4444", "#8b5cf6"];

  for (let i = 0; i < 30; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 0.8 + 0.8) + "s";
    document.body.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    }, 1500);
  }
}
