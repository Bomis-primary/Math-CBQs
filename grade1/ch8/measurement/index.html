<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: 14 Master CBQ Suite</title>
    <style>
        :root {
            --primary: #d35400;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fdf2e9;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 480px; border: 5px solid #f5b041; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #f5b041; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Layout Typography */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #ba4a00; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.5rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
        .q-context { background: #f4f6f6; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; font-weight: bold; color: #7e5109; line-height: 1.4; border: 2px dashed #f5b041; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 14px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }

        /* General UI Actions */
        .btn-action { background: #e67e22; color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #a04000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #a04000; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo">
    </div>

    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2>🧩 14-CBQ Master Challenge</h2>
        <div class="visual-emoji-display">🔢📏⚖️🎈</div>
        <p style="margin-bottom: 25px; font-size: 1.3rem; color: #495057; font-weight: bold;">
            Numbers & Measurements Suite 🚀
        </p>
        <button class="btn-action" onclick="startInteractive()">START SUITE 👉</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span> / <span id="q-total">14</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT QUESTION 👉</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Master Evaluation Complete!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆👏✨</div>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">RESTART CHALLENGE 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        /* --- MODULE 1: NUMBER SYSTEMS --- */
        {
            emoji: "📦",
            context: "How many ‘tens’ do you need to group together to make 100?",
            options: ["1", "5", "10", "100"],
            answer: 2,
            hint: "Try skip counting by 10 until you reach 100. How many steps did it take?",
            exp: "10 groups of ten (10 × 10) bundle together perfectly to form 100."
        },
        {
            emoji: "🍎",
            context: "In the word \"APPLE\", what is the position of 'L'?",
            options: ["second", "sixth", "fifth", "fourth"],
            answer: 3,
            hint: "Count each letter systematically from left to right: A is 1st, P is 2nd...",
            exp: "'L' is the fourth letter when we count the letters sequentially in order."
        },
        {
            emoji: "🚌",
            context: "Candy, Danny, Freddy, Polly, Edward and Suzi are standing in a line for the bus, starting with Candy at the front. Who is third in the line?",
            options: ["Danny", "Freddy", "Polly", "Edward"],
            answer: 1,
            hint: "Candy is 1st, Danny is 2nd. Who comes right after Danny?",
            exp: "Counting from Candy at the front, Freddy is the third person in the line."
        },
        {
            emoji: "🎟️",
            context: "What is the standard form of 100 + 0 + 7?",
            options: ["170", "107", "17", "1007"],
            answer: 1,
            hint: "Put together 1 hundred, 0 tens, and 7 ones into placeholders.",
            exp: "1 hundred, 0 tens, and 7 ones combined is 107."
        },
        {
            emoji: "💯",
            context: "How many hundreds are there in the number 200?",
            options: ["1", "2", "0", "20"],
            answer: 1,
            hint: "Think about how many distinct groups of 100 are needed to count up to 200.",
            exp: "The number 200 consists of exactly 2 separate bundles of hundreds."
        },
        {
            emoji: "🏫",
            context: "In a school assembly row, Deepa is 5th in line and she is the last student. How many students are standing in that row?",
            options: ["7", "5", "3", "1"],
            answer: 1,
            hint: "If she is number 5 and there is no one standing behind her, the line stops there.",
            exp: "If she is 5th and the absolute last person, there are exactly 5 students total in that row."
        },
        {
            emoji: "💎",
            context: "What is the face value of the digit 1 in the number 142?",
            options: ["100", "10", "1", "142"],
            answer: 2,
            hint: "Face value is what a digit looks like on its own, ignoring its column place value.",
            exp: "The face value of a digit is the digit itself, regardless of its position column."
        },
        {
            emoji: "📝",
            context: "In the number 106, which digit is in the tens place?",
            options: ["1", "6", "0", "10"],
            answer: 2,
            hint: "Look at the middle placeholder digit that sits between the hundreds and ones.",
            exp: "106 is written as 1 Hundred, 0 Tens, and 6 Ones. The middle tracking digit is 0."
        },
        {
            emoji: "🚶‍♀️",
            context: "A girl is standing in a queue. There are 10 people in front of her. What is her ordinal position in the queue?",
            options: ["10th", "9th", "11th", "12th"],
            answer: 2,
            hint: "If 10 people are occupying spots ahead of her, what number is her turn?",
            exp: "Since 10 people are occupying spots ahead of her, she takes the very next consecutive spot, which is the 11th position."
        },

        /* --- MODULE 2: HIGH-ORDER MEASUREMENTS --- */
        {
            emoji: "🎈",
            context: "If a birthday balloon and a toy ball are exactly the same size, are they always the same weight?",
            options: [
                "Yes, size tells you exactly how heavy it is.",
                "No, the balloon is usually heavier.",
                "No, the ball is usually heavier because it is solid, while the balloon is full of light air.",
                "Yes, because they take up the same amount of space."
            ],
            answer: 2,
            hint: "Think about what is packed inside both objects. Air vs dense solid material!",
            exp: "Size does not equal weight! A solid ball has much denser materials inside than an air-filled balloon."
        },
        {
            emoji: "🖐️",
            context: "You measure the classroom activity table using your handspan and get a count of 8. Your teacher measures the exact same table. Will the teacher's count be the same?",
            options: [
                "Yes, because the table did not change sizes.",
                "No, the teacher's count will be smaller because their hand is larger.",
                "No, the teacher's count will be larger because teachers are taller.",
                "Yes, handspans are standard lines everywhere."
            ],
            answer: 1,
            hint: "Whose hand covers more space in just one step?",
            exp: "Handspans are non-standard. A teacher's hand covers more distance per step, meaning it takes fewer steps to cross the table."
        },
        {
            emoji: "🚪",
            context: "To measure the height of your classroom door using non-standard units, which item is the most practical to use?",
            options: ["Paper clips", "Grains of rice", "Arm spans", "Finger widths"],
            answer: 2,
            hint: "Using tiny items for a giant door would take hours! Choose a large unit.",
            exp: "Arm spans match large objects best. Tiny items like rice or clips lead to tracking errors on big surfaces."
        },
        {
            emoji: "✏️",
            context: "If a mini eraser is \"shorter than\" a new wooden pen, then what can we say about the pen?",
            options: [
                "The pen is shorter than the eraser.",
                "The pen is lighter than the eraser.",
                "The pen is longer than the eraser.",
                "The pen is the exact same length."
            ],
            answer: 2,
            hint: "Flip the perspective around! What is the structural opposite of 'shorter than'?",
            exp: "Comparisons work in pairs. If the eraser is shorter, the pen must be longer than the eraser."
        },
        {
            emoji: "⚖️",
            context: "Scale 1 shows a Red Apple is heavier than an Orange. Scale 2 shows that same Orange is heavier than a Strawberry. What happens if you contrast the Apple and the Strawberry?",
            options: [
                "The scale stays balanced.",
                "The Apple side goes down because it is the heaviest.",
                "The Strawberry side goes down.",
                "The pans tip back and forth."
            ],
            answer: 1,
            hint: "If Apple > Orange, and Orange > Strawberry, who sits at the top of the chain?",
            exp: "Transitive logic rules! If Apple beats Orange, and Orange beats Strawberry, the Apple is heaviest and pulls gravity down."
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');
    const audioClaps = new Audio('assets/freesound_community-claps-44774.mp3');

    window.addEventListener('load', () => {
        document.getElementById('q-total').innerText = dataset.length;
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') { audioCorrect.currentTime = 0; audioCorrect.play().catch(() => {}); }
        else if (type === 'wrong') { audioWrong.currentTime = 0; audioWrong.play().catch(() => {}); }
        else if (type === 'claps') { audioClaps.currentTime = 0; audioClaps.play().catch(() => {}); }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 First-Attempt Star! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Resolved! ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                showFeedback('hint', `💡 Hint: ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Concept Check: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time ran out! Here is the layout check: ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerHTML = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        playSound('claps');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You earned ${score} / ${dataset.length} perfect first-attempt stars! ⭐`;
        
        if (finalPercent >= 80) {
            document.getElementById('result-title').innerText = "👑 Master of Spatial Analytics!";
            document.getElementById('result-emoji').innerText = "🥇🏆✨";
            msg += "\nFlawless comprehension! You possess advanced capability in tracking queues, reverse relational mapping, placeholder constraints, and density misconceptions.";
        } else if (finalPercent >= 50) {
            document.getElementById('result-title').innerText = "🚀 Great Competency!";
            document.getElementById('result-emoji').innerText = "✏️📈💡";
            msg += "\nWonderful effort! Paying closer attention to unit changes and queue positions will step you up to total mastery next time.";
        } else {
            document.getElementById('result-title').innerText = "🧱 Keep Practice Open!";
            document.getElementById('result-emoji').innerText = "🎒🔄📚";
            msg += "\nVisualizing physical blocks and weight balances makes math structural. Try once more to unlock your medals!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
