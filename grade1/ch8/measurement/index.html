<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math: Chapter 8 - Measurement Challenge</title>
    <style>
        :root {
            --primary: #d35400;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #fdf2e9;
            --text: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: white; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); padding: 20px; position: relative; min-height: 480px; border: 5px solid #f5b041; overflow: hidden; }
        
        /* Strict 5-Second Splash Guard Layout */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 18px; }
        #splash-screen img { width: 190px; height: auto; }

        .hidden { display: none !important; }
        
        /* Interactive Dashboard Meta */
        .header-meta { display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 4px dashed #f5b041; }
        .timer { color: var(--danger); background: #fff5f5; padding: 5px 12px; border-radius: 12px; border: 2px solid #ffc9c9; }
        .score-box { color: #2b8a3e; background: #ebfbee; padding: 5px 12px; border-radius: 12px; border: 2px solid #b2f2bb; }
        
        /* Layout Typography */
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 15px; color: #ba4a00; line-height: 1.3; }
        .visual-emoji-display { font-size: 3.5rem; text-align: center; margin: 10px 0; user-select: none; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
        .q-context { background: #f4f6f6; padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1.2rem; text-align: center; font-weight: bold; color: #7e5109; line-height: 1.4; border: 2px dashed #f5b041; }
        
        /* Responsive High-Contrast Tap Targets */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-opt { background: #f8f9fa; border: 3px solid #dee2e6; border-radius: 16px; padding: 14px; text-align: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.1s; width: 100%; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px #e9ecef; color: var(--text); }
        .btn-opt:active { transform: translateY(2px); box-shadow: 0 2px #e9ecef; }
        .btn-opt.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724 !important; box-shadow: 0 4px #c3e6cb; }
        .btn-opt.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24 !important; box-shadow: 0 4px #f5c6cb; }
        
        /* Feedback Callout Systems */
        .feedback-box { padding: 14px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; line-height: 1.4; }
        .feedback-box.hint { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .feedback-box.explanation { background: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }

        /* General UI Actions */
        .btn-action { background: #e67e22; color: white; border: none; padding: 15px; font-size: 1.4rem; border-radius: 16px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px #a04000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #a04000; }
        .audio-ctrl { background: none; border: none; font-size: 2rem; cursor: pointer; }
        
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <!-- Splash Screen (Strict 5 Seconds Guard) -->
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo">
    </div>

    <!-- Intro Screen -->
    <div id="intro-screen" class="hidden" style="text-align: center; padding-top: 40px;">
        <h2>Measurement Mastery Challenge</h2>
        <div class="visual-emoji-display" style="margin-top: 25px; margin-bottom: 35px;">✏️⚖️🚪🥛</div>
        <button class="btn-action" onclick="startInteractive()">START CHALLENGE 👉</button>
    </div>

    <!-- Main Game Screen -->
    <div id="game-screen" class="hidden">
        <div class="header-meta">
            <div class="score-box">⭐ <span id="score-val">0</span> / <span id="q-total">15</span></div>
            <button class="audio-ctrl" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="timer">⏳ <span id="timer-val">60</span>s</div>
        </div>
        
        <div id="question-box">
            <div id="q-emoji" class="visual-emoji-display"></div>
            <div id="q-text" class="q-context"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn-action hidden" onclick="handleNext()">NEXT QUESTION 👉</button>
    </div>

    <!-- Final Score Analytics Screen -->
    <div id="result-screen" class="hidden" style="text-align: center; padding-top: 20px;">
        <h2 id="result-title">🎉 Evaluation Complete!</h2>
        <div id="result-emoji" class="visual-emoji-display">🏆👏✨</div>
        <p id="result-text" style="font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; white-space: pre-line;"></p>
        <button class="btn-action" onclick="restartInteractive()">RESTART CHALLENGE 🔄</button>
    </div>
</div>

<script>
    const dataset = [
        {
            emoji: "✏️",
            context: "A pencil is 5 paper clips long. A crayon is 3 paper clips long. Which statement is true?",
            options: [
                "The crayon is longer than the pencil.",
                "The pencil is longer than the crayon.",
                "They are the same length.",
                "The pencil is shorter than the crayon."
            ],
            answer: 1,
            hint: "Compare the number of units. Is 5 more or less than 3?",
            exp: "5 units is more than 3 units, so the pencil has a greater length."
        },
        {
            emoji: "🪣",
            context: "A bucket can hold 10 mugs of water. A jug can hold 3 mugs of water. Which has more capacity?",
            options: ["The jug", "The mug", "The bucket", "They are the same"],
            answer: 2,
            hint: "Which container takes a larger count of mugs to fill up completely?",
            exp: "The bucket holds more units (10) than the jug (3)."
        },
        {
            emoji: "🧼",
            context: "If an eraser is \"shorter than\" a pen, then the pen is ________ the eraser.",
            options: ["Shorter than", "Lighter than", "Longer than", "As long as"],
            answer: 2,
            hint: "Flip the perspective! What is the opposite matching term for shorter?",
            exp: "\"Longer than\" is the structural opposite of \"shorter than.\""
        },
        {
            emoji: "📚",
            context: "Which of these would you use to measure the weight of a book using non-standard units?",
            options: ["A spoon", "Marbles or blocks", "A piece of string", "A cup of water"],
            answer: 1,
            hint: "We need solid, heavy, unvarying pieces that balance well on a scale.",
            exp: "We can use several small, equal-weight items like blocks to see how many it takes to balance the weight of a book."
        },
        {
            emoji: "🚪",
            context: "To measure the length of your classroom door, which non-standard unit would be most practical?",
            options: ["Paper clips", "Finger widths", "Arm spans", "Grains of rice"],
            answer: 2,
            hint: "Using tiny items for a big door takes too long. Choose a larger bodily unit!",
            exp: "Arm spans are larger units, making it faster and easier to measure a large object like a door."
        },
        {
            emoji: "🫖",
            context: "A teapot fills 5 teacups. A water bottle fills 8 teacups. Which statement is correct?",
            options: [
                "The teapot holds more than the bottle.",
                "The bottle holds less than the teapot.",
                "The teapot holds less than the bottle.",
                "They have the same capacity."
            ],
            answer: 2,
            hint: "Compare the fluid unit count. Is 5 cups less or more than 8 cups?",
            exp: "5 cups is a smaller amount than 8 cups, meaning the teapot holds less."
        },
        {
            emoji: "🍉",
            context: "If a watermelon is heavier than a mango, then the mango is ________ the watermelon.",
            options: ["Heavier than", "Lighter than", "Larger than", "As heavy as"],
            answer: 1,
            hint: "If a big item tips the scale down, what does the smaller item feel like?",
            exp: "Math comparisons work in pairs. If one object is heavier, the other must be lighter."
        },
        {
            emoji: "🎈",
            context: "If a balloon and a ball are the same size, are they always the same weight?",
            options: [
                "Yes, always.",
                "No, the ball is usually heavier.",
                "No, the balloon is usually heavier.",
                "Yes, because they look the same."
            ],
            answer: 1,
            hint: "Think about what is stuffed inside. Air vs a dense, solid toy material!",
            exp: "Size does not determine weight. A ball is solid/dense, while a balloon is filled with light air."
        },
        {
            emoji: "🖐️",
            context: "If you measure a table using your handspan and your teacher measures it using their handspan, will the number be the same?",
            options: [
                "Yes, because the table doesn't change.",
                "No, because the teacher's hand is likely larger.",
                "Yes, because handspans are standard units.",
                "No, because the table grows."
            ],
            answer: 1,
            hint: "Whose hand takes up more space in a single baseline stretch?",
            exp: "Since handspans are non-standard and vary in size, the count will be different."
        },
        {
            emoji: "🥛",
            context: "An empty glass is ________ a glass full of milk.",
            options: ["Heavier than", "Lighter than", "Longer than", "Shorter than"],
            answer: 1,
            hint: "Does adding a liquid into a container add weight or make it vanish?",
            exp: "The milk adds weight to the glass, so the empty one is lighter."
        },
        {
            emoji: "🎗️",
            context: "A blue ribbon is longer than a yellow ribbon. The yellow ribbon is longer than a pink ribbon. Which statement must be true?",
            options: [
                "The pink ribbon is the longest.",
                "The blue ribbon is the longest.",
                "The blue ribbon is shorter than the pink ribbon.",
                "All three ribbons are equal."
            ],
            answer: 1,
            hint: "Line them up mentally! If Blue beats Yellow, and Yellow beats Pink, who is biggest?",
            exp: "Transitive property logic: If Blue > Yellow and Yellow > Pink, then Blue is automatically the longest."
        },
        {
            emoji: "🥣",
            context: "You have a tall, narrow cup filled with juice. If you pour all of it into a short, wide empty bowl without spilling, what happens to the total juice?",
            options: [
                "There is more juice now because the bowl is wide.",
                "There is less juice now because the bowl is short.",
                "The amount of juice stays exactly the same.",
                "The juice disappears."
            ],
            answer: 2,
            hint: "Did you add any new juice or drink any away during the pouring?",
            exp: "Conservation of volume: Changing container shape does not change the amount of liquid."
        },
        {
            emoji: "🪵",
            context: "Two sticks are on a table. Stick A's top reaches higher, but Stick B's bottom starts further down. How do you find out which is longer?",
            options: [
                "Look at whichever reaches highest on the page.",
                "Line up their bottom edges flat at the exact same starting line.",
                "Check which stick is brighter.",
                "Roll them to see which goes faster."
            ],
            answer: 1,
            hint: "To compare heights fairly, items must share a flat, equal starting baseline floor.",
            exp: "Objects must share a common baseline starting line to be directly and accurately compared."
        },
        {
            emoji: "⚖️",
            context: "You place a heavy structural block on the left pan of a balance scale and a light feather on the right pan. What will happen?",
            options: [
                "The left pan with the block will tip all the way down.",
                "The right pan with the feather will tip all the way down.",
                "The scale will stay level and balanced.",
                "Both pans will fly up together."
            ],
            answer: 0,
            hint: "Think about gravity! Does gravity pull heavier objects down or lift them into the air?",
            exp: "Gravity pulls harder on heavier weights, causing that side of a balance scale to sink down."
        },
        {
            emoji: "☕",
            context: "It takes 5 big mugs of water to fill a bucket. If you switch to using a very tiny teacup instead, will it take more or fewer teacups?",
            options: ["Fewer than 5 teacups.", "Exactly 5 teacups.", "More than 5 teacups.", "Zero teacups."],
            answer: 2,
            hint: "If each new cup holds much less space, do you need to scoop more times or fewer times?",
            exp: "Smaller units mean a higher unit count is required to fill the exact same total space."
        }
    ];

    let currentQ = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval = null;
    let timeRemaining = 60; 
    let isMuted = false;

    const audioCorrect = new Audio('assets/correct.mp3');
    const audioWrong = new Audio('assets/wrong.mp3');
    const audioClaps = new Audio('assets/freesound_community-claps-44774.mp3');

    window.addEventListener('load', () => {
        document.getElementById('q-total').innerText = dataset.length;
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
    }

    function playSound(type) {
        if (isMuted) return;
        if (type === 'correct') { audioCorrect.currentTime = 0; audioCorrect.play().catch(() => {}); }
        else if (type === 'wrong') { audioWrong.currentTime = 0; audioWrong.play().catch(() => {}); }
        else if (type === 'claps') { audioClaps.currentTime = 0; audioClaps.play().catch(() => {}); }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = 60;
        document.getElementById('timer-val').innerText = timeRemaining;
        timerInterval = setInterval(() => {
            timeRemaining--;
            document.getElementById('timer-val').innerText = timeRemaining;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        attempts = 0;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        let qData = dataset[currentQ];
        document.getElementById('q-emoji').innerText = qData.emoji;
        document.getElementById('q-text').innerHTML = qData.context;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        
        if (selectedIndex === qData.answer) {
            clearInterval(timerInterval);
            clickedBtn.classList.add('correct');
            playSound('correct');
            
            if (attempts === 0) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerVisualSparklers();
                showFeedback('explanation', `🎉 First-Attempt Star! ${qData.exp}`);
            } else {
                showFeedback('explanation', `👍 Resolved! ${qData.exp}`);
            }
            
            disableOptions();
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            attempts++;
            playSound('wrong');
            clickedBtn.classList.add('wrong');
            clickedBtn.disabled = true;
            
            if (attempts === 1) { 
                showFeedback('hint', `💡 Hint: ${qData.hint}`);
            } else {
                clearInterval(timerInterval);
                disableOptions();
                buttons[qData.answer].classList.add('correct');
                showFeedback('explanation', `Concept Check: ${qData.exp}`);
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleTimeout() {
        disableOptions();
        let qData = dataset[currentQ];
        const buttons = document.getElementsByClassName('btn-opt');
        buttons[qData.answer].classList.add('correct');
        showFeedback('explanation', `⏰ Time ran out! Here is the baseline fact: ${qData.exp}`);
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function disableOptions() {
        const buttons = document.getElementsByClassName('btn-opt');
        for (let b of buttons) { b.disabled = true; }
    }

    function showFeedback(type, message) {
        const box = document.getElementById('feedback');
        box.className = `feedback-box ${type}`;
        box.innerHTML = message;
        box.classList.remove('hidden');
    }

    function handleNext() {
        currentQ++;
        if (currentQ < dataset.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        const screen = document.getElementById('result-screen');
        screen.classList.remove('hidden');
        playSound('claps');
        
        let finalPercent = (score / dataset.length) * 100;
        let msg = `You earned ${score} / ${dataset.length} perfect first-attempt stars! ⭐`;
        
        if (finalPercent >= 80) {
            document.getElementById('result-title').innerText = "👑 Master of Measurements!";
            document.getElementById('result-emoji').innerText = "🥇🏆✨";
            msg += "\nIncredible performance! You display sophisticated spatial analytical capability in resolving size vs weight misconceptions, transitive comparisons, and inverse non-standard counting scales.";
        } else if (finalPercent >= 50) {
            document.getElementById('result-title').innerText = "🚀 Great Progress!";
            document.getElementById('result-emoji').innerText = "✏️📈💡";
            msg += "\nWonderful work! Re-evaluating how variable non-standard base units operate will help push you to perfect mastery next time.";
        } else {
            document.getElementById('result-title').innerText = "🧱 Keep Practicing!";
            document.getElementById('result-emoji').innerText = "🎒🔄📚";
            msg += "\nVisualizing physical scale interactions makes measuring easy. Try once more to unlock your top medals!";
        }
        
        document.getElementById('result-text').innerText = msg;
    }

    function restartInteractive() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function triggerVisualSparklers() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        
        let particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                size: Math.random() * 5 + 4,
                alpha: 1
            });
        }
        
        let animationFrame;
        function update() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let alive = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha > 0) {
                    alive = true;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (alive) {
                animationFrame = requestAnimationFrame(update);
            } else {
                canvas.classList.add('hidden');
                cancelAnimationFrame(animationFrame);
            }
        }
        update();
    }
</script>
</body>
</html>
