<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths - Fractions Interactive</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5A623;
            --success-color: #2ECC71;
            --error-color: #E74C3C;
            --bg-color: #F4F7F6;
            --text-color: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #game-container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* Screens management */
        .screen {
            display: none;
            padding: 30px 24px;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Logo Screen */
        #logo-screen {
            background: #ffffff;
        }

        #logo-screen img {
            max-width: 250px;
            height: auto;
        }

        /* Header / Stats panel */
        #stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #EEF2F5;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid #E2E8F0;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #timer-bar-outer {
            width: 100px;
            height: 10px;
            background: #CBD5E1;
            border-radius: 5px;
            overflow: hidden;
        }

        #timer-bar-inner {
            height: 100%;
            width: 100%;
            background: var(--secondary-color);
            transition: width 1s linear;
        }

        /* Typography & Content UI */
        h2 {
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
            color: #1A2530;
        }

        p.context-text {
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 20px;
            color: #4A5568;
            background: #F8FAFC;
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid var(--primary-color);
            width: 100%;
        }

        /* Visual Aids Container */
        .visual-aid {
            margin: 10px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .pizza-img {
            max-width: 150px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Buttons & Options Layout */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #E2E8F0;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: #F0F7FF;
        }

        .option-btn.correct {
            background: #E8F8F0 !important;
            border-color: var(--success-color) !important;
            color: #1E7E34;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: #FCE8E6 !important;
            border-color: var(--error-color) !important;
            color: #BD2130;
        }

        /* System Messages / Feedback Box */
        .feedback-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            width: 100%;
            display: none;
            animation: popIn 0.3s ease;
        }

        .feedback-box.hint {
            background: #FFF9E6;
            color: #8A6D3B;
            border: 1px dashed var(--secondary-color);
        }

        .feedback-box.reveal {
            background: #E8F8F0;
            color: #1E7E34;
            border: 1px solid var(--success-color);
            font-weight: 500;
            text-align: left;
        }

        /* Action Buttons */
        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.2);
        }

        .action-btn:hover {
            background: #357ABD;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            h2 { font-size: 19px; }
            p.context-text { font-size: 14px; padding: 10px; }
            .option-btn { padding: 12px 16px; font-size: 15px; }
            .screen { padding: 20px 16px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="confetti-canvas"></canvas>

        <div id="logo-screen" class="screen active">
            <img src="assets/logo.png" alt="Innovine Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <h1 id="logo-fallback" style="display:none; color: #4A90E2; font-weight: 800; font-size: 32px;">INNOVINE</h1>
        </div>

        <div id="intro-screen" class="screen">
            <h2 style="color: var(--primary-color);">Welcome to Fractions Adventure! 🍰</h2>
            <p class="context-text" style="border-left-color: var(--secondary-color); text-align: left;">
                Help your friends share food, fix windows, and count treats using fractions! <br><br>
                <strong>Rules of Play:</strong><br>
                • You have 60 seconds per question.<br>
                • If you make a mistake, you get 1 retry with a helpful hint!
            </p>
            <button class="action-btn" onclick="startQuiz()">Start Exploring</button>
        </div>

        <div id="quiz-module" style="display: none; flex-direction: column; flex-grow: 1;">
            <div id="stats-bar">
                <div>Question: <span id="current-q-num">1</span>/10</div>
                <div>Score: <span id="current-score">0</span></div>
                <div class="timer-container">
                    ⏳ <div id="timer-bar-outer"><div id="timer-bar-inner"></div></div>
                </div>
            </div>

            <div id="question-screen" class="screen active" style="padding-top: 15px; justify-content: flex-start;">
                <p id="q-context" class="context-text"></p>
                
                <div id="visual-aid-box" class="visual-aid"></div>

                <div id="options-box" class="options-container"></div>
                <div id="feedback-message" class="feedback-box"></div>
                <button id="next-btn" class="action-btn" style="display: none;" onclick="loadNextQuestion()">Next Question ➜</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h2 id="result-title">Quiz Completed!</h2>
            <div id="result-emoji" style="font-size: 64px; margin: 15px 0;">🏆</div>
            <p id="result-score-text" style="font-size: 18px; font-weight: 600; margin-bottom: 10px;"></p>
            <p id="result-feedback" style="font-size: 16px; color: #4A5568; margin-bottom: 25px; text-align: center; max-width: 80%;"></p>
            <button class="action-btn" style="background: var(--secondary-color);" onclick="resetQuiz()">Play Again 🔄</button>
        </div>
    </div>

    <audio id="audio-claps" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // Master dataset containing the canonical correct answer text
        const masterDatabase = [
            {
                context: "Mini brings a full round pizza to school. She wants to share it equally with her friend Rohan. Into how many equal parts should she cut the pizza so that both of them get an exact half?",
                visualType: "pizza",
                options: ["1 part", "2 parts", "3 parts", "4 parts"],
                correctText: "2 parts",
                hint: "Think about how many total people want to eat an equal share of the pizza.",
                explanation: "When 1 whole object is divided into 2 equal parts, each part is called a half (1/2)."
            },
            {
                context: "Look at the square window frame. It has 4 small equal square blocks. 2 of the blocks are covered completely by a blue cloud curtain. What fraction of the window is covered?",
                visualType: "window",
                options: ["One-fourth (1/4)", "One-half (1/2)", "Three-fourths (3/4)", "Four-fourths (4/4)"],
                correctText: "One-half (1/2)",
                hint: "Count how many blocks are covered out of 4. Is 2 exactly half of 4?",
                explanation: "Covering 2 out of 4 equal parts (2/4) covers exactly one-half (1/2) of the whole window frame."
            },
            {
                context: "Kabir has a long chocolate bar divided structurally into 4 equal pieces. He breaks it apart and gives 3 pieces to his younger sister. What fraction of the chocolate bar did his sister get?",
                visualType: "chocolate",
                options: ["One-fourth (1/4)", "Two-fourths (2/4)", "Three-fourths (3/4)", "The whole chocolate"],
                correctText: "Three-fourths (3/4)",
                hint: "Count how many equal pieces his sister received out of the 4 total matching pieces.",
                explanation: "Giving 3 out of 4 equal parts represents three-fourths (3/4) of the entire chocolate bar."
            },
            {
                context: "Simran writes four fractions on the blackboard: 1/4, 3/4, 2/4, and 1/2. Which fraction does NOT belong to the same group of 'like fractions' as the other three?",
                visualType: null,
                options: ["1/4", "3/4", "2/4", "1/2"],
                correctText: "1/2",
                hint: "Look closely at the bottom numbers (denominators) of all four fractions written on the board.",
                explanation: "Like fractions always share the exact same denominator. 1/4, 3/4, and 2/4 all have 4 at the bottom, while 1/2 does not."
            },
            {
                context: "Three friends measure how much of their identical drawing sheets they have colored in class: Riya colored 1/3, Amit colored 2/3, and Sana colored 3/3. Who colored the largest part of their sheet?",
                visualType: null,
                options: ["Riya", "Amit", "Sana", "They all colored the same amount"],
                correctText: "Sana",
                hint: "When the bottom numbers are identical, compare the top numbers to see who completed more parts.",
                explanation: "3/3 means Sana colored 3 out of 3 equal parts, which is equal to finishing 1 whole drawing sheet."
            },
            {
                context: "Arjun wants to show 1/4 of a paper circle. He draws lines to cut it into 4 pieces and colors 1 piece yellow. Look at his shape. What mistake did Arjun make?",
                visualType: "unequal-circle",
                options: ["He colored too many parts.", "The 4 parts are not equal in size.", "He should have made only 2 parts.", "He made no mistake."],
                correctText: "The 4 parts are not equal in size.",
                hint: "Fractions can only show parts of a whole if all the broken parts are completely fair and identical.",
                explanation: "Fractions must always represent equal parts of a whole. Because Arjun's pieces are different sizes, it cannot represent 1/4."
            },
            {
                context: "Read both statements carefully:\n\nAssertion (A): 1/4 of a school ribbon is shorter than 1/2 of the exact same ribbon.\n\nReason (R): Cutting a whole into 4 equal pieces makes each piece smaller than cutting it into 2 equal pieces.",
                visualType: null,
                options: [
                    "Both A and R are correct, and R explains A perfectly.",
                    "Both A and R are correct, but R does not explain A.",
                    "A is correct, but R is wrong.",
                    "Both A and R are wrong."
                ],
                correctText: "Both A and R are correct, and R explains A perfectly.",
                hint: "If you share a single ribbon among 4 people instead of 2 people, do the shares get smaller or larger?",
                explanation: "The larger the denominator, the more pieces the whole object is divided into, making each single piece smaller."
            },
            {
                context: "Mother baked 12 identical cookies for the snack box. Rohan eats 1/4 of the total cookies, and Meera eats 2/4 of the total cookies. How many cookies did Meera eat from the box?",
                visualType: null,
                options: ["3 cookies", "4 cookies", "6 cookies", "8 cookies"],
                correctText: "6 cookies",
                hint: "Divide 12 cookies into 4 equal groups. Each group has 3 cookies. Meera took 2 of those groups.",
                explanation: "Dividing 12 cookies into 4 equal groups gives 3 cookies per group (1/4 = 3). Since Meera ate 2 groups, she ate 3 + 3 = 6 cookies."
            },
            {
                context: "In a box of snacks, Rohan eats 1/4 of the cookies and Meera eats 2/4 of the cookies. What total fraction of the cookie box did both children finish together?",
                visualType: null,
                options: ["1/4 of the box", "2/4 of the box", "3/4 of the box", "4/4 of the box"],
                correctText: "3/4 of the box",
                hint: "Since they are like fractions sharing the same bottom number, simply add the top numbers together.",
                explanation: "Adding 1/4 and 2/4 directly gives 3/4. Together they ate three-fourths of the full cookie box."
            },
            {
                context: "A full cookie box is represented by the fraction 4/4. If some children finish eating a combined total fraction of 3/4 of the box, what remaining fraction of cookies is left over for Papa?",
                visualType: null,
                options: ["1/4 of the box", "2/4 of the box", "3/4 of the box", "No cookies are left"],
                correctText: "1/4 of the box",
                hint: "Start with the complete whole box fraction (4/4) and subtract the part that was already eaten (3/4).",
                explanation: "The full box is 1 whole (4/4). Subtracting the eaten share leaves 4/4 - 3/4 = 1/4 of the box for Papa."
            }
        ];

        // Active database instance that gets shuffled and randomized
        let database = [];

        let state = {
            currentIdx: 0,
            score: 0,
            attempts: 0,
            timer: null,
            timeLeft: 60
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('logo-screen').classList.remove('active');
                document.getElementById('intro-screen').classList.add('active');
            }, 5000);
        });

        // Fisher-Yates shuffle engine to randomize any target array
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuizData() {
            // Deep clone master list to ensure fresh state on play-again clicks
            database = masterDatabase.map(item => {
                return {
                    context: item.context,
                    visualType: item.visualType,
                    // Randomize order of individual options within the question item
                    options: shuffleArray([...item.options]),
                    correctText: item.correctText,
                    hint: item.hint,
                    explanation: item.explanation
                };
            });
            // Randomize whole question queue sequence layout
            shuffleArray(database);
        }

        function startQuiz() {
            prepareQuizData();
            document.getElementById('intro-screen').classList.remove('active');
            document.getElementById('quiz-module').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(state.timer);
            state.timeLeft = 60;
            state.attempts = 0;
            
            document.getElementById('current-q-num').innerText = state.currentIdx + 1;
            document.getElementById('current-score').innerText = state.score;
            document.getElementById('next-btn').style.display = 'none';
            
            const feedback = document.getElementById('feedback-message');
            feedback.style.display = 'none';
            feedback.className = 'feedback-box';

            const qData = database[state.currentIdx];
            document.getElementById('q-context').innerText = qData.context;

            const aidBox = document.getElementById('visual-aid-box');
            aidBox.innerHTML = '';
            
            if(qData.visualType === 'pizza') {
                aidBox.innerHTML = `<img src="assets/pizza.png" alt="Whole Pizza with Toppings" class="pizza-img">`;
            } else if(qData.visualType === 'window') {
                aidBox.innerHTML = `
                    <svg width="150" height="150" viewBox="0 0 100 100" style="background:#334155; border-radius:8px; padding:6px;">
                        <rect x="2" y="2" width="46" height="46" fill="#3B82F6" stroke="#0284C7" stroke-width="1"/>
                        <text x="25" y="30" font-size="16" text-anchor="middle">☁️</text>
                        <rect x="52" y="2" width="46" height="46" fill="#3B82F6" stroke="#0284C7" stroke-width="1"/>
                        <text x="75" y="30" font-size="16" text-anchor="middle">☁️</text>
                        <rect x="2" y="52" width="46" height="46" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
                        <rect x="52" y="52" width="46" height="46" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
                    </svg>`;
            } else if(qData.visualType === 'chocolate') {
                aidBox.innerHTML = `
                    <svg width="220" height="65" viewBox="0 0 160 45" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));">
                        <rect x="2" y="2" width="36" height="40" rx="4" fill="#7A431D" stroke="#5C3214" stroke-width="1.5"/>
                        <rect x="7" y="6" width="26" height="32" rx="2" fill="#8B4F26"/>
                        <rect x="41" y="2" width="36" height="40" rx="4" fill="#7A431D" stroke="#5C3214" stroke-width="1.5"/>
                        <rect x="46" y="6" width="26" height="32" rx="2" fill="#8B4F26"/>
                        <rect x="80" y="2" width="36" height="40" rx="4" fill="#7A431D" stroke="#5C3214" stroke-width="1.5"/>
                        <rect x="85" y="6" width="26" height="32" rx="2" fill="#8B4F26"/>
                        <rect x="119" y="2" width="36" height="40" rx="4" fill="#7A431D" stroke="#5C3214" stroke-width="1.5"/>
                        <rect x="124" y="6" width="26" height="32" rx="2" fill="#8B4F26"/>
                    </svg>`;
            } else if(qData.visualType === 'unequal-circle') {
                aidBox.innerHTML = `
                    <svg width="140" height="140" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="46" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
                        <path d="M 50 50 L 25 50 A 46 46 0 0 1 50 4" fill="#FCD34D" />
                        <line x1="25" y1="4" x2="25" y2="96" stroke="#64748B" stroke-width="2.5"/>
                        <line x1="4" y1="50" x2="96" y2="50" stroke="#64748B" stroke-width="2.5"/>
                    </svg>`;
            }

            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            qData.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleSelection(opt, btn);
                optBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            const bar = document.getElementById('timer-bar-inner');
            bar.style.width = '100%';
            
            state.timer = setInterval(() => {
                state.timeLeft--;
                bar.style.width = `${(state.timeLeft / 60) * 100}%`;
                
                if(state.timeLeft <= 0) {
                    clearInterval(state.timer);
                    forceRevealTimeout();
                }
            }, 1000);
        }

        function handleSelection(selectedText, selectedBtn) {
            const qData = database[state.currentIdx];
            const feedback = document.getElementById('feedback-message');
            
            // Evaluates text payload directly rather than indexes to stay dynamic
            if(selectedText === qData.correctText) {
                clearInterval(state.timer);
                playSound('claps');
                triggerConfetti();
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if(state.attempts === 0) state.score += 10;
                else state.score += 5;
                
                document.getElementById('current-score').innerText = state.score;
                feedback.className = 'feedback-box reveal';
                feedback.innerHTML = `<strong>🌟 Correct!</strong> ${qData.explanation}`;
                feedback.style.display = 'block';
                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                state.attempts++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if(state.attempts === 1) {
                    feedback.className = 'feedback-box hint';
                    feedback.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    feedback.style.display = 'block';
                } else {
                    clearInterval(state.timer);
                    disableAllOptions();
                    feedback.className = 'feedback-box reveal';
                    feedback.style.borderLeft = '4px solid var(--error-color)';
                    feedback.innerHTML = `<strong>Let's learn:</strong> The correct answer is <strong>${qData.correctText}</strong>.<br><br>${qData.explanation}`;
                    feedback.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'inline-block';
                }
            }
        }

        function forceRevealTimeout() {
            disableAllOptions();
            const qData = database[state.currentIdx];
            const feedback = document.getElementById('feedback-message');
            feedback.className = 'feedback-box reveal';
            feedback.style.borderLeft = '4px solid var(--secondary-color)';
            feedback.innerHTML = `<strong>⏰ Time's up!</strong> The correct answer is <strong>${qData.correctText}</strong>.<br><br>${qData.explanation}`;
            feedback.style.display = 'block';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function disableAllOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        function playSound(type) {
            const snd = document.getElementById(`audio-${type}`);
            if(snd) {
                snd.currentTime = 0;
                snd.play().catch(() => {});
            }
        }

        function loadNextQuestion() {
            state.currentIdx++;
            if(state.currentIdx < database.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-module').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.classList.add('active');

            const scorePct = (state.score / 100) * 100;
            document.getElementById('result-score-text').innerText = `Your Total Score: ${state.score} Points`;

            const emoji = document.getElementById('result-emoji');
            const txt = document.getElementById('result-feedback');

            if(scorePct >= 75) {
                emoji.innerText = "🏆";
                txt.innerText = "Good job!";
            } else if(scorePct >= 40) {
                emoji.innerText = "🔄";
                txt.innerText = "Review this chapter and try again";
            } else {
                emoji.innerText = "📚";
                txt.innerText = "Let’s practise more";
            }
        }

        function resetQuiz() {
            state.currentIdx = 0;
            state.score = 0;
            document.getElementById('result-screen').classList.remove('active');
            startQuiz();
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            let particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: `hsl(${Math.random() * 360}, 90%, 60%)`,
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }

            let animationFrameId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let remaining = false;
                
                particles.forEach((p) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - p.r/2) * 5;

                    if (p.y <= canvas.height) remaining = true;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r/2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/2);
                    ctx.stroke();
                });

                if (remaining) {
                    animationFrameId = requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrameId);
                }
            }
            draw();
        }
    </script>
</body>
