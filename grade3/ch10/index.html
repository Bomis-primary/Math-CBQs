<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Fractions Quest</title>
    <style>
        :root { --primary: #6d28d9; --secondary: #a78bfa; --success: #059669; --danger: #e11d48; --warning: #d97706; --background: #f5f3ff; --surface: #ffffff; --text: #1e1b4b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--background); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 650px; background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .screen { display: none; } .screen.active { display: block; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e5e7eb; border-radius: 10px; background: white; cursor: pointer; text-align: left; }
        .action-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .feedback-box { padding: 15px; margin: 10px 0; border-radius: 10px; display: none; }
        .hint { background: #fffbeb; border-left: 5px solid var(--warning); }
        .explanation { background: #eff6ff; border-left: 5px solid #3b82f6; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="grade3/ch10/assets/logo.png" alt="Logo" style="max-width: 200px;">
        <h2 style="color: var(--primary);">Loading...</h2>
    </div>

    <audio id="audio-correct" src="grade3/ch10/assets/claps.mp3"></audio>
    <audio id="audio-wrong" src="grade3/ch10/assets/wrong.mp3"></audio>

    <div class="container">
        <div id="welcome-screen" class="screen active">
            <h1>Fractions Masterclass</h1>
            <button class="action-btn" onclick="startInteractive()">Start Quest</button>
        </div>

        <div id="game-screen" class="screen">
            <h3 id="progress-text">Question 1/12</h3>
            <p id="target-question" style="margin: 20px 0; font-size: 1.2rem;"></p>
            <div id="target-options"></div>
            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>
            <button id="next-btn" class="action-btn" style="display: none; margin-top: 20px;" onclick="advanceQuestion()">Next</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Quest Complete!</h2>
            <button class="action-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Force hide splash screen after 3 seconds just in case
        window.addEventListener('load', () => setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 3000));

        const questionBank = [
            { question: "Pooja cuts a pizza into 4 equal slices. She eats 3 of those slices. What fraction of the pizza did she eat?", options: ["1/2", "1/4", "3/4", "4/3"], answer: 2, explanation: "She ate 3 out of 4 slices, which is 3/4." },
            { question: "If a rectangle is divided into 2 equal parts and 1 part is shaded, what fraction is shaded?", options: ["1/4", "1/2", "2/2", "3/4"], answer: 1, explanation: "1 out of 2 is 1/2." },
            { question: "In the fraction 2/4, what is the number '4' called?", options: ["Numerator", "Whole Number", "Denominator", "Like Fraction"], answer: 2, explanation: "The bottom number is the denominator." },
            { question: "Half of 8 marbles is how many?", options: ["2", "4", "6", "8"], answer: 1, explanation: "8 ÷ 2 = 4." },
            { question: "Fractions with the same denominator are called what?", options: ["Unlike", "Equal", "Like", "Whole"], answer: 2, explanation: "They are called Like fractions." },
            { question: "Which is larger, 1/3 or 1/4?", options: ["1/3", "1/4", "Equal", "Cannot tell"], answer: 0, explanation: "1/3 is larger than 1/4." },
            { question: "Which is smaller, 2/7 or 5/7?", options: ["2/7 is equal", "2/7 is greater", "2/7 is smaller", "None"], answer: 2, explanation: "2 is less than 5, so 2/7 is smaller." },
            { question: "How many fourths make a half?", options: ["1", "2", "3", "4"], answer: 1, explanation: "2/4 equals 1/2." },
            { question: "Where is the numerator located?", options: ["Top", "Bottom", "Middle", "Side"], answer: 0, explanation: "The numerator is the top number." },
            { question: "Why is 1/5 smaller than 1/2?", options: ["1 is smaller", "5 is bigger", "More parts mean smaller pieces", "They are equal"], answer: 2, explanation: "More parts mean smaller pieces." },
            { question: "Kabir uses 1/4 of his 12 apples. How many did he use?", options: ["2", "3", "4", "6"], answer: 1, explanation: "12 ÷ 4 = 3." },
            { question: "Kabir used 3 apples from 12. What fraction is left?", options: ["1/4", "2/4", "3/4", "4/4"], answer: 2, explanation: "9 left out of 12 is 3/4." }
        ];

        let currentIndex = 0;
        function startInteractive() { document.getElementById('welcome-screen').classList.remove('active'); document.getElementById('game-screen').classList.add('active'); displayQuestion(); }
        
        function displayQuestion() {
            let q = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1}/12`;
            document.getElementById('target-question').innerText = q.question;
            document.getElementById('target-options').innerHTML = '';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            q.options.forEach((opt, i) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    document.getElementById('explain-feedback').innerText = q.explanation;
                    document.getElementById('explain-feedback').style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                    if(i === q.answer) { document.getElementById('audio-correct').play(); } else { document.getElementById('audio-wrong').play(); }
                };
                document.getElementById('target-options').appendChild(btn);
            });
        }
        
        function advanceQuestion() { currentIndex++; currentIndex < 12 ? displayQuestion() : (document.getElementById('game-screen').style.display = 'none', document.getElementById('result-screen').classList.add('active')); }
    </script>
</body>
</html>
