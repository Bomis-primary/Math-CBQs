<script>
    const questionBank = [
        {
            type: "Conceptual Parts of Whole",
            question: "Pooja cuts a complete circular pizza into 4 identical, equal-sized slices. She eats 3 of those slices with her friends. What numerical fraction of the pizza did they eat?",
            options: [
                "One-half (1/2)", // Cleaned up control characters (\u001f)
                "One-fourth (1/4)",
                "Three-fourths (3/4)",
                "Four-thirds (4/3)"
            ],
            answer: 2,
            hint: "Count how many slices were eaten out of the total number of equal slices.",
            explanation: "The pizza is divided into 4 equal slices (denominator). They ate 3 slices (numerator). This is written as $\\frac{3}{4}$, which means three-fourths."
        },
        {
            type: "Visual 2D Shapes Interpretation",
            question: "Imagine a perfect rectangle divided into 2 completely equal vertical strips. If exactly 1 of these strips is shaded blue, what fraction represents the shaded region?",
            options: [ "1/4", "1/2", "2/2", "3/4" ],
            answer: 1,
            hint: "1 out of 2 equal parts is colored. This is also called a half.",
            explanation: "When 1 part out of 2 equal divisions is shaded, it represents exactly half of the complete figure, written mathematically as $\\frac{1}{2}$."
        },
        {
            type: "Vocabulary & Properties",
            question: "In the fraction 2/4, what is the specific mathematical term used for the bottom number '4'?",
            options: [ "Numerator", "Whole Number", "Denominator", "Like Fraction" ],
            answer: 2,
            hint: "The top number shows selected parts, while the bottom number states the total parts in the whole.",
            explanation: "The bottom number in a fraction is called the denominator. It tells us the total number of equal parts the whole is divided into."
        },
        {
            type: "Real-Life Application",
            question: "Rohan has a pack of 8 identical marbles. He gives exactly half of his total marbles to his sister Maya. How many marbles does Maya receive?",
            options: [ "2 marbles", "4 marbles", "6 marbles", "8 marbles" ],
            answer: 1,
            hint: "Finding half means dividing the total group of items into 2 equal parts.",
            explanation: "To find a half ($\\frac{1}{2}$) of 8, divide 8 by 2. $8 \\div 2 = 4$. Maya gets 4 marbles."
        },
        {
            type: "Like vs Unlike Classification",
            question: "Look closely at this group of fractions: 1/5, 3/5, and 4/5. Because they all share the exact same denominator, what specific name are they given?",
            options: [ "Unlike fractions", "Equal fractions", "Like fractions", "Whole fractions" ],
            answer: 2,
            hint: "Fractions that have identical numbers at the bottom are grouped under this name.",
            explanation: "Fractions that have the same denominator are called 'Like fractions'. They are easy to add, subtract, and compare."
        },
        {
            type: "Fraction Wall Comparison",
            question: "Using a fraction wall model, compare 1/3 and 1/4. If you have two bars of identical length, one split into 3 parts and the other into 4 parts, which part is larger?",
            options: [
                "1/3 is larger than 1/4",
                "1/4 is larger than 1/3",
                "1/3 and 1/4 are perfectly equal",
                "It is impossible to tell without numbers"
            ],
            answer: 0,
            hint: "If a whole cake is shared among 3 people, do they get bigger or smaller pieces than if shared among 4 people?",
            explanation: "When denominators are different but numerators are equal to 1, the fraction with the smaller denominator is larger. Thus, $\\frac{1}{3} > \\frac{1}{4}$."
        },
        {
            type: "Same Denominator Reasoning",
            question: "Compare the two like fractions 2/7 and 5/7. Which statement correctly identifies the relationship?",
            options: [
                "2/7 is equal to 5/7",
                "2/7 is greater than 5/7",
                "2/7 is smaller than 5/7",
                "The denominators must be added first"
            ],
            answer: 2,
            hint: "When denominators match, simply compare the numerators. Is 2 smaller or larger than 5?",
            explanation: "Since both fractions have the same denominator (7), we compare the numerators. 2 is less than 5, so $\\frac{2}{7}$ is smaller than $\\frac{5}{7}$."
        },
        {
            type: "Equivalent Fraction Discovery",
            question: "You have a rectangular strip with 1/2 shaded. Another identical strip is divided into 4 equal blocks. How many blocks must you shade to cover the exact same area as 1/2?",
            options: [ "1 block", "2 blocks", "3 blocks", "4 blocks" ],
            answer: 1,
            hint: "Find a fraction with a denominator of 4 that equals a half. Shading how many fourths makes a half?",
            explanation: "Two-fourths ($\\frac{2}{4}$) is equal in size to one-half ($\\frac{1}{2}$). Therefore, you need to shade exactly 2 blocks."
        },
        {
            type: "Error Detection Challenge",
            question: "Anu is writing down mathematical statements about fractions. Which statement written below is completely INCORRECT?",
            options: [
                "1/2 of an object is one of two equal parts.",
                "In a fraction, the numerator is always written on the bottom.",
                "3/4 means three parts out of four equal parts.",
                "Fractions with different denominators are called unlike fractions."
            ],
            answer: 1,
            hint: "Think about the layout of a fraction. Is the numerator on the top or on the bottom?",
            explanation: "The incorrect statement is that the numerator is written on the bottom. The numerator is always the top number; the denominator is on the bottom."
        },
        {
            type: "Assertion & Reason Logic",
            question: "Assertion: 1/5 is smaller than 1/2.\nReason: When dividing a whole into more parts, each individual part becomes smaller in size.",
            options: [
                "Both Assertion and Reason are true, and the Reason explains the Assertion perfectly.",
                "Both Assertion and Reason are true, but the Reason does not explain the Assertion.",
                "The Assertion is true, but the Reason is false.",
                "The Assertion is completely false."
            ],
            answer: 0,
            hint: "Think about dividing a chocolate bar among 5 people versus sharing it with just 1 friend.",
            explanation: "Both statements are correct. Dividing a whole into 5 pieces makes each piece much smaller than dividing it into just 2 pieces. Hence, $\\frac{1}{5} < \\frac{1}{2}$."
        },
        {
            type: "Multi-Step Story Problem (Part 1)",
            question: "Case Story Part 1: Kabir has a basket containing 12 fresh apples. He uses exactly one-fourth (1/4) of the apples to bake a small pie. How many apples did he take out for the pie?",
            options: [ "2 apples", "3 apples", "4 apples", "6 apples" ],
            answer: 1,
            hint: "To find one-fourth of a collection, divide the total number of items by 4.",
            explanation: "One-fourth ($\\frac{1}{4}$) of 12 apples is found by calculating $12 \\div 4 = 3$. Kabir uses 3 apples."
        },
        {
            type: "Multi-Step Story Problem (Part 2)",
            question: "Case Story Part 2: Kabir started with 12 apples and used 3 of them to make the pie in Part 1. What fraction of the original 12 apples does he have left inside the basket?",
            options: [ "1/4", "2/4", "3/4", "4/4" ],
            answer: 2,
            hint: "If 1/4 of the apples are taken away from a whole (4/4), how many fourths are left?",
            explanation: "Since 3 apples out of 12 were used, 9 apples remain ($12 - 3 = 9$). 9 apples represent $\\frac{3}{4}$ (three-fourths) of the original 12 apples."
        }
    ];

    let currentIndex = 0;
    let runningScore = 0;
    let attemptTracker = 0; 
    let countdownTimer;
    let activeSeconds = 60;

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
        }, 5000); 
    });

    function startInteractive() {
        document.getElementById('welcome-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        displayQuestion();
    }

    function displayQuestion() {
        clearInterval(countdownTimer);
        activeSeconds = 60; 
        attemptTracker = 0;
        
        document.getElementById('timer-counter').innerText = activeSeconds;
        document.getElementById('hint-feedback').style.display = 'none';
        document.getElementById('explain-feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        let qData = questionBank[currentIndex];
        document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
        document.getElementById('target-question').innerText = `[${qData.type}]\n${qData.question}`;
        
        const optionsBox = document.getElementById('target-options');
        optionsBox.innerHTML = '';

        qData.options.forEach((optText, index) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
            optionsBox.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        countdownTimer = setInterval(() => {
            activeSeconds--;
            document.getElementById('timer-counter').innerText = activeSeconds;
            if(activeSeconds <= 0) {
                clearInterval(countdownTimer);
                lockButtonsOnTimeout();
            }
        }, 1000);
    }

    function lockButtonsOnTimeout() {
        let qData = questionBank[currentIndex];
        disableAllOptions();
        const explBox = document.getElementById('explain-feedback');
        explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
        explBox.style.display = 'block';
        playSound('wrong');
        document.getElementById('next-btn').style.display = 'block';
    }

    function evaluateSelection(selectedBtn, chosenIdx) {
        let qData = questionBank[currentIndex];
        
        if (chosenIdx === qData.answer) {
            clearInterval(countdownTimer);
            selectedBtn.classList.add('correct');
            disableAllOptions();
            
            if (attemptTracker === 0) {
                runningScore++;
                document.getElementById('score-text').innerText = `Score: ${runningScore}`;
            }
            
            triggerSparkles();
            playSound('correct');
            
            // Clean UX Fix: Clear hint display when correct answer is found
            document.getElementById('hint-feedback').style.display = 'none';

            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';

        } else {
            attemptTracker++;
            selectedBtn.classList.add('wrong');
            selectedBtn.disabled = true;
            playSound('wrong');

            if (attemptTracker === 1) {
                const hintBox = document.getElementById('hint-feedback');
                hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                hintBox.style.display = 'block';
            } else {
                clearInterval(countdownTimer);
                disableAllOptions();
                
                const optionsList = document.getElementById('target-options').children;
                optionsList[qData.answer].classList.add('correct');

                document.getElementById('hint-feedback').style.display = 'none';

                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';
            }
        }
    }

    function disableAllOptions() {
        const buttons = document.getElementsByClassName('option-btn');
        for(let btn of buttons) {
            btn.disabled = true;
        }
    }

    function playSound(type) {
        const audio = document.getElementById(`audio-${type}`);
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio contextual restrictions block playback until user interaction."));
        }
    }

    function advanceQuestion() {
        currentIndex++;
        if (currentIndex < questionBank.length) {
            displayQuestion();
        } else {
            showFinalResults();
        }
    }

    function showFinalResults() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
        
        let finalPercentage = (runningScore / questionBank.length) * 100;
        let statusText = "";

        if (finalPercentage >= 75) {
            statusText = "Good job!";
        } else if (finalPercentage >= 40) {
            statusText = "Review this chapter and try again.";
        } else {
            statusText = "Let’s practise more.";
        }
        
        document.getElementById('final-status-msg').innerText = statusText;
    }

    function resetInteractive() {
        currentIndex = 0;
        runningScore = 0;
        document.getElementById('score-text').innerText = `Score: 0`;
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('welcome-screen').classList.add('active');
    }

    // Optimized Particle System Engine (Backward iteration fix applied)
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerSparkles() {
        resizeCanvas();
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: Math.random() * 4 + 2,
                color: `hsl(${Math.random() * 40 + 260}, 90%, 65%)`,
                speedX: (Math.random() - 0.5) * 8,
                speedY: (Math.random() - 0.5) * 8,
                alpha: 1
            });
        }
        renderParticles();
    }

    function renderParticles() {
        if (particles.length === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Loop backward to safely remove array items via splice without skipping indices
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.speedX;
            p.y += p.speedY;
            p.alpha -= 0.02;
            
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();

            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        if (particles.length > 0) {
            requestAnimationFrame(renderParticles);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }
</script>
