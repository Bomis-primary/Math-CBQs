<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Geometry Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #F8FAFC;
            color: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        .splash-logo { 
            max-width: 260px; 
            height: auto; 
            margin-bottom: 25px;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #3B82F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- QUIZ CONTAINER --- */
        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 700;
            color: #64748B;
            font-size: 0.95rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #EFF6FF;
            border-color: #3B82F6;
            color: #1D4ED8;
        }

        .option-btn.correct {
            background: #DCFCE7 !important;
            border-color: #22C55E !important;
            color: #15803D !important;
        }

        .option-btn.incorrect {
            background: #FEE2E2 !important;
            border-color: #EF4444 !important;
            color: #B91C1C !important;
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #E2E8F0;
            padding-top: 20px;
        }

        .next-btn {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background: #2563EB;
        }

        .score-display, .feedback-msg {
            font-weight: 700;
            font-size: 1rem;
        }

        /* --- START & RESULT SCREENS --- */
        .center-card {
            text-align: center;
            display: none;
        }

        .center-card h2 {
            font-size: 1.8rem;
            color: #0F172A;
            margin-bottom: 12px;
        }

        .center-card p {
            color: #64748B;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .primary-btn {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: #2563EB;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN (5 Seconds) -->
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo">
        <div class="loader-spinner"></div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="quiz-card center-card" style="display: block;">
        <h2>Grade 3 Geometry Quiz</h2>
        <p>Test your knowledge of lines, shapes, open/closed figures, and 3D attributes[cite: 1].</p>
        <button class="primary-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- QUIZ CARD -->
    <div id="quiz-card" class="quiz-card">
        <div class="quiz-header">
            <span id="question-counter">Question 1 of 12</span>
            <span id="score-tracker">Score: 0</span>
        </div>
        <div class="question-text" id="question-container">Loading question...</div>
        <div class="options-list" id="options-container"></div>
        <div class="footer-nav">
            <span class="feedback-msg" id="feedback-txt"></span>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="quiz-card center-card">
        <h2>Quiz Completed!</h2>
        <p id="final-score-text">You scored 0 out of 12</p>
        <button class="primary-btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="snd-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // 5-Second Splash Screen Timer
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.remove();
                }, 400);
            }
        }, 5000);

        // Grade 3 Geometry Question Pool[cite: 1]
        const questions = [
            { question: "If a line extends indefinitely in both directions, which of the following is correct?", correct: "C) It has no endpoints.", options: ["A) It has two endpoints.", "B) It has one endpoint.", "C) It has no endpoints.", "D) It is a line segment."] },
            { question: "You are drawing a line segment exactly 7 cm long. Which tool is essential?", correct: "B) A ruler", options: ["A) A pencil only", "B) A ruler", "C) A compass", "D) A protractor"] },
            { question: "Which of the following best describes a ray?", correct: "C) A path that starts at one point and extends indefinitely in one direction.", options: ["A) A path with two endpoints that can be measured.", "B) A path that extends indefinitely in both directions.", "C) A path that starts at one point and extends indefinitely in one direction.", "D) A path that has no beginning or end."] },
            { question: "Two lines cross each other at a single point. What is this point called?", correct: "B) The point of intersection", options: ["A) A vertex", "B) The point of intersection", "C) An endpoint", "D) A line segment"] },
            { question: "A shape is described as having 3 sides and 3 vertices. Which shape is it?", correct: "C) A triangle", options: ["A) A square", "B) A rectangle", "C) A triangle", "D) A circle"] },
            { question: "A square is a special type of rectangle. What is the main property that makes it special?", correct: "C) All 4 sides are equal.", options: ["A) It has 4 vertices.", "B) Its opposite sides are equal.", "C) All 4 sides are equal.", "D) It has no sides."] },
            { question: "Which of the following figures is an example of an open figure?", correct: "C) The letter 'C'", options: ["A) A circle", "B) A triangle", "C) The letter 'C'", "D) A rectangle"] },
            { question: "Which solid shape has 6 faces where all faces are squares of the same size?", correct: "B) Cube", options: ["A) Cuboid", "B) Cube", "C) Cylinder", "D) Sphere"] },
            { question: "A cone has how many flat circular faces and how many curved surfaces?", correct: "A) 1 flat circular face and 1 curved surface", options: ["A) 1 flat circular face and 1 curved surface", "B) 2 flat circular faces and 0 curved surfaces", "C) 0 flat circular faces and 1 curved surface", "D) 1 flat circular face and 0 curved surfaces"] },
            { question: "What is a Tangram?", correct: "B) A Chinese puzzle made of geometrical pieces", options: ["A) A 3D building block set", "B) A Chinese puzzle made of geometrical pieces", "C) A drawing tool for geometry", "D) A type of ruler"] },
            { question: "If you are looking at a cylinder, how many edges and vertices does it have?", correct: "C) 2 edges, 0 vertices", options: ["A) 12 edges, 8 vertices", "B) 0 edges, 0 vertices", "C) 2 edges, 0 vertices", "D) 1 edge, 1 vertex"] },
            { question: "What property does a circle have that distinguishes it from a square?", correct: "C) It has no vertices.", options: ["A) It has 4 corners.", "B) It has 4 sides.", "C) It has no vertices.", "D) It has 3 sides."] }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function startQuiz() {
            currentIndex = 0;
            score = 0;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-txt').innerText = '';

            const q = questions[currentIndex];
            document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
            document.getElementById('question-container').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => selectOption(btn, optionText, q.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, chosen, correct) {
            if (answered) return;
            answered = true;

            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correct) {
                    btn.classList.add('correct');
                }
            });

            const feedback = document.getElementById('feedback-txt');
            if (chosen === correct) {
                selectedBtn.classList.add('correct');
                score++;
                feedback.innerText = 'Correct! 🎉';
                feedback.style.color = '#16A34A';
                playSound('correct');
            } else {
                selectedBtn.classList.add('incorrect');
                feedback.innerText = 'Incorrect.';
                feedback.style.color = '#DC2626';
                playSound('wrong');
            }

            document.getElementById('score-tracker').innerText = `Score: ${score}`;
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-card').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';
            document.getElementById('final-score-text').innerText = `You scored ${score} out of ${questions.length}`;
        }

        function restartQuiz() {
            document.getElementById('result-screen').style.display = 'none';
            startQuiz();
        }

        function playSound(type) {
            try {
                const audio = document.getElementById(type === 'correct' ? 'snd-correct' : 'snd-wrong');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }
            } catch (e) {
                console.log(e);
            }
        }
    </script>
</body>
</html>
