<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Geometry Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #16A34A;
            --error: #DC2626;
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 30px;
            position: relative;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            text-align: center;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 24px;
            text-align: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* Quiz Header & Progress */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Options List */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 2px solid var(--border);
            padding: 14px 18px;
            text-align: left;
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #EFF6FF;
        }

        .option-btn.correct {
            background-color: #DCFCE7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
        }

        .option-btn.incorrect {
            background-color: #FEE2E2 !important;
            border-color: var(--error) !important;
            color: #991B1B !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Feedback Message */
        .feedback-box {
            min-height: 24px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Results Screen */
        .results-card {
            text-align: center;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Grade 3 Geometry Quiz</h1>
            <p>Test your knowledge of lines, shapes, and figures. You will have up to two attempts for each question. Let's get started!</p>
            <button class="btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Question Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 12</span>
                <span id="score-counter">Score: 0</span>
            </div>
            <div id="question-container" class="question-text">Question text goes here...</div>
            <div id="options-container" class="options-list"></div>
            <div id="feedback" class="feedback-box"></div>
            <button id="next-btn" class="btn" style="display: none;" onclick="nextQuestion()">Next Question</button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen results-card">
            <h1>Quiz Complete!</h1>
            <p>Great job completing the geometry assessment.</p>
            <div id="final-score" class="score-display">0 / 12</div>
            <button class="btn" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // Quiz Data extracted directly from source[cite: 1]
        const questions = [
            { question: "If a line extends indefinitely in both directions, which of the following is correct?", correct: "C) It has no endpoints.", options: ["A) It has two endpoints.", "B) It has one endpoint.", "C) It has no endpoints.", "D) It is a line segment."] },
            { question: "You are drawing a line segment exactly 7 cm long on a paper. Which tool is essential to ensure the length is accurate?", correct: "B) A ruler", options: ["A) A pencil only", "B) A ruler", "C) A compass", "D) A protractor"] },
            { question: "Which of the following best describes a ray?", correct: "C) A path that starts at one point and extends indefinitely in one direction.", options: ["A) A path with two endpoints that can be measured.", "B) A path that extends indefinitely in both directions.", "C) A path that starts at one point and extends indefinitely in one direction.", "D) A path that has no beginning or end."] },
            { question: "Two lines cross each other at a single point. What is this point called?", correct: "B) The point of intersection", options: ["A) A vertex", "B) The point of intersection", "C) An endpoint", "D) A line segment"] },
            { question: "A shape is described as having 3 sides and 3 vertices. Which shape is it?", correct: "C) A triangle", options: ["A) A square", "B) A rectangle", "C) A triangle", "D) A circle"] },
            { question: "A square is a special type of rectangle. What is the main property that makes it special?", correct: "C) All 4 sides are equal.", options: ["A) It has 4 vertices.", "B) Its opposite sides are equal.", "C) All 4 sides are equal.", "D) It has no sides."] },
            { question: "Which of the following figures is an example of an open figure?", correct: "C) The letter 'C'", options: ["A) A circle", "B) A triangle", "C) The letter 'C'", "D) A rectangle"] },
            { question: "Which solid shape has 6 faces where all faces are squares of the same size?", correct: "B) Cube", options: ["A) Cuboid", "B) Cube", "C) Cylinder", "D) Sphere"] },
            { question: "A cone has how many flat circular faces and how many curved surfaces?", correct: "A) 1 flat circular face and 1 curved surface", options: ["A) 1 flat circular face and 1 curved surface", "B) 2 flat circular faces and 0 curved surfaces", "C) 0 flat circular faces and 1 curved surface", "D) 1 flat circular face and 0 curved surfaces"] },
            { question: "What is a Tangram?", correct: "B) A Chinese puzzle made of geometrical pieces", options: ["A) A 3D building block set", "B) A Chinese puzzle made of geometrical pieces", "C) A drawing tool for geometry", "D) A type of ruler"] },
            { question: "If you are looking at a cylinder, how many edges and vertices does it have?", correct: "C) 2 edges, 0 vertices", options: ["A) 12 edges, 8 vertices", "B) 0 edges, 0 vertices", "C) 2 edges, 0 vertices", "D) 1 edge, 1 vertex"] },
            { question: "What property does a circle have that distinguishes it from a square?", correct: "C) It has no vertices.", options: ["A) It has 4 corners.", "B) It has 4 sides.", "C) It has no vertices.", "D) It has 3 sides."] }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attempts = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            attempts = 0;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = 'none';

            const q = questions[currentQuestionIndex];
            document.getElementById('question-counter').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('score-counter').innerText = `Score: ${score}`;
            document.getElementById('question-container').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => selectOption(btn, optionText);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(btn, selectedText) {
            const q = questions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');

            if (selectedText === q.correct) {
                // Correct Answer
                btn.classList.add('correct');
                feedback.style.color = 'var(--success)';
                feedback.innerText = 'Correct! Great job.';
                score++;
                document.getElementById('score-counter').innerText = `Score: ${score}`;
                disableAllOptions();
                showNextButton();
            } else {
                // Incorrect Answer
                attempts++;
                if (attempts === 1) {
                    // First incorrect attempt: give second chance
                    btn.classList.add('incorrect');
                    btn.disabled = true;
                    feedback.style.color = 'var(--error)';
                    feedback.innerText = 'Incorrect. Try one more time!';
                } else {
                    // Second incorrect attempt: reveal correct answer
                    btn.classList.add('incorrect');
                    disableAllOptions();
                    highlightCorrectAnswer(q.correct);
                    feedback.style.color = 'var(--error)';
                    feedback.innerText = `Incorrect. The correct answer is: ${q.correct}`;
                    showNextButton();
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
        }

        function highlightCorrectAnswer(correctText) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                if (b.innerText === correctText) {
                    b.classList.add('correct');
                }
            });
        }

        function showNextButton() {
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('results-screen').classList.add('active');
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        }

        function restartQuiz() {
            document.getElementById('results-screen').classList.remove('active');
            startQuiz();
        }
    </script>
</body>
</html>
