<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 – Chapter 1: Number System up to 9999 Assessment</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #ecc94b;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        header {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 1rem;
        }

        .mute-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            font-weight: bold;
        }
        .timer-badge {
            color: var(--danger);
        }

        .quiz-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .question-number {
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .svg-container {
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-btn.correct {
            border-color: var(--success) !important;
            background-color: #d1fae5 !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            border-color: var(--danger) !important;
            background-color: #fee2e2 !important;
            color: #991b1b !important;
        }

        .feedback-box {
            margin-top: 1.25rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #feebc8;
            border-left: 4px solid var(--warning);
            color: #744210;
        }

        .feedback-box.explanation {
            background-color: #edf2f7;
            border-left: 4px solid var(--primary);
            color: var(--text);
        }

        .submit-container {
            text-align: center;
            margin: 2.5rem 0;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(37 99 235 / 0.2);
            transition: background-color 0.2s ease;
        }

        .action-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        #results-card {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 2px solid #bfdbfe;
            text-align: center;
            padding: 3rem 2rem;
            border-radius: 12px;
            display: none;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1rem 0;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        #brand-splash {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--surface);
            z-index: 9999;
        }
        #brand-splash img {
            max-width: 250px;
            height: auto;
        }
    </style>
</head>
<body>

<div id="brand-splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div class="container" id="main-content" style="display: none;">
    <canvas id="confetti-canvas"></canvas>

    <div class="controls-header">
        <div></div>
        <button class="mute-btn" id="mute-toggle" onclick="toggleMute()">🔊 Sound On</button>
    </div>

    <header id="quiz-header">
        <h1>Grade 3 – Chapter 1: Number System up to 9999</h1>
    </header>

    <div id="game-container" style="display: none;">
        <div class="hud-bar">
            <div>Score: <span id="hud-score">0</span> / 13</div>
            <div class="timer-badge">Time Left: <span id="hud-timer">60</span>s</div>
        </div>

        <div id="quiz-flow-container">
            <div id="active-question-wrapper"></div>
            
            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>
        </div>

        <div class="submit-container">
            <button type="button" id="next-action-btn" class="action-btn" style="display: none;" onclick="handleNextButton()">Next Question</button>
        </div>
    </div>

    <div id="intro-card" style="background: var(--surface); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); text-align: center;">
        <h2 style="color: var(--primary); margin-bottom: 1rem;">Ready to begin your number system adventure?</h2>
        <p style="margin-bottom: 2rem; color: var(--text-secondary);">You'll have 60 seconds per question with 2 attempts allowed for each task.</p>
        <button class="action-btn" onclick="startQuizFlow()">Start Assessment</button>
    </div>

    <div id="results-card">
        <h2>Assessment Complete!</h2>
        <div class="score-display"><span id="final-score">0</span> / 13</div>
        <p id="result-message" style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem;"></p>
        <button class="action-btn" onclick="restartQuizFlow()">Try Again</button>
    </div>
</div>

<audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
<audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

<script>
    const questionsData = [
        {
            text: "Which number is shown below in Base-10 blocks?",
            hasSvg: true,
            svgType: "blocks-346",
            options: ["346", "436", "364", "306"],
            answer: 0,
            hint: "Count how many hundred flats, ten rods, and unit cubes there are altogether.",
            explanation: "There are 3 flats (300), 4 rods (40), and 6 cubes (6), which combines to form 346."
        },
        {
            text: "Which number is marked by the blue question mark point on this open number line?",
            hasSvg: true,
            svgType: "timeline-250",
            options: ["240", "250", "260", "270"],
            answer: 1,
            hint: "The point sits exactly halfway between the markings for 200 and 300.",
            explanation: "The midpoint between 200 and 300 is found by calculating 200 + 50, which equals 250."
        },
        {
            text: "Which comparative statement below describes Stack A and Stack B accurately?",
            hasSvg: true,
            svgType: "stacks-coins",
            options: ["Both stacks are equal", "First stack (A) has more coins", "Second stack (B) has more coins", "Both have less than 5 coins"],
            answer: 1,
            hint: "Count the physical layer items on Stack A and compare them carefully against Stack B.",
            explanation: "Stack A contains 8 coins while Stack B has 6 coins, meaning Stack A has more."
        },
        {
            text: "Which mathematical expression below represents the expanded partition form of this collection?",
            hasSvg: true,
            svgType: "expanded-482",
            options: ["400 + 80 + 2", "40 + 80 + 2", "400 + 8 + 2", "480 + 2 + 2"],
            answer: 0,
            hint: "Write down the values separate: check hundreds blocks (400), rods (80), and single units (2).",
            explanation: "4 hundreds flats = 400. 8 tens rods = 80. 2 units = 2. Combined expanded notation is 400 + 80 + 2."
        },
        {
            text: "Which card below sits exactly in the middle position when arranged in increasing order (smallest to largest)?",
            hasSvg: true,
            svgType: "cards-order",
            options: ["235", "245", "254", "225"],
            answer: 1,
            hint: "Sort the values 235, 245, and 254 from the smallest value to the highest value first.",
            explanation: "The increasing sequence is 235, 245, 254. The middle number is 245."
        },
        {
            text: "Rohan token number at the counter has 5 hundreds, 0 tens, and 8 ones. What is his exact token number?",
            hasSvg: false,
            options: ["580", "508", "58", "805"],
            answer: 1,
            hint: "Set up your place value columns: H T O. Put 5 in Hundreds, 0 in Tens, and 8 in Ones.",
            explanation: "5 hundreds (500) + 0 tens (0) + 8 ones (8) produces the structural value 508."
        },
        {
            text: "A postman needs to deliver an item to a house labeled 'Seven thousand forty'. What digit sequence does he look for?",
            hasSvg: false,
            options: ["7400", "7040", "7004", "740"],
            answer: 1,
            hint: "Listen to placeholders. There are no spoken hundreds or ones, so place zeros there.",
            explanation: "Seven thousand forty is written as 7040. 7400 would be seven thousand four hundred."
        },
        {
            text: "Meera is collecting stamps. She has 999 stamps. Her father gives her 1 more stamp. How many stamps does she have now?",
            hasSvg: false,
            options: ["100 stamps", "1000 stamps", "9991 stamps", "9100 stamps"],
            answer: 1,
            hint: "What number comes immediately next when you add one single unit to 999?",
            explanation: "Adding 1 to 999 completes the ten, hundred, and thousand place transitions to make 1000."
        },
        {
            text: "Sana expanded the number 732 as: 70 + 30 + 2. What structural error did she make?",
            hasSvg: false,
            options: ["Wrong ones value", "She wrote 70 instead of 700 for Hundreds", "Wrong tens position value", "No mistake made"],
            answer: 1,
            hint: "Look at the digit 7. It stands in the hundreds slot column, not the tens slot.",
            explanation: "7 is in the hundreds column, meaning its placeholder value must be 700, not 70."
        },
        {
            text: "Karan writes the value 652. If he interchanges the digits in the hundreds place and the ones place, what new number is formed?",
            hasSvg: false,
            options: ["256", "562", "265", "625"],
            answer: 0,
            hint: "Swap the position of the digit 6 and the digit 2 completely, leaving the middle number 5 untouched.",
            explanation: "Moving 2 to the front and 6 to the back creates the value 256."
        },
        {
            text: "Anu sorts four boxes from smallest to largest: 345, 398, 376, 410. Which box breaks the sequence order?",
            hasSvg: false,
            options: ["345", "398", "376", "410"],
            answer: 2,
            hint: "Every value in an increasing order must be greater than the number before it. Is 376 larger than 398?",
            explanation: "376 is smaller than 398, so it is out of place. The right order is 345, 376, 398, 410."
        },
        {
            text: "Assertion (A): The number 840 is greater than 480. \nReason (R): 8 hundreds is greater than 4 hundreds.",
            hasSvg: false,
            options: ["Both A and R are true, and R correctly explains A", "Both true but R does not explain A", "A is true, R is false", "Both statements are false"],
            answer: 0,
            hint: "Check if 840 is greater than 480, and see if comparing hundreds proves it.",
            explanation: "When evaluating 3-digit numbers, we check hundreds columns first. Since 8 > 4, the logic matches perfectly."
        },
        {
            text: "Riya has three number cards: 4, 9, and 1. She wants to form the smallest possible 3-digit number using each card once. What is it?",
            hasSvg: false,
            options: ["941", "149", "194", "419"],
            answer: 1,
            hint: "To build the smallest possible value, write your digits down from the smallest up to the largest.",
            explanation: "Arranging digits 1, 4, and 9 in increasing sequence yields 149."
        }
    ];

    let currentIdx = 0;
    let totalScore = 0;
    let timerId = null;
    let secondsLeft = 60;
    let currentQuestionAttempts = 0;
    let soundMuted = false;

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            document.getElementById('brand-splash').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }, 5000);
    });

    function toggleMute() {
        soundMuted = !soundMuted;
        document.getElementById('mute-toggle').textContent = soundMuted ? "🔇 Muted" : "🔊 Sound On";
    }

    function triggerAudioEffect(status) {
        if (soundMuted) return;
        const player = document.getElementById(status === 'win' ? 'audio-correct' : 'audio-wrong');
        if (player) {
            player.currentTime = 0;
            player.play().catch(() => {});
        }
    }

    function startQuizFlow() {
        document.getElementById('intro-card').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        currentIdx = 0;
        totalScore = 0;
        renderQuestionBlock();
    }

    function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            secondsLeft--;
            document.getElementById('hud-timer').textContent = secondsLeft;
            if(secondsLeft <= 0) {
                clearInterval(timerId);
                revealCorrectAnswerAutomatically();
            }
        }, 1000);
    }

    function renderQuestionBlock() {
        currentQuestionAttempts = 0;
        secondsLeft = 60;
        document.getElementById('hud-timer').textContent = secondsLeft;
        document.getElementById('hud-score').textContent = totalScore;
        document.getElementById('hint-feedback').style.display = 'none';
        document.getElementById('explain-feedback').style.display = 'none';
        document.getElementById('next-action-btn').style.display = 'none';

        const q = questionsData[currentIdx];
        let svgMarkup = "";

        if (q.hasSvg) {
            if (q.svgType === 'blocks-346') {
                svgMarkup = `
                <svg viewBox="0 0 800 240" width="100%">
                    <rect width="800" height="240" fill="none" rx="12" stroke="#cbd5e1" stroke-width="2"/>
                    <defs>
                        <g id="cube-u"><rect width="10" height="10" fill="#38bdf8" stroke="#0284c7"/></g>
                        <g id="rod-t">
                            ${Array.from({length:10}, (_,i)=>`<g transform="translate(0,${i*11})"><use href="#cube-u"/></g>`).join('')}
                        </g>
                        <g id="flat-h">
                            ${Array.from({length:10}, (_,i)=>`<g transform="translate(${i*11},0)"><use href="#rod-t"/></g>`).join('')}
                        </g>
                    </defs>
                    <g transform="translate(30, 40)">
                        <text x="50" y="-10" font-size="14" font-weight="bold" fill="#475569">Hundreds (3)</text>
                        <g transform="translate(0,0)"><use href="#flat-h"/></g>
                        <g transform="translate(20,15)"><use href="#flat-h"/></g>
                        <g transform="translate(40,30)"><use href="#flat-h"/></g>
                    </g>
                    <g transform="translate(360, 40)">
                        <text x="40" y="-10" font-size="14" font-weight="bold" fill="#475569">Tens (4)</text>
                        <g transform="translate(0,0)"><use href="#rod-t"/></g>
                        <g transform="translate(20,0)"><use href="#rod-t"/></g>
                        <g transform="translate(40,0)"><use href="#rod-t"/></g>
                        <g transform="translate(60,0)"><use href="#rod-t"/></g>
                    </g>
                    <g transform="translate(580, 40)">
                        <text x="30" y="-10" font-size="14" font-weight="bold" fill="#475569">Ones (6)</text>
                        <g transform="translate(0,0)"><use href="#cube-u"/></g>
                        <g transform="translate(20,20)"><use href="#cube-u"/></g>
                        <g transform="translate(40,40)"><use href="#cube-u"/></g>
                        <g transform="translate(0,60)"><use href="#cube-u"/></g>
                    </g>
                </svg>`;
            } else if (q.svgType === 'timeline-250') {
                svgMarkup = `
                <svg viewBox="0 0 800 120" width="100%">
                    <rect width="800" height="120" fill="none" rx="12" stroke="#cbd5e1" stroke-width="2"/>
                    <line x1="100" y1="60" x2="700" y2="60" stroke="#1e293b" stroke-width="3"/>
                    <line x1="100" y1="50" x2="100" y2="70" stroke="#1e293b" stroke-width="3"/>
                    <text x="90" y="95" font-weight="bold" fill="#475569">200</text>
                    <line x1="400" y1="50" x2="400" y2="70" stroke="#2563eb" stroke-width="3"/>
                    <text x="395" y="40" font-weight="bold" fill="#2563eb" font-size="20">?</text>
                    <line x1="700" y1="50" x2="700" y2="70" stroke="#1e293b" stroke-width="3"/>
                    <text x="690" y="95" font-weight="bold" fill="#475569">300</text>
                </svg>`;
            } else if (q.svgType === 'stacks-coins') {
                svgMarkup = `
                <svg viewBox="0 0 800 160" width="100%">
                    <rect width="800" height="160" fill="none" rx="12" stroke="#cbd5e1" stroke-width="2"/>
                    <g transform="translate(250, 20)">
                        <text x="10" y="110" font-weight="bold">Stack A</text>
                        ${Array.from({length:8}, (_,i)=>`<ellipse cx="40" cy="${90 - i*10}" rx="25" ry="8" fill="#f59e0b" stroke="#b45309"/>`).join('')}
                    </g>
                    <g transform="translate(450, 20)">
                        <text x="10" y="110" font-weight="bold">Stack B</text>
                        ${Array.from({length:6}, (_,i)=>`<ellipse cx="40" cy="${90 - i*10}" rx="25" ry="8" fill="#34d399" stroke="#047857"/>`).join('')}
                    </g>
                </svg>`;
            } else if (q.svgType === 'expanded-482') {
                svgMarkup = `
                <svg viewBox="0 0 800 100" width="100%">
                    <rect width="800" height="100" fill="none" rx="12" stroke="#cbd5e1" stroke-width="2"/>
                    <text x="400" y="60" font-size="28" font-weight="bold" fill="#1e293b" text-anchor="middle">482</text>
                </svg>`;
            } else if (q.svgType === 'cards-order') {
                svgMarkup = `
                <svg viewBox="0 0 800 120" width="100%">
                    <rect width="800" height="120" fill="none" rx="12" stroke="#cbd5e1" stroke-width="2"/>
                    <g transform="translate(180, 25)">
                        <rect width="100" height="70" rx="8" fill="#3b82f6" stroke="#1d4ed8"/>
                        <text x="50" y="45" fill="white" font-weight="bold" font-size="20" text-anchor="middle">235</text>
                    </g>
                    <g transform="translate(350, 25)">
                        <rect width="100" height="70" rx="8" fill="#10b981" stroke="#047857"/>
                        <text x="50" y="45" fill="white" font-weight="bold" font-size="20" text-anchor="middle">254</text>
                    </g>
                    <g transform="translate(520, 25)">
                        <rect width="100" height="70" rx="8" fill="#f59e0b" stroke="#b45309"/>
                        <text x="50" y="45" fill="white" font-weight="bold" font-size="20" text-anchor="middle">245</text>
                    </g>
                </svg>`;
            }
        }

        const container = document.getElementById('active-question-wrapper');
        container.innerHTML = `
            <div class="quiz-card active">
                <div class="question-number">Question ${currentIdx + 1} of ${questionsData.length}</div>
                <div class="question-text">${q.text.replace('\n', '<br>')}</div>
                ${q.hasSvg ? `<div class="svg-container">${svgMarkup}</div>` : ''}
                <div class="options-grid">
                    ${q.options.map((opt, i) => `
                        <button type="button" class="option-btn" data-index="${i}" onclick="submitOptionAnswer(${i}, this)">${opt}</button>
                    `).join('')}
                </div>
            </div>
        `;
        startTimer();
    }

    function submitOptionAnswer(selectedIdx, element) {
        const q = questionsData[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');

        if (selectedIdx === q.answer) {
            clearInterval(timerId);
            element.classList.add('correct');
            triggerAudioEffect('win');
            buttons.forEach(btn => btn.disabled = true);
            
            if (currentQuestionAttempts === 0) {
                totalScore++;
            }
            
            showExplanationBox();
        } else {
            currentQuestionAttempts++;
            element.classList.add('incorrect');
            element.disabled = true;
            triggerAudioEffect('fail');

            if (currentQuestionAttempts === 1) {
                const hintBox = document.getElementById('hint-feedback');
                hintBox.textContent = "Hint: " + q.hint;
                hintBox.style.display = 'block';
            } else if (currentQuestionAttempts >= 2) {
                clearInterval(timerId);
                buttons.forEach(btn => {
                    btn.disabled = true;
                    if (parseInt(btn.getAttribute('data-index')) === q.answer) {
                        btn.classList.add('correct');
                    }
                });
                showExplanationBox();
            }
        }
    }

    function revealCorrectAnswerAutomatically() {
        const q = questionsData[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            if (parseInt(btn.getAttribute('data-index')) === q.answer) {
                btn.classList.add('correct');
            }
        });
        showExplanationBox();
    }

    function showExplanationBox() {
        const expBox = document.getElementById('explain-feedback');
        expBox.textContent = "Explanation: " + questionsData[currentIdx].explanation;
        expBox.style.display = 'block';
        document.getElementById('next-action-btn').style.display = 'inline-block';
    }

    function handleNextButton() {
        currentIdx++;
        if (currentIdx < questionsData.length) {
            renderQuestionBlock();
        } else {
            showFinalResultsSummary();
        }
    }

    function showFinalResultsSummary() {
        clearInterval(timerId);
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('quiz-header').style.display = 'block'; // re-show header on results screen if required
        
        const resultsCard = document.getElementById('results-card');
        document.getElementById('final-score').textContent = totalScore;
        
        const msgElement = document.getElementById('result-message');
        if (totalScore === questionsData.length) {
            msgElement.textContent = "Perfect score! Outstanding mathematical skills!";
        } else if (totalScore >= 9) {
            msgElement.textContent = "Great job! You have a solid grasp of the 4-digit number system.";
        } else {
            msgElement.textContent = "Good try! Review the place value rules and clear the challenge again.";
        }
        
        resultsCard.style.display = 'block';
    }

    function restartQuizFlow() {
        document.getElementById('results-card').style.display = 'none';
        document.getElementById('quiz-header').style.display = 'none';
        startQuizFlow();
    }
</script>
</body>
</html>
