<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Indian Currency & Money Interactive</title>
    <style>
        :root {
            --primary: #065f46;
            --secondary: #10b981;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --background: #f0fdf4;
            --surface: #ffffff;
            --text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(4, 120, 87, 0.08);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-placeholder {
            max-width: 100%;
            width: clamp(150px, 40vw, 220px);
            height: auto;
            margin-bottom: 20px;
        }

        /* Core Engine Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Fluid Typography Rule Implementation */
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            text-align: center;
            color: #475569;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* HUD Layout */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Layout */
        .question-text {
            font-size: clamp(1.05rem, 3vw, 1.25rem);
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* Option Buttons & Touch Target Safety */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
            min-height: 48px; /* Touch Target Safety Guarantee */
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f8fafc;
        }

        .option-btn.correct {
            background-color: #ecfdf5 !important;
            border-color: var(--success) !important;
            color: #064e3b;
        }

        .option-btn.wrong {
            background-color: #fef2f2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .feedback-box.hint {
            background-color: #fef3c7;
            border-left: 5px solid var(--warning);
            color: #92400e;
        }

        .feedback-box.explanation {
            background-color: #e0f2fe;
            border-left: 5px solid #0284c7;
            color: #0c4a6e;
        }

        /* Action Buttons */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(6, 95, 70, 0.15);
            min-height: 48px;
        }

        .action-btn:hover {
            background: #044e39;
        }

        /* Score Display Circle */
        .score-circle {
            width: clamp(110px, 25vw, 130px);
            height: clamp(110px, 25vw, 130px);
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 16px; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-placeholder" id="main-logo">
        <h2 id="logo-text" style="display:none; color: var(--primary);">Innovine</h2>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Indian Currency & Money</h1>
            <p class="description">Learn to identify denominations, express money formats using the decimal point, convert between Rupees and Paise smoothly, and master story sums!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading summary...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                type: "Denomination Identification",
                question: "Meera opens her piggy bank and finds one currency note of ₹100, two notes of ₹20, and one coin of ₹5. What is the total denomination amount she found?",
                options: ["₹125", "₹145", "₹140", "₹105"],
                correctText: "₹145",
                hint: "Add up all components: One 100, two 20s (20 + 20 = 40), and one 5.",
                explanation: "Total calculation: 100 + 20 + 20 + 5 = 145. So, the total amount is ₹145."
            },
            {
                type: "Decimal Notation Formatting",
                question: "Which of the following correctly writes 'seventy-five rupees and five paise' using the decimal format and currency symbol?",
                options: ["₹75.5", "₹75.50", "₹75.05", "75.05p"],
                correctText: "₹75.05",
                hint: "Paise must always occupy two digits after the decimal point. Five paise is written as zero-five.",
                explanation: "To write paise as a decimal, we use two digits. 5 paise is equal to ₹0.05. Combined with 75 rupees, it is properly written as ₹75.05."
            },
            {
                type: "Rupees to Paise Conversion",
                question: "Rahul has a crisp ₹9 note. He wants to know how much this value is if it is converted entirely into paise (p). Help him find the answer.",
                options: ["90 paise", "900 paise", "9000 paise", "9 paise"],
                correctText: "900 paise",
                hint: "Since ₹1 equals 100 paise, multiply the number of rupees by 100.",
                explanation: "Conversion logic: 9 × 100 = 900. Hence, ₹9 is equivalent to 900 paise."
            },
            {
                type: "Paise to Rupees Conversion",
                question: "An old jar contains 450 paise in total coins. If you convert this amount into rupees and paise using a dot, how will you write it?",
                options: ["₹45.0", "₹4.50", "₹450.00", "₹0.45"],
                correctText: "₹4.50",
                hint: "Divide 450 by 100, or count two places from the right side to put your decimal dot.",
                explanation: "Since 100 paise makes 1 rupee, 400 paise makes 4 rupees, leaving 50 paise over. This is represented cleanly as ₹4.50."
            },
            {
                type: "Basic Addition Operation",
                question: "Aarav spends ₹42.50 on a notebook and ₹12.25 on a fancy eraser. What is the total amount of money Aarav pays the shopkeeper?",
                options: ["₹54.75", "₹54.50", "₹55.75", "₹54.25"],
                correctText: "₹54.75",
                hint: "Align the decimal points perfectly and add the paise part first, then add the rupees part.",
                explanation: "Adding the columns: 50p + 25p = 75p, and ₹42 + ₹12 = ₹54. Combining them gives ₹54.75."
            },
            {
                type: "Basic Subtraction Operation",
                question: "Sanya had ₹80.00 in her pocket. She bought an ice cream cone for ₹35.50. How much money does she have left over?",
                options: ["₹45.50", "₹44.50", "₹54.50", "₹45.00"],
                correctText: "₹44.50",
                hint: "Subtract ₹35.50 from ₹80.00. You will need to borrow from the rupees place to subtract the paise columns.",
                explanation: "Subtracting: ₹80.00 - ₹35.50 = ₹44.50. She has exactly ₹44.50 left."
            },
            {
                type: "Multiplication Operation",
                question: "One chocolate bar costs exactly ₹15.00. If Kabir buys a pack of 5 such identical chocolate bars, how much will he spend in total?",
                options: ["₹60.00", "₹75.00", "₹85.00", "₹70.00"],
                correctText: "₹75.00",
                hint: "Multiply the rate of one item (15) by the total number of items bought (5).",
                explanation: "Using basic multiplication: 15 × 5 = 75. Therefore, the total spending is ₹75.00."
            },
            {
                type: "Division Operation",
                question: "Four friends share a large snack box that costs ₹36.40. If they decide to divide the bill equally among themselves, how much should each friend contribute?",
                options: ["₹9.10", "₹8.10", "₹9.40", "₹9.00"],
                correctText: "₹9.10",
                hint: "Divide the entire amount by 4. 36 ÷ 4 = 9 and 40 ÷ 4 = 10.",
                explanation: "Dividing ₹36 by 4 gives ₹9. Dividing 40 paise by 4 gives 10 paise. Thus, each friend pays ₹9.10."
            },
            {
                type: "Error Detection Challenge",
                question: "Identify the statement below that contains a mathematical error or incorrect currency rule:",
                options: [
                    "The Indian currency symbol is ₹.",
                    "An amount of 700 paise is equal to ₹70.00.",
                    "To convert rupees into paise, we multiply the amount by 100.",
                    "₹2.50 plus ₹1.50 equals exactly ₹4.00."
                ],
                correctText: "An amount of 700 paise is equal to ₹70.00.",
                hint: "Look closely at the 700 paise conversion. Divide 700 by 100. Does it really equal seventy rupees?",
                explanation: "The second statement is incorrect because 700 ÷ 100 = 7. So 700 paise equals ₹7.00, not ₹70.00."
            },
            {
                type: "Assertion & Reason MCQ",
                question: "Assertion: If you have five coins of 50 paise, their total value is written as ₹2.50.\nReason: 50 paise multiplied by 5 equals 250 paise, and 250 paise equals 2 rupees and 50 paise.",
                options: [
                    "Both Assertion and Reason are correct, and the Reason perfectly explains the Assertion.",
                    "Both Assertion and Reason are correct, but the Reason does not explain the Assertion.",
                    "The Assertion is true, but the Reason is completely false.",
                    "The Assertion is false, but the Reason is true."
                ],
                correctText: "Both Assertion and Reason are correct, and the Reason perfectly explains the Assertion.",
                hint: "Calculate the total paise (5 × 50) and test if the conversion explanation matches perfectly.",
                explanation: "Both statements are correct. 5 × 50p = 250p. Converting 250p by dividing by 100 gives ₹2.50, which matches both points perfectly."
            },
            {
                type: "Multi-Step Case Story (Part 1)",
                question: "Case Story Part 1: Vivaan goes to a stationery shop with a ₹100 note. He picks up a sketch pen pack for ₹45.00 and a drawing book for ₹32.50. How much is the total bill of his items?",
                options: ["₹77.00", "₹77.50", "₹87.50", "₹75.50"],
                correctText: "₹77.50",
                hint: "Add the price of the sketch pens (45.00) to the price of the drawing book (32.50).",
                explanation: "Total item bill calculation: 45.00 + 32.50 = 77.50. The items cost ₹77.50."
            },
            {
                type: "Multi-Step Case Story (Part 2)",
                question: "Case Story Part 2: Continuing from Vivaan's trip, he hands his ₹100 note to the shopkeeper to pay his total bill of ₹77.50. How much change should the shopkeeper return to Vivaan?",
                options: ["₹22.50", "₹23.50", "₹32.50", "₹22.00"],
                correctText: "₹22.50",
                hint: "Subtract the total bill calculated in Part 1 (77.50) from the initial note value (100.00).",
                explanation: "Change computation: 100.00 - 77.50 = 22.50. The shopkeeper must return ₹22.50."
            }
        ];

        let activeQuestionPool = [];
        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer = null;
        let activeSeconds = 60;

        function shuffleArray(array) {
            const arrCopy = [...array];
            for (let i = arrCopy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arrCopy[i], arrCopy[j]] = [arrCopy[j], arrCopy[i]];
            }
            return arrCopy;
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 5000);
        });

        function startInteractive() {
            ['correct', 'wrong'].forEach(type => {
                const a = document.getElementById(`audio-${type}`);
                if(a) { a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {}); }
            });

            setupQuestionPool();

            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function setupQuestionPool() {
            activeQuestionPool = shuffleArray(questionBank);
        }

        function displayQuestion() {
            if (countdownTimer) clearInterval(countdownTimer);
            activeSeconds = 60; 
            attemptTracker = 0; 
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = activeQuestionPool[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${activeQuestionPool.length}`;
            
            // Fixed line: Removed the type prefix in brackets [qData.type] to directly output the question content
            document.getElementById('target-question').innerText = qData.question;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            const shuffledOptions = shuffleArray(qData.options);

            shuffledOptions.forEach((optText) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.addEventListener('click', () => evaluateSelection(btn, optText, qData));
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    if (countdownTimer) clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            attemptTracker = -1; 
            let qData = activeQuestionPool[currentIndex];
            disableAllOptions();
            highlightCorrectAnswer(qData.correctText);
            
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluateSelection(selectedBtn, chosenText, qData) {
            if (chosenText === qData.correctText) {
                if (countdownTimer) clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerSparkles();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    if (countdownTimer) clearInterval(countdownTimer);
                    disableAllOptions();
                    highlightCorrectAnswer(qData.correctText);

                    document.getElementById('hint-feedback').style.display = 'none';
                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function highlightCorrectAnswer(correctText) {
            const optionsList = document.getElementById('target-options').children;
            for (let btn of optionsList) {
                if (btn.innerText === correctText) {
                    btn.classList.add('correct');
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio layer standby."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestionPool.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score-value').innerText = `${runningScore}/${activeQuestionPool.length}`;
            
            let statusText = "";

            if (runningScore === 12) {
                statusText = "Perfect score! Outstanding work!";
            } else if (runningScore >= 9 && runningScore < 12) {
                statusText = "Good job! You have a great understanding of currency values.";
            } else if (runningScore >= 5 && runningScore < 9) {
                statusText = "Review this chapter and try again.";
            } else {
                statusText = "Let’s practise more together.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            attemptTracker = 0;
            if (countdownTimer) clearInterval(countdownTimer);
            
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        // Particle Canvas Implementation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId = null;

        function resizeCanvas() {
            if(canvas && canvas.parentElement) {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            resizeCanvas();
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 40 + 120}, 85%, 60%)`,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
            if (!animationId) renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animationId = null;
                return;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles = particles.filter(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.02;
                
                if (p.alpha <= 0) return false;
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
                
                return true;
            });

            animationId = requestAnimationFrame(renderParticles);
        }

        // Active Error Fallback Layer
        const logoImg = document.getElementById('main-logo');
        const logoText = document.getElementById('logo-text');

        if (logoImg) {
            logoImg.addEventListener('error', function() {
                this.style.display = 'none';
                if (logoText) logoText.style.display = 'block';
            });
        }
    </script>
</body>
</html>
