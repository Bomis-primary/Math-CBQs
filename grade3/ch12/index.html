<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Data Handling Explorer</title>
    <style>
        :root {
            --primary: #0f766e;
            --secondary: #2dd4bf;
            --success: #15a34a;
            --danger: #e11d48;
            --warning: #ea580c;
            --background: #f0fdfa;
            --surface: #ffffff;
            --text: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(15, 118, 110, 0.08);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* 5-Second Splash Overlay */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-placeholder {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Screen Display Controller */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Game Metrics Bar */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Content Layout */
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* Rendered Visuals Container */
        .visual-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
        }

        /* Table Assets */
        .visual-table {
            border-collapse: collapse;
            font-size: 15px;
            font-weight: 500;
            background-color: #ffffff;
            border: 2px solid #334155;
            width: 100%;
            max-width: 450px;
        }

        .visual-table th {
            background-color: #cbd5e1;
            color: #0f172a;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #334155;
            text-align: center;
        }

        .visual-table td {
            border: 2px solid #334155;
            padding: 10px 14px;
            vertical-align: middle;
        }

        .key-row {
            background-color: #f1f5f9;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* CSS Bar Graphs */
        .chart-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            border-left: 3px solid #334155;
            border-bottom: 3px solid #334155;
            height: 180px;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            position: relative;
            margin-bottom: 10px;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            background-color: var(--primary);
            border-radius: 4px 4px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding-top: 4px;
            transition: height 0.5s ease;
        }

        .bar-label {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            position: absolute;
            bottom: -25px;
        }

        /* Tally Graphics styling */
        .tally-bundle {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: bold;
            color: #0f766e;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f9fafb;
        }

        .option-btn.correct {
            background-color: #f0fdf4 !important;
            border-color: var(--success) !important;
            color: #14532d;
        }

        .option-btn.wrong {
            background-color: #fff1f2 !important;
            border-color: var(--danger) !important;
            color: #4c0519;
        }

        /* Feedback Drawers */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.5;
        }

        .feedback-box.hint {
            background-color: #fff7ed;
            border-left: 5px solid var(--warning);
            color: #7c2d12;
        }

        .feedback-box.explanation {
            background-color: #f0fdfa;
            border-left: 5px solid var(--primary);
            color: #115e59;
        }

        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
        }

        .action-btn:hover {
            background: #115e59;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="splash-screen">
        <img src="grade3/ch12/assets/logo.png" alt="Innovine Logo" class="logo-placeholder" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
        <h2 id="logo-text" style="display:none; color: var(--primary);">Innovine</h2>
    </div>

    <audio id="audio-correct" src="grade3/ch12/assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="grade3/ch12/assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Data Handling Quest</h1>
            <p class="description">Master the art of tracking surveys! Learn to read tally systems, calculate pictograph scales, unlock bar graph keys, and extract useful information.</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading data layout...</div>
                
                <div class="visual-container" id="target-visual"></div>
                
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Quest Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Processing data markers...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                question: "Rohan counted the number of red birds spotted in a park and recorded them using tally groups.\n\nWhat total number did Rohan record?",
                visual: `<div class="tally-bundle">卌</div> &nbsp; <div class="tally-bundle">卌</div> &nbsp; <div class="tally-bundle">|||</div>`,
                options: ["8 birds", "13 birds", "10 birds", "15 birds"],
                answer: 1,
                hint: "Each complete block with a diagonal cross slash represents exactly 5 items. Count by fives and add the leftover ones.",
                explanation: "Two complete tally blocks mean $5 + 5 = 10$. Adding the 3 extra vertical lines gives $10 + 3 = 13$. He recorded 13 birds."
            },
            {
                question: "Look at the favorite books chart row setup below.\n\nHow many children chose Adventure Books altogether?",
                visual: `
                    <table class="visual-table">
                        <thead><tr><th colspan="2">Class Favorite Books</th></tr></thead>
                        <tbody>
                            <tr>
                                <td style="background:#f8fafc;">Adventure Books</td>
                                <td>📖 📖 📖 📖 📖</td>
                            </tr>
                            <tr><td colspan="2" class="key-row">Key: 📖 = 4 children</td></tr>
                        </tbody>
                    </table>
                `,
                options: ["9 children", "16 children", "20 children", "25 children"],
                answer: 2,
                hint: "Multiply the total number of symbols drawn by the value given in the chart's key rule.",
                explanation: "Since 1 symbol = 4 children, 5 identical symbols equal $5 \\times 4 = 20$ children. The answer is 20."
            },
            {
                question: "Sanya is building a school transport pictograph. Based on the rules defined in the key, how many total bus symbols must she draw to show 60 students?",
                visual: `
                    <table class="visual-table">
                        <thead><tr><th colspan="2">School Transport Tracker</th></tr></thead>
                        <tbody>
                            <tr><td style="background:#f8fafc; width:40%;">Bus Riders</td><td>(60 Students Total)</td></tr>
                            <tr><td colspan="2" class="key-row">Key: 🚌 = 10 students</td></tr>
                        </tbody>
                    </table>
                `,
                options: ["6 symbols", "10 symbols", "60 symbols", "5 symbols"],
                answer: 0,
                hint: "Divide the total target count of students by the value that a single symbol stands for.",
                explanation: "To find the number of symbols needed, divide the total count by the key value: $60 \\div 10 = 6$. So, 6 bus symbols are required."
            },
            {
                question: "Look at the bar graph below showing team results.\n\nHow many MORE points did Blue House score than Red House?",
                visual: `
                    <div class="chart-wrapper">
                        <div class="bar-container"><div class="bar" style="height: 90%;">45</div><span class="bar-label">Blue</span></div>
                        <div class="bar-container"><div class="bar" style="height: 40%; background:#94a3b8;">20</div><span class="bar-label">Red</span></div>
                    </div>
                `,
                options: ["15 points", "20 points", "25 points", "45 points"],
                answer: 2,
                hint: "Find the values of both bars (Blue is 45 and Red is 20) and subtract the smaller value from the larger one.",
                explanation: "Blue House scored 45 points and Red House scored 20 points. To find the difference, calculate $45 - 20 = 25$ points."
            },
            {
                question: "Karan wants to find out what flavor of ice cream the students in his class prefer. What is the most effective way for him to collect this primary information?",
                visual: "",
                options: [
                    "Guess what his classmates like by looking at them.",
                    "Ask every student by conducting a survey or using a questionnaire.",
                    "Read a storybook about ice cream shops.",
                    "Check the weather report outside."
                ],
                answer: 1,
                hint: "To get accurate facts from people, you must ask them directly or write down their answers.",
                explanation: "Conducting a systematic interview or survey questionnaire is the best way to gather real and accurate data directly from a group."
            },
            {
                question: "Look at the sports interest chart.\n\nWhich sport is the LEAST popular among the surveyed student group?",
                visual: `
                    <div class="chart-wrapper" style="height: 140px;">
                        <div class="bar-container"><div class="bar" style="height: 54%;">30</div><span class="bar-label">Cricket</span></div>
                        <div class="bar-container"><div class="bar" style="height: 100%;">55</div><span class="bar-label">Football</span></div>
                        <div class="bar-container"><div class="bar" style="height: 36%;">20</div><span class="bar-label">Basket.</span></div>
                    </div>
                `,
                options: ["Cricket", "Football", "Basketball", "All are equally popular"],
                answer: 2,
                hint: "The least popular category is shown by the shortest bar column on the graph chart.",
                explanation: "Comparing the heights: Basketball is the shortest column bar at 20, making it the least favorite choice."
            },
            {
                question: "Look at the weekly fruit tracking data graph.\n\nHow many MORE boxes of Apples were sold compared to Oranges?",
                visual: `
                    <div class="chart-wrapper" style="height: 120px;">
                        <div class="bar-container"><div class="bar" style="height: 100%;">18</div><span class="bar-label">Apples</span></div>
                        <div class="bar-container"><div class="bar" style="height: 66%;">12</div><span class="bar-label">Oranges</span></div>
                    </div>
                `,
                options: ["30 boxes", "6 boxes", "12 boxes", "8 boxes"],
                answer: 1,
                hint: "Find the numerical difference between the two category values by subtracting the smaller amount from the larger one.",
                explanation: "To find how many more boxes were sold, subtract the values: $18 - 12 = 6$. Exactly 6 more boxes of apples were sold."
            },
            {
                question: "Why do we use visual charts like bar graphs and pictographs instead of just keeping a long unorganized list of random answers?",
                visual: "",
                options: [
                    "Because charts take up more space in notebooks.",
                    "Because they hide information from other people.",
                    "Because visual charts make it very easy to read, compare, and understand values at a single glance.",
                    "Because drawings are only used for art class."
                ],
                answer: 2,
                hint: "Think about what is quicker: counting 100 random words scattered around, or looking at a neat colored bar chart.",
                explanation: "Visual representations summarize numbers efficiently, allowing people to extract patterns, maximums, and trends instantly."
            },
            {
                question: "Identify the mathematical statement below that contains an error regarding data handling tools:",
                visual: "",
                options: [
                    "A pictograph uses small images or symbols to show quantities.",
                    "Tally marks are always written down in groups of 10 with two diagonal slash bars across.",
                    "Every graph or chart should have a clear title and label markers.",
                    "The key in a pictograph explains what each drawn symbol means."
                ],
                answer: 1,
                hint: "Think about how we draw a crossed tally block. Do we count up to 10 before drawing a slash, or is it a different group size?",
                explanation: "The second statement is incorrect. Tally marks are bundled into groups of 5, not 10. The fifth mark is drawn as a diagonal line across the first 4 vertical strokes."
            },
            {
                question: "Assertion: If a pictograph symbol represents 5 trees, then a row with 4 tree symbols means there are 20 trees in total.\nReason: Multiplication is used to decode the total value when each symbol represents a group size greater than 1.",
                visual: "",
                options: [
                    "Both Assertion and Reason are true, and the Reason explains the Assertion perfectly.",
                    "Both Assertion and Reason are true, but the Reason does not explain the Assertion.",
                    "The Assertion is true, but the Reason is false.",
                    "The Assertion is completely false."
                ],
                answer: 0,
                hint: "Verify the math ($4 \\times 5$) and check if the reasoning rule matches how pictograph keys work.",
                explanation: "Both statements are correct. 4 symbols $\\times$ 5 items per symbol = 20. The reason correctly explains why multiplication is the method used to decode a pictograph row."
            },
            {
                question: "Maya surveyed her friends to find out what pets they own and stored the results in a table.\n\nHow many total cats do Maya's friends own?",
                visual: `
                    <table class="visual-table">
                        <thead><tr><th>Pet Type</th><th>Tally Collected</th></tr></thead>
                        <tbody>
                            <tr><td>Dogs</td><td>卌 卌</td></tr>
                            <tr><td>Cats</td><td>卌 ||</td></tr>
                            <tr><td>Birds</td><td>||||</td></tr>
                        </tbody>
                    </table>
                `,
                options: ["5 cats", "7 cats", "10 cats", "4 cats"],
                answer: 1,
                hint: "Look at the Cats row. Add the value of one closed cross-five tally group to the two single vertical lines next to it.",
                explanation: "The tally marks for cats show one complete bundle (5) plus two individual lines (2). This equals $5 + 2 = 7$ cats."
            },
            {
                question: "Maya wants to display her entire pet dataset on a single bar graph.\n\nWhat total number of pets will the sum of all the bars combined show?",
                visual: `
                    <table class="visual-table">
                        <thead><tr><th>Pet Category</th><th>Calculated Count</th></tr></thead>
                        <tbody>
                            <tr><td>Dogs</td><td>10</td></tr>
                            <tr><td>Cats</td><td>7</td></tr>
                            <tr><td>Birds</td><td>4</td></tr>
                        </tbody>
                    </table>
                `,
                options: ["17 pets", "21 pets", "14 pets", "25 pets"],
                answer: 1,
                hint: "Add up the values of all three separate animal categories together: $10 + 7 + 4$.",
                explanation: "To find the complete count of all pet data combined, calculate the sum: $10 \\text{ (dogs)} + 7 \\text{ (cats)} + 4 \\text{ (birds)} = 21$ total pets."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 5000);
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60; 
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            
            document.getElementById('target-question').innerText = qData.question;
            
            const visualBox = document.getElementById('target-visual');
            visualBox.innerHTML = qData.visual || "";

            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let qData = questionBank[currentIndex];
            disableAllOptions();
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = questionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerSparkles();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio feedback trigger asset check."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Good job!";
            } else if (finalPercentage >= 40) {
                statusText = "Review this chapter and try again.";
            } else {
                statusText = "Let’s practise more.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        // Particle Canvas Graphics (Teal / Turquoise Theme)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            resizeCanvas();
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 40 + 170}, 85%, 55%)`, 
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
            renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, idx) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.02;
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) {
                requestAnimationFrame(renderParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
