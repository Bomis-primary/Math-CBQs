<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 3 Mathematics - Chapter 12: Data Handling Master Module</title>
    <style>
        /*------------------------------------------------------------------
        [CSS CUSTOM PROPERTIES / DESIGN SYSTEM ENGINE]
        ------------------------------------------------------------------*/
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --primary-light: #f0f7ff;
            --success: #28a745;
            --success-bg: #d4edda;
            --success-border: #c3e6cb;
            --danger: #dc3545;
            --danger-bg: #f8d7da;
            --danger-border: #f5c6cb;
            --warning: #ffc107;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --neutral-dark: #2d3748;
            --neutral-medium: #4a5568;
            --neutral-light: #edf2f7;
            --body-bg: #f7fafc;
            --card-bg: #ffffff;
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /*------------------------------------------------------------------
        [BASE STYLES & LAYOUT RESET]
        ------------------------------------------------------------------*/
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--body-bg);
            color: var(--neutral-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /*------------------------------------------------------------------
        [1. INTRO / SPLASH SCREEN]
        ------------------------------------------------------------------*/
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            max-width: 220px;
            height: auto;
            object-fit: contain;
            margin-bottom: 24px;
        }

        .splash-loader {
            width: 40px;
            height: 40px;
            border: 4px solid var(--neutral-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /*------------------------------------------------------------------
        [2. APP WORKSPACE FRAME LAYOUT]
        ------------------------------------------------------------------*/
        .quiz-container {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
            display: none; /* Display is toggled by JS exactly after 5 seconds */
            flex-direction: column;
            position: relative;
        }

        .progress-track {
            height: 6px;
            background-color: var(--neutral-light);
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #63b3ed);
            width: 0%;
            transition: width var(--transition);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--neutral-light);
            background-color: #fff;
        }

        .header-logo {
            max-height: 32px;
            width: auto;
            object-fit: contain;
        }

        .meta-dashboard {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dashboard-pill {
            background-color: var(--body-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--neutral-medium);
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--neutral-light);
        }

        .dashboard-pill.timer-alert {
            color: var(--danger);
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
            animation: pulse 1.5s infinite;
        }

        .audio-toggle-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neutral-medium);
            transition: transform var(--transition);
        }

        .audio-toggle-btn:hover {
            transform: scale(1.1);
        }

        /*------------------------------------------------------------------
        [3. MAIN PLAYSPACE CANVAS AREA]
        ------------------------------------------------------------------*/
        .quiz-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .question-statement {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neutral-dark);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .graphical-container {
            background-color: var(--body-bg);
            border: 1px solid var(--neutral-light);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .graphical-payload {
            max-width: 100%;
            height: auto;
            max-height: 240px;
            object-fit: contain;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .option-node {
            background-color: var(--card-bg);
            border: 2px solid var(--neutral-light);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            color: var(--neutral-medium);
            text-align: left;
            cursor: pointer;
            transition: all var(--transition);
            outline: none;
            width: 100%;
        }

        .option-node:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        /* Feedback styling mappings */
        .option-node.state-correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #155724 !important;
        }

        .option-node.state-incorrect {
            background-color: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            color: #721c24 !important;
        }

        .option-node:disabled {
            cursor: not-allowed;
        }

        /*------------------------------------------------------------------
        [4. HINTS AND REVIEWS CONTEXT PANELS]
        ------------------------------------------------------------------*/
        .feedback-panel {
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .feedback-panel.type-hint {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: #856404;
        }

        .feedback-panel.type-solution {
            background-color: var(--primary-light);
            border: 1px solid #b8daff;
            color: #004085;
        }

        /*------------------------------------------------------------------
        [5. FINAL END-OF-SESSION METRICS VIEW]
        ------------------------------------------------------------------*/
        .analytics-view {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        .analytics-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .analytics-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--neutral-dark);
            margin-bottom: 8px;
        }

        .analytics-text {
            font-size: 1rem;
            color: var(--neutral-medium);
            margin-bottom: 24px;
            max-width: 440px;
        }

        .metrics-row {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 28px;
        }

        .metric-box {
            flex: 1;
            background-color: var(--body-bg);
            border: 1px solid var(--neutral-light);
            padding: 14px;
            border-radius: var(--radius-md);
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--neutral-medium);
            margin-top: 2px;
            font-weight: 700;
        }

        .restart-action-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color var(--transition);
        }

        .restart-action-btn:hover {
            background-color: var(--primary-dark);
        }

        /*------------------------------------------------------------------
        [6. RUNTIME EFFECTS & KEYFRAMES ENGINE]
        ------------------------------------------------------------------*/
        .confetti-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            z-index: 999;
            animation: fall linear forwards;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 50% { opacity: 0.6; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(450px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="splash-overlay" id="app-splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo" id="splash-logo-asset">

    </main>

<script>
    /**

    const DATASET_REGISTRY = [

    /**
     * @class ExecutionStateEngine
     * Main runtime application controller managing audio channels, UI updates, and data flow.
     */
    class ExecutionStateEngine {
        constructor(questionsPayload) {
            this.registry = questionsPayload;
            this.currentIndex = 0;
            this.score = 0;
            this.timerRef = null;
            this.secondsRemaining = 60;
            this.attemptCount = 0; 
            this.isMuted = false;

            // Audio instantiation
            this.audioSuccess = new Audio('assets/claps.mp3');
            this.audioFailure = new Audio('assets/wrong.mp3');

            // Cache global DOM nodes
            this.domProgressBar = document.getElementById('ui-progress-bar');
            this.domIndexLabel = document.getElementById('ui-index-label');
            this.domScoreLabel = document.getElementById('ui-score-label');
            this.domTimerLabel = document.getElementById('ui-timer-label');
            this.domTimerContainer = document.getElementById('ui-timer-container');
            this.domViewport = document.getElementById('ui-dynamic-viewport');
            this.domAudioToggle = document.getElementById('ui-audio-toggle');

            this.bindGlobalEvents();
            this.initializeSplashConstraint();
        }

        bindGlobalEvents() {
            this.domAudioToggle.addEventListener('click', () => {
                this.isMuted = !this.isMuted;
                this.domAudioToggle.textContent = this.isMuted ? "✕" : "🔊";
                this.domAudioToggle.style.color = this.isMuted ? "var(--danger)" : "var(--neutral-medium)";
            });
        }

        initializeSplashConstraint() {
            // Strictly enforce logo splash screen visibility for 5 seconds
            setTimeout(() => {
                const splash = document.getElementById('app-splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    const mainContainer = document.getElementById('app-canvas-container');
                    mainContainer.style.display = 'flex';
                    this.loadActiveQuestionFrame();
                }, 500);
            }, 5000);
        }

        loadActiveQuestionFrame() {
            clearInterval(this.timerRef);
            this.attemptCount = 0; 
            
            const currentItem = this.registry[this.currentIndex];
            
            this.domIndexLabel.textContent = currentItem.displayIndex;
            this.domScoreLabel.textContent = this.score;
            this.secondsRemaining = currentItem.durationLimit;
            this.domTimerLabel.textContent = this.secondsRemaining;
            this.domTimerContainer.className = 'dashboard-pill';

            const calculationPercentage = (this.currentIndex / this.registry.length) * 100;
            this.domProgressBar.style.width = `${calculationPercentage}%`;

            this.renderCanvasInterface(currentItem);
            this.engageChronometerCycle();
        }

        engageChronometerCycle() {
            this.timerRef = setInterval(() => {
                this.secondsRemaining--;
                this.domTimerLabel.textContent = this.secondsRemaining;

                if (this.secondsRemaining <= 10) {
                    this.domTimerContainer.classList.add('timer-alert');
                }

                if (this.secondsRemaining <= 0) {
                    clearInterval(this.timerRef);
                    this.evaluateSubmissionSequence(null, true); 
                }
            }, 1000);
        }

        renderCanvasInterface(item) {
            this.domViewport.innerHTML = `
                <div class="question-statement">${item.statement}</div>
                ${item.media ? `
                    <div class="graphical-container">
                        <img src="${item.media}" alt="Chapter 12 Data Reference Graphic" class="graphical-payload" id="ui-media-element">
                    </div>
                ` : ''}
                <div class="options-grid" id="ui-options-root" role="radiogroup" aria-label="Choices Grid Matrix"></div>
                <div class="feedback-panel type-hint" id="panel-hint"></div>
                <div class="feedback-panel type-solution" id="panel-solution"></div>
            `;

            if (item.media) {
                const img = document.getElementById('ui-media-element');
                img.onerror = () => img.closest('.graphical-container').style.display = 'none';
            }

            const rootOptionsGrid = document.getElementById('ui-options-root');
            item.choices.forEach((optionText, idx) => {
                const button = document.createElement('button');
                button.className = 'option-node';
                button.textContent = optionText;
                button.id = `opt-node-${idx}`;
                button.setAttribute('role', 'radio');
                
                button.addEventListener('click', () => this.evaluateSubmissionSequence(button, false));
                rootOptionsGrid.appendChild(button);
            });
        }

        evaluateSubmissionSequence(clickedButton, isTimeout) {
            const currentItem = this.registry[this.currentIndex];
            const allOptionButtons = this.domViewport.querySelectorAll('.option-node');
            const panelHint = document.getElementById('panel-hint');
            const panelSolution = document.getElementById('panel-solution');

            if (isTimeout) {
                this.fireAudioFeedback(false);
                allOptionButtons.forEach(btn => btn.disabled = true);
                this.highlightAbsoluteAnswer(allOptionButtons, currentItem.solutionKey);
                
                panelSolution.textContent = `Time expired! ${currentItem.explanation}`;
                panelSolution.style.display = 'block';
                
                this.stageTransitionDelay();
                return;
            }

            const chosenAnswerText = clickedButton.textContent.trim();
            const isCorrect = (chosenAnswerText === currentItem.solutionKey.trim());

            if (isCorrect) {
                clearInterval(this.timerRef);
                this.fireAudioFeedback(true);
                clickedButton.classList.add('state-correct');
                allOptionButtons.forEach(btn => btn.disabled = true);
                
                this.triggerConfettiVisualParticles();
                this.score += currentItem.pointsAllocation;
                this.domScoreLabel.textContent = this.score;
                
                this.stageTransitionDelay();
            } else {
                this.attemptCount++;
                this.fireAudioFeedback(false);

                if (this.attemptCount === 1) {
                    clickedButton.classList.add('state-incorrect');
                    clickedButton.disabled = true; 
                    
                    panelHint.textContent = `Hint: ${currentItem.hint}`;
                    panelHint.style.display = 'block';
                } else {
                    clearInterval(this.timerRef);
                    clickedButton.classList.add('state-incorrect');
                    allOptionButtons.forEach(btn => btn.disabled = true);
                    
                    this.highlightAbsoluteAnswer(allOptionButtons, currentItem.solutionKey);
                    panelHint.style.display = 'none';
                    
                    panelSolution.textContent = `Review: ${currentItem.explanation}`;
                    panelSolution.style.display = 'block';
                    
                    this.stageTransitionDelay();
                }
            }
        }

        highlightAbsoluteAnswer(buttonsCollection, solutionString) {
            buttonsCollection.forEach(btn => {
                if (btn.textContent.trim() === solutionString.trim()) {
                    btn.classList.add('state-correct');
                }
            });
        }

        fireAudioFeedback(isSuccessMode) {
            if (this.isMuted) return;
            try {
                const audioTarget = isSuccessMode ? this.audioSuccess : this.audioFailure;
                audioTarget.currentTime = 0;
                audioTarget.play().catch(() => {});
            } catch (e) {
                console.warn("Audio Context playback deferred safely.");
            }
        }

        triggerConfettiVisualParticles() {
            const colors = ['#4a90e2', '#28a745', '#ffc107', '#e74c3c', '#9b59b6'];
            const containerBox = document.getElementById('app-canvas-container');
            
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = '0px';
                
                const scaleSize = Math.random() * 6 + 6;
                particle.style.width = `${scaleSize}px`;
                particle.style.height = `${scaleSize}px`;
                
                particle.style.animationDuration = `${Math.random() * 1.2 + 1.2}s`;
                containerBox.appendChild(particle);
                
                setTimeout(() => particle.remove(), 2400);
            }
        }

        stageTransitionDelay() {
            setTimeout(() => {
                this.currentIndex++;
                if (this.currentIndex < this.registry.length) {
                    this.loadActiveQuestionFrame();
                } else {
                    this.compileFinalPerformanceSummary();
                }
            }, 3000);
        }

        compileFinalPerformanceSummary() {
            clearInterval(this.timerRef);
            this.domProgressBar.style.width = '100%';
            
            const totalPossiblePoints = this.registry.reduce((acc, current) => acc + current.pointsAllocation, 0);
            const accuracyFactor = Math.round((this.score / totalPossiblePoints) * 100);

            let iconEmoji = '🎉';
            let summaryMessage = 'Good job';

            if (accuracyFactor >= 75) {
                iconEmoji = '🎉';
                summaryMessage = 'Good job! Excellent data parsing capability demonstrated.';
            } else if (accuracyFactor >= 40) {
                iconEmoji = '📚';
                summaryMessage = 'Review this chapter and try again. Practice makes perfect!';
            } else {
                iconEmoji = '✏️';
                summaryMessage = 'Let’s practise more. Review the fundamentals of graphs and keys.';
            }

            this.domViewport.innerHTML = `
                <div class="analytics-view">
                    <div class="analytics-icon" aria-hidden="true">${iconEmoji}</div>
                    <h2 class="analytics-title">Module Completed</h2>
                    <p class="analytics-text">${summaryMessage}</p>
                    
                    <div class="metrics-row">
                        <div class="metric-box">
                            <div class="metric-value">${this.score} / ${totalPossiblePoints}</div>
                            <div class="metric-label">Points Scored</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value">${accuracyFactor}%</div>
                            <div class="metric-label">Accuracy Index</div>
                        </div>
                    </div>

                    <button class="restart-action-btn" id="ui-action-restart">Re-initialize Chapter 12</button>
                </div>
            `;

            document.getElementById('ui-action-restart').addEventListener('click', () => {
                this.currentIndex = 0;
                this.score = 0;
                this.loadActiveQuestionFrame();
            });
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        window.ActiveModuleEngineInstance = new ExecutionStateEngine(DATASET_REGISTRY);
    });
</script>
</body>
</html>
