<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Measurement & Estimation CBQ Interactive</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #2b5c8f;
            --secondary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --background: #f4f7f6;
            --surface: #ffffff;
            --text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Splash Screen - Logo Only */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen img {
            max-width: 220px;
            height: auto;
            object-fit: contain;
        }

        /* Screens Visibility */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* HUD elements */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #edf2f7;
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Frame */
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Options Stack */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f7fafc;
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--success) !important;
            color: #2e7d32;
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: var(--danger) !important;
            color: #c62828;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #fffde7;
            border-left: 5px solid var(--warning);
            color: #f57f17;
        }

        .feedback-box.explanation {
            background-color: #e3f2fd;
            border-left: 5px solid var(--secondary);
            color: #1565c0;
        }

        /* Primary Controls */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(43,92,143,0.2);
        }

        .action-btn:hover {
            background: #224a73;
        }

        /* Score screen metrics */
        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #edf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        @media (max-width: 480px) {
            .container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen with Only the Logo -->
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" onerror="this.style.display='none';">
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Competency-Based Challenge</h1>
            <p class="description">Test your deep conceptual understanding of Measurement & Estimation through 12 real-world competency-based questions!</p>
            <button class="action-btn" onclick="startInteractive()">Start CBQ Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading text question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading score analysis...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                type: "Competency Skill: Critical Tool Selection",
                question: "Riya wants to measure the perimeter of her classroom's rectangular whiteboard to frame it with colorful tape. Which tool should she pick?",
                options: [
                    "A short 15-centimeter pencil box ruler",
                    "A long flexible measuring tape or meter rod",
                    "A digital kitchen weighing scale",
                    "A graduated glass measuring cylinder"
                ],
                answer: 1,
                hint: "A whiteboard is large, so a small ruler would need to be moved many times. Think of longer measuring instruments.",
                explanation: "A long measuring tape or meter rod is ideal for measuring larger objects like whiteboards efficiently without repetitive adjustments."
            },
            {
                type: "Competency Skill: Real-World Estimation",
                question: "If you lift a full, unopened medium-sized water bottle intended for personal daily sports use, what is its actual capacity usually measured as?",
                options: [
                    "1 liter",
                    "1 milimeter",
                    "100 meters",
                    "50 kilograms"
                ],
                answer: 0,
                hint: "Think about how much fluid satisfies a person during sports play. Milliliters and liters are capacity units.",
                explanation: "A standard personal sports water bottle typically holds 1 liter of liquid."
            },
            {
                type: "Competency Skill: Unit Conversion Application",
                question: "Kabir's toy train track is 2 meters and 50 centimeters long. How can he express this entire length purely in centimeters?",
                options: [
                    "205 centimeters",
                    "250 centimeters",
                    "2,500 centimeters",
                    "520 centimeters"
                ],
                answer: 1,
                hint: "Convert the meters part to centimeters first (2 meters = 200 cm), then add the leftover 50 cm.",
                explanation: "Since 1 meter = 100 cm, 2 meters = 200 cm. Adding 200 cm to 50 cm gives 250 centimeters."
            },
            {
                type: "Competency Skill: Analytical Reasoning",
                question: "Three children estimate the length of a classroom desk:\n- Tina: 10 meters\n- Sam: 1 meter\n- John: 10 centimeters\nWho made the most reasonable estimation?",
                options: [
                    "Tina, because desks are very long.",
                    "Sam, because a standard desk is roughly around an arm's span or meter long.",
                    "John, because desks are tiny like notebooks.",
                    "None of them are close."
                ],
                answer: 1,
                hint: "10 meters is as long as a large bus! Think about how long a regular classroom table is.",
                explanation: "Sam's estimate of 1 meter is the most reasonable. 10 meters is way too long, and 10 centimeters is too short."
            },
            {
                type: "Competency Skill: Logical Problem Solving",
                question: "A fruit vendor weighs a bunch of bananas and the scale pointer stops exactly at 1 kg 500 g. How many total grams is that?",
                options: [
                    "150 grams",
                    "1,005 grams",
                    "1,500 grams",
                    "15,000 grams"
                ],
                answer: 2,
                hint: "1 kilogram = 1,000 grams. Combine 1,000 g with the extra 500 g.",
                explanation: "1 kg is equal to 1,000 g. Adding the extra 500 g gives 1,500 grams in total."
            },
            {
                type: "Competency Skill: Comparative Judgment",
                question: "Which of the following animals or objects has a mass closest to 1 kilogram?",
                options: [
                    "A tiny newborn house mouse",
                    "A standard school hardcover textbook",
                    "A heavy motorcycle",
                    "A single plastic drinking straw"
                ],
                answer: 1,
                hint: "Think of an object you carry daily in your school bag that feels moderately heavy.",
                explanation: "A standard thick hardcover school textbook generally weighs close to 1 kilogram."
            },
            {
                type: "Competency Skill: Everyday Contextual Math",
                question: "A juice carton contains 500 mL of apple juice. Priya drinks 200 mL of it. How much juice is left inside the carton?",
                options: [
                    "700 milliliters",
                    "300 milliliters",
                    "3 liters",
                    "50 milliliters"
                ],
                answer: 1,
                hint: "Subtract the volume consumed (200 mL) from the initial quantity (500 mL).",
                explanation: "500 mL minus 200 mL leaves exactly 300 milliliters of juice remaining."
            },
            {
                type: "Competency Skill: Multi-Step Word Problem",
                question: "Anu walks 400 meters from her house to the park, and then walks another 600 meters from the park to the grocery store. What is her total distance covered in kilometers?",
                options: [
                    "1,000 kilometers",
                    "10 kilometers",
                    "1 kilometer",
                    "100 kilometers"
                ],
                answer: 2,
                hint: "First find total meters (400 + 600), then remember how many meters make 1 kilometer.",
                explanation: "400 m + 600 m = 1,000 meters. Since 1,000 meters = 1 kilometer, she traveled 1 km."
            },
            {
                type: "Competency Skill: Error Analysis",
                question: "A teacher asks the class to identify the incorrect statement about units of measurement. Which option should the students point out?",
                options: [
                    "Liquid medicine is measured in milliliters.",
                    "The distance between two cities is measured in kilometers.",
                    "The mass of a heavy elephant is measured in grams.",
                    "The length of a pencil is measured in centimeters."
                ],
                answer: 2,
                hint: "Elephants are massive animals. Would grams be an appropriate unit for their weight?",
                explanation: "Measuring an elephant in grams is incorrect because grams are meant for light objects; heavy animals like elephants use kilograms or tonnes."
            },
            {
                type: "Competency Skill: Conceptual Application",
                question: "If you want to bake a cake and the recipe asks for 2 kg of flour, but your kitchen scale only measures in grams, how many grams should you measure out?",
                options: [
                    "200 grams",
                    "2,000 grams",
                    "20,000 grams",
                    "2 grams"
                ],
                answer: 1,
                hint: "Multiply 2 by the conversion factor between kilograms and grams (1 kg = 1,000 g).",
                explanation: "Since 1 kg = 1,000 g, 2 kilograms is equal to 2 × 1,000 = 2,000 grams."
            },
            {
                type: "Competency Skill: Real-World Scenario",
                question: "A swimming pool contains 5,000 liters of water. If a family uses buckets to drain out 2,000 liters, how many liters of water remain in the pool?",
                options: [
                    "3,000 liters",
                    "7,000 liters",
                    "300 liters",
                    "5,000 liters"
                ],
                answer: 0,
                hint: "Perform a simple subtraction: Initial amount minus the amount removed.",
                explanation: "5,000 liters minus 2,000 liters leaves 3,000 liters of water in the pool."
            },
            {
                type: "Competency Skill: Synthesis & Reasoning",
                question: "Look at the pattern: 1 meter = 100 cm. 2 meters = 200 cm. Following this rule, what would 7 meters and 80 centimeters equal in total centimeters?",
                options: [
                    "78 centimeters",
                    "780 centimeters",
                    "7,800 centimeters",
                    "870 centimeters"
                ],
                answer: 1,
                hint: "7 meters turns into 700 cm. Now add the 80 cm to it.",
                explanation: "7 meters = 700 cm. Adding the extra 80 cm gives 780 centimeters."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 2000);
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60;
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            document.getElementById('target-question').innerText = `[${qData.type}] ${qData.question}`;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let qData = questionBank[currentIndex];
            disableAllOptions();
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } catch (e) {
                console.log("Confetti script block not found.");
            }
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = questionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerConfetti();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    document.getElementById('hint-feedback').style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio presentation skipped."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Excellent competency mastery!";
                triggerConfetti();
                setTimeout(triggerConfetti, 300);
            } else if (finalPercentage >= 40) {
                statusText = "Good effort! Review the tricky word problems and try again.";
            } else {
                statusText = "Let’s practise more measurement concepts.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }
    </script>
</body>
</html>
