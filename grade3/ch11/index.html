<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Patterns & Symmetry Quest</title>
    <style>
        :root {
            --primary: #0284c7; 
            --secondary: #38bdf8; 
            --success: #16a34a;
            --danger: #e11d48; 
            --warning: #ea580c; 
            --background: #f0f9ff;
            --surface: #ffffff; 
            --text: #0f172a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        body { 
            background-color: var(--background); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 650px; 
            background: var(--surface); 
            border-radius: 20px; 
            box-shadow: 0 12px 36px rgba(2, 132, 199, 0.08); 
            padding: 32px; 
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* Strict Screen Isolation */
        .screen { display: none !important; }
        .screen.active { display: block !important; }
        #splash-screen.active { display: flex !important; justify-content: center; align-items: center; }

        /* Welcome Screen Styling */
        .welcome-content { text-align: center; }
        .welcome-logo { max-width: 200px; height: auto; margin-bottom: 24px; }
        h1 { color: #0284c7; font-size: 1.8rem; margin-bottom: 16px; font-weight: 700; }
        .description { text-align: center; color: #475569; margin-bottom: 32px; line-height: 1.6; font-size: 1rem; }
        
        /* Splash Screen Style */
        #splash-screen { text-align: center; padding: 60px 20px; }
        .logo-frame { max-width: 240px; height: auto; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* HUD Bar from Screenshots */
        .hud { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f1f5f9; 
            padding: 12px 20px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            font-weight: 600; 
            font-size: 0.95rem;
        }
        .timer-box { 
            color: #e11d48; 
            background: #fff1f2; 
            padding: 4px 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        /* Question Text */
        .question-text { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.6; 
            color: #0f172a;
        }

        /* HTML Visual Tracks */
        .visual-track {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 24px;
            padding: 16px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
        }

        /* Shape/Ornament Track Elements */
        .ornament-item {
            font-size: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .item-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
            font-weight: 700;
        }

        /* Building Grid Stack Elements */
        .grid-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            background: #fff;
            padding: 6px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            align-items: center;
        }
        .grid-block {
            width: 30px;
            height: 20px;
            background: #38bdf8;
            border: 2px solid #0284c7;
            border-radius: 3px;
        }
        .stack-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
            margin-top: 6px;
            text-align: center;
        }

        /* Options Layout */
        .options-container { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-bottom: 20px;
        }
        
        .option-btn { 
            background: var(--surface); 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 18px 20px; 
            cursor: pointer; 
            font-weight: 500; 
            width: 100%; 
            transition: all 0.2s ease; 
            font-size: 1.05rem; 
            text-align: left; 
            color: #334155;
        }
        
        .option-btn:hover:not(:disabled) { 
            border-color: #94a3b8; 
            background: #f8fafc; 
        }
        
        .option-btn.correct { 
            background: #f0fdf4 !important; 
            border-color: #16a34a !important; 
            color: #14532d !important; 
            font-weight: 600;
        }
        
        .option-btn.wrong { 
            background: #fff1f2 !important; 
            border-color: #e11d48 !important; 
            color: #4c0519 !important; 
        }

        .option-btn:disabled:not(.correct):not(.wrong) {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Feedback Panels */
        .feedback-box { 
            padding: 18px; 
            border-radius: 12px; 
            margin-top: 16px; 
            display: none; 
            line-height: 1.6; 
            font-weight: 500; 
            font-size: 0.95rem;
        }
        .feedback-box.explanation { 
            background: #f0f9ff; 
            border-left: 5px solid #0284c7; 
            color: #0c4a6e; 
        }

        .action-btn { 
            width: 100%; 
            background: #0084c7; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            padding: 16px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: background 0.2s;
        }
        .action-btn:hover { background: #0269a1; }

        .score-circle { width: 130px; height: 130px; border-radius: 50%; background: #f1f5f9; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; margin: 20px auto; color: var(--primary); border: 4px solid var(--secondary); }
    </style>
</head>
<body>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        <div id="splash-screen" class="screen active">
            <img src="assets/logo.png" alt="Logo" class="logo-frame">
        </div>

        <div id="welcome-screen" class="screen">
            <div class="welcome-content">
                <img src="assets/logo.png" alt="Logo" class="welcome-logo">
                <h1>Patterns & Symmetry Quest</h1>
                <p class="description">Welcome, Explorer! Get ready to apply mirror lines, pattern tracks, and tiling logic to crack real-world math mysteries.</p>
                <button class="action-btn" style="display: block;" onclick="startInteractive()">Start Challenge</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/5</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span> s</div>
            </div>
            <div id="target-question" class="question-text"></div>
            
            <div id="dynamic-visual-panel"></div>

            <div id="options-area" class="options-container"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>
            <button id="next-btn" class="action-btn" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 10px;">Quest Complete!</h2>
            <div class="score-circle" id="final-score-value">0/5</div>
            <p class="description" id="final-status-msg"></p>
            <button class="action-btn" style="display: block;" onclick="resetInteractive()">Try Again</button>
        </div>
    </div>

    <script>
        const baseQuestionBank = [
            {
                type: "ornament",
                question: "An automated design patterns an ornament using: Heart, Star, Diamond, Heart, Star, Diamond... If this arrangement continues, what item represents position 12?",
                options: ["Heart", "Star", "Diamond", "Square"],
                answer: 2, 
                explanation: "The pattern repeats every 3 items (1=Heart, 2=Star, 3=Diamond). Since 12 is a multiple of 3, it will land exactly on a Diamond!"
            },
            {
                type: "grid",
                question: "A construction grid builds a growing pattern. Step 1 uses 2 squares, Step 2 uses 4 squares, and Step 3 uses 6 squares. How many total squares will Step 6 need?",
                options: ["8 squares", "10 squares", "12 squares", "14 squares"],
                answer: 2,
                explanation: "The count increases by 2 blocks with each step (Step number × 2). Step 6 will require 6 × 2 = 12 blocks total."
            },
            {
                type: "text",
                question: "Rahul is arranging square colored tiles on a wall without leaving any gaps or overlaps. He uses Red, Blue, Red, Blue. What geometric concept is Rahul creating?",
                options: ["Perimeter boundaries", "Tiling and tessellation", "An asymmetric layout", "A decreasing sequence"],
                answer: 1,
                explanation: "Covering a completely flat surface with repeating geometric shapes without any gaps or overlapping spaces is called tiling or tessellation."
            },
            {
                type: "text",
                question: "An artist designs a floor border sequence using layout lengths: 3cm, 6cm, 12cm, 24cm... What logic is being used to expand the pattern steps?",
                options: ["Adding 3cm to each previous measurement", "Subtracting 3cm from each step", "Using a rule to double the previous length", "Dividing the length value by 3"],
                answer: 2,
                explanation: "Each measurement is multiplied by 2 to construct the next position (3×2=6, 6×2=12, 12×2=24). The logic rule is to double the previous value."
            },
            {
                type: "text",
                question: "A tiling pattern alternates lines: Row 1 uses all Triangles. Row 2 uses all Squares. Row 3 uses all Triangles. What does Row 10 use?",
                options: ["Triangles", "Squares", "Circles", "Hexagons"],
                answer: 1,
                explanation: "Odd rows map entirely to Triangles, while even rows map directly to Squares. Since 10 is an even number, Row 10 will use Squares."
            }
        ];

        let questionBank = [...baseQuestionBank];
        let currentIndex = 0;
        let runningScore = 0;
        let countdownTimer;
        let activeSeconds = 60;

        // Auto-switch away from splash screen cleanly after 3.5 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.remove('active');
                document.getElementById('welcome-screen').classList.add('active');
            }, 3500);
        });

        function startInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            let q = questionBank[currentIndex];
            clearInterval(countdownTimer);
            activeSeconds = 60;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('target-question').innerText = q.question;
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            // Generate Native Non-Image Visual Component Elements
            const visualPanel = document.getElementById('dynamic-visual-panel');
            visualPanel.innerHTML = '';
            
            if (q.type === "ornament") {
                visualPanel.innerHTML = `
                    <div class="visual-track">
                        <div class="ornament-item">❤️<div class="item-label">1</div></div>
                        <div class="ornament-item">⭐<div class="item-label">2</div></div>
                        <div class="ornament-item">💎<div class="item-label">3</div></div>
                        <div class="ornament-item">❤️<div class="item-label">4</div></div>
                        <div class="ornament-item">⭐<div class="item-label">5</div></div>
                        <div class="ornament-item">💎<div class="item-label">6</div></div>
                        <div class="ornament-item" style="opacity:0.5;">❓<div class="item-label">...12</div></div>
                    </div>`;
            } else if (q.type === "grid") {
                visualPanel.innerHTML = `
                    <div class="visual-track">
                        <div><div class="grid-stack"><div class="grid-block"></div><div class="grid-block"></div></div><div class="stack-label">Step 1</div></div>
                        <div><div class="grid-stack"><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div></div><div class="stack-label">Step 2</div></div>
                        <div><div class="grid-stack"><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div><div class="grid-block"></div></div><div class="stack-label">Step 3</div></div>
                        <div style="opacity:0.4; font-size:1.5rem; font-weight:bold; padding-bottom:20px;">... Step 6?</div>
                    </div>`;
            }

            const area = document.getElementById('options-area');
            area.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => evaluate(btn, idx);
                area.appendChild(btn);
            });
            
            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let q = questionBank[currentIndex];
            disableAllOptions();
            playSound('wrong');
            highlightCorrectAnswer(q.answer);
            
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${q.explanation}`;
            explBox.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluate(selectedBtn, idx) {
            clearInterval(countdownTimer);
            let q = questionBank[currentIndex];
            disableAllOptions();
            
            if (idx === q.answer) {
                selectedBtn.classList.add('correct');
                playSound('correct');
                runningScore++;
                document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                document.getElementById('explain-feedback').innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('wrong');
                highlightCorrectAnswer(q.answer);
                playSound('wrong');
                document.getElementById('explain-feedback').innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
            }
            
            document.getElementById('explain-feedback').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function disableAllOptions() {
            const area = document.getElementById('options-area');
            Array.from(area.children).forEach(btn => btn.disabled = true);
        }

        function highlightCorrectAnswer(correctIdx) {
            const area = document.getElementById('options-area');
            if(area.children[correctIdx]) {
                area.children[correctIdx].classList.add('correct');
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play deferred."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = finalPercentage >= 80 ? "Spectacular! You have mastered patterns and symmetry!" : (finalPercentage >= 50 ? "Good effort! Let's review and try again to improve." : "Let’s practice more together!");
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }
    </script>
</body>
</html>
