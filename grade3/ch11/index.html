<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Math - Patterns and Symmetry Interactive CBQ</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Splash Screen Style */
        #splash-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        #splash-screen img {
            max-width: 250px;
            height: auto;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        /* Quiz Header */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .progress {
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
        }

        /* Question Card */
        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: left;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        /* Feedback and Controls */
        .feedback-box {
            font-weight: 600;
            margin: 15px 0;
            min-height: 24px;
            font-size: 1rem;
        }

        .action-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Results Screen */
        #results-screen h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #results-screen p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Splash Screen (Innovine Logo for 5 seconds) -->
        <div id="splash-screen">
            <img src="assets/logo.png" alt="Innovine Logo">
            <p style="margin-top: 20px; color: #64748b; font-weight: 500;">Loading Interactive Module...</p>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="hidden">
            <div class="quiz-header">
                <span class="progress" id="progress-indicator">Question 1 of 12</span>
                <span class="progress" id="attempts-indicator">Attempts: 2/2</span>
            </div>
            <div id="question-box">
                <div class="question-text" id="question-text">Question goes here</div>
                <div class="options-grid" id="options-grid"></div>
            </div>
            <div class="feedback-box" id="feedback-box"></div>
            <div class="action-footer">
                <button id="next-btn" class="btn-primary hidden" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <h2>Activity Completed! 🎉</h2>
            <p id="score-text">You scored X out of 12</p>
            <button class="btn-primary" onclick="restartQuiz()">Restart Activity</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-correct" src="assets/claps.mp3"></audio>
    <audio id="sound-wrong" src="assets/wrong.mp3"></audio>

    <script>
        // 12 CBQ Questions Database based on Chapter 11 (Patterns and Symmetry)
        const quizData = [
            {
                question: "What comes next in the repeating sequence: Red, Blue, Red, Blue, Red, ...?",
                options: ["Red", "Blue", "Green", "Yellow"],
                answer: 1 // Blue
            },
            {
                question: "Identify the missing number in the growing pattern: 2, 4, 6, 8, ...?",
                options: ["9", "10", "12", "11"],
                answer: 1 // 10
            },
            {
                question: "Which of the following shapes can be used to tile a floor without any gaps or overlaps?",
                options: ["Circle", "Square", "Oval", "Curved triangle"],
                answer: 1 // Square
            },
            {
                question: "Complete the number pattern: 95, 85, 75, 65, 55, ...?",
                options: ["45", "50", "35", "40"],
                answer: 0 // 45
            },
            {
                question: "What is a line of symmetry?",
                options: [
                    "A line that splits a shape into two different sizes",
                    "A line that divides a figure into exact mirror-image halves",
                    "A line drawn only on the outside border",
                    "A line that makes a shape disappear"
                ],
                answer: 1 // A line that divides a figure into exact mirror-image halves
            },
            {
                question: "Which shape pattern follows an alternating sequence rule?",
                options: ["Circle, Circle, Circle", "Square, Square, Circle", "Circle, Square, Circle, Square", "Triangle, Triangle, Triangle"],
                answer: 2 // Circle, Square, Circle, Square
            },
            {
                question: "Complete the sequence: 1, 2, 3, 1, 2, 3, 1, 2, ...?",
                options: ["1", "2", "3", "4"],
                answer: 2 // 3
            },
            {
                question: "Why can't circles be used to form a tiling pattern?",
                options: [
                    "They are too small",
                    "They leave gaps when arranged together",
                    "They have straight edges",
                    "They are always colourful"
                ],
                answer: 1 // They leave gaps when arranged together
            },
            {
                question: "What type of pattern is represented by numbers increasing or decreasing by a constant amount?",
                options: ["Repeating pattern", "Growing pattern", "Symmetric pattern", "Tiling pattern"],
                answer: 1 // Growing pattern
            },
            {
                question: "How many lines of symmetry can be drawn for a standard regular square?",
                options: ["1", "2", "4", "Infinite"],
                answer: 2 // 4
            },
            {
                question: "Complete the backward counting number sequence: 50, 45, 40, 35, 30, ...?",
                options: ["20", "25", "28", "22"],
                answer: 1 // 25
            },
            {
                question: "Which everyday item uses patterns made of lines and spaces that computers can read to identify products?",
                options: ["Barcodes", "Digital Clocks", "Lightbulbs", "Windows"],
                answer: 0 // Barcodes
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attemptsLeft = 2;
        let lockAnswer = false;

        // Splash Screen Timer (5 seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');
                loadQuestion();
            }, 5000);
        });

        function loadQuestion() {
            lockAnswer = false;
            attemptsLeft = 2;
            document.getElementById('attempts-indicator').innerText = `Attempts: 2/2`;
            document.getElementById('feedback-box').innerText = '';
            document.getElementById('next-btn').classList.add('hidden');

            const currentData = quizData[currentQuestionIndex];
            document.getElementById('progress-indicator').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            document.getElementById('question-text').innerText = currentData.question;

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            currentData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (lockAnswer) return;

            const currentData = quizData[currentQuestionIndex];
            const soundCorrect = document.getElementById('sound-correct');
            const soundWrong = document.getElementById('sound-wrong');
            const feedbackBox = document.getElementById('feedback-box');

            if (selectedIndex === currentData.answer) {
                // Correct Answer
                lockAnswer = true;
                btnElement.classList.add('correct');
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                feedbackBox.style.color = 'var(--success)';
                feedbackBox.innerText = 'Correct! Great job!';
                score++;
                disableAllOptions();
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                // Incorrect Answer
                attemptsLeft--;
                soundWrong.currentTime = 0;
                soundWrong.play();

                if (attemptsLeft > 0) {
                    btnElement.classList.add('incorrect');
                    btnElement.disabled = true;
                    feedbackBox.style.color = 'var(--danger)';
                    feedbackBox.innerText = `Incorrect! You have ${attemptsLeft} attempt left. Try again!`;
                    document.getElementById('attempts-indicator').innerText = `Attempts: ${attemptsLeft}/2`;
                } else {
                    // Out of attempts, reveal correct answer
                    lockAnswer = true;
                    btnElement.classList.add('incorrect');
                    feedbackBox.style.color = 'var(--danger)';
                    feedbackBox.innerText = `Incorrect! The correct answer was: "${currentData.options[currentData.answer]}"`;
                    
                    highlightCorrectAnswer();
                    disableAllOptions();
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        function highlightCorrectAnswer() {
            const currentData = quizData[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            if (buttons[currentData.answer]) {
                buttons[currentData.answer].classList.add('correct');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `You scored ${score} out of ${quizData.length}`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }
    </script>
</body>
</html>
