<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Patterns & Symmetry Quest</title>
    <style>
        :root {
            --primary: #0284c7; 
            --secondary: #38bdf8; 
            --success: #16a34a;
            --danger: #e11d48; 
            --warning: #ea580c; 
            --background: #f0f9ff;
            --surface: #ffffff; 
            --text: #0f172a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        body { 
            background-color: var(--background); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 650px; 
            background: var(--surface); 
            border-radius: 20px; 
            box-shadow: 0 12px 36px rgba(2, 132, 199, 0.08); 
            padding: 32px; 
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Strict Screen State System */
        .screen { display: none !important; }
        .screen.active { display: block !important; }
        
        /* Splash Screen Setup */
        #splash-screen.active { 
            display: flex !important; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .logo-frame { 
            max-width: 240px; 
            height: auto; 
            animation: pulse 2s infinite ease-in-out; 
        }

        @keyframes pulse { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.04); } 
        }

        /* Welcome Screen Styling */
        .welcome-content { text-align: center; }
        .welcome-logo { max-width: 200px; height: auto; margin-bottom: 24px; }
        h1 { color: #0284c7; font-size: 1.8rem; margin-bottom: 16px; font-weight: 700; text-align: center; }
        .description { text-align: center; color: #475569; margin-bottom: 32px; line-height: 1.6; font-size: 1rem; }
        
        /* HUD Display Bar */
        .hud { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f1f5f9; 
            padding: 12px 20px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            font-weight: 600; 
            font-size: 0.95rem;
        }
        .timer-box { 
            color: #e11d48; 
            background: #fff1f2; 
            padding: 4px 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        /* Question Typography */
        .question-text { 
            font-size: 1.15rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.6; 
            color: #0f172a;
        }

        /* Inline CSS Visual Track Base */
        .visual-track {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: flex-end;
            margin: 8px 0 24px 0;
            padding: 20px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
        }

        /* Ornament Sequence Layout */
        .ornament-item {
            font-size: 2.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }
        .item-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 6px;
            font-weight: 700;
        }

        /* Pure CSS Building Blocks */
        .grid-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
            background: #ffffff;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            align-items: center;
            min-width: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .grid-block {
            width: 44px;
            height: 18px;
            background: #38bdf8;
            border: 2px solid #0284c7;
            border-radius: 4px;
        }
        .stack-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-top: 8px;
            text-align: center;
        }

        /* Options System Layout */
        .options-container { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-bottom: 20px;
        }
        
        .option-btn { 
            background: var(--surface); 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 18px 20px; 
            cursor: pointer; 
            font-weight: 500; 
            width: 100%; 
            transition: all 0.2s ease; 
            font-size: 1.05rem; 
            text-align: left; 
            color: #334155;
        }
        
        .option-btn:hover:not(:disabled) { 
            border-color: #38bdf8; 
            background: #f0f9ff; 
        }
        
        .option-btn.correct { 
            background: #f0fdf4 !important; 
            border-color: #16a34a !important; 
            color: #14532d !important; 
            font-weight: 600;
        }
        
        .option-btn.wrong { 
            background: #fff1f2 !important; 
            border-color: #e11d48 !important; 
            color: #4c0519 !important; 
        }

        .option-btn:disabled:not(.correct):not(.wrong) {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Explanation Feedback */
        .feedback-box { 
            padding: 18px; 
            border-radius: 12px; 
            margin-top: 16px; 
            display: none; 
            line-height: 1.6; 
            font-weight: 500; 
            font-size: 0.95rem;
        }
        .feedback-box.explanation { 
            background: #f0f9ff; 
            border-left: 5px solid #0284c7; 
            color: #0c4a6e; 
        }

        /* Action Controls */
        .action-btn { 
            width: 100%; 
            background: #0284c7; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            padding: 16px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 12px; 
            transition: background 0.2s;
        }
        .action-btn:hover { background: #0269a1; }

        .score-circle { width: 130px; height: 130px; border-radius: 50%; background: #f1f5f9; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; margin: 20px auto; color: var(--primary); border: 4px solid var(--secondary); }

        /* Confetti Overlay Setup */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        <canvas id="confetti-canvas"></canvas>

        <div id="splash-screen" class="screen active">
            <img src="assets/logo.png" alt="Innovine Solutions" class="logo-frame">
        </div>

        <div id="welcome-screen" class="screen">
            <div class="welcome-content">
                <img src="assets/logo.png" alt="Innovine Solutions" class="welcome-logo">
                <h1>Patterns & Symmetry Quest</h1>
                <p class="description">Welcome, Explorer! Get ready to apply mirror lines, pattern tracks, and tiling logic to crack real-world math mysteries.</p>
                <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/5</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span> s</div>
            </div>
            <div id="target-question" class="question-text"></div>
            
            <div id="dynamic-visual-panel"></div>

            <div id="options-area" class="options-container"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>
            <button id="next-btn" class="action-btn" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 10px;">Quest Complete!</h2>
            <div class="score-circle" id="final-score-value">0/5</div>
            <p class="description" id="final-status-msg"></p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>
    </div>
