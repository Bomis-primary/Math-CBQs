<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Patterns & Symmetry Quest</title>
    <style>
        :root {
            --primary: #0284c7; --secondary: #38bdf8; --success: #16a34a;
            --danger: #e11d48; --warning: #ea580c; --background: #f0f9ff;
            --surface: #ffffff; --text: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--background); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; position: relative; }
        .container { width: 100%; max-width: 650px; background: var(--surface); border-radius: 20px; box-shadow: 0 12px 36px rgba(2, 132, 199, 0.08); padding: 24px; position: relative; z-index: 2; }
        
        .screen { display: none; }
        .screen.active { display: block; }
        h1, h2 { color: var(--primary); text-align: center; margin-bottom: 16px; }
        .description { text-align: center; color: #475569; margin-bottom: 24px; line-height: 1.6; }
        
        /* HUD & Question */
        .hud { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; }
        .timer-box { color: var(--danger); display: flex; align-items: center; gap: 4px; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; white-space: pre-line; }

        /* Alphabet Grid */
        .letter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .letter-card { background: white; border: 3px solid #e2e8f0; border-radius: 16px; padding: 20px; font-size: 3rem; font-weight: 800; text-align: center; color: var(--primary); cursor: pointer; transition: 0.2s; }
        .letter-card:hover:not(.disabled) { border-color: var(--secondary); background: #f8fafc; }
        .letter-card.correct { border-color: var(--success); background: #f0fdf4; color: var(--success); }
        .letter-card.wrong { border-color: var(--danger); background: #fff1f2; color: var(--danger); }
        .letter-card.disabled { pointer-events: none; opacity: 0.6; }
        .letter-card.correct.disabled, .letter-card.wrong.disabled { opacity: 1; }

        /* Buttons & Feedback */
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: var(--surface); border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; cursor: pointer; font-weight: 500; width: 100%; transition: 0.2s; font-size: 1rem; text-align: left; }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background: #f8fafc; }
        .option-btn.correct { background: #f0fdf4 !important; border-color: var(--success) !important; color: #14532d; }
        .option-btn.wrong { background: #fff1f2 !important; border-color: var(--danger) !important; color: #4c0519; }
        
        .feedback-box { padding: 16px; border-radius: 12px; margin-top: 15px; display: none; line-height: 1.5; font-weight: 500; }
        .feedback-box.hint { background: #fff7ed; border-left: 5px solid var(--warning); color: #7c2d12; }
        .feedback-box.explanation { background: #f0f9ff; border-left: 5px solid var(--primary); color: #0c4a6e; }
        .action-btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .action-btn:hover { background: #0369a1; }

        .score-circle { width: 130px; height: 130px; border-radius: 50%; background: #f1f5f9; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; margin: 20px auto; color: var(--primary); border: 4px solid var(--secondary); }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        <div id="welcome-screen" class="screen active">
            <h1>Patterns & Symmetry</h1>
            <p class="description">Master sequences, symmetry, and tiling logic!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/3</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>
            <div id="target-question" class="question-text"></div>
            <div id="options-area"></div>
            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>
            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Quest Complete!</h2>
            <div class="score-circle" id="final-score-value">0/0</div>
            <p class="description" id="final-status-msg"></p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>
    </div>

    <script>
        const questionBank = [
            {
                type: "Visual",
                question: "Which capital letter has a clear horizontal line of symmetry?",
                options: ["A", "M", "B", "Q"],
                isVisualLetters: true,
                answer: 2,
                hint: "Try to draw a horizontal split across the middle. Which one has an identical top and bottom?",
                explanation: "The letter 'B' has a horizontal line of symmetry. The top part mirrors the bottom part perfectly."
            },
            {
                type: "Standard",
                question: "Which shape can be cut into two identical mirror halves using only one straight vertical line down the middle?",
                options: ["A heart shape", "An asymmetric L-shape", "A scalene triangle", "A dynamic wind flag"],
                answer: 0,
                hint: "Think about which shape looks exactly the same on its left side as it does on its right side.",
                explanation: "A heart shape has vertical symmetry. If you draw a line down the middle, the left side mirrors the right side."
            },
            {
                type: "Standard",
                question: "An alternating sequence uses: Triangle, Square, Circle... what is the 9th shape?",
                options: ["Triangle", "Square", "Circle", "Rectangle"],
                answer: 2,
                hint: "The pattern repeats every 3 shapes. The 9th shape completes a full cycle.",
                explanation: "Since the group [Triangle, Square, Circle] has a length of 3, the 9th item perfectly finishes the third loop as a Circle."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            let q = questionBank[currentIndex];
            clearInterval(countdownTimer);
            activeSeconds = 60;
            attemptTracker = 0; 
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('target-question').innerText = q.question;
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const area = document.getElementById('options-area');
            area.innerHTML = '';
            
            if (q.isVisualLetters) {
                area.className = "letter-grid";
                q.options.forEach((char, idx) => {
                    let div = document.createElement('div');
                    div.className = 'letter-card';
                    div.innerText = char;
                    div.onclick = () => evaluate(div, idx);
                    area.appendChild(div);
                });
            } else {
                area.className = "options-container";
                q.options.forEach((opt, idx) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => evaluate(btn, idx);
                    area.appendChild(btn);
                });
            }
            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let q = questionBank[currentIndex];
            disableAllOptions();
            playSound('wrong');
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${q.explanation}`;
            explBox.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluate(el, idx) {
            let q = questionBank[currentIndex];
            
            if (idx === q.answer) {
                clearInterval(countdownTimer);
                el.classList.add('correct');
                disableAllOptions();
                triggerSparkles();
                playSound('correct');
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                document.getElementById('hint-feedback').style.display = 'none';
                document.getElementById('explain-feedback').innerHTML = "<strong>Correct!</strong> " + q.explanation;
                document.getElementById('explain-feedback').style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';
            } else {
                attemptTracker++;
                el.classList.add('wrong');
                playSound('wrong');
                
                if (q.isVisualLetters) el.classList.add('disabled');
                else el.disabled = true;

                if (attemptTracker === 1) {
                    document.getElementById('hint-feedback').innerHTML = "<strong>Hint:</strong> " + q.hint;
                    document.getElementById('hint-feedback').style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    highlightCorrectAnswer(q.answer);
                    document.getElementById('hint-feedback').style.display = 'none';
                    document.getElementById('explain-feedback').innerHTML = "<strong>Not quite!</strong> " + q.explanation;
                    document.getElementById('explain-feedback').style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const area = document.getElementById('options-area');
            if (area.className === "letter-grid") {
                Array.from(area.children).forEach(card => card.classList.add('disabled'));
            } else {
                Array.from(area.children).forEach(btn => btn.disabled = true);
            }
        }

        function highlightCorrectAnswer(correctIdx) {
            const area = document.getElementById('options-area');
            area.children[correctIdx].classList.add('correct');
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio contextual lock handled."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = finalPercentage >= 75 ? "Good job!" : (finalPercentage >= 40 ? "Review this chapter and try again." : "Let’s practise more.");
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        /* Particle System Engine */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 40 + 190}, 90%, 60%)`,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
            renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, idx) => {
                p.x += p.speedX; p.y += p.speedY; p.alpha -= 0.02;
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) requestAnimationFrame(renderParticles);
        }
    </script>
</body>
</html>
