<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Time & Timelines Interactive</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-placeholder {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Core Engine Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* HUD layout */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Elements */
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* Option Buttons */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f9fafb;
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #fef3c7;
            border-left: 5px solid var(--warning);
            color: #92400e;
        }

        .feedback-box.explanation {
            background-color: #dbeafe;
            border-left: 5px solid var(--secondary);
            color: #1e40af;
        }

        /* Action Buttons */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(30,58,138,0.15);
        }

        .action-btn:hover {
            background: #1e3a8a;
        }

        /* Score Display styling */
        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-placeholder" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
        <h2 id="logo-text" style="display:none; color: var(--primary);">Innovine</h2>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Time & Timelines</h1>
            <p class="description">Master reading analog clocks to the exact minute, understanding quarters of an hour, calculating duration, and using timeline sequencing logic!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading summary...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                question: "Rohan stops studying and goes for a break at the time shown on the clock face below. He returns to his desk exactly 20 minutes later. What time does he get back to his studies?",

            },
            {
                question: "Sia is waiting for her school lunch break. Her teacher shows the class the clock below and mentions that lunch will be served immediately. What is another way to announce this time to her friends?",

                answer: 1,
                hint: "Notice that the minute hand has traveled exactly one-fourth of the way around the clock face.",
                explanation: "The clock face shows 1:15. Because 15 minutes is exactly one quarter of a 60-minute hour, this time is widely known as 'Quarter past 1'."

                answer: 2,
                hint: "Count how many minute steps are remaining for the long hand to reach the top 12 mark.",
                explanation: "The watch shows 4:45. To reach the start time of 5:00, the long hand must cover the remaining 15 minutes (or one quarter-hour interval)."

            {

                    "His estimate was very accurate.",
                    "His estimate was way too high compared to actual time.",
                    "His estimate was too low compared to actual time.",
                    "Brushing teeth cannot be measured in minutes."
                ],
                answer: 1,
                hint: "Compare his guess (20 minutes) with the real measured value (3 minutes). Is 20 much larger or smaller than 3?",

                answer: 2,

                explanation: "If yesterday
