<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Time & Timelines Interactive</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-placeholder {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Core Engine Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* HUD layout */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Elements */
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* Option Buttons */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f9fafb;
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #fef3c7;
            border-left: 5px solid var(--warning);
            color: #92400e;
        }

        .feedback-box.explanation {
            background-color: #dbeafe;
            border-left: 5px solid var(--secondary);
            color: #1e40af;
        }

        /* Action Buttons */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(30,58,138,0.15);
        }

        .action-btn:hover {
            background: #1e3a8a;
        }

        /* Score Display styling */
        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-placeholder" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
        <h2 id="logo-text" style="display:none; color: var(--primary);">Innovine</h2>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Time & Timelines</h1>
            <p class="description">Master reading analog clocks to the exact minute, understanding quarters of an hour, calculating duration, and using timeline sequencing logic!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading summary...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                question: "Rohan looks at the classroom wall clock. The short hour hand is slightly past 4, and the long minute hand points directly at the number 2. What exact time is it?",
                hasImage: "clock-4-10",
                options: ["4:02", "4:10", "2:20", "5:10"],
                answer: 1,
                hint: "Each large number on an analog clock face represents a count of 5 minutes.",
                explanation: "When the minute hand points at 2, you multiply $2 \\times 5 = 10$ minutes. Since the hour hand is past 4, the time is exactly 4:10."
            },
            {
                question: "Sia's mother told her that lunch will be ready at 'quarter past 1'. Which digital display matches what her mother said?",
                hasImage: "clock-1-15",
                options: ["1:45", "1:15", "1:30", "12:45"],
                answer: 1,
                hint: "An hour is split into 4 quarters of 15 minutes each. 'Quarter past' means 1 quarter of an hour has passed.",
                explanation: "A quarter of an hour is 15 minutes ($60 \\div 4 = 15$). Therefore, 'quarter past 1' means 15 minutes have passed after 1 o'clock, which is 1:15."
            },
            {
                question: "Karan's swimming class starts at 5:00. He checks his watch and notices that it is exactly 'quarter to 5'. How many minutes does he have left before class starts?",
                hasImage: "clock-4-45",
                options: ["45 minutes", "30 minutes", "15 minutes", "5 minutes"],
                answer: 2,
                hint: "'Quarter to 5' means there is exactly one quarter of an hour remaining until the clock strikes 5:00.",
                explanation: "'Quarter to 5' represents the time 4:45. From 4:45 to 5:00, there are exactly 15 minutes left."
            },
            {
                question: "Aditya wants to check his time-estimation skills. He estimates that brushing his teeth thoroughly takes about 20 minutes. He uses a stopwatch and finds it actually takes 3 minutes. What can we say about his estimate?",
                options: [
                    "His estimate was very accurate.",
                    "His estimate was way too high compared to actual time.",
                    "His estimate was too low compared to actual time.",
                    "Brushing teeth cannot be measured in minutes."
                ],
                answer: 1,
                hint: "Compare his guess (20 minutes) with the real measured value (3 minutes). Is 20 much larger or smaller than 3?",
                explanation: "Aditya's estimate of 20 minutes was much higher than the actual measured time of 3 minutes. Brushing teeth normally takes a few minutes, not close to half an hour."
            },
            {
                question: "If today is Tuesday, what day of the week will it be tomorrow?",
                options: ["Monday", "Wednesday", "Thursday", "Sunday"],
                answer: 1,
                hint: "Tomorrow means the very next day immediately following today.",
                explanation: "The day that comes immediately after Tuesday is Wednesday."
            },
            {
                question: "Riya's school project is due 'the day after tomorrow'. If today is Thursday, on which day must she submit her project?",
                options: ["Friday", "Saturday", "Sunday", "Wednesday"],
                answer: 1,
                hint: "'The day after tomorrow' means you must jump forward exactly two days from today.",
                explanation: "Counting two days forward from Thursday (1 day is Friday, 2 days is Saturday) brings us to Saturday."
            },
            {
                question: "The current year is 2026. Aman was asked to write down the date of an event that happened in the 'previous year'. What year should he write?",
                options: ["2027", "2025", "2024", "2028"],
                answer: 1,
                hint: "The 'previous year' means the year that came immediately before the current year ($2026 - 1$).",
                explanation: "The year immediately preceding 2026 is 2025."
            },
            {
                question: "Ananya is currently studying in Grade 3 in the year 2026. Her brother tells her she will join high school 'two years from now'. What calendar year will that be?",
                options: ["2027", "2028", "2024", "2029"],
                answer: 1,
                hint: "Add exactly 2 years to the current year of 2026.",
                explanation: "Two years from now is calculated by adding 2 to the current year: $2026 + 2 = 2028$."
            },
            {
                question: "Anik logs these temporal facts in a diary entry. Which statement contains an incorrect definition or time calculation error?",
                options: [
                    "Half past 6 is written digitally as 6:30.",
                    "If today is Sunday, then tomorrow is Monday.",
                    "Quarter past 3 means there are 45 minutes left until 4 o'clock.",
                    "The year following 2030 will be 2031."
                ],
                answer: 2,
                hint: "Check the definition of 'quarter past'. Does it tell us how many minutes have passed, or how many are left?",
                explanation: "The statement is incorrect. Quarter past 3 means it is 3:15 (15 minutes past 3). There are 45 minutes left until 4:00, but that time phrase itself is called 'quarter to 4', not quarter past 3."
            },
            {
                question: "Assertion: An analog clock face has 60 small tick marks around its circular edge.\nReason: The long hand takes exactly 1 hour to visit all 60 ticks because 1 hour equals 60 minutes.",
                options: [
                    "Both Assertion and Reason are correct, and the Reason perfectly explains the Assertion.",
                    "Both Assertion and Reason are correct, but the Reason does not explain the Assertion.",
                    "The Assertion is correct, but the Reason is completely false.",
                    "Both the Assertion and the Reason are completely false."
                ],
                answer: 0,
                hint: "Think about why there are 60 markings on a clock and how the minute hand travels across them.",
                explanation: "Both statements are correct. There are 60 markings because an hour contains 60 minutes, and the minute hand travels across one tick mark every single minute."
            },
            {
                question: "Case Story Part 1: Kabir is creating a historical timeline for his family history. He discovers that his grandfather bought their house in 2010, his parents got married 5 years later, and Kabir was born 4 years after his parents' marriage. In what year was Kabir born?",
                hasImage: "timeline-family",
                options: ["2015", "2019", "2020", "2014"],
                answer: 1,
                hint: "Start at 2010, add 5 years for the marriage, then add 4 more years for Kabir's birth.",
                explanation: "Parents married: $2010 + 5 = 2015$. Kabir born: $2015 + 4 = 2019$."
            },
            {
                question: "Case Story Part 2: Look at Kabir's completed family timeline sequence below:\nEvent A: Grandfather buys house (2010)\nEvent B: Parents get married (2015)\nEvent C: Kabir is born (2019)\nWhich of the following describes the correct chronological order of these events from earliest to latest?",
                hasImage: "timeline-family",
                options: [
                    "Event B → Event C → Event A",
                    "Event A → Event B → Event C",
                    "Event C → Event B → Event A",
                    "Event A → Event C → Event B"
                ],
                answer: 1,
                hint: "Arrange the events starting from the oldest year (smallest number) moving forward to the most recent year.",
                explanation: "Chronological order requires organizing by time sequence: 2010 (Event A) happened first, followed by 2015 (Event B), and finally 2019 (Event C)."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 5000);
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function generateClockSVG(hour, minute) {
            const hrAngle = (hour * 30) + (minute * 0.5);
            const minAngle = minute * 6;
            return `
            <div style="display:flex; justify-content:center; margin: 15px 0;">
                <svg width="160" height="160" viewBox="0 0 100 100" style="background:transparent;">
                    <circle cx="50" cy="50" r="45" stroke="#1e3a8a" stroke-width="3" fill="#ffffff"/>
                    <line x1="50" y1="50" x2="50" y2="28" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" transform="rotate(${hrAngle} 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" transform="rotate(${minAngle} 50 50)"/>
                    <circle cx="50" cy="50" r="3" fill="#1e3a8a"/>
                    <text x="50" y="14" font-size="8" font-weight="bold" text-anchor="middle" fill="#1f2937">12</text>
                    <text x="88" y="53" font-size="8" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text>
                    <text x="50" y="92" font-size="8" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text>
                    <text x="12" y="53" font-size="8" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text>
                </svg>
            </div>`;
        }

        function generateTimelineSVG() {
            return `
            <div style="display:flex; justify-content:center; margin: 15px 0; width:100%;">
                <svg width="100%" height="70" viewBox="0 0 300 70" style="background:transparent;">
                    <line x1="20" y1="35" x2="280" y2="35" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
                    <polygon points="280,30 290,35 280,40" fill="#1e3a8a"/>
                    <circle cx="50" cy="35" r="5" fill="#3b82f6"/>
                    <text x="50" y="22" font-size="7" font-weight="bold" text-anchor="middle" fill="#1f2937">2010</text>
                    <text x="50" y="52" font-size="6" text-anchor="middle" fill="#4b5563">House Bought</text>
                    <circle cx="150" cy="35" r="5" fill="#3b82f6"/>
                    <text x="150" y="22" font-size="7" font-weight="bold" text-anchor="middle" fill="#1f2937">2015</text>
                    <text x="150" y="52" font-size="6" text-anchor="middle" fill="#4b5563">Marriage</text>
                    <circle cx="240" cy="35" r="5" fill="#3b82f6"/>
                    <text x="240" y="22" font-size="7" font-weight="bold" text-anchor="middle" fill="#1f2937">2019</text>
                    <text x="240" y="52" font-size="6" text-anchor="middle" fill="#4b5563">Kabir Born</text>
                </svg>
            </div>`;
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60; 
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            
            let displayContent = qData.question;
            
            if (qData.hasImage) {
                if (qData.hasImage === "clock-4-10") {
                    displayContent += generateClockSVG(4, 10);
                } else if (qData.hasImage === "clock-1-15") {
                    displayContent += generateClockSVG(1, 15);
                } else if (qData.hasImage === "clock-4-45") {
                    displayContent += generateClockSVG(4, 45);
                } else if (qData.hasImage === "timeline-family") {
                    displayContent += generateTimelineSVG();
                }
            }

            document.getElementById('target-question').innerHTML = displayContent;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let qData = questionBank[currentIndex];
            disableAllOptions();
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = questionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerSparkles();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio waiting for user gesture."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Good job!";
            } else if (finalPercentage >= 40) {
                statusText = "Review this chapter and try again.";
            } else {
                statusText = "Let’s practise more.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            resizeCanvas();
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 360}, 85%, 65%)`,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
            renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, idx) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.02;
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) {
                requestAnimationFrame(renderParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
