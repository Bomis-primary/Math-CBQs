<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Time & Timelines Interactive</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 750px; 
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-placeholder {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Core Engine Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 1.2rem;
        }

        /* HUD layout */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4f6;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Elements */
        .question-text {
            font-size: 1.4rem; 
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-line;
        }

        /* Option Buttons */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2.5px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            font-size: 1.25rem; 
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f9fafb;
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            font-size: 1.15rem;
            font-weight: 600;
            display: none;
            line-height: 1.5;
        }

        .feedback-box.hint {
            background-color: #fef3c7;
            border-left: 6px solid var(--warning);
            color: #92400e;
        }

        .feedback-box.explanation {
            background-color: #dbeafe;
            border-left: 6px solid var(--secondary);
            color: #1e40af;
        }

        /* Action Buttons */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            margin-top: 24px;
            box-shadow: 0 4px 8px rgba(30,58,138,0.2);
        }

        .action-btn:hover {
            background: #1e3a8a;
        }

        /* Score Display styling */
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 24px auto;
            color: var(--primary);
            border: 5px solid var(--secondary);
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .question-text { font-size: 1.2rem; }
            .option-btn { padding: 16px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-placeholder" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
        <h2 id="logo-text" style="display:none; color: var(--primary); font-size: 3rem; font-weight: 800; letter-spacing: 1px;">Innovine</h2>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Time & Timelines</h1>
            <p class="description">Master reading analog clocks to the exact minute, understanding quarters of an hour, calculating duration, and using timeline sequencing logic!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading summary...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                question: "Rohan stops studying and goes for a break at the time shown on the clock face below. He returns to his desk exactly 20 minutes later. What time does he get back to his studies?",
                hasImage: "clock-4-10",
                options: ["4:10", "4:20", "4:30", "4:50"],
                answer: 2,
                hint: "First, read the starting time from the clock face. Then, add 20 minutes to that value.",
                explanation: "The clock face shows a starting break time of 4:10. Adding 20 minutes to the minute hand position (10 + 20 = 30) brings him back to his studies at exactly 4:30."
            },
            {
                question: "Sia is waiting for her school lunch break. Her teacher shows the class the clock below and mentions that lunch will be served immediately. What is another way to announce this time to her friends?",
                hasImage: "clock-1-15",
                options: ["Quarter to 1", "Quarter past 1", "Half past 1", "Quarter past 12"],
                answer: 1,
                hint: "Notice that the minute hand has traveled exactly one-fourth of the way around the clock face.",
                explanation: "The clock face shows 1:15. Because 15 minutes is exactly one quarter of a 60-minute hour, this time is widely known as 'Quarter past 1'."
            },
            {
                question: "Karan's after-school sports practice is scheduled to begin at exactly 5:00. He checks his wrist watch and sees the time displayed below. How many minutes do he and his teammates have left to prepare?",
                hasImage: "clock-4-45",
                options: ["45 minutes", "30 minutes", "15 minutes", "5 minutes"],
                answer: 2,
                hint: "Count how many minute steps are remaining for the long hand to reach the top 12 mark.",
                explanation: "The watch shows 4:45. To reach the start time of 5:00, the long hand must cover the remaining 15 minutes (or one quarter-hour interval)."
            },
            {
                question: "Aditya wants to check his time-estimation skills. He estimates that brushing his teeth thoroughly takes about 20 minutes. He uses a stopwatch and finds it actually takes 3 minutes. What can we say about his estimate?",
                options: [
                    "His estimate was very accurate.",
                    "His estimate was way too high compared to actual time.",
                    "His estimate was too low compared to actual time.",
                    "Brushing teeth cannot be measured in minutes."
                ],
                answer: 1,
                hint: "Compare his guess (20 minutes) with the real measured value (3 minutes). Is 20 much larger or smaller than 3?",
                explanation: "Aditya's estimate of 20 minutes was much higher than the actual measured time of 3 minutes. Brushing teeth normally takes a few minutes, not close to half an hour."
            },
            {
                question: "Rahul's cousin calls him on Tuesday and says, 'I will reach your city by train the day after tomorrow.' On what day of the week will Rahul's cousin arrive?",
                options: ["Wednesday", "Thursday", "Friday", "Monday"],
                answer: 1,
                hint: "Start at Tuesday. 'Tomorrow' is the very next day, and 'the day after tomorrow' is one more day after that.",
                explanation: "Starting from Tuesday, tomorrow is Wednesday, and the day after tomorrow is Thursday. Therefore, his cousin will arrive on Thursday."
            },
            {
                question: "Riya's school project is due 'the day after tomorrow'. If yesterday was Thursday, on which day must she submit her project?",
                options: ["Friday", "Saturday", "Sunday", "Wednesday"],
                answer: 2,
                hint: "First find out what day it is today. If yesterday was Thursday, today must be Friday. Now skip ahead two days ('the day after tomorrow').",
                explanation: "If yesterday was Thursday, today is Friday. 'Tomorrow' would be Saturday, and 'the day after tomorrow' is Sunday. Riya must submit her project on Sunday."
            },
            {
                question: "Aman is creating a personal timeline. He lists his milestone events in chronological order from earliest to latest: He learned to ride a bike (2024), he joined nursery school (2022), and he learned to swim (2025). Which event should be listed first on his timeline?",
                options: ["He learned to ride a bike", "He joined nursery school", "He learned to swim", "All events happened at the same time"],
                answer: 1,
                hint: "Find the smallest (earliest) year number among 2024, 2022, and 2025.",
                explanation: "Chronological timelines start from the earliest year to the latest year. Comparing the years, 2022 is the earliest year, so joining nursery school must be listed first."
            },
            {
                question: "Ananya is currently studying in Grade 3 in the year 2026. Her brother tells her she will join high school 'two years from now'. What calendar year will that be?",
                options: ["2027", "2028", "2024", "2029"],
                answer: 1,
                hint: "Add exactly 2 years to the current year of 2026.",
                explanation: "Two years from now is calculated by adding 2 to the current year: 2026 + 2 = 2028."
            },
            {
                question: "Anik logs these temporal facts in a diary entry. Which statement contains an incorrect definition or time calculation error?",
                options: [
                    "Half past 6 is written digitally as 6:30.",
                    "If today is Sunday, then tomorrow is Monday.",
                    "Quarter past 3 means there are 45 minutes left until 4 o'clock.",
                    "The year following 2030 will be 2031."
                ],
                answer: 2,
                hint: "Check the definition of 'quarter past'. Does it tell us how many minutes have passed, or how many are left?",
                explanation: "The statement is incorrect. Quarter past 3 means it is 3:15 (15 minutes past 3). There are 45 minutes left until 4:00, but that time phrase itself is called 'quarter to 4', not quarter past 3."
            },
            {
                question: "Assertion: An analog clock face has 60 small markings around its circular edge.\nReason: The long hand takes exactly 1 hour to visit all 60 markings because 1 hour equals 60 minutes.",
                options: [
                    "Both Assertion and Reason are correct, and the Reason perfectly explains the Assertion.",
                    "Both Assertion and Reason are correct, but the Reason does not explain the Assertion.",
                    "The Assertion is correct, but the Reason is completely false.",
                    "Both the Assertion and the Reason are completely false."
                ],
                answer: 0,
                hint: "Think about why there are 60 markings on a clock and how the minute hand travels across them.",
                explanation: "Both statements are correct. There are 60 markings because an hour contains 60 minutes, and the minute hand travels across one marking every single minute."
            },
            {
                question: "Kabir is looking at a family history timeline layout. Based on the rules and offsets shown below, what is the missing year value when Kabir was born?",
                hasImage: "timeline-family-blank",
                options: ["2018", "2019", "2021", "2022"],
                answer: 1,
                hint: "Look at the year the new car was bought (2020). If that milestone happened exactly '+1 year' after Kabir was born, count backward 1 year from 2020.",
                explanation: "We can count backward from a known date: The family bought a new car in 2020. Since that happened 1 year after Kabir was born, Kabir's birth year must be 2020 - 1 = 2019."
            },
            {
                question: "Review Kabir's completed family milestone chart below. Which of the selections below shows these events arranged in the correct chronological sequence from earliest to latest?",
                hasImage: "timeline-family",
                options: [
                    "Event D → Event E → Event C",
                    "Event C → Event D → Event E",
                    "Event E → Event D → Event C",
                    "Event C → Event E → Event D"
                ],
                answer: 1,
                hint: "Chronological order means listing events in time sequence, starting from the smallest year number up to the largest year number.",
                explanation: "Following the order of years: 2019 (Event C: Kabir Born) comes first, followed by 2020 (Event D: Bought new car), and finally 2022 (Event E: Kabir joined play school)."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.transition = 'opacity 0.5s ease';
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 500);
                }
            }, 5000);
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function generateClockSVG(hour, minute) {
            const hrAngle = (hour * 30) + (minute * 0.5);
            const minAngle = minute * 6;
            return `
            <div style="display:flex; justify-content:center; margin: 20px 0;">
                <svg width="260" height="260" viewBox="0 0 100 100" style="background:transparent;">
                    <circle cx="50" cy="50" r="44" stroke="#1e3a8a" stroke-width="3" fill="#ffffff"/>
                    
                    <line x1="50" y1="9" x2="50" y2="12" stroke="#1e3a8a" stroke-width="1.5"/>
                    <line x1="91" y1="50" x2="88" y2="50" stroke="#1e3a8a" stroke-width="1.5"/>
                    <line x1="50" y1="91" x2="50" y2="88" stroke="#1e3a8a" stroke-width="1.5"/>
                    <line x1="9" y1="50" x2="12" y2="50" stroke="#1e3a8a" stroke-width="1.5"/>
                    
                    <line x1="50" y1="50" x2="50" y2="28" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" transform="rotate(${hrAngle} 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="16" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" transform="rotate(${minAngle} 50 50)"/>
                    <circle cx="50" cy="50" r="3.5" fill="#1e3a8a"/>
                    
                    <text x="50" y="20.5" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f2937">12</text>
                    <text x="82.5" y="53" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text>
                    <text x="50" y="85.5" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text>
                    <text x="17.5" y="53" font-size="9" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text>
                </svg>
            </div>`;
        }

        function generateTimelineSVG(hideBirthYear = false) {
            return `
            <div style="display:flex; justify-content:center; margin: 20px 0; width:100%;">
                <svg width="100%" height="120" viewBox="0 0 300 85" style="background:transparent;">
                    <line x1="20" y1="40" x2="280" y2="40" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
                    <polygon points="280,35 290,40 280,45" fill="#1e3a8a"/>
                    
                    <circle cx="50" cy="40" r="7" fill="#3b82f6"/>
                    <text x="50" y="22" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f2937">${hideBirthYear ? '?' : '2019'}</text>
                    <text x="50" y="58" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#4b5563">Event C</text>
                    <text x="50" y="69" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#9ca3af">(Kabir Born)</text>
                    
                    <text x="100" y="33" font-size="9" font-weight="800" fill="#f59e0b" text-anchor="middle">+1 Year</text>
                    
                    <circle cx="150" cy="40" r="7" fill="#3b82f6"/>
                    <text x="150" y="22" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f2937">2020</text>
                    <text x="150" y="58" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#4b5563">Event D</text>
                    <text x="150" y="69" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#9ca3af">(New Car)</text>
                    
                    <text x="200" y="33" font-size="9" font-weight="800" fill="#f59e0b" text-anchor="middle">+2 Years</text>
                    
                    <circle cx="250" cy="40" r="7" fill="#3b82f6"/>
                    <text x="250" y="22" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f2937">2022</text>
                    <text x="250" y="58" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#4b5563">Event E</text>
                    <text x="250" y="69" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#9ca3af">(Play School)</text>
                </svg>
            </div>`;
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60; 
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            
            let displayContent = qData.question;
            
            if (qData.hasImage) {
                if (qData.hasImage === "clock-4-10") {
                    displayContent += generateClockSVG(4, 10);
                } else if (qData.hasImage === "clock-1-15") {
                    displayContent += generateClockSVG(1, 15);
                } else if (qData.hasImage === "clock-4-45") {
                    displayContent += generateClockSVG(4, 45);
                } else if (qData.hasImage === "timeline-family-blank") {
                    displayContent += generateTimelineSVG(true);
                } else if (qData.hasImage === "timeline-family") {
                    displayContent += generateTimelineSVG(false);
                }
            }

            document.getElementById('target-question').innerHTML = displayContent;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let qData = questionBank[currentIndex];
            disableAllOptions();
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = questionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerSparkles();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio infrastructure synchronized."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Good job!";
            } else if (finalPercentage >= 40) {
                statusText = "Review this chapter and try again.";
            } else {
                statusText = "Let’s practise more.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            resizeCanvas();
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 360}, 85%, 65%)`,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
            renderParticles();
        }

        function renderParticles() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, idx) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.02;
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) {
                requestAnimationFrame(renderParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
