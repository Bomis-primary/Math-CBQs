<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Mastery Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #1e3a8a; 
            --success: #15803d; 
            --danger: #b91c1c; 
            --background: #eff6ff; 
            --hint: #b45309;
        }
        body { font-family: sans-serif; background: var(--background); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #splash { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s ease; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: 0.2s; background: white; }
        .option-btn:hover:not([disabled]) { background: #f0fdfa; border-color: var(--primary); }
        .hidden { display: none !important; }
        #timer { font-weight: bold; color: var(--danger); }
        
        /* Styled Feedback Classes */
        .feedback-hint { background-color: #fef3c7; color: var(--hint); border-left: 5px solid var(--hint); }
        .feedback-correct { background-color: #dcfce7; color: var(--success); border-left: 5px solid var(--success); }
        .feedback-wrong { background-color: #fee2e2; color: var(--danger); border-left: 5px solid var(--danger); }
        
        #next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        #next-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="splash"><img src="assets/logo.png" alt="Innovine Logo"></div>

    <div class="container">
        <div id="quiz-area">
            <div style="display:flex; justify-content:space-between;">
                <div id="q-progress">Question 1/12</div>
                <div id="timer">60s</div>
            </div>
            <h2 id="question">Loading...</h2>
            <div id="options"></div>
            <div id="feedback" style="padding: 15px; margin-top: 10px; border-radius: 8px;" class="hidden"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="result-area" class="hidden">
            <h2 id="final-msg"></h2>
            <p id="score-text"></p>
            <button onclick="location.reload()">Restart Assessment</button>
        </div>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        // Balanced Grade 3 Appropriate Problems (Multiplication limits within 100)
        const masterQuestions = [
            {
                question: "What is 15 ÷ 3?",
                options: ["3", "4", "5", "6"],
                answer: 2,
                hint: "Count up by 3s until you reach 15.",
                explanation: "15 divided by 3 is 5 because 3 × 5 = 15."
            },
            {
                question: "What is 24 ÷ 4?",
                options: ["4", "6", "8", "12"],
                answer: 1,
                hint: "What number multiplied by 4 gives you 24?",
                explanation: "24 ÷ 4 = 6 because 4 × 6 = 24."
            },
            {
                question: "If you share 12 cookies equally among 2 friends, how many cookies does each friend get?",
                options: ["4", "5", "6", "8"],
                answer: 2,
                hint: "What is half of 12?",
                explanation: "12 shared equally between 2 groups leaves 6 in each group."
            },
            {
                question: "What is 40 ÷ 5?",
                options: ["7", "8", "9", "10"],
                answer: 1,
                hint: "Think of your 5 times tables: 5, 10, 15, 20...",
                explanation: "40 ÷ 5 = 8 because 5 × 8 = 40."
            },
            {
                question: "Which multiplication sentence helps you solve 18 ÷ 2 = ?",
                options: ["2 × 9 = 18", "2 + 9 = 11", "18 - 2 = 16", "18 × 2 = 36"],
                answer: 0,
                hint: "Division is the opposite of multiplication. Look for the family fact.",
                explanation: "Knowing that 2 × 9 = 18 tells you that 18 ÷ 2 = 9."
            },
            {
                question: "What is 0 ÷ 6?",
                options: ["0", "6", "1", "Cannot be done"],
                answer: 0,
                hint: "If you have 0 items to split among 6 people, how many does everyone get?",
                explanation: "Zero divided by any number is always 0."
            },
            {
                question: "Tom has 32 markers. He puts them into boxes of 8. How many boxes does he fill?",
                options: ["3", "4", "5", "6"],
                answer: 1,
                hint: "How many times does 8 go into 32?",
                explanation: "32 ÷ 8 = 4. He will fill exactly 4 boxes."
            },
            {
                question: "What is 56 ÷ 8?",
                options: ["6", "7", "8", "9"],
                answer: 1,
                hint: "8 times what number equals 56?",
                explanation: "56 ÷ 8 = 7 because 8 × 7 = 56."
            },
            {
                question: "What is 30 ÷ 10?",
                options: ["2", "3", "5", "10"],
                answer: 1,
                hint: "Count by tens: 10, 20, 30...",
                explanation: "30 divided by 10 is 3."
            },
            {
                question: "Which of these is an example of dividing into 3 equal groups?",
                options: ["Putting 9 toys into 3 boxes with 3 in each", "Putting 5 toys into 2 boxes", "Adding 3 toys to 3 toys", "Taking away 3 toys"],
                answer: 0,
                hint: "Equal groups must have the exact same number in each group.",
                explanation: "9 toys split into 3 boxes means 3 in each box, which is a perfect division sentence (9 ÷ 3 = 3)."
            },
            {
                question: "What is 42 ÷ 6?",
                options: ["6", "7", "8", "9"],
                answer: 1,
                hint: "If 6 × 6 = 36, add one more group of 6.",
                explanation: "42 ÷ 6 = 7 because 6 × 7 = 42."
            },
            {
                question: "What is 70 ÷ 7?",
                options: ["1", "7", "10", "70"],
                answer: 2,
                hint: "Think about multiplying a number by 10.",
                explanation: "70 ÷ 7 = 10 because 7 × 10 = 70."
            }
        ];

        let questions = [];
        let currentQ = 0, score = 0, attempts = 0, timeLeft = 60, timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupQuizData() {
            questions = shuffle([...masterQuestions]);
            questions.forEach(q => {
                const correctText = q.options[q.answer];
                shuffle(q.options);
                q.answer = q.options.indexOf(correctText);
            });
        }

        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = 0;
            setTimeout(() => splash.classList.add('hidden'), 500);
        }, 2000);

        function startTimer() {
            timeLeft = 60;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    handleTimeout(); 
                }
            }, 1000);
        }

        function loadQuestion() {
            attempts = 0;
            startTimer();
            const q = questions[currentQ];
            document.getElementById('q-progress').innerText = `Question ${currentQ + 1}/${questions.length}`;
            document.getElementById('question').innerText = q.question;
            document.getElementById('options').innerHTML = q.options.map((opt, i) => 
                `<button class="option-btn" id="opt-${i}" onclick="check(${i})">${opt}</button>`).join('');
            
            const fb = document.getElementById('feedback');
            fb.classList.add('hidden');
            fb.className = ''; 
            document.getElementById('next-btn').classList.add('hidden');
        }

        // Trigger safe confetti explosion from both sides of the screen
        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } catch (e) {
                console.log("Confetti script loading error.");
            }
        }

        function check(idx) {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            attempts++;
            
            if (idx === q.answer || attempts >= 2) {
                clearInterval(timer);
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.disabled = true);
            }
            
            if(idx === q.answer) {
                score++;
                try { document.getElementById('audio-correct').play(); } catch(e){}
                triggerConfetti(); // Fire confetti explosion!
                fb.innerText = "Correct! " + q.explanation;
                fb.className = 'feedback-correct';
                fb.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else if(attempts < 2) {
                fb.className = 'feedback-hint';
                fb.classList.remove('hidden');
                fb.innerText = "Hint: " + q.hint;
                document.getElementById(`opt-${idx}`).style.borderColor = "var(--danger)";
            } else {
                try { document.getElementById('audio-wrong').play(); } catch(e){}
                fb.className = 'feedback-wrong';
                fb.classList.remove('hidden');
                fb.innerText = "Incorrect. " + q.explanation;
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }

        function handleTimeout() {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            fb.className = 'feedback-wrong';
            fb.classList.remove('hidden');
            fb.innerText = "Time's up! " + q.explanation;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            const finalMsg = document.getElementById('final-msg');
            const scoreText = document.getElementById('score-text');
            const percentage = Math.round((score / questions.length) * 100);
            
            scoreText.innerText = `You scored ${score} out of ${questions.length} (${percentage}%).`;
            
            if (percentage >= 85) {
                finalMsg.innerText = "🎉 Division Master!";
                finalMsg.style.color = "var(--success)";
                // Celebration burst at the very end
                triggerConfetti();
                setTimeout(triggerConfetti, 300);
            } else if (percentage >= 60) {
                finalMsg.innerText = "👍 Good Job!";
                finalMsg.style.color = "var(--hint)";
            } else {
                finalMsg.innerText = "📚 Keep Practicing!";
                finalMsg.style.color = "var(--danger)";
            }
        }

        setupQuizData();
        loadQuestion();
    </script>
</body>
</html>
