<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Mastery Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #1e3a8a; 
            --success: #15803d; 
            --danger: #b91c1c; 
            --background: #eff6ff; 
            --hint: #b45309;
        }
        body { font-family: sans-serif; background: var(--background); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #splash { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s ease; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: 0.2s; background: white; }
        .option-btn:hover:not([disabled]) { background: #f0fdfa; border-color: var(--primary); }
        .hidden { display: none !important; }
        #timer { font-weight: bold; color: var(--danger); }
        
        /* Styled Feedback Classes */
        .feedback-hint { background-color: #fef3c7; color: var(--hint); border-left: 5px solid var(--hint); }
        .feedback-correct { background-color: #dcfce7; color: var(--success); border-left: 5px solid var(--success); }
        .feedback-wrong { background-color: #fee2e2; color: var(--danger); border-left: 5px solid var(--danger); }
        
        #next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        #next-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="splash"><img src="assets/logo.png" alt="Innovine Logo"></div>

    <div class="container">
        <div id="quiz-area">
            <div style="display:flex; justify-content:space-between;">
                <div id="q-progress">Question 1/12</div>
                <div id="timer">60s</div>
            </div>
            <h2 id="question">Loading...</h2>
            <div id="options"></div>
            <div id="feedback" style="padding: 15px; margin-top: 10px; border-radius: 8px;" class="hidden"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="result-area" class="hidden">
            <h2 id="final-msg"></h2>
            <p id="score-text"></p>
            <button onclick="location.reload()">Restart Assessment</button>
        </div>
    </div>

    <audio id="audio-correct" src="assets/claps.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        // 12 CBSE-Aligned Competency-Based Questions for Grade 3 Math
        const masterQuestions = [
            {
                question: "Rohan has 20 laddoos. He wants to pack them into small boxes such that each box has exactly 4 laddoos. Which mathematical action represents finding the number of boxes needed?",
                options: ["Adding 4 to 20 multiple times", "Subtracting 4 from 20 repeatedly until reaching 0", "Multiplying 20 by 4", "Subtracting 20 from itself"],
                answer: 1,
                hint: "Division can be thought of as taking away the same group size over and over.",
                explanation: "Division is equivalent to repeated subtraction. Subtracting 4 from 20 repeatedly tells you how many boxes (5) can be made."
            },
            {
                question: "Anu draws 18 stars and wants to put them into equal rows. She tries putting 4 stars in each row but finds she cannot do it equally. Which of these row setups will let her share all 18 stars with none left over?",
                options: ["Rows of 5 stars", "Rows of 4 stars", "Rows of 3 stars", "Rows of 7 stars"],
                answer: 2,
                hint: "Find a number that can count up exactly to 18 without skipping past it.",
                explanation: "18 can be divided into 3 equal rows because 3 × 6 = 18. Other numbers leave remainders."
            },
            {
                question: "A teacher writes '___ × 5 = 35' on the board to help students solve a word problem. Which division problem is this multiplication fact helping them solve?",
                options: ["35 ÷ 5 = ___", "5 ÷ 35 = ___", "35 ÷ 7 = ___", "35 - 5 = ___"],
                answer: 0,
                hint: "Look for the total being split into 5 equal groups.",
                explanation: "Multiplication and division are inverse operations. Finding what times 5 equals 35 directly solves 35 divided by 5."
            },
            {
                question: "Kiran is creating a pattern using 28 beads. He decides to divide the beads into 4 equal groups. If he wants to use a number line to show this division, how should he make his backward jumps starting from 28?",
                options: ["Take 4 giant jumps backward of 1 bead each", "Take 4 backward jumps of 7 beads each", "Take 7 backward jumps of 1 bead each", "Take 28 backward jumps of 4 beads each"],
                answer: 1,
                hint: "28 ÷ 4 = 7. Think about how many steps are in each jump.",
                explanation: "To divide 28 into 4 equal groups on a number line, you skip count backward from 28 to 0 in 4 balanced jumps of 7 units each."
            },
            {
                question: "Sana has 0 chocolates to distribute among her 5 friends. How many chocolates will each friend receive?",
                options: ["5 chocolates", "1 chocolate", "0 chocolates", "Each gets an unequal share"],
                answer: 2,
                hint: "If there is nothing to start with, what can be shared?",
                explanation: "When you share 0 items into any number of groups, each group gets 0 items (0 ÷ 5 = 0)."
            },
            {
                question: "A gardener has 36 saplings to plant. He wants to form an array with 6 saplings in each row. How many rows will he be able to make?",
                options: ["5 rows", "6 rows", "7 rows", "12 rows"],
                answer: 1,
                hint: "Think about which square number fact matches 36.",
                explanation: "An array organizes items into rows and columns. 36 items with 6 in each row means 36 ÷ 6 = 6 rows."
            },
            {
                question: "A fruit seller packs 45 apples equally into 5 baskets. Later, he finds 1 more apple and tries to put it in a basket. Why can he not keep the baskets equal now?",
                options: ["Because 46 cannot be divided by 5 equally", "Because 45 is smaller than 5", "Because apples cannot be divided", "Because 5 is an odd number"],
                answer: 0,
                hint: "Think about what happens to the total count when you add 1 more to 45.",
                explanation: "Initially, 45 ÷ 5 = 9 apples per basket. Adding 1 apple makes it 46, which leaves a remainder when divided by 5, breaking the equal distribution."
            },
            {
                question: "Meera is preparing a dance performance. There are 24 students, and she needs to arrange them in groups. Which of the following grouping choices will leave some students out without a complete group?",
                options: ["Groups of 3", "Groups of 4", "Groups of 5", "Groups of 6"],
                answer: 2,
                hint: "Which number does NOT divide 24 cleanly?",
                explanation: "24 is divisible by 3, 4, and 6. However, 24 ÷ 5 leaves a remainder of 4, meaning 4 students wouldn't have a complete group."
            },
            {
                question: "Look at this statement: 'There are 8 pencil boxes. Each box holds the same number of pencils. There are 48 pencils in total.' Which question requires division to solve?",
                options: ["How many pencils are there altogether?", "How many pencils are there in each box?", "How many boxes are there?", "What is the total cost of the pencils?"],
                answer: 1,
                hint: "We already know the total and the number of groups. What is missing?",
                explanation: "Finding the number of items within a single group when the total and number of groups are known requires division (48 ÷ 8)."
            },
            {
                question: "Rahul uses the subtraction chain '12 - 3 = 9', '9 - 3 = 6', '6 - 3 = 3', '3 - 3 = 0' to solve a problem. What problem was he trying to solve?",
                options: ["12 - 4", "12 ÷ 3", "12 × 3", "3 ÷ 12"],
                answer: 1,
                hint: "Count how many times the number 3 was taken away.",
                explanation: "Rahul subtracted 3 from 12 a total of 4 times until he reached 0. This models the competency operation 12 ÷ 3 = 4."
            },
            {
                question: "Anish has 40 stickers. He wants to give an equal number of stickers to 10 of his classmates. If he wants to use multiplication facts to find the answer, which table should he read?",
                options: ["Table of 40 up to 10", "Table of 10 up to 40", "Table of 5 up to 10", "Table of 1 up to 40"],
                answer: 1,
                hint: "He is distributing across 10 groups. He needs to find 10 × ? = 40.",
                explanation: "To solve 40 ÷ 10, he can use the table of 10 to find what number multiplied by 10 equals 40 (10 × 4 = 40)."
            },
            {
                question: "A factory packs 32 toy cars into boxes. Each box fits 4 cars. If they sell 3 boxes, how many boxes of toy cars do they have left?",
                options: ["5 boxes", "8 boxes", "11 boxes", "4 boxes"],
                answer: 0,
                hint: "First find the total number of boxes made, then subtract the sold boxes.",
                explanation: "Total boxes made = 32 ÷ 4 = 8 boxes. If they sell 3 boxes, the remaining boxes = 8 - 3 = 5 boxes."
            }
        ];

        let questions = [];
        let currentQ = 0, score = 0, attempts = 0, timeLeft = 60, timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupQuizData() {
            questions = shuffle([...masterQuestions]);
            questions.forEach(q => {
                const correctText = q.options[q.answer];
                shuffle(q.options);
                q.answer = q.options.indexOf(correctText);
            });
        }

        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = 0;
            setTimeout(() => splash.classList.add('hidden'), 500);
        }, 2000);

        function startTimer() {
            timeLeft = 60;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    handleTimeout(); 
                }
            }, 1000);
        }

        function loadQuestion() {
            attempts = 0;
            startTimer();
            const q = questions[currentQ];
            document.getElementById('q-progress').innerText = `Question ${currentQ + 1}/${questions.length}`;
            document.getElementById('question').innerText = q.question;
            document.getElementById('options').innerHTML = q.options.map((opt, i) => 
                `<button class="option-btn" id="opt-${i}" onclick="check(${i})">${opt}</button>`).join('');
            
            const fb = document.getElementById('feedback');
            fb.classList.add('hidden');
            fb.className = ''; 
            document.getElementById('next-btn').classList.add('hidden');
        }

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } catch (e) {
                console.log("Confetti library unavailable.");
            }
        }

        function check(idx) {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            attempts++;
            
            if (idx === q.answer || attempts >= 2) {
                clearInterval(timer);
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.disabled = true);
            }
            
            if(idx === q.answer) {
                score++;
                try { document.getElementById('audio-correct').play(); } catch(e){}
                triggerConfetti();
                fb.innerText = "Correct! " + q.explanation;
                fb.className = 'feedback-correct';
                fb.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else if(attempts < 2) {
                fb.className = 'feedback-hint';
                fb.classList.remove('hidden');
                fb.innerText = "Hint: " + q.hint;
                document.getElementById(`opt-${idx}`).style.borderColor = "var(--danger)";
            } else {
                try { document.getElementById('audio-wrong').play(); } catch(e){}
                fb.className = 'feedback-wrong';
                fb.classList.remove('hidden');
                fb.innerText = "Incorrect. " + q.explanation;
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }

        function handleTimeout() {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            fb.className = 'feedback-wrong';
            fb.classList.remove('hidden');
            fb.innerText = "Time's up! " + q.explanation;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            const finalMsg = document.getElementById('final-msg');
            const scoreText = document.getElementById('score-text');
            const percentage = Math.round((score / questions.length) * 100);
            
            scoreText.innerText = `You scored ${score} out of ${questions.length} (${percentage}%).`;
            
            if (percentage >= 85) {
                finalMsg.innerText = "🎉 Division Master!";
                finalMsg.style.color = "var(--success)";
                triggerConfetti();
                setTimeout(triggerConfetti, 300);
            } else if (percentage >= 60) {
                finalMsg.innerText = "👍 Good Job!";
                finalMsg.style.color = "var(--hint)";
            } else {
                finalMsg.innerText = "📚 Keep Practicing!";
                finalMsg.style.color = "var(--danger)";
            }
        }

        setupQuizData();
        loadQuestion();
    </script>
</body>
</html>
