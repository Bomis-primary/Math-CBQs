<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Mastery Assessment</title>
    <style>
        :root { 
            --primary: #1e3a8a; 
            --success: #15803d; 
            --danger: #b91c1c; 
            --background: #eff6ff; 
            --hint: #b45309;
        }
        body { font-family: sans-serif; background: var(--background); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #splash { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s ease; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: 0.2s; background: white; }
        .option-btn:hover:not([disabled]) { background: #f0fdfa; border-color: var(--primary); }
        .hidden { display: none !important; }
        #timer { font-weight: bold; color: var(--danger); }
        
        /* Styled Feedback Classes */
        .feedback-hint { background-color: #fef3c7; color: var(--hint); border-left: 5px solid var(--hint); }
        .feedback-correct { background-color: #dcfce7; color: var(--success); border-left: 5px solid var(--success); }
        .feedback-wrong { background-color: #fee2e2; color: var(--danger); border-left: 5px solid var(--danger); }
        
        #next-btn, #restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        #next-btn:hover, #restart-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="splash"><h2>Division Mastery Assessment</h2></div>

    <div class="container">
        <div id="quiz-area">
            <div style="display:flex; justify-content:space-between;">
                <div id="q-progress">Question 1/12</div>
                <div id="timer">60s</div>
            </div>
            <h2 id="question">Loading...</h2>
            <div id="options"></div>
            <div id="feedback" style="padding: 15px; margin-top: 10px; border-radius: 8px;" class="hidden"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="result-area" class="hidden">
            <h2 id="final-msg"></h2>
            <p id="score-text"></p>
            <button id="restart-btn" onclick="location.reload()">Restart Assessment</button>
        </div>
    </div>

    <audio id="audio-correct" src="assets/correct.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        // Raw dataset base
        const masterQuestions = [
            {
                question: "What is 48 ÷ 6?",
                options: ["6", "7", "8", "9"],
                answer: 2, // index of "8" initially
                hint: "Think about what multiplied by 6 equals 48.",
                explanation: "48 divided by 6 is 8 because 6 × 8 = 48."
            },
            {
                question: "What is 132 ÷ 11?",
                options: ["11", "12", "13", "14"],
                answer: 1,
                hint: "11 × 10 = 110. Add one more 11 to get 121...",
                explanation: "132 ÷ 11 = 12 because 11 × 12 = 132."
            },
            {
                question: "What is the quotient of 0 ÷ 7?",
                options: ["0", "7", "Undefined", "1"],
                answer: 0,
                hint: "If you have 0 items to share among 7 people, how many does each person get?",
                explanation: "Zero divided by any non-zero number is always 0."
            },
            {
                question: "What is 7 ÷ 0?",
                options: ["0", "7", "Undefined", "70"],
                answer: 2,
                hint: "Can you divide something into groups of zero items?",
                explanation: "Division by zero is undefined in mathematics."
            },
            {
                question: "What is the remainder when 45 is divided by 6?",
                options: ["1", "3", "5", "0"],
                answer: 1,
                hint: "Find the closest multiple of 6 that is less than 45.",
                explanation: "6 × 7 = 42. The difference between 45 and 42 is 3."
            },
            {
                question: "Solve: 240 ÷ 40",
                options: ["6", "60", "4", "40"],
                answer: 0,
                hint: "You can cancel out the trailing zeros to make it 24 ÷ 4.",
                explanation: "240 ÷ 40 is equivalent to 24 ÷ 4, which equals 6."
            },
            {
                question: "What is 100 ÷ 0.25?",
                options: ["25", "40", "250", "400"],
                answer: 3,
                hint: "Dividing by 0.25 (or 1/4) is the same as multiplying by 4.",
                explanation: "There are four 0.25s in every 1 unit, so 100 × 4 = 400."
            },
            {
                question: "If 7 x 9 = 63, which division sentence is also true?",
                options: ["7 ÷ 63 = 9", "63 ÷ 9 = 7", "9 ÷ 7 = 63", "63 ÷ 63 = 7"],
                answer: 1,
                hint: "Division is the inverse operation of multiplication. Total ÷ Factor = Other Factor.",
                explanation: "Because 7 × 9 = 63, it inversely means 63 ÷ 9 = 7."
            },
            {
                question: "What is 144 ÷ (12 ÷ 3)?",
                options: ["36", "12", "4", "48"],
                answer: 0,
                hint: "Remember Order of Operations (PEMDAS). Solve the parenthesis first.",
                explanation: "First solve 12 ÷ 3 = 4. Then calculate 144 ÷ 4 = 36."
            },
            {
                question: "A box holds 8 donuts. How many full boxes can be filled with 90 donuts?",
                options: ["10", "11", "12", "11.25"],
                answer: 1,
                hint: "Divide 90 by 8 and drop the remainder since the question asks for full boxes.",
                explanation: "90 ÷ 8 = 11 with a remainder of 2. So, 11 full boxes can be filled."
            },
            {
                question: "What is 1,212 ÷ 4?",
                options: ["33", "303", "330", "333"],
                answer: 1,
                hint: "Break it down: 1,200 ÷ 4 and 12 ÷ 4, then add them together.",
                explanation: "1200 ÷ 4 = 300, and 12 ÷ 4 = 3. 300 + 3 = 303."
            },
            {
                question: "Which of the following numbers is perfectly divisible by 3 (no remainder)?",
                options: ["251", "313", "404", "513"],
                answer: 3,
                hint: "A number is divisible by 3 if the sum of its digits is divisible by 3.",
                explanation: "For 513: 5 + 1 + 3 = 9. Since 9 is divisible by 3, 513 is also divisible by 3."
            }
        ];

        let questions = [];
        let currentQ = 0, score = 0, attempts = 0, timeLeft = 60, timer;

        // Helper function to shuffle array items in place
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Prepares quiz configurations dynamically 
        function setupQuizData() {
            // Shallow clone and shuffle the core questions
            questions = shuffle([...masterQuestions]);

            // Shuffle the choices inside every isolated question item
            questions.forEach(q => {
                const correctText = q.options[q.answer]; // Grab string value of correct choice
                shuffle(q.options);                      // Shuffle options array directly
                q.answer = q.options.indexOf(correctText); // Recalculate target key location
            });
        }

        // Splash screen delay
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = 0;
            setTimeout(() => splash.classList.add('hidden'), 500);
        }, 2000);

        function startTimer() {
            timeLeft = 60;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    handleTimeout(); 
                }
            }, 1000);
        }

        function loadQuestion() {
            attempts = 0;
            startTimer();
            const q = questions[currentQ];
            document.getElementById('q-progress').innerText = `Question ${currentQ + 1}/${questions.length}`;
            document.getElementById('question').innerText = q.question;
            document.getElementById('options').innerHTML = q.options.map((opt, i) => 
                `<button class="option-btn" id="opt-${i}" onclick="check(${i})">${opt}</button>`).join('');
            
            const fb = document.getElementById('feedback');
            fb.classList.add('hidden');
            fb.className = ''; 
            document.getElementById('next-btn').classList.add('hidden');
        }

        function check(idx) {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            attempts++;
            
            if (idx === q.answer || attempts >= 2) {
                clearInterval(timer);
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.disabled = true);
            }
            
            if(idx === q.answer) {
                score++;
                try { document.getElementById('audio-correct').play(); } catch(e){}
                fb.innerText = "Correct! " + q.explanation;
                fb.className = 'feedback-correct';
                fb.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else if(attempts < 2) {
                fb.className = 'feedback-hint';
                fb.classList.remove('hidden');
                fb.innerText = "Hint: " + q.hint;
                document.getElementById(`opt-${idx}`).style.borderColor = "var(--danger)";
            } else {
                try { document.getElementById('audio-wrong').play(); } catch(e){}
                fb.className = 'feedback-wrong';
                fb.classList.remove('hidden');
                fb.innerText = "Incorrect. " + q.explanation;
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }

        function handleTimeout() {
            const q = questions[currentQ];
            const fb = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            fb.className = 'feedback-wrong';
            fb.classList.remove('hidden');
            fb.innerText = "Time's up! " + q.explanation;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            const finalMsg = document.getElementById('final-msg');
            const scoreText = document.getElementById('score-text');
            const percentage = Math.round((score / questions.length) * 100);
            
            scoreText.innerText = `You scored ${score} out of ${questions.length} (${percentage}%).`;
            
            if (percentage >= 85) {
                finalMsg.innerText = "🎉 Division Master!";
                finalMsg.style.color = "var(--success)";
            } else if (percentage >= 60) {
                finalMsg.innerText = "👍 Good Job!";
                finalMsg.style.color = "var(--hint)";
            } else {
                finalMsg.innerText = "📚 Keep Practicing!";
                finalMsg.style.color = "var(--danger)";
            }
        }

        // Initialize quiz configuration routines
        setupQuizData();
        loadQuestion();
    </script>
</body>
</html>
