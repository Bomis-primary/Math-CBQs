<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Mathematics - Competency Based Interactive</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #1a436d;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --success-color: #48bb78;
            --error-color: #f56565;
            --warning-color: #ed8936;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        /* Logo Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        #splash-screen p {
            font-size: 1.1rem;
            color: #718096;
            font-weight: 500;
        }

        /* Utility/Header Components */
        .hidden { display: none !important; }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #edf2f7;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            background: #edf2f7;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-low {
            background: #fed7d7;
            color: var(--error-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        /* Screen Elements */
        .screen-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
        }

        .btn:hover { background: var(--primary-hover); }

        /* Question Layout */
        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .option-btn.correct {
            background: #edf7ed;
            border-color: var(--success-color);
            color: #1e4620;
        }

        .option-btn.incorrect {
            background: #fdf2f2;
            border-color: var(--error-color);
            color: #611a1a;
        }

        /* Feedback Area */
        .feedback-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.4;
        }

        .feedback-hint {
            background: #feebc8;
            border-left: 4px solid var(--warning-color);
            color: #744210;
        }

        .feedback-explanation {
            background: #e2e8f0;
            border-left: 4px solid #4a5568;
            color: #2d3748;
        }

        /* Confetti Elements */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f00;
            border-radius: 50%;
            animation: fire 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fire {
            0% { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Responsive Settings */
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="../assets/logo.png" alt="Innovine Logo" onerror="this.style.display='none';">
        <p>Loading Interactive...</p>
    </div>

    <div class="container">
        <audio id="audio-correct" src="../assets/claps.mp3" preload="auto"></audio>
        <audio id="audio-wrong" src="../assets/wrong.mp3" preload="auto"></audio>

        <div id="intro-screen">
            <h2 class="screen-title">Maths Chapter 2: Addition</h2>
            <p style="text-align: center; margin-bottom: 25px; line-height: 1.6; color: #4a5568;">
                Welcome! Answer the following competency-based questions carefully. You have 60 seconds per question and 2 attempts for each.
            </p>
            <button class="btn" onclick="startQuiz()">Start Challenge</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="header-meta">
                <span id="question-number">Question 1/12</span>
                <span id="score-tracker">Score: 0</span>
                <div id="timer-display" class="timer-box">⏱️ <span id="timer-count">60</span>s</div>
            </div>

            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="question-container">
                <p id="question-text" class="question-text"></p>
                <div id="options-grid" class="options-grid"></div>
            </div>

            <div id="feedback-container" class="feedback-box hidden"></div>

            <button id="next-btn" class="btn hidden" onclick="handleNext()">Next</button>
        </div>

        <div id="result-screen" class="hidden">
            <h2 class="screen-title">Challenge Completed!</h2>
            <div id="result-message" style="text-align: center; font-size: 1.3rem; font-weight: 600; margin-bottom: 15px;"></div>
            <p id="final-score" style="text-align: center; font-size: 1.1rem; margin-bottom: 25px; color: #4a5568;"></p>
            <button class="btn" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // Complete 12 competency questions pool
        const questions = [
            {
                text: "Riya has 125 stickers. She wants 150 stickers. She gets 23 more. Does she reach her goal?",
                options: [
                    "Yes, she has more than 150",
                    "Yes, she has exactly 150",
                    "No, she has less than 150",
                    "Cannot be found"
                ],
                answer: 2, // index of option c
                hint: "Find out how many stickers Riya has in total by adding 125 and 23 first.",
                explanation: "Riya ends up with 125 + 23 = 148 stickers. Since 148 is less than 150, she does not reach her goal."
            },
            {
                text: "A teacher has 132 books. She buys some more and now has 150 books. How many books did she buy?",
                options: ["12", "18", "20", "28"],
                answer: 1,
                hint: "Think about what number added to 132 makes 150, or count forward from 132 to 150.",
                explanation: "The teacher bought 18 books because 132 + 18 = 150."
            },
            {
                text: "A shop sold 210 notebooks in the morning. By afternoon, total sales became 255. How many notebooks were sold in the afternoon?",
                options: ["35", "40", "45", "50"],
                answer: 2,
                hint: "Find the difference between the total sales (255) and the morning sales (210).",
                explanation: "Subtract morning sales from total sales: 255 - 210 = 45 notebooks were sold in the afternoon."
            },
            {
                text: "A shop sold 120 pens and 80 pencils. How many more pens than pencils were sold?",
                options: ["20", "30", "40", "50"],
                answer: 2,
                hint: "Compare the total number of pens and pencils by checking how much bigger 120 is than 80.",
                explanation: "120 pens minus 80 pencils equals 40 more pens sold."
            },
            {
                text: "Class A collected 145 books and Class B collected 155 books. Which statement is correct?",
                options: [
                    "Class A collected more books",
                    "Class B collected 10 more books",
                    "Both collected equal books",
                    "Class B collected 20 more books"
                ],
                answer: 1,
                hint: "Find the difference between 155 and 145 to see who collected more and by how much.",
                explanation: "Class B collected 155 and Class A collected 145. 155 - 145 = 10, meaning Class B collected 10 more books."
            },
            {
                text: "Aarav solved: 120 + 25 = 135. What mistake did he make?",
                options: [
                    "Added ones incorrectly",
                    "Added tens incorrectly",
                    "Ignored tens completely",
                    "No mistake"
                ],
                answer: 1,
                hint: "Look closely at the tens place values: 2 tens plus 2 tens should equal how many tens?",
                explanation: "Aarav added tens incorrectly. 120 + 25 should equal 145, because 20 + 20 = 40 in the tens column."
            },
            {
                text: "Meera solved: 145 + 32 = 167. Which is correct?",
                options: [
                    "Ones are added wrongly",
                    "Tens are added wrongly",
                    "Carry is missing",
                    "Answer is correct"
                ],
                answer: 2,
                hint: "Add the ones column (5 + 2) and the tens column (4 + 3) to verify her math.",
                explanation: "5 + 2 = 7 and 4 + 3 = 7, so the sum is 177. She forgot to process the missing tens or write down the correct tens digit (she wrote 6 instead of 7)."
            },
            {
                text: "Rohan solved: 230 + 40 = 240. Why is this wrong?",
                options: [
                    "Tens were not added correctly",
                    "Ones were added wrongly",
                    "Hundreds were added twiced",
                    "No mistake"
                ],
                answer: 0,
                hint: "Check the tens position. What do you get when you add 3 tens and 4 tens?",
                explanation: "Tens were not added correctly. 3 tens + 4 tens = 7 tens, so 230 + 40 should be 270."
            },
            {
                text: "Assertion: 40 + 30 = 70. Reason: We add tens to tens.",
                options: [
                    "Both are correct and reason explains assertion",
                    "Both are correct but reason does not explain",
                    "Assertion is correct, reason is wrong",
                    "Both are wrong"
                ],
                answer: 0,
                hint: "Is 40 + 30 equal to 70? When adding these multiples of ten, do we group the tens together?",
                explanation: "Both statements are correct. 40 and 30 are combinations of tens, and we achieve 70 by combining their values."
            },
            {
                text: "Assertion: 125 + 25 = 150. Reason: Adding 25 increases the number by 25.",
                options: [
                    "Both are correct and reason explains assertion",
                    "Both are correct but reason does not explain",
                    "Assertion is correct, reason is wrong",
                    "Both are wrong"
                ],
                answer: 0,
                hint: "Check if the sum is accurate, and recall what addition does to an initial count.",
                explanation: "Both are true. Adding any value increases the original number by exactly that amount."
            },
            {
                text: "A school needs 300 books for its library. They collected 145 books on Day 1 and 155 books on Day 2. They decide to donate 20 books to another school. Will they still have enough books?",
                options: [
                    "Yes, exactly enough",
                    "Yes, more than enough",
                    "No, less than needed",
                    "Cannot be found"
                ],
                answer: 2,
                hint: "Add Day 1 and Day 2 counts together, then deduct the 20 donated books.",
                explanation: "They collected 145 + 155 = 300 books. After donating 20 books, they only have 280 left, which is less than the 300 needed."
            },
            {
                text: "Riya collected 135 books and Ameya collected 145 books. There were already 120 books in the library. The school plans to arrange the books in groups of 100. How many full groups can they make?",
                options: ["3", "4", "5", "6"],
                answer: 1,
                hint: "Calculate the total total number of books first by adding 135, 145, and 120 together.",
                explanation: "The total number of books is 135 + 145 + 120 = 400. In groups of 100, they can make exactly 4 full groups."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attempts = 0;
        let timerInterval;
        let timeLeft = 60;

        // Auto-clear splash screen after 5 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.classList.add('hidden'), 500);
            }, 5000);
        });

        function startQuiz() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 60;
            attempts = 0;
            
            document.getElementById('timer-count').textContent = timeLeft;
            document.getElementById('timer-display').classList.remove('timer-low');
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const q = questions[currentQuestionIndex];
            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}/${questions.length}`;
            document.getElementById('question-text').textContent = q.text;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            q.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => checkAnswer(index, button);
                optionsGrid.appendChild(button);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-count').textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer-display').classList.add('timer-low');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    revealCorrectAnswerValue();
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, selectedButton) {
            const q = questions[currentQuestionIndex];
            attempts++;

            if (selectedIndex === q.answer) {
                // Correct Answer setup
                clearInterval(timerInterval);
                selectedButton.classList.add('correct');
                playSound('correct');
                triggerConfetti();
                disableAllOptions();
                
                if (attempts === 1) score++;
                document.getElementById('score-tracker').textContent = `Score: ${score}`;
                
                showFeedback('Correct! Well done.', 'success');
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                // Wrong Answer setup
                playSound('wrong');
                selectedButton.classList.add('incorrect');
                selectedButton.disabled = true;

                if (attempts === 1) {
                    // First failure: offer a hint
                    showFeedback(`Incorrect. Hint: ${q.hint}`, 'hint');
                } else {
                    // Second failure: show answer + full breakdown
                    clearInterval(timerInterval);
                    revealCorrectAnswerValue();
                }
            }
        }

        function revealCorrectAnswerValue() {
            disableAllOptions();
            const q = questions[currentQuestionIndex];
            const optionButtons = document.getElementsByClassName('option-btn');
            
            if (optionButtons[q.answer]) {
                optionButtons[q.answer].classList.add('correct');
            }

            showFeedback(`Incorrect. Correct Answer chosen automatically.<br><br><strong>Explanation:</strong> ${q.explanation}`, 'explanation');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function showFeedback(text, type) {
            const fbBox = document.getElementById('feedback-container');
            fbBox.className = 'feedback-box'; 
            
            if (type === 'hint') fbBox.classList.add('feedback-hint');
            else if (type === 'explanation') fbBox.classList.add('feedback-explanation');
            else {
                fbBox.style.background = '#edf7ed';
                fbBox.style.color = '#1e4620';
                fbBox.style.borderLeft = '4px solid var(--success-color)';
            }
            
            fbBox.innerHTML = text;
            fbBox.classList.remove('hidden');
        }

        function handleNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const percentage = (score / questions.length) * 100;
            let msg = "";

            if (percentage >= 75) msg = "Good job!";
            else if (percentage >= 40) msg = "Review this chapter and try again";
            else msg = "Let’s practise more";

            document.getElementById('result-message').textContent = msg;
            document.getElementById('final-score').textContent = `You scored ${score} out of ${questions.length} (${percentage.toFixed(0)}%)`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score-tracker').textContent = `Score: 0`;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function playSound(type) {
            const sound = document.getElementById(`audio-${type}`);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked until click interact"));
            }
        }

        function triggerConfetti() {
            const container = document.querySelector('.container');
            for (let i = 0; i < 30; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                
                const colors = ['#f56565', '#48bb78', '#4299e1', '#ecc94b', '#ed64a6'];
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                conf.style.setProperty('--x', `250px`);
                conf.style.setProperty('--y', `200px`);
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 150;
                conf.style.setProperty('--tx', `${250 + Math.cos(angle) * distance}px`);
                conf.style.setProperty('--ty', `${200 + Math.sin(angle) * distance}px`);
                
                container.appendChild(conf);
                setTimeout(() => conf.remove(), 1500);
            }
        }
    </script>
</body>
</html>
